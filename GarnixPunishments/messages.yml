# GarnixPunishments — messages.yml
# Values are in Portuguese (what players see). Placeholders:
#   {player} {staff} {reason} {proof} {duration} {expires} {code} {id}
# {code} is the public punishment code shown to players; {id} is the internal numeric id (still
# available if needed). Kick screens keep {expires} unresolved in the file — filled at kick time.

# Chat feedback for commands and menu actions. {player} {code} {id} {count} {ip} {input} {error}
commands:
  apply:
    success: '&aPunição aplicada em {player} &7({code}).'
    exempt: '&c{player} é imune a punições.'
    duplicate: '&c{player} já possui uma punição ativa desse tipo.'
    self: '&cVocê não pode se punir.'
    no-ip: '&cNão há um IP registrado para {player} (ele nunca entrou).'
    exempt-alt: '&cNão é possível: uma conta imune está online neste IP.'
    error: '&cErro ao aplicar punição: {error}'
  pardon:
    success: '&a{player} foi perdoado de {count} punição(ões).'
    none: '&e{player} não possui punições ativas.'
    error: '&cErro ao perdoar: {error}'
  revoke:
    success: '&aPunição {code} revogada.'
    not-found: '&cPunição não encontrada ou já inativa.'
    no-permission: '&cVocê não pode revogar punições aplicadas por outros staffs.'
    forbidden: '&cVocê não tem permissão para revogar punições.'
    error: '&cErro ao revogar: {error}'
  edit:
    success: '&aPunição {code} atualizada.'
    not-found: '&cPunição não encontrada.'
    no-permission: '&cVocê não pode editar punições aplicadas por outros staffs.'
    error: '&cErro ao editar: {error}'
  dupeip:
    error: '&cErro: {error}'
  checkid:
    usage: '&cUse: /checkid <id>'
    not-found: '&cNenhuma punição encontrada com o ID &f{code}&c.'
    proof: '&fProva de &7{code}&f: &7{proof}'
    error: '&cErro ao buscar punição: {error}'
  invalid-duration: '&cDuração inválida: {input}'
  punish-locked: '&c{staff} já está aplicando uma punição em {player}.'
  warn-usage: '&cUse: /warn <jogador> <motivo> <prova>  &7(a prova deve começar com https://)'
  exempt-protected: '&c{player} é imune e não pode ser inspecionado.'
  menu-error: '&cNão foi possível abrir o menu. Tente novamente.'
  reload:
    success: '&aConfigurações recarregadas com sucesso.'
    error: '&cErro ao recarregar configurações: {error}'

# Conversation prompts (chat). Opened from the /punir menu.
conversation:
  proof:
    prompt:
    - ''
    - '  &aInforme a URL da prova.'
    - '  &7Para cancelar digite &8cancelar&7.'
    - ''
    invalid: '&cURL inválida. Ex.: https://imgur.com/...'
  revoke:
    prompt:
    - ''
    - '  &aInforme o motivo da revogação.'
    - '  &7Para cancelar digite &8cancelar&7.'
    - ''
    invalid: '&cO motivo não pode ser vazio.'
  pardon:
    prompt:
    - ''
    - '  &aInforme o motivo do perdão.'
    - '  &7Para cancelar digite &8cancelar&7.'
    - ''
    invalid: '&cO motivo não pode ser vazio.'

# Display names per type (used in {punishment} of warn-limit-reached).
type-names:
  ban: Banimento
  tempban: Banimento Temporário
  mute: Mute
  tempmute: Mute Temporário
  warn: Aviso
  ipban: Banimento de IP

# ── Kick screens (shown to the punished player on ban) ──────────────────
# A linha em branco é '&f' e não '': o cliente colapsa string vazia na tela de
# kick, e o &f garante o respiro entre os blocos.
screens:
  ban:
  - '&c&lREDE GARNIX'
  - '&f'
  - '&cVocê está banido permanentemente do servidor.'
  - '&f'
  - '&cMotivo: {reason} - {proof}'
  - '&cAutor: {staff}'
  - '&f'
  - '&cID &e#{code} &cpara criar uma revisão em &r&ndiscord.gg/redegarnix&r&c.'
  tempban:
  - '&c&lREDE GARNIX'
  - '&f'
  - '&cVocê está banido temporariamente do servidor.'
  - '&f'
  - '&cMotivo: {reason} - {proof}'
  - '&cAutor: {staff}'
  - '&cExpira em: {expires}'
  - '&f'
  - '&cID &e#{code} &cpara criar uma revisão em &r&ndiscord.gg/redegarnix&r&c.'
  ipban:
  - '&c&lREDE GARNIX'
  - '&f'
  - '&cVocê está banido do servidor por IP.'
  - '&cNenhuma conta neste IP pode entrar.'
  - '&f'
  - '&cMotivo: {reason} - {proof}'
  - '&cAutor: {staff}'
  - '&f'
  - '&cID &e#{code} &cpara criar uma revisão em &r&ndiscord.gg/redegarnix&r&c.'

# ── In-chat notices ────────────────────────────────────────────────────
# Mesma estrutura das telas de kick. Lembre que o MuteChatListener reenvia este
# bloco a CADA tentativa de falar, sem cooldown — cada linha a mais se multiplica
# no chat de quem está tentando conversar.
mute-notice:
  permanent:
  - ''
  - '&c&lREDE GARNIX'
  - ''
  - '&cVocê está silenciado permanentemente.'
  - ''
  - '&cMotivo: {reason} - {proof}'
  - '&cAutor: {staff}'
  - ''
  - '&cID &e#{code} &cpara criar uma revisão em &r&ndiscord.gg/redegarnix&r&c.'
  - ''
  temp:
  - ''
  - '&c&lREDE GARNIX'
  - ''
  - '&cVocê está silenciado temporariamente.'
  - ''
  - '&cMotivo: {reason} - {proof}'
  - '&cAutor: {staff}'
  - '&cExpira em: {expires}'
  - ''
  - '&cID &e#{code} &cpara criar uma revisão em &r&ndiscord.gg/redegarnix&r&c.'
  - ''

# Personal warn notice (shown to the warned player when the current stage is NOT yet reached).
# {warn_count} = active warns after this one, {warn_next} = warns required at the current stage,
# {next_punishment}/{next_duration} = the punishment that will be applied at this stage.
# Um fato por linha: juntar punição com duração numa linha só estoura o chat
# quando o nome do tipo é grande.
warn-notice:
- ''
- '  &6&l⚠ VOCE RECEBEU UM AVISO'
- ''
- '  &8▪ &fMotivo: &7{reason}'
- '  &8▪ &fAplicado por: &7{staff}'
- '  &8▪ &fAvisos ativos: &a{warn_count}&8/&c{warn_next}'
- ''
- '  &8▪ &fPróxima punição: &7{next_punishment}'
- '  &8▪ &fDuração: &7{next_duration}'
- ''
- '  &7Ao atingir &f{warn_next} &7avisos ela'
- '  &7será aplicada automaticamente.'
- ''

# Replaces warn-notice when THIS warn reaches the limit and an escalation punishment is applied.
# {punishment} = display name of the applied punishment, {duration} = its duration (or permanent).
warn-limit-reached:
- ''
- '  &c&l⚠ LIMITE DE AVISOS ATINGIDO'
- ''
- '  &8▪ &fMotivo: &7{reason}'
- '  &8▪ &fAvisos acumulados: &7{warn_count}'
- ''
- '  &8▪ &fPunição aplicada: &c{punishment}'
- '  &8▪ &fDuração: &c{duration}'
- ''
- '  &7Seus avisos foram zerados.'
- ''

# ── Public broadcast per punishment type ───────────────────────────────
# Todos os tipos seguem a mesma moldura: linha em branco, cabeçalho colorido pelo
# tipo, o que aconteceu, e os detalhes em '&8▪'. Sem barras de traço.
broadcast-messages:
  ban:
  - ''
  - '  &c&lBANIMENTO'
  - '  &f{player} &7foi banido permanentemente.'
  - ''
  - '  &8▪ &fMotivo: &7{reason}'
  - '  &8▪ &fStaff: &7{staff}'
  - '  &8▪ &fProva: &7{proof}'
  - ''
  tempban:
  - ''
  - '  &c&lBANIMENTO'
  - '  &f{player} &7foi banido por &f{duration}&7.'
  - ''
  - '  &8▪ &fMotivo: &7{reason}'
  - '  &8▪ &fStaff: &7{staff}'
  - '  &8▪ &fProva: &7{proof}'
  - ''
  ipban:
  - ''
  - '  &c&lBANIMENTO DE IP'
  - '  &f{player} &7foi banido por IP permanentemente.'
  - ''
  - '  &8▪ &fMotivo: &7{reason}'
  - '  &8▪ &fStaff: &7{staff}'
  - '  &8▪ &fProva: &7{proof}'
  - ''
  mute:
  - ''
  - '  &e&lMUTE'
  - '  &f{player} &7foi silenciado permanentemente.'
  - ''
  - '  &8▪ &fMotivo: &7{reason}'
  - '  &8▪ &fStaff: &7{staff}'
  - '  &8▪ &fProva: &7{proof}'
  - ''
  tempmute:
  - ''
  - '  &e&lMUTE'
  - '  &f{player} &7foi silenciado por &f{duration}&7.'
  - ''
  - '  &8▪ &fMotivo: &7{reason}'
  - '  &8▪ &fStaff: &7{staff}'
  - '  &8▪ &fProva: &7{proof}'
  - ''
  warn:
  - ''
  - '  &6&lAVISO'
  - '  &f{player} &7recebeu um aviso.'
  - ''
  - '  &8▪ &fMotivo: &7{reason}'
  - '  &8▪ &fStaff: &7{staff}'
  - '  &8▪ &fProva: &7{proof}'
  - ''

# ── Revoke broadcast (per punishment type, plus the full pardon) ────────
# Mesma moldura do broadcast-messages: cabeçalho, o que aconteceu, detalhes em '&8▪'.
# O cabeçalho é verde porque a punição saiu; o tipo vai na linha 'Punição', com os
# mesmos nomes do bloco type-names. Aqui {staff} é quem REVOGOU, não quem aplicou.
revoke-messages:
  ban:
  - ''
  - '  &a&lREVOGADO'
  - '  &f{player} &7não está mais banido.'
  - ''
  - '  &8▪ &fPunição: &7Banimento'
  - '  &8▪ &fID: &7#{code}'
  - '  &8▪ &fStaff: &7{staff}'
  - ''
  tempban:
  - ''
  - '  &a&lREVOGADO'
  - '  &f{player} &7não está mais banido.'
  - ''
  - '  &8▪ &fPunição: &7Banimento Temporário'
  - '  &8▪ &fID: &7#{code}'
  - '  &8▪ &fStaff: &7{staff}'
  - ''
  mute:
  - ''
  - '  &a&lREVOGADO'
  - '  &f{player} &7não está mais silenciado.'
  - ''
  - '  &8▪ &fPunição: &7Mute'
  - '  &8▪ &fID: &7#{code}'
  - '  &8▪ &fStaff: &7{staff}'
  - ''
  tempmute:
  - ''
  - '  &a&lREVOGADO'
  - '  &f{player} &7não está mais silenciado.'
  - ''
  - '  &8▪ &fPunição: &7Mute Temporário'
  - '  &8▪ &fID: &7#{code}'
  - '  &8▪ &fStaff: &7{staff}'
  - ''
  warn:
  - ''
  - '  &a&lREVOGADO'
  - '  &f{player} &7teve um aviso removido.'
  - ''
  - '  &8▪ &fPunição: &7Aviso'
  - '  &8▪ &fID: &7#{code}'
  - '  &8▪ &fStaff: &7{staff}'
  - ''
  ipban:
  - ''
  - '  &a&lREVOGADO'
  - '  &f{player} &7não está mais banido por IP.'
  - ''
  - '  &8▪ &fPunição: &7Banimento de IP'
  - '  &8▪ &fID: &7#{code}'
  - '  &8▪ &fStaff: &7{staff}'
  - ''
  # Full pardon (all punishments at once — no single id)
  # Só {player} e {staff} são resolvidos aqui: sem {code}, sem tipo, sem contagem.
  pardon:
  - ''
  - '  &a&lPERDAO'
  - '  &f{player} &7foi perdoado de todas as punições.'
  - ''
  - '  &8▪ &fStaff: &7{staff}'
  - ''

# ── /dupeip <jogador/ip> — contas no mesmo IP com marcadores de status ──
# Nome verde = online, cinza = offline. Marcadores '*' empilham ANTES do nick, na ordem fixa
# ipban → ban/tempban → mute/tempmute → warn (um único '*' de warn, mesmo com várias).
# Placeholders: header/footer → {player} {ip} {count}; line → {markers} {name} {seen}.
dupeip:
  header:
  - ''
  - '  &c&lCONTAS NO MESMO IP'
  - '  &f{player} &8(&7{ip}&8) &8▪ &f{count} &7conta(s)'
  - ''
  line: '  &8▪ {markers}{name} &8▶ &fvisto: &7{seen}'
  footer:
  - ''
  not-found: '&cNenhum jogador encontrado para &f{input}&c.'
  # Cor aplicada ao nick conforme presença.
  name-online: '&a'
  name-offline: '&7'
  # Marcadores por tipo de punição ativa (deixe vazio para ocultar um deles).
  marker-ipban: '&4*'
  marker-ban: '&c*'
  marker-mute: '&e*'
  marker-warn: '&6*'
