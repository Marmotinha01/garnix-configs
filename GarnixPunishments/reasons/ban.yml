# Reason menu for BAN (permanent). Fixed slots, no pagination.
#   title / rows          — menu title and size (rows * 9 slots)
#   permanent             — label used for {duration} on permanent reasons
#   item-lore             — lore template for each reason ({type}, {duration})
#   no-permission-icon    — shown at a reason's slot when staff lacks its permission (does nothing)
#   back-icon             — returns to the type menu
#   reasons.<id>          — display / icon / data / slot / permission (no duration = permanent)

title: Motivos - Banimento
rows: 6

item-lore:
- '&8 ▪ &fDuração: &7{duration} '
- ''
- '&aClique para selecionar.'

no-permission-icon:
  material: BARRIER
  display: '&cSem permissão'
  lore:
  - '&7O seu cargo não libera'
  - '&7este motivo de punição.'

back-icon:
  slot: 49
  texture: '7437346d8bda78d525d19f540a95e4e79daeda795cbc5a13256236312cf'
  display: '&eVoltar'
  lore:
  - '&7Clique para voltar.'

