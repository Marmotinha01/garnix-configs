title: Loja de {owner}
rows: 3

item-preview-icon:
  slot: 11
  # Três estados de lore conforme o tipo da loja: só compra, só venda, ou ambas.
  # {buy_display}/{sell_display} = símbolo + valor + moeda, ou o texto de Grátis se o preço é 0.
  # {buy_tax}/{sell_tax} = linha de taxa.
  lore-buy:
  - ''
  - ' &8 ▪ &fDono: &7{owner} '
  - ' &8 ▪ &fQuantia: &7x{amount} '
  - ''
  - ' &8 ▪ &fCompra: {buy_display} '
  - '{buy_tax}'
  lore-sell:
  - ''
  - ' &8 ▪ &fDono: &7{owner} '
  - ' &8 ▪ &fQuantia: &7x{amount} '
  - ''
  - ' &8 ▪ &fVenda: {sell_display} '
  - '{sell_tax}'
  lore-both:
  - ''
  - ' &8 ▪ &fDono: &7{owner} '
  - ' &8 ▪ &fQuantia: &7x{amount} '
  - ''
  - ' &8 ▪ &fCompra: {buy_display} '
  - '{buy_tax}'
  - ''
  - ' &8 ▪ &fVenda: {sell_display} '
  - '{sell_tax}'

# {buy_tax}: quando alguém COMPRA, o dono recebe menos (a taxa incide sobre o dono).
# {sell_tax}: quando você VENDE para a loja, você recebe menos (a taxa incide sobre você).
# -free: moeda sem taxa. -noprice: tem taxa mas o preço ainda é Grátis (só a alíquota).
# -charged: tem taxa e preço, mostra o líquido. {tax} = alíquota, {net} = líquido.
# Deixe qualquer um em branco ('') para OCULTAR a linha (ela some, sem deixar espaço).
buy-tax-free: ' &8 ▪ &fTaxa: &aIsento '
buy-tax-noprice: ' &8 ▪ &fTaxa: &c&l{tax}&c% '
buy-tax-charged: ' &8 ▪ &fTaxa: &c&l{tax}&c% &8(&7dono recebe {currency_prefix}{net}&8) '
sell-tax-free: ' &8 ▪ &fTaxa: &aIsento '
sell-tax-noprice: ' &8 ▪ &fTaxa: &c&l{tax}&c% '
sell-tax-charged: ' &8 ▪ &fTaxa: &c&l{tax}&c% &8(&7você recebe {currency_prefix}{net}&8) '

# Texto no lugar do valor+moeda quando o preço é 0 (loja Grátis).
buy-free-display: '&aGrátis'
sell-free-display: '&cGrátis'

no-item-selected-icon:
  slot: 11
  material: BARRIER
  display: '&cNenhum Item'
  lore:
  - '&7O dono da loja ainda'
  - '&7não definiu um item.'

buy-icon:
  slot: 13
  material: EMERALD
  display: '&aComprar'
  lore:
  - '&7Leve o item da loja'
  - '&7pagando o preço pedido.'
  - ''
  - '&aClique para comprar.'
  # Mostrada quando a loja não vende (sem preço de compra). Ao clicar, o cliente recebe a
  # mensagem shop.not-selling.
  disabled-lore:
  - '&7Leve o item da loja'
  - '&7pagando o preço pedido.'
  - ''
  - ' &8 ▾ &cEsta loja não vende itens.'

sell-icon:
  slot: 15
  material: REDSTONE
  display: '&cVender'
  lore:
  - '&7Passe o seu item para a'
  - '&7loja e receba por ele.'
  - ''
  - '&cClique para vender.'
  # Mostrada quando a loja não compra (sem preço de venda). Ao clicar, o cliente recebe a
  # mensagem shop.not-buying.
  disabled-lore:
  - '&7Passe o seu item para a'
  - '&7loja e receba por ele.'
  - ''
  - ' &8 ▾ &cEsta loja não compra itens.'
