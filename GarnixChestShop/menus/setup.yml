title: Criar Loja
rows: 6

selected-item-icon:
  slot: 13

no-item-selected-icon:
  slot: 13
  material: BARRIER
  display: '&cNenhum Item'
  lore:
  - '&7Clique em um item do seu'
  - '&finventário &7para selecionar.'

shop-type-icon:
  slot: 37
  material: HOPPER
  display: '&aTipo de Loja'
  lore:
  - '&7Defina se a loja compra,'
  - '&7vende ou faz as duas coisas.'
  - ''
  - '{filters}'
  - ''
  - '&aClique para alternar.'

shop-type-filters:
  buy-display: Compra
  sell-display: Venda
  both-display: Ambas
  line: ' &8 ► &7{display} '
  line-selected: ' &a ► &f{display} '

currency-icon:
  slot: 38
  lore:
  - '&eClique para alterar.'

display-icon:
  slot: 39
  material: NAME_TAG
  display: '&aNome do Item'
  none-display: '&7Nenhum'
  lore:
  - '&7Troque o nome que aparece'
  - '&7na placa da sua loja.'
  - ''
  - '&8 ▪ &fAtual: {display} '
  - ''
  - '&aClique para definir.'


amount-icon:
  slot: 43
  material: ANVIL
  display: '&aQuantia'
  lore:
  - '&7Quantos itens saem em'
  - '&7cada negociação da loja.'
  - ''
  - '&8 ▪ &fAtual: &ex{amount} '
  - ''
  - '&aClique para alterar.'

buy-price-icon:
  slot: 40
  material: EMERALD
  display: '&aPreço de Compra'
  free-display: '&aGrátis'
  selected-lore:
  - '&7Quanto o cliente paga'
  - '&7para levar o seu item.'
  - ''
  - '&8 ▪ &fAtual: {symbol_color}{symbol}{primary_color}{price} '
  - '{tax_info}'
  - ''
  - '&aClique para alterar.'
  # {tax_info}: a taxa da economia (garnix-currencies) incide sobre quem RECEBE. Na compra
  # quem recebe é você (dono), então mostra o líquido após a taxa. Some se o item for grátis.
  tax-free: ' &8 ▪ &fTaxa: &aIsento '
  # Mostrada enquanto o preço ainda é Grátis (sem valor definido): só a alíquota, sem líquido.
  tax-charged-noprice: ' &8 ▪ &fTaxa: &c&l{tax}&c% '
  tax-charged: ' &8 ▪ &fTaxa: &c&l{tax}&c% &8(&7recebe {net}&8) '
  disabled-lore:
  - ''
  - ' &8 ▾ &cDesativado neste tipo de loja. '
  - ''

sell-price-icon:
  slot: 41
  material: REDSTONE
  display: '&cPreço de Venda'
  free-display: '&cGrátis'
  selected-lore:
  - '&7Quanto a loja paga por'
  - '&7cada item recebido.'
  - ''
  - '&8 ▪ &fAtual: {symbol_color}{symbol}{primary_color}{price} '
  - '{tax_info}'
  - ''
  - '&cClique para alterar.'
  # {tax_info}: na venda quem recebe é o cliente que vende para a loja (você paga o valor
  # cheio), então mostra o líquido que ele recebe após a taxa. Some se o preço for grátis.
  tax-free: ' &8 ▪ &fTaxa: &aIsento '
  # Mostrada enquanto o preço ainda é Grátis (sem valor definido): só a alíquota, sem líquido.
  tax-charged-noprice: ' &8 ▪ &fTaxa: &c&l{tax}&c% '
  tax-charged: ' &8 ▪ &fTaxa: &c&l{tax}&c% &8(&7recebe {net}&8) '
  disabled-lore:
  - ''
  - ' &8 ▾ &cDesativado neste tipo de loja. '
  - ''

notify-on-icon:
  slot: 42
  material: BOOK_AND_QUILL
  display: '&aNotificações'
  lore:
  - '&7Avisa no chat sempre que'
  - '&7alguém usa a sua loja.'
  - ''
  - '&8 ▪ &fStatus: &aAtivadas '
  - ''
  - '&aClique para desativar.'

notify-off-icon:
  slot: 42
  material: BOOK
  display: '&cNotificações'
  lore:
  - '&7Nenhum aviso no chat'
  - '&7sobre a sua loja.'
  - ''
  - '&8 ▪ &fStatus: &cDesativadas '
  - ''
  - '&cClique para ativar.'
