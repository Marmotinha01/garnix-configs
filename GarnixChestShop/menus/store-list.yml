# Ícone contextual da sua loja (slot 51). Só um dos três é exibido:
# - my-store-icon: você já tem uma loja → abre o gerenciamento.
# - create-store-icon: você tem permissão (chestshop.store.create) e ainda não tem loja → cria.
# - vip-store-icon: você não tem permissão → apenas informa que é exclusivo de VIP.
my-store-icon:
  slot: 51
  material: CHEST
  display: '&aMinha Loja'
  lore:
  - '&7Gerencie a sua loja.'
  - ''
  - '&aClique para gerenciar.'

create-store-icon:
  slot: 51
  material: EMERALD
  display: '&aCriar Loja'
  lore:
  - '&7Você ainda não tem uma loja.'
  - ''
  - '&aClique para criar.'

vip-store-icon:
  slot: 51
  material: BARRIER
  display: '&cCriar Loja'
  lore:
  - '&7Apenas jogadores &eVIP'
  - '&7podem criar uma loja.'
  - ''
  - '&eAdquira VIP para desbloquear.'

