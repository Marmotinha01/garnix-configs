# Ícone contextual da sua loja (slot 51). Só um dos três é exibido:
# - my-store-icon: você já tem uma loja → abre o gerenciamento.
# - create-store-icon: você tem permissão (chestshop.store.create) e ainda não tem loja → cria.
# - vip-store-icon: você não tem permissão → apenas informa que é exclusivo de VIP.
my-store-icon:
  slot: 51
  material: CHEST
  display: '&aMinha Loja'
  lore:
  - '&7Ajuste a sua loja, os'
  - '&7preços e quem tem acesso.'
  - ''
  - '&aClique para gerenciar.'

create-store-icon:
  slot: 51
  material: EMERALD
  display: '&aCriar Loja'
  lore:
  - '&7Monte a sua loja e venda'
  - '&7para o servidor inteiro.'
  - ''
  - '&aClique para criar.'

vip-store-icon:
  slot: 51
  material: BARRIER
  display: '&cCriar Loja'
  lore:
  - '&7Criar uma loja própria é'
  - '&7um recurso exclusivo VIP.'
  - ''
  - '&7Adquira o seu VIP em'
  - '&c&nhttps://redegarnix.com'

