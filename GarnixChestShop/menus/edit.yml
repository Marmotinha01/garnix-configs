title: Editar Loja
rows: 6

selected-item-icon:
  slot: 13
  lore:
  - ''
  - '&aOpções de uso:'
  - '&fBotão Direito &8➟ &cRemover Item'

no-item-selected-icon:
  slot: 13
  material: BARRIER
  display: '&cNenhum Item'
  lore:
  - '&7Clique em um item do seu'
  - '&finventário &7para selecionar.'

shop-type-icon:
  slot: 28
  material: HOPPER
  display: '&aTipo de Loja'
  lore:
  - ''
  - '{filters}'
  - ''
  - '&aClique para alternar.'

shop-type-filters:
  buy-display: 'Compra '
  sell-display: 'Venda '
  both-display: 'Ambas '
  line: ' &8► &7{display}'
  line-selected: ' &a► &f{display}'

currency-icon:
  slot: 30
  lore:
  - '&7Clique para trocar.'

buy-price-icon:
  slot: 32
  material: EMERALD
  display: '&aPreço de Compra'
  free-display: '&aGrátis'
  lore:
  - '&fPreço: {symbol_color}{symbol}{primary_color}{price}'
  - '{tax_info}'
  - ''
  - '&7Clique para alterar.'
  # {tax_info}: a taxa da economia (garnix-currencies) incide sobre quem RECEBE. Na compra
  # quem recebe é você (dono), então mostra o líquido após a taxa. Some se o item for grátis.
  tax-free: '&fTaxa: &aIsento'
  # Mostrada enquanto o preço ainda é Grátis (sem valor definido): só a alíquota, sem líquido.
  tax-charged-noprice: '&fTaxa: &c&l{tax}&c%'
  tax-charged: '&fTaxa: &c&l{tax}&c% &8(&7recebe {net}&8)'
  disabled-lore:
  - '&cDesativado neste tipo de loja.'

sell-price-icon:
  slot: 34
  material: REDSTONE
  display: '&cPreço de Venda'
  free-display: '&cGrátis'
  lore:
  - '&fPreço: {symbol_color}{symbol}{primary_color}{price}'
  - '{tax_info}'
  - ''
  - '&7Clique para alterar.'
  # {tax_info}: na venda quem recebe é o cliente que vende para a loja (você paga o valor
  # cheio), então mostra o líquido que ele recebe após a taxa. Some se o preço for grátis.
  tax-free: '&fTaxa: &aIsento'
  # Mostrada enquanto o preço ainda é Grátis (sem valor definido): só a alíquota, sem líquido.
  tax-charged-noprice: '&fTaxa: &c&l{tax}&c%'
  tax-charged: '&fTaxa: &c&l{tax}&c% &8(&7recebe {net}&8)'
  disabled-lore:
  - '&cDesativado neste tipo de loja.'

amount-icon:
  slot: 37
  material: ANVIL
  display: '&aQuantia'
  lore:
  - '&fValor: &ex{amount}'
  - ''
  - '&7Clique para alterar.'

notify-on-icon:
  slot: 39
  material: BOOK_AND_QUILL
  display: '&aNotificações'
  lore:
  - '&fStatus: &aLigadas'
  - ''
  - '&7Clique para desligar.'

notify-off-icon:
  slot: 39
  material: BOOK
  display: '&cNotificações'
  lore:
  - '&fStatus: &cDesligadas'
  - ''
  - '&7Clique para ligar.'

display-icon:
  slot: 41
  material: NAME_TAG
  display: '&aDisplay Customizado'
  none-display: '&7Nenhum'
  lore:
  - '&fAtual: {display}'
  - ''
  - '&7Clique para alterar.'

friend-icon:
  slot: 43
  texture: 76cbae7246cc2c6e888587198c7959979666b4f5a4088f24e26e075f140ae6c3
  display: '&aAmigos'
  lore:
  - '&fTotal: &7{count}'
  - ''
  - '&7Clique para gerenciar.'
