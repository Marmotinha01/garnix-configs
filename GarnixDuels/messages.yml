myth:
  # Placeholder %duels_myth% quando não há mito.
  none-placeholder: Ninguém
  announce:
  - ''
  - ' &c&lMITO &7O mito atual do servidor é &f&l{player}&7!'
  - ' &7Derrote-o para tomar o seu lugar.'
  - ''
  none:
  - ''
  - ' &c&lMITO &7Não há nenhum mito no servidor no momento.'
  - ''
  set-success: '&f{player} &aagora é o mito do servidor.'
  no-eligible: '&cNenhum jogador elegível para o sorteio.'
  broadcast-set:
  - ''
  - ' &c&lMITO &f{player} &7foi definido como o novo mito!'
  - ''
  broadcast-drawn:
  - ''
  - ' &c&lMITO &7O novo mito foi sorteado...'
  - ' &c&lMITO &f&l{player} &7é o novo mito do servidor!'
  - ''
  # {player} = novo mito (matador), {previous} = mito anterior.
  broadcast-killed:
  - ''
  - ' &c&lMITO &f{player} &7derrotou o mito &f{previous} &7e tomou o seu lugar!'
  - ''
  # Resorteio automático: tempo demais OFFLINE. {player} = mito antigo.
  expired-offline:
  - ''
  - ' &c&lMITO &7O mito &f{player} &7ficou tempo demais offline.'
  - ' &7A tag será resorteada...'
  - ''
  # Resorteio automático: tempo demais SEM PVP. {player} = mito antigo.
  expired-no-pvp:
  - ''
  - ' &c&lMITO &7O mito &f{player} &7ficou tempo demais sem ir PvP.'
  - ' &7A tag será resorteada...'
  - ''

