myth:
  # Dias máximos sem ENTRAR no servidor antes do resorteio automático.
  max-offline-days: 3
  # Dias máximos sem PVP antes do resorteio automático.
  max-no-pvp-days: 4
  # Intervalo (minutos) da verificação de expiração do mito.
  check-interval-minutes: 30
  # Som tocado a todos quando o mito muda (""=desativado).
  change-sound: AMBIENCE_THUNDER
  # Texto da placeholder %duels_myth_tag% quando o jogador é o mito.
  tag: '&c[⚔]'