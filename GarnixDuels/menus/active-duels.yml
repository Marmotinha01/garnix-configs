# Ícone de cada duelo. {p1} {p2} {bet} {mode}
# No 'duel-bet-icon' também valem as placeholders da moeda da aposta:
# {symbol} {symbol_color} {primary_color} {secondary_color} {currency} {amount}
duel-bet-icon:
  material: DIAMOND_SWORD
  display: '&f{p1} &7vs &f{p2}'
  lore:
  - '&fModo: &7{mode} '
  - '&fAposta: {symbol_color}{symbol} {primary_color}{amount} {currency} '
  - ''
  - '&7Clique para assistir no camarote.'
  flags:
  - HIDE_ENCHANTS

duel-no-bet-icon:
  material: IRON_SWORD
  display: '&f{p1} &7vs &f{p2}'
  lore:
  - '&fModo: &7{mode} '
  - ''
  - '&7Clique para assistir no camarote.'
  flags:
  - HIDE_ENCHANTS

empty-icon:
  slot: 22
  material: WEB
  display: '&cVazio'
  lore:
  - '&7Nenhum duelo em andamento.'

back-icon:
  slot: 49
  texture: '7437346d8bda78d525d19f540a95e4e79daeda795cbc5a13256236312cf'
