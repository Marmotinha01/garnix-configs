# Cada entrada e um tipo de fragmento. A chave (ex.: presa) e o id usado nos
# comandos e no custo da loja. Campos: display, icon.
#
# ── UM FRAGMENTO POR FONTE ──────────────────────────────────────────────
#
#   presa      bosses
#   selo       crates e caixas misteriosas
#   marca      eventos de chat
#   estilhaco  eventos presenciais (o PvP)
#
# E o que faz o custo multi-fragmento da loja obrigar a tocar em varios
# sistemas. Se dois tipos saissem do mesmo lugar, seriam uma moeda so com
# passos extras — que era exatamente o estado anterior, com bosses e crates
# dando ambos `fogo` e os outros dois sem faucet nenhum.
#
# Fragmento nao inflaciona: 500 sao 500 no dia 3 e no dia 20. E por isso que
# ele e a rota in-game de item de site que preco em coins nao consegue ser.
fragments:
  presa:
    display: '&4Presa Colossal'
    icon:
      material: BONE
      display: '&4Presa Colossal'
      glow: true
      lore:
      - '&8Fragmento'

  selo:
    display: '&eSelo Lacrado'
    icon:
      material: PAPER
      display: '&eSelo Lacrado'
      glow: true
      lore:
      - '&8Fragmento'

  marca:
    display: '&6Marca do Vencedor'
    icon:
      material: NAME_TAG
      display: '&6Marca do Vencedor'
      glow: true
      lore:
      - '&8Fragmento'

  estilhaco:
    display: '&cEstilhaco de Arena'
    icon:
      material: FLINT
      display: '&cEstilhaco de Arena'
      glow: true
      lore:
      - '&8Fragmento'