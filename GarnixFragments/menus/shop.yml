title: Loja de Runas

# Menu simples, sem paginação: cada item declara o próprio 'slot' no shop.yml.
# As 3 linhas do meio são a grade da loja — dois trios por linha:
#
#   linha 2   caixas gerais      |  caixas das vias
#   linha 3   utilitários        |  mineração
#   linha 4   forjas             |  torres de cacto
rows: 5

back-icon:
  slot: 40
  texture: '7437346d8bda78d525d19f540a95e4e79daeda795cbc5a13256236312cf'
  display: '&eVoltar'
  lore:
  - '&7Clique para voltar.'

# Formato de cada linha de custo. Placeholders: {amount}, {display}.
cost-line: '&8 ▪ &cx{amount} {display} '

# Lore de cada item. {cost} vira uma linha por runa exigida.
purchase-lore:
- ''
- ' &8Troca:'
- '{cost}'
- ''
- '&aClique para trocar.'
