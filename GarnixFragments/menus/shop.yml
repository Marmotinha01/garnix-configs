  lore:
  - '&7Nenhum item encontrado.'

back-icon:
  slot: 49
  texture: '7437346d8bda78d525d19f540a95e4e79daeda795cbc5a13256236312cf'
  display: '&eVoltar'
  lore:
  - '&7Clique para voltar.'

# Formato de cada linha de custo. Placeholders: {amount}, {display}.
cost-line: '&8 ▪ &e{amount} &7de &f{display} '

# Lore de cada item. {cost} vira uma linha por runa exigida.
