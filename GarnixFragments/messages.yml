  not-enough: '&cVocê só possui &e{amount} &7{fragments} {stored}.'
  inventory-full: '&cSeu inventário está cheio.'
  empty: '&cVocê não possui fragmentos deste tipo armazenados.'
  success: '&aVocê retirou &e{amount} &7{fragments} de &f{display}&7.'

# Loja
shop:
  purchased: '&aVocê comprou &f{item}&7.'
  cannot-afford: '&cVocê precisa de &e{amount} &7{fragments} de &f{display}&7.'

# Comandos administrativos
admin:
  reload-success: '&aConfigurações recarregadas com sucesso.'
  reset: '&aArmazenamento de &f{player} &afoi resetado.'
  player-offline: '&cO jogador &f{player} &7não está online.'
  unknown-type: '&cO tipo de fragmento &f{type} &7não existe.'
