  # -- Linha 5, trio da esquerda: fly temporário ------------------------------
  #
  # O voo NÃO é bloqueado na fazenda (`GarnixEssentials/config.yml` só lista
  # `eventos` e `arenas`), e lá ele vale 1,55x de throughput — 12,5 contra 19,4
  # blocos/s, medido em 14-FARM-PESCA.md. Ou seja não é conveniência: é o único
  # multiplicador do servidor que se compra avulso.
  #
  # Por isso as doses LONGAS moram aqui e não na loja da pesca. Runa é contagem:
  # 450 são 450 no dia 3 e no dia 20, então o item continua difícil a temporada
  # inteira. Um preço em corais viraria pó no dia 6 e entregaria fly permanente.
  #
  # E o item só funciona para quem NÃO é VIP — `TempFlyManager` recusa quem já
  # tem `essentials.fly` (sem consumir). Esta é a rota do free para uma vantagem
  # que hoje só o site dá, que é exatamente o que esta loja existe para fazer.
  #
  # ⚠️ O relógio corre OFFLINE: o expiry é absoluto, então 24h de fly são 24h de
  # relógio e não de jogo. É o que impede a dose longa de virar estoque.
