# Loja de Runas — a rota in-game do que o site vende.
#
# Cada entrada e um item da loja. Campos:
#   slot     — vaga no menu (menus/shop.yml é uma grade fixa de 5 linhas)
#   icon     — ícone exibido (o custo é gerado automaticamente)
#   cost     — runas exigidas: <id>: <quantia> (aceita sufixos: 1.5K)
#   commands — comandos executados no console ao comprar ({player} = comprador)
#
# -- POR QUE ELA EXISTE ------------------------------------------------------
#
# Coins são exponenciais: qualquer preço em coins fica trivial dois dias depois.
# Runa é CONTAGEM — 500 são 500 no dia 3 e no dia 20. É a única coisa no
# servidor que consegue manter um item "difícil" a temporada inteira.
#
# Por isso esta loja não vende conveniência barata: ela é onde o jogador que NÃO
# paga chega nos itens do cash-shop, por um caminho deliberadamente mais longo.
#
# -- A GRADE -----------------------------------------------------------------
#
# Dois trios por linha, e as seções abaixo seguem a ordem de leitura do menu:
#
#   10 11 12   14 15 16    caixas gerais      |  caixas das vias
#   19 20 21   23 24 25    utilitários        |  mineração
#   28 29 30   32 33 34    forjas             |  torres de cacto
#   37 38 39               fly temporário     |  (livre)
#
# Trocar um item de lugar é mexer só no `slot` — a ordem das seções aqui é para
# quem lê o arquivo, o menu não depende dela.
#
# -- A REGRA DO CUSTO --------------------------------------------------------
#
# Todo item caro custa MAIS DE UM TIPO de runa, e os tipos vêm de fontes
# diferentes (sagrada=boss · eterna=crate/caixa · divina=? · primal=?). É o
# que impede o jogador de morar num sistema só e comprar tudo: para levar a
# britadeira ele precisa ter matado boss, aberto caixa, ganhado evento de chat
# E lutado.
#
# Um custo de tipo único seria uma moeda com passos extras. Um custo de quatro
# tipos é uma agenda. Só a faixa de entrada (utilitário de conveniência e a
# bomba pequena) cobra um tipo só.
#
# A faixa vai de 90 (limpador) a 1.000 de um mesmo tipo (britadeira) — os lotes
# da Caixa Runas (25 · 50 · 100 · 250 · 500) foram desenhados contra ela, então
# mexer nos extremos daqui pede revisar o comentário de `boxes/runas.yml`.
#
# ⚠️ Os números abaixo assumem a taxa de drop atual (20% nos bosses, faixa rara
#    nas crates, 3–5 por evento). Quando o M1 e o M2 forem medidos in-game, se a
#    taxa real for k× a estimada, TODOS os custos multiplicam por k — nada mais
#    muda, porque a loja não tem outro acoplamento.
#
# ⚠️ A britadeira é o maior throughput do jogo (coluna inteira, 3x3 por nível,
#    10 simultâneas). Ela é o único item de quatro runas daqui, e é de propósito:
#    é o produto que mais empurra o Ranking de Apelões.

