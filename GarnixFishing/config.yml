# GarnixFishing — config

# Currency credited on each catch (a GarnixCurrencies id).
#
# ⚠️ É a renda IMEDIATA, creditada na hora e multiplicada por skin + armadura +
# booster + rank. É por aqui que os corais entram, e é por isso que ela NÃO pode
# ser coins: a pilha de multiplicadores da pesca não pode tocar no exponencial.
# Os coins da pesca entram pelo payload `type: CURRENCY` das 44 recompensas da
# escada, em rewards.yml, sem multiplicador nenhum — o equipamento compra ACESSO
# (o `weight` que a skin alcança), não valor.
currency: corais
# Corais por unidade fisgada, ANTES dos bônus. Vale só para as recompensas que
# não trazem o próprio `currency:` — ou seja a chave, as duas caixas e as 44 de
# coins. As 10 espécies (o corpo da tabela) sobrescrevem com o valor delas,
# de 3 a 69 corais.
#
# Calibrado junto com a escada das espécies para a temporada fechar em 2,20 M de
# corais — que é a receita que os preços de shop.yml assumem.
currency-per-catch: '15'
# XP base por unidade fisgada. Na prática nunca é usado: toda recompensa de
# rewards.yml declara o próprio `xp`. Fica como rede de segurança.
xp-per-catch: 5.0
# Shown as {xp_needed} once a rod is at the level cap.
max-level-display: ∞

# Rod-XP display (XP is not a currency). Fills the {color}/{display}/{symbol}
# tokens of a {bonus} line whose provider is "xp" on armor pieces.
xp-display:
  symbol: ''
  color: '&b'
  display: XP

# Auto-generated bonus lines for armor pieces (armors/*.yml): put {bonus} on a
# lore line and it expands to one line per entry of that piece's 'bonuses' table,
# so a percentage is written once (in 'bonuses') instead of by hand. Per line:
# {value} = the number, {unit} = "%" for a percent bonus (empty otherwise);
# {color} and {display} come from the provider — "xp" uses xp-display above, the
# corais currency comes from GarnixCurrencies. An armor file may override this
# layout with its own 'bonus-format'.
bonus-lore-format: "&8 ▪ &a+&l{value}&a{unit} {primary_color}{Display} "

# Minutes between leaderboard rebuilds (the ranking keeps the top 10).
ranking-refresh-minutes: 5

# Shared style for the XP bar ({level_bar}).
progress-bar:
  length: 10
  symbol: ▪
  completed-color: '&a'
  incomplete-color: '&7'

# Seconds between catches. The Speed enchantment subtracts its flat seconds from this.
#
# ⚠️ NÚMERO CRÍTICO. Com a Correnteza 10 (−10s) o intervalo cai para 5s, ou seja
# 720 fisgadas/h contra as 240 de uma vara sem encante. Somado à Cobiça 10
# (+60%), a conta de referência sai de 240 para 1.152 unidades/h ao longo da
# temporada — e é sobre essa curva de throughput que levels.yml foi integrado e
# que a escada de coins de rewards.yml foi resolvida. Mexer aqui invalida os dois.
fishing-base-interval-seconds: 15

# Fishing rod (real, tradeable item). Bought in the home menu; all progression
# (level, XP, enchants, skins) lives on the item NBT. Material comes from the
# equipped skin.
# Placeholders: {skin}, {level}, {xp}, {xp_needed}, {bonus}, {enchants}, {level_bar}.
rod:
  # Purchase price and the GarnixCurrencies id it is paid with (a main economy
  # currency — buying with corais would be circular, since corais come from fishing).
  price: 40000
  currency: coins
  display: '&bVara de Pesca'
  lore:
  - ''
  - ' &8Informações: '
  - '&8 ▪ &fNível: &e{level} '
  - '&8 ▪ &fXP: &a{xp}&8/&c{xp_needed} {level_bar} '
  - '&8 ▪ &fSkin: {skin-display} &a+&l{skin-bonus}&a% '
  - ''
  - ' &b▎ &fEncantamentos: '
  - '{enchants}'
  - '' 
  - '&bOpções de uso:'
  - '&fBotão dir. + SHIFT &8➟ &7Gerenciar'
  # O {value} é o efeito do nível que a vara TEM: "Correnteza 3 (-3s)". Ele só
  # pode viver aqui. No livro seria mentira, porque lá o {level} é quantos níveis
  # o livro aplica, e não o nível final — um livro de 1 numa vara em Correnteza 4
  # entrega a Correnteza 5, então o livro mostraria o efeito do 1 e o jogador
  # ficaria com o do 5. A moldura do número (sinal, unidade, cor) é o
  # "value-format" de cada encantamento, em enchants.yml.
  enchant-entry: ' &8◗ &7{enchant} {level} &8({value}&8) '
  no-enchants: ' &8◗ &cNenhum encantamento '

# Skin forge item (consumed on use).
forge-item:
  texture: c03563c9259bdc86b44d1a02fee3853dea696770a28c4724d13f713f6c5ec54f
  display: '&bForja de Skins'
  lore:
  - '&7Combine skins para'
  - '&7forjar uma melhor.'
  - ''
  - '&8 ▪ &fTipo: &bVara de Pesca '
  - ''
  - ' &8Requisitos:'
  - '&8 ▪ &c7 skins iguais '
  - ''
  - '&bOpções de uso:'
  - '&fBotão dir. + SHIFT &8➟ &7Abrir'

# Boosters: per-catch multipliers given as items. Two types — "xp" (fishing XP)
# and the currency id above ("corais"). Activated by right-clicking the item.
booster:
  # How often (seconds) expired boosters are swept off online players (and they
  # are notified). Offline players are pruned lazily.
  expiry-task-seconds: 60
  # Minimum remaining seconds required to remove an active booster back to the
  # inventory — blocks the park-and-refund loop near expiry.
  min-remove-seconds: 30

# Type labels shown wherever a booster's {type} appears (item, menu, messages).
booster-types:
  xp:
    display: '&bXP'
  corais:
    display: '&3Corais'
  # The "both" booster boosts corais and fishing XP at once.
  both:
    display: '&bXP &7+ &3Corais'

# Booster item template (also the icon shown in the booster menu).
# Placeholders: {type}, {bonus} (e.g. 2x / 10%), {duration}.
booster-item:
  material: POTION
  data: 8203
  flags:
  - HIDE_POTION_EFFECTS
  display: '&bBooster de Pesca'
  lore:
  - '&7Use este booster para ter'
  - '&7seus ganhos aumentados.'
  - ''
  - ' &8Informações: '
  - ' &8▪ &fTipo: {type} '
  - ' &8▪ &fBônus: &a{bonus} '
  - ' &8▪ &fDuração: &7{duration} '
  activation-lore:
  - ''
  - '&bOpções de uso:'
  - '&fBotão direito &8➟ &7Ativar'
  - '&fBotão dir. + SHIFT &8➟ &7Juntar'