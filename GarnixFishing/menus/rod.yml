# Rod menu — opened with SHIFT + right-click on the rod. Two icons: boosters and
# the rod's skin state. Skins are applied by dragging a skin item onto the rod;
# a rod holds exactly one skin.

title: Sua Vara de Pesca
rows: 3

# Shown when the rod has NO skin (informational, no click).
skin-empty-icon:
  slot: 11
  material: BARRIER
  display: '&cNenhuma Skin'
  lore:
  - '&7Arraste uma skin na'
  - '&7vara para aplicá-la.'

# Shown when the rod HAS a skin — the icon is the equipped skin's own item, with
# this display/lore over it. Placeholders: {skin}, {bonus}, {max_weight}.
skin-equipped-icon:
  slot: 11
  display: '{skin}'
  lore:
  - ''
  - ' &8Especificações:'
  - ' &8▪ &fBônus: &a+&l{bonus}&a%'
  - ' &8▪ &fPeso Máximo: &c&l{max_weight}&ckg'
  - ''
  - '&aClique para recuperar a skin.'

# Shown when the player has at least one active booster (clickable → booster menu).
booster-icon:
  slot: 15
  material: POTION
  data: 8203
  flags:
  - HIDE_POTION_EFFECTS
  display: '&bBoosters'
  lore:
  - '&7Servem para aumentar'
  - '&7seus ganhos na pesca.'
  - ''
  - '&bClique para gerenciar.'

# Shown when the player has no active boosters (static, opens nothing).
booster-none-icon:
  slot: 15
  material: GLASS_BOTTLE
  amount: 0
  display: '&cBoosters'
  lore:
  - '&7Servem para aumentar'
  - '&7seus ganhos na pesca.'
  - ''
  - ' &c▾ Nenhum booster ativo. '
  - ''

rewards-icon:
  slot: 13
  material: CHEST
  display: '&6Recompensas'
  lore:
  - '&7Todas as recompensas'
  - '&7possíveis da pesca.'
  - ''
  - '&6Clique para ver.'