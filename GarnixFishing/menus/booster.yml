# Menu — Active Boosters. Live countdown (refreshes each second); clicking an
# active booster removes it and returns an item worth 50% of the remaining time.
# The booster icon (material/display/lore) comes from config.yml's booster-item;
# this file supplies only the slots, the empty filler, the remove hint and back.
title: Seus Boosters
rows: 4

slots:
- 11
- 13
- 15

empty-slot-icon:
  material: GLASS_BOTTLE
  amount: 0
  display: '&cSlot Vazio'
  lore:
  - '&7Sem booster ativo aqui.'

# Appended below the booster-item lore for each active booster.
active-lore-suffix:
- ''
- ' &cAo remover &c&l50&c% do tempo'
- ' &cdo booster será perdido.'
- ''
- '&aClique para remover.'

back-icon:
  slot: 31
  texture: 7437346d8bda78d525d19f540a95e4e79daeda795cbc5a13256236312cf
  display: '&cVoltar'
  lore:
  - '&7Clique para voltar.'