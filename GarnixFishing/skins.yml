# GarnixFishing — Skins da vara. A skin define os bônus da fisgada e o PESO máximo
# que a vara consegue fisgar (rewards.yml → weight <= max-weight).
#
# Cada skin declara:
#   display        — nome colorido
#   material       — material visual da vara
#   forgeable      — true = 7 desta skin forjam a PRÓXIMA declarada abaixo
#   bonuses        — bônus por provider (value + percent), igual às armaduras
#   max-weight     — maior peso de recompensa que esta vara alcança
#
# Ponha {bonus} numa linha da lore e ela vira uma linha por entrada de 'bonuses'
# (cor e nome saem da moeda; o xp usa o xp-display do config.yml), então o
# percentual é escrito UMA vez — em 'bonuses' — e não à mão. O layout da linha é o
# 'bonus-lore-format' do config.yml.
#
# -- MESMO PERCENTUAL PARA TODA MOEDA ---------------------------------
# Toda skin dá o MESMO percentual em corais e XP, igual às skins de Mining e Farm.
# É o que permite anunciar um número só de bônus e ele fechar com o que está
# escrito aqui. A ladder é 2 · 5 · 9 · 14 · 20 · 28 · 38 · 50 · 65.
#
# -- LADDER DA TEMPORADA ----------------------------------------------
# Ordem de raridade (a ordem DESTE arquivo é a ordem da forja):
#   Madeira · Coral · Escama · Prata · Turquesa · Abissita · Serenita ·
#   Oceanita · Pérola · Tempestita
#
# A forja (7 skins iguais) sobe de Coral até Serenita. Oceanita, Pérola e
# Tempestita têm forgeable: false e só saem de caixa (glow no menu).
# ---------------------------------------------------------------------

unlock-lore:
- '&aArraste sobre uma'
- '&avara para aplicar.'

rod-skins:
  default:
    display: '&eMadeira'
    material: FISHING_ROD
    forgeable: false
    max-weight: 3
    icon:
      material: FISHING_ROD
      display: '&eSkin de Madeira'
      lore:
      - ''
      - ' &8Especificações: '
      - '&8 ▪ &cPeso até &l{max_weight}&ckg '
      - ''
      - '&8 ▾ &cSem bônus. '
      - ''

  coral:
    display: '&3Coral'
    material: FISHING_ROD
    forgeable: true
    max-weight: 6
    icon:
      glow: true
      material: FISHING_ROD
      display: '&3Skin de Coral'
      lore:
      - ''
      - ' &8Especificações: '
      - '{bonus}'
      - '&8 ▪ &cPeso até &l{max_weight}&ckg '
      - ''
    bonuses:
      corais:
        value: 2.0
        percent: true
      xp:
        value: 2.0
        percent: true

