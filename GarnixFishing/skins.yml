# GarnixFishing — Skins da vara. A skin define o bônus de corais e o PESO máximo
# que a vara consegue fisgar (rewards.yml → weight <= max-weight).
#
# Cada skin declara:
#   display        — nome colorido
#   material       — material visual da vara
#   forgeable      — true = 7 desta skin forjam a PRÓXIMA declarada abaixo
#   currency-bonus — % somado aos corais por fisgada
#   max-weight     — maior peso de recompensa que esta vara alcança
#
# ── LADDER DA TEMPORADA ──────────────────────────────────────────────
# Ordem de raridade (a ordem DESTE arquivo é a ordem da forja):
#   Madeira · Coral · Escama · Prata · Turquesa · Abissita · Serenita ·
#   Oceanita · Pérola · Tempestita
#
# A forja (7 skins iguais) sobe de Coral até Serenita. Oceanita, Pérola e
# Tempestita têm forgeable: false e só saem de caixa (glow no menu).
# ─────────────────────────────────────────────────────────────────────

unlock-lore:
- ''
- '&aArraste sobre uma'
- '&avara para aplicar.'

rod-skins:
  default:
    display: '&eMadeira'
    material: FISHING_ROD
    forgeable: false
    currency-bonus: 0
    max-weight: 3
    icon:
      material: FISHING_ROD
      display: '&eSkin de Madeira'
      lore:
      - ''
      - ' &8Especificações:'
      - '&8 ▪ &a+&l{bonus}&a% &3Corais '
      - '&8 ▪ &cPeso até &l{max_weight}&ckg '

