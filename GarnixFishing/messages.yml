# GarnixFishing — messages (keys in English, values in pt-BR).

general:
  only-players: '&cApenas jogadores podem usar este comando.'
  reloaded: '&aConfigurações recarregadas com sucesso.'

fishing:
  started: '&aVocê arremessou a linha.'
  stopped: '&cVocê recolheu a linha.'

actionbar:
  fishing: '&bPescando... &f{remaining}s'
  not-fishing: '&7Arremesse a linha na água para pescar.'

catch:
  title: '&b&lFISGOU!'
  # Currency placeholders: {symbol_color}{symbol}{primary_color}{secondary_color}
  # {currency} (singular/plural) {amount}. {quantity} = how many were fished.
  subtitle: '&f{reward} &7x{quantity} &8■ &a+ {symbol_color}{symbol}{primary_color}{amount} {currency}'
  bad-luck: '&8Que azar... nada dessa vez.'

level:
  up: '&b&lLEVEL UP. &fSua vara alcançou o nível &b&l{level}&f.'
  reward-unlocked-header: '&3&lNOVAS RECOMPENSAS DESBLOQUEADAS.'
  reward-unlocked-entry: ' &8▶ &f{reward}'

enchant:
  # Applied with books dragged onto the rod. {enchant} carries its own color.
  applied: '&aEncantamento &f{enchant} &aaplicado. Nível atual: &f{level}&a.'
  partial: '&aEncantamento &f{enchant} &aelevado ao nível &f{level}&a. Livro restante: &f{remaining}&a.'
  already-max: '&cA vara já está no nível máximo de &f{enchant}&c.'

# Rod purchase (home menu).
rod:
  # {item} placeholder is not used; a fixed confirmation is enough.
  purchased: '&aVocê comprou uma Vara de Pesca.'
  # Currency placeholders resolved by the hook: {symbol_color}{symbol}{primary_color}{amount} {currency}.
  insufficient: '&cVocê precisa de {symbol_color}{symbol}{primary_color}{amount} {currency}&c para comprar a vara.'
  inventory-full: '&cSeu inventário está cheio.'

skin:
  invalid: '&cEssa skin não existe mais.'
  need-rod: '&cVocê precisa de uma Vara de Pesca no inventário.'
  # Applied by dragging a skin item onto the rod (swaps out the previous one).
  applied: '&aSkin {skin} &aaplicada na sua vara.'
  already-equipped: '&cEssa vara já está com a skin {skin}&c.'
  removed: '&eSkin {skin} &eremovida e devolvida como item.'
  inventory-full: '&cSeu inventário está cheio.'

shop:
  # {item} = the bought product's icon display (carries its own colors).
  purchased: '&aVocê comprou {item}&a.'
  # Currency placeholders resolved by the hook: {symbol_color}{symbol}{primary_color}{amount} {currency}.
  insufficient: '&cVocê precisa de {symbol_color}{symbol}{primary_color}{amount} {currency}&c para concluir essa compra.'

forge:
  no-item: '&cVocê não possui mais o item de forja.'
  inventory-full: '&cSeu inventário está cheio.'
  success: '&aVocê forjou a skin {skin}&a.'

booster:
  # {type} já vem colorido (booster-types); {bonus} = ex. 2x.
  activated: '&aBooster de {type} &f{bonus} &aativado.'
  stacked: '&aBooster de {type} &f{bonus} &aestendido.'
  # Juntar no inventário (shift + botão direito). Tokens: {type} {bonus} {amount} {duration}
  merged: '&aBooster &f{type} {bonus} {duration} &aunificado. &7(eram x{amount})'
  merge-none: '&eVocê não tem outros boosters de {type} &f{bonus}&e no inventário para juntar.'
  expired: '&cSeu booster de {type} &f{bonus} &cexpirou.'
  removed: '&eBooster removido. &7Devolvido &f{remaining}&7.'
  blocked: '&cVocê já tem um booster ativo.'
  conflict: '&cVocê já tem um booster ativo. &7Aguarde expirar ou desative-o.'
  too-little-time: '&cTempo restante insuficiente para remover este booster.'

admin:
  usage: '&cUse: {usage}'
  usages:
    setlevel: /pesca setlevel <jogador> <nível>
