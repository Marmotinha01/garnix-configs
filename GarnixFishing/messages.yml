    givebook: /pesca givebook <jogador> <speed|luck|double> <nível> [quantidade]
    giverod: /pesca giverod <jogador>
    giveskin: /pesca giveskin <jogador> <skin> [quantidade]
    giveforge: /pesca giveforge <jogador> [quantidade]
    givearmor: /pesca givearmor <jogador> <armadura|coleção> [quantidade]
    givebooster: /pesca givebooster <jogador> <tipo> <multiplicador> <duração> [quantidade]
  player-not-found: '&cJogador &f{player} &cnão encontrado.'
  player-no-rod: '&f{player} &cprecisa estar segurando uma Vara de Pesca.'
  invalid-number: '&cNúmero inválido: &f{value}&c.'
  level-range: '&cO nível deve estar entre 0 e {max}.'
  level-set: '&aNível da vara de &f{player} &adefinido para &f{level}&a.'
  xp-added: '&aAdicionado &f{value} &aXP à vara de &f{player}&a.'
  enchant-not-found: '&cEncantamento &f{enchant} &cnão encontrado.'
  enchant-set: '&aEncantamento &f{enchant} &ada vara de &f{player} &adefinido para o nível &f{level}&a.'
  skin-not-found: '&cSkin &f{skin} &cnão encontrada.'
  skin-given: '&aEntregue a skin {skin} &a(x{amount}) para &f{player}&a.'
  forge-given: '&aEntregue &f{amount} &aitem(ns) de forja para &f{player}&a.'
  rod-given: '&aEntregue uma Vara de Pesca para &f{player}&a.'
  book-given: '&aEntregue livro de &f{enchant} &f{level} &a(x{amount}) para &f{player}&a.'
  armor-not-found: '&cArmadura/coleção não encontrada: &f{armor}'
  armor-given: '&aArmadura {armor} &adada para &f{player}&a.'
  collection-given: '&aColeção &f{collection} &adada para &f{player}&a.'
  booster-type-invalid: '&cTipo de booster inválido: &f{type}&c.'
