# The 3 rod enchantments. Levels live on the rod's NBT and are applied with
# enchant books (dragged onto the rod). The highest configured level is the cap.
#   speed  : seconds removed from the catch interval (flat, not percent)
#   luck   : % weight boost for rewards flagged "rare: true"
#   double : % chance to catch twice at once
#
# Each enchant defines its own book item under "book" (material/display/lore),
# with the {enchant} (enchant display), {level} and {value} placeholders.
#
# {value} e o EFEITO REAL do nivel — os segundos que a Correnteza tira, a % da
# Mare, a % da Cobica. A lore antiga so tinha {level}, e "Nivel: 3" nao informa
# nada: o jogador nao tinha como saber o que o 3 valia. Toda lore daqui usa o
# numero, e a unidade vem escrita ao lado porque ela muda de um para o outro.

enchantments:
  
  speed:
    display: '&bCorrenteza'
    book:
      material: ENCHANTED_BOOK
      display: '&bLivro de Correnteza'
      lore:
      - '&7Diminui o tempo de espera'
      - '&7entre uma fisgada e outra.'
      - ''
      - ' &8Especificações: '
      - '&8 ▪ &fNível: &7{level} '
      - '&8 ▪ &fEfeito: &b-{value}s &fpor fisgada '
      - '&8 ▪ &fTipo: &bVara de Pesca '
      - ''
      - '&7Arraste sobre a vara'
      - '&7para aplicar o livro.'
    levels:
      '1':
        value: 1
      '2':
        value: 2
      '3':
        value: 3
      '4':
        value: 4
      '5':
        value: 5
  
  luck:
    display: '&aMaré'
    book:
      material: ENCHANTED_BOOK
      display: '&aLivro de Maré'
      lore:
      - '&7Deixa os peixes raros mais'
      - '&7fáceis de cair no anzol.'
      - ''
      - ' &8Especificações: '
      - '&8 ▪ &fNível: &7{level} '
      - '&8 ▪ &fEfeito: &a+{value}% &fnos raros '
      - '&8 ▪ &fTipo: &bVara de Pesca '
      - ''
      - '&7Só vale para o que já dá'
      - '&7para pescar no seu nível.'
      - ''
      - '&7Arraste sobre a vara'
      - '&7para aplicar o livro.'
    levels:
      '1':
        value: 15
      '2':
        value: 30
      '3':
        value: 50
      '4':
        value: 75
      '5':
        value: 100
  
  double:
    display: '&dCobiça'
    book:
      material: ENCHANTED_BOOK
      display: '&dLivro de Cobiça'
      lore:
      - '&7Chance de a fisgada valer'
      - '&7dobrado, e não só o item:'
      - '&7corais e XP dobram junto.'
      - ''
      - ' &8Especificações: '
      - '&8 ▪ &fNível: &7{level} '
      - '&8 ▪ &fEfeito: &d{value}% &fde dobrar '
      - '&8 ▪ &fTipo: &bVara de Pesca '
      - ''
      - '&7Arraste sobre a vara'
      - '&7para aplicar o livro.'
    levels:
      '1':
        value: 5
      '2':
        value: 10
      '3':
        value: 18
      '4':
        value: 28
      '5':
        value: 40
