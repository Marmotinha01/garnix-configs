# The 3 rod enchantments. Levels live on the rod's NBT and are applied with
# enchant books (dragged onto the rod). The highest configured level is the cap.
#   speed  : seconds removed from the catch interval (flat, not percent)
#   luck   : % weight boost for rewards flagged "rare: true"
#   double : % chance to catch twice at once
#
# Each enchant defines its own book item under "book" (material/display/lore),
# with the {enchant} (enchant display) and {level} placeholders.

enchantments:
  
  speed:
    display: '&bCorrenteza'
    book:
      material: ENCHANTED_BOOK
      display: '&bLivro de Correnteza'
      lore:
      - '&7Puxa o peixe mais rápido'
      - '&7para a sua vara.'
      - ''
      - ' &8Especificações: '
      - '&8 ▪ &fNível: &7{level} '
      - '&8 ▪ &fTipo: &bVara de Pesca '
      - ''
      - '&7Arraste sobre a vara'
      - '&7para aplicar o livro.'
    levels:
      '1':
        value: 1
      '2':
        value: 2
      '3':
        value: 3
      '4':
        value: 4
      '5':
        value: 5
  
  luck:
    display: '&aFaro Aguçado'
    book:
      material: ENCHANTED_BOOK
      display: '&aLivro de Faro Aguçado'
      lore:
      - '&7Aumenta a chance de vir'
      - '&7recompensa melhor.'
      - ''
      - ' &8Especificações: '
      - '&8 ▪ &fNível: &7{level} '
      - '&8 ▪ &fTipo: &bVara de Pesca '
      - ''
      - '&7Arraste sobre a vara'
      - '&7para aplicar o livro.'
    levels:
      '1':
        value: 15
      '2':
        value: 30
      '3':
        value: 50
      '4':
        value: 75
      '5':
        value: 100
  
  double:
    display: '&dFartura'
    book:
      material: ENCHANTED_BOOK
      display: '&dLivro de Fartura'
      lore:
      - '&7Chance de fisgar mais de'
      - '&7uma recompensa por vez.'
      - ''
      - ' &8Especificações: '
      - '&8 ▪ &fNível: &7{level} '
      - '&8 ▪ &fTipo: &bVara de Pesca '
      - ''
      - '&7Arraste sobre a vara'
      - '&7para aplicar o livro.'
    levels:
      '1':
        value: 5
      '2':
        value: 10
      '3':
        value: 18
      '4':
        value: 28
      '5':
        value: 40
