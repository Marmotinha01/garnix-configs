# The 3 rod enchantments. Levels live on the rod's NBT and are applied with
# enchant books (dragged onto the rod). The highest configured level is the cap.
#   speed  : seconds removed from the catch interval (flat, not percent)
#   luck   : % weight boost for rewards flagged "rare: true"
#   double : % chance to catch twice at once
#
# Each enchant defines its own book item under "book" (material/display/lore),
# with the {enchant} (enchant display) and {level} placeholders.
#
# O efeito de cada nivel NAO aparece no livro: la o {level} e quantos niveis o
# livro aplica, e nao o nivel final — um livro de 1 numa vara que ja esta em
# Correnteza 4 entrega a Correnteza 5, entao o livro estaria mostrando o efeito
# do 1 e o jogador ficaria com o do 5. Quem mostra efeito e a vara, na linha
# "rod.enchant-entry" do config.yml, onde o nivel e o de verdade. O "value-format"
# de cada encantamento e a moldura desse numero (sinal, unidade, cor).

enchantments:
  
  speed:
    display: '&bCorrenteza'
    value-format: '&c-&l{value}&cs'
    book:
      material: ENCHANTED_BOOK
      display: '&bLivro de Correnteza'
      lore:
      - '&7Diminui o tempo de espera'
      - '&7entre uma fisgada e outra.'
      - ''
      - ' &8Especificações: '
      - '&8 ▪ &fNível: &7{level} '
      - '&8 ▪ &fTipo: &bVara de Pesca '
      - ''
      - '&7Arraste sobre a vara'
      - '&7para aplicar o livro.'
    levels:
      '1':
        value: 1
      '2':
        value: 2
      '3':
        value: 3
      '4':
        value: 4
      '5':
        value: 5
  
  luck:
    display: '&aMaré'
    value-format: '&a+&l{value}&a%'
    book:
      material: ENCHANTED_BOOK
      display: '&aLivro de Maré'
      lore:
      - '&7Deixa os peixes raros mais'
      - '&7fáceis de cair no anzol.'
      - ''
      - ' &8Especificações: '
      - '&8 ▪ &fNível: &7{level} '
      - '&8 ▪ &fTipo: &bVara de Pesca '
      - ''
      - '&7Arraste sobre a vara'
      - '&7para aplicar o livro.'
    levels:
      '1':
        value: 15
      '2':
        value: 30
      '3':
        value: 50
      '4':
        value: 75
      '5':
        value: 100
  
  double:
    display: '&dCobiça'
    value-format: '&a+&l{value}&a%'
    book:
      material: ENCHANTED_BOOK
      display: '&dLivro de Cobiça'
      lore:
      - '&7Chance de a fisgada valer'
      - '&7dobrado, e não só o item:'
      - '&7corais e XP dobram junto.'
      - ''
      - ' &8Especificações: '
      - '&8 ▪ &fNível: &7{level} '
      - '&8 ▪ &fTipo: &bVara de Pesca '
      - ''
      - '&7Arraste sobre a vara'
      - '&7para aplicar o livro.'
    levels:
      '1':
        value: 5
      '2':
        value: 10
      '3':
        value: 18
      '4':
        value: 28
      '5':
        value: 40
