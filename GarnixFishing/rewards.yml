  # ═══ A CHAVE — comando virtual, cai direto no /crates ══════════════════════
  # ~18 a 49 por dia, 420 na temporada. Fora do "rare" de proposito: ela ja e
  # frequente, entao a Mare foi inteira para as caixas.
  chave:
    required-level: 5
    chance: 0.1725
    weight: 3
    xp: 25
    type: COMMAND
    command: crates givevirtualkey pesca {player} {amount}
    amount: 1
    display: '&bChave Pesca'
    icon:
      material: TRIPWIRE_HOOK
      glow: true
      display: '&bChave Pesca'
      lore:
      - '&7Consiga recompensas'
      - '&7abrindo essa chave.'

  # ═══ O TOPO — as duas caixas ═══════════════════════════════════════════════
  # Sao as unicas recompensas com "rare: true", ou seja as unicas que a Mare
  # turbina (+150% no nivel 10).
  #
  # ⚠️ A Caixa Pesca I esta em PESO 3, alcancavel pela vara de Madeira desde o
  # comeco. Ela ja esteve em peso 6 e isso era um deadlock: a Caixa I e a fonte
  # das skins do meio, mas o peso 6 exigia justamente a skin de Coral para
  # abri-la. O jogador travava no nivel 7 e nao saia mais.
  #
  # ⚠️ A Caixa Pesca I e a ROTA DE LIVROS da via, e por isso a taxa dela nao e
  # solta: 150 na temporada x ~10,5% de livros dentro dela, mais 25 Caixas II x
  # 30% x 3 niveis, dao os ~30 niveis de livro que a arvore de encantes pede.
  # Mexer nesta chance, ou na fatia de livros da caixa, muda o ritmo de
  # encantamento e desloca a curva inteira de levels.yml.
  caixa-pesca-i:
    required-level: 6
    chance: 0.0384
    weight: 3
    rare: true
    xp: 45
    type: COMMAND_ITEM
    command: caixas give pesca-i {player} {amount}
    amount: 1
    display: '&bCaixa Pesca &b[Tier &lI&b]'
    icon:
      material: CHEST
      display: '&bCaixa Pesca &b[Tier &lI&b]'
      lore:
      - '&7Abra e descubra o que a sorte'
      - '&7guardou para você lá dentro.'

