# GarnixFishing — a tabela de fisgada.
#
# Cada recompensa:
#   required-level : nivel em que ela abre
#   chance         : PESO relativo do sorteio (nao precisa somar 100)
#   weight         : o PESO da recompensa — o portao da vara: a skin so fisga
#                    recompensas cujo weight <= o max-weight dela
#   rare           : se true, recebe o impulso do encante Mare
#   bad-luck       : fisgada de azar — nao entrega nada e nao paga nada
#   xp             : XP por unidade; omita para usar o xp-per-catch global
#   type           : ITEM / COMMAND / COMMAND_ITEM / CURRENCY / NONE
#   currency       : renda POR FISGADA em corais (imediata, creditada na hora,
#                    multiplicada por skin + armadura + booster + rank)
#   amount         : quantia do payload ({amount} nos comandos, deposito do CURRENCY)
#
# ═══ COMO A TABELA E DIVIDIDA ════════════════════════════════════════════════
#
#   azar        1 entrada    paga nada
#   especies   10 entradas   pagam CORAIS na hora, sem payload  (o corpo)
#   coins      44 entradas   pagam COINS por correio            (a escada)
#   chave       1 entrada    chave de pesca, direto no /crates
#   caixas      2 entradas   Caixa Pesca I e II, por correio    (o topo)
#
# ═══ O PORTAO DA ESCADA SAO AS SKINS 1 A 7, E SO ELAS ════════════════════════
#
# Nenhuma recompensa passa de PESO 45 (Serenita). Oceanita, Perola e Tempestita
# — as tres que a forja nao alcanca e que o site vende — ficam FORA da escada
# de renda: elas valem o percentual (+15/+20/+25%) e o prestigio, e o max-weight
# de 65/90/130 delas nao gateia recompensa nenhuma.
#
# Isso e deliberado e e o que torna a escada honesta. Se a renda dependesse
# delas, a conta AFK sem sorte travaria no nivel gateado pela Serenita e ficaria
# 4x10^5 atras de quem comprou a skin no site no fim da temporada — porque o
# alvo do tier continua subindo 6,61x por dia depois que o jogador trava.
#
# A escada de peso das skins (3 · 6 · 10 · 15 · 22 · 32 · 45 · 65 · 90 · 130)
# continua escrita como esta: os tres ultimos degraus sao vitrine.
#
# ⚠️ Prazo de cada portao — e o que a crate e as caixas TEM que entregar:
#
#   Coral    (peso  6) abre no nivel  8, dia  3,40
#   Escama   (peso 10) abre no nivel 14, dia  5,95
#   Prata    (peso 15) abre no nivel 20, dia  8,50
#   Turquesa (peso 22) abre no nivel 27, dia 11,47
#   Abissita (peso 32) abre no nivel 33, dia 14,02
#   Serenita (peso 45) abre no nivel 39, dia 16,57
#
# ═══ POR QUE O CORPO E "type: NONE" E ISSO NAO E AZAR ════════════════════════
#
# O RewardDelivery grava UMA LINHA DE CORREIO por fisgada entregue, sem
# agregacao (MailManager.sendCurrency faz um INSERT por chamada). Com 94% das
# fisgadas gerando payload, uma conta AFK no fim da temporada geraria ~21.800
# linhas por dia — 2,2 milhoes/dia com 100 contas.
#
# Por isso as 10 especies nao tem "type": elas sao NONE, ou seja SEM PAYLOAD, e
# o valor delas e o campo currency — corais creditados na hora, sem passar pelo
# correio. O RewardService ramifica pela flag bad-luck crua (nao pelo
# isBadLuck(), que junta NONE com azar), entao a especie mantem titulo, Cobica e
# contador do ranking. So o azar abaixo leva bad-luck: true.
#
# ⚠️ NAO acrescente bad-luck: true numa especie: ela viraria azar de verdade —
# perderia o titulo, a Cobica pararia de dobrar e o ranking pararia de contar.
#
# A chave e type: COMMAND (comando VIRTUAL): o RewardDelivery executa na hora,
# sem correio, porque ela credita um saldo no GarnixCrates e nao ocupa slot. As
# caixas sao COMMAND_ITEM (item fisico), entao vao para o correio mesmo — e sao
# as unicas coisas que vao. O correio da pesca fica em 53 a 1.239 linhas/dia.
#
# ═══ A ESCADA DE COINS ═══════════════════════════════════════════════════════
#
# 44 recompensas, uma por nivel, com portao 2D: required-level (a escada de
# niveis) x weight (a skin da vara). Cada degrau vale ~2,2x, contra os 6,6x da
# escada antiga de 20 — o degrau menor e o que faz um erro de ritmo custar 2,2x
# em vez de uma ordem de grandeza.
#
# Os valores foram resolvidos por RECORRENCIA contra o alvo de 7% da renda
# diaria do tier: a recompensa nova entrega o que FALTA depois das anteriores,
# que continuam no pool. O erro contra a banda fica entre 0,4x e 2,1x.
#
# ⚠️ chance: 0.1 e baixo de proposito. Ela e o unico numero que controla o
# volume de correio da escada: a 1,5 seriam ~10.000 linhas/dia por conta. A 0,1
# sao ~1.000, e a recorrencia so devolve valores maiores para compensar — a
# renda nao muda.
#
# ⚠️ amount e lido como new BigDecimal(getString(...)) (Reward.java:73-74) — por
# isso vai ENTRE ASPAS: sem aspas um inteiro grande viraria BigInteger e o
# getString devolveria nulo.
#
# ⚠️ O menu de recompensas (menus/rewards.yml) ja acrescenta Nivel, Peso e
# Chance em cada icone. NAO repita esses tres na lore daqui.

rewards:

  # -- AZAR — nao entrega nada e nao paga nada -------------------------------
  # Cai de 24% das fisgadas no nivel 1 para ~6% no nivel 44: o pool cresce a
  # cada especie e a cada degrau da escada, entao a vara melhor erra menos.
  azar:
    required-level: 0
    chance: 8
    weight: 1
    bad-luck: true
    xp: 2
    display: '&8Azar'
    icon:
      material: INK_SACK
      data: 8
      display: '&8Azar'
      lore:
      - '&7Não foi dessa vez.'

