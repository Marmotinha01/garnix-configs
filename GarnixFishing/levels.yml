# GarnixFishing — curva de XP da vara.
#
# 44 NIVEIS, tempo por nivel PLANO de 10,2 h. A conta AFK de referencia (24h,
# sorte media de caixas) chega ao nivel 44 no DIA 18,7, deixando ~1,3 dia de
# teto antes do fim da temporada.
#
# ⚠️ A curva NAO e uma progressao geometrica escrita a mao — ela e a INTEGRAL do
# throughput real. O XP de cada nivel e quanto a conta de referencia produz
# durante as 10,2 h daquele nivel, com o equipamento que ela tem NAQUELE
# momento: o intervalo caindo de 15s para 5s conforme a Correnteza sobe, a
# Cobica multiplicando as fisgadas, e skin + armadura multiplicando o XP.
#
# Por isso o nivel 1 pede 12.290 e o nivel 44 pede 129.640 (10,6x): nao e o
# nivel que fica mais caro, e o jogador que fica ~10x mais rapido.
#
# ⚠️ O laco e fechado: caixa -> livro -> encante -> throughput -> caixa. Se
# mexer na taxa de Caixa Pesca I em rewards.yml, ou na fatia de livros dentro
# da caixa (GarnixMysteryBoxes/boxes/pesca-i.yml), o ritmo de encantamento muda
# e ESTA CURVA sai do lugar.
#
# A curva antiga tinha 20 niveis somando 1.365.311 e mirava 23,9 h por nivel,
# mas o pool real do nivel 1 dava 4,2 XP por fisgada em vez dos 8 assumidos —
# o nivel 1 levava 45,8 h de verdade. Agora leva 10,2.

