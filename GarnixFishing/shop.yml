# Coral-shop products. Each product is placed at its own slot in menus/shop.yml.
#   slot    — inventory slot in the shop menu.
#   cost    — price in the config currency (corais).
#   command — run as console on purchase; {player} = buyer's name.
#   icon    — material/display/lore shown in the menu (shared buy-lore appended).
#
# ═══ O QUE A LOJA VENDE ══════════════════════════════════════════════════════
#
# Três blocos, e só eles:
#
#   chaves    pesca e bosses, em lotes de 16 e 32
#   limites   spawner · máquina · armazém, em lotes de 5, 15 e 30
#   caixas    Recursos, Runas e Booster
#
# A pesca é a via AFK: ela não devolve poder de combate nem item de progressão
# direto, ela devolve CHANCE (chave, caixa) e CAPACIDADE (limite). Quem quer a
# peça em si abre a caixa ou vai na via ativa.
#
# ═══ POR QUE O LIMITE TEM CÂMBIO CRESCENTE ═══════════════════════════════════
#
# Antes daqui existia um produto só, e ele era um exploit: 1.500 corais compravam
# 1.500 de limite de spawner, câmbio 1:1 com o item nº 1 do Ranking de Apelões. A
# pesca rende ~2,19 milhões de corais na temporada, então aquilo comprava ~2,19
# MILHÕES de limite — várias ordens acima de qualquer necessidade real, já que um
# bloco comporta no máximo 512 itens de spawner.
#
# O câmbio agora CRESCE com o lote, ao contrário de toda loja normal:
#
#   lote de  5  ->  1.300 corais por unidade
#   lote de 15  ->  1.500 por unidade  (+15%)
#   lote de 30  ->  1.667 por unidade  (+28%)
#
# A base de ~1.100 é derivada: 2,19×10⁶ corais na temporada ÷ ~2.000 de limite,
# que é o teto útil com folga (512 itens por bloco × os blocos que o jogador
# mantém). Os lotes daqui partem dela e sobem.
#
# É de propósito. `spawnerslimite` é o item nº 1 do Ranking de Apelões: multiplica
# a única via SEM teto físico. E corais são negociáveis (sem blacklist, por decisão
# do dono), então um jogador pode comprar os corais dos outros e converter tudo em
# capacidade. Com câmbio plano, concentrar não custaria nada a mais.
#
# Quem compra pouco não sente. Quem quer concentrar paga progressivamente mais —
# que é exatamente o freio que o E5 pedia sem precisar proibir a troca.
#
# `maquinaslimite` entra pelo mesmo câmbio: as duas são moedas de contagem pura e
# devem custar o mesmo esforço.
#
# ⚠️ O armazém segue a MESMA escala de lote (5/15/30) por decisão do dono — a
# leitura do menu fica uniforme nas três colunas. O preço dele é 1/10 do dos
# outros dois porque a unidade dele sempre valeu 1/10: o item de armazém vendido
# em todo o resto do servidor é 500 por 55.000 corais, ou seja 110 por unidade,
# contra 1.100 dos limites de compra.
#
# ═══ CHAVES ══════════════════════════════════════════════════════════════════
#
# Câmbio plano, sem desconto por lote — chave não é vetor de concentração, os 16
# e os 32 existem só para poupar clique:
#
#   chave de pesca    875 corais cada   (o lote de 10 já custava 900)
#   chave de bosses  1.500 corais cada
#
# A de boss custa ~1,7× porque a fonte dela é matar boss, não ficar AFK — este é
# o preço de furar essa fila com uma via passiva.
products:

  # -- Chaves -----------------------------------------------------------------
  chave-pesca-16:
    slot: 10
    cost: 14000
    command: crates givekey pesca {player} 16
    icon:
      material: TRIPWIRE_HOOK
      amount: 16
      glow: true
      display: '&bChave Pesca'
      lore:
      - '&7Consiga recompensas'
      - '&7abrindo essa chave.'
      - ''
