# Coral-shop products. Each product is placed at its own slot in menus/shop.yml.
#   slot    — inventory slot in the shop menu.
#   cost    — price in the config currency (corais).
#   command — run as console on purchase; {player} = buyer's name.
#   icon    — material/display/lore shown in the menu (shared buy-lore appended).
#
# ═══ POR QUE ESTE ARQUIVO FOI REESCRITO ══════════════════════════════════════
#
# Tinha UM produto, e ele era um exploit:
#
#   spawner-limit: cost 1500 corais  ->  spawner givelimite {player} 1500
#
# Câmbio 1:1 com o item nº 1 do Ranking de Apelões. A pesca rende ~2,19 milhões
# de corais na temporada, então isso comprava ~2,19 MILHÕES de limite de spawner
# — várias ordens acima de qualquer necessidade real, já que um bloco comporta
# no máximo 512 itens de spawner.
#
# ═══ O CÂMBIO NOVO ═══════════════════════════════════════════════════════════
#
#   lote de   1  ->   1.100 corais por unidade
#   lote de  10  ->   1.400 por unidade  (+27%)
#   lote de 100  ->   1.900 por unidade  (+73%)
#
# A base de 1.100 é derivada: 2,19×10⁶ corais na temporada ÷ ~2.000 de limite,
# que é o teto útil com folga (512 itens por bloco × os blocos que o jogador
# mantém).
#
# ⚠️ O câmbio CRESCE com o lote, ao contrário de toda loja normal — e é de
# propósito. `spawnerslimite` é o item nº 1 do Ranking de Apelões: multiplica a
# única via SEM teto físico. E corais são negociáveis (sem blacklist, por decisão
# do dono), então um jogador pode comprar os corais dos outros e converter tudo
# em capacidade. Com câmbio plano, concentrar não custaria nada a mais.
#
# Quem compra pouco não sente. Quem quer concentrar paga progressivamente mais —
# que é exatamente o freio que o E5 pedia sem precisar proibir a troca.
#
# `maquinaslimite` entra pelo mesmo câmbio: as duas são moedas de contagem pura
# e devem custar o mesmo esforço.
products:

  # ── Limite de spawner ──────────────────────────────────────────────────────
  spawner-limit-1:
    slot: 10
    cost: 1100
    command: spawner givelimite {player} 1
    icon:
      material: PAPER
      display: '&bLimite de Spawner'
      lore:
      - '&8 ▪ &fQuantia: &b1 '
      - ''

  spawner-limit-10:
    slot: 11
    cost: 14000
    command: spawner givelimite {player} 10
    icon:
      material: PAPER
      display: '&bLimite de Spawner'
      lore:
      - '&8 ▪ &fQuantia: &b10 '
      - ''

  spawner-limit-100:
    slot: 12
    cost: 190000
    command: spawner givelimite {player} 100
    icon:
      material: PAPER
      display: '&bLimite de Spawner'
      lore:
      - '&8 ▪ &fQuantia: &b100 '
      - ''

  # ── Limite de maquina ──────────────────────────────────────────────────────
  machine-limit-1:
    slot: 14
    cost: 1100
    command: maquina givelimite {player} 1
    icon:
      material: PAPER
      display: '&eLimite de Maquina'
      lore:
      - '&8 ▪ &fQuantia: &e1 '
      - ''

  machine-limit-10:
    slot: 15
    cost: 14000
    command: maquina givelimite {player} 10
    icon:
      material: PAPER
      display: '&eLimite de Maquina'
      lore:
      - '&8 ▪ &fQuantia: &e10 '
      - ''

  machine-limit-100:
    slot: 16
    cost: 190000
    command: maquina givelimite {player} 100
    icon:
      material: PAPER
      display: '&eLimite de Maquina'
      lore:
      - '&8 ▪ &fQuantia: &e100 '
      - ''
