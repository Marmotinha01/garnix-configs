# Coral-shop products. Each product is placed at its own slot in menus/shop.yml.
#   slot    — inventory slot in the shop menu.
#   cost    — price in the config currency (corais).
#   command — run as console on purchase; {player} = buyer's name.
#   icon    — material/display/lore shown in the menu (shared buy-lore appended).
#
# ═══ A RÉGUA DA LOJA ═════════════════════════════════════════════════════════
#
# ✅ Decisão do dono (06/08/2026): *"a loja da pesca só pode ter itens úteis e
# que não impactam de maneira forte na economia"*.
#
# A pesca é a via AFK de 24h numa conta dedicada. Qualquer item forte vendido
# aqui vira renda passiva convertida em poder — e é por isso que ela não vende
# nem peça de progressão, nem capacidade das vias sem teto físico.
#
# ⚠️ O QUE SAIU POR ESSA RÉGUA, em 06/08/2026:
#
#   limite de spawner   item nº 1 do Ranking de Apelões, 4.000 cash a unidade,
#                       multiplica a única via SEM teto físico
#   limite de máquina   mesma família, 1.500 cash a unidade
#   chave de bosses     furar a fila de matar boss com conta AFK
#   Caixa Recursos      é a rota indireta dos dois primeiros: 1,5% dela é limite
#                       de spawner e 4,5% é limite de máquina
#
# Junto saiu o câmbio CRESCENTE por lote (1.300 → 1.500 → 1.667 por unidade),
# que existia só para frear a concentração de `spawnerslimite`. Sem o produto,
# o freio não tem o que frear: tudo aqui volta a ser câmbio plano.
#
# ═══ AS QUATRO FAMÍLIAS ══════════════════════════════════════════════════════
#
#   chaves     a chave da PRÓPRIA via, em lotes de 16 e 32
#   fly        conveniência por tempo, em 30m · 1h · 3h
#   armazém    capacidade de estoque, em 500 · 1.500 · 3.000
#   caixas     Runas e Booster
#
# O que sobrou tem um traço em comum: ou é loot da própria via, ou é temporário,
# ou tem teto físico. Nada aqui acumula poder permanente numa outra via.
#
# ═══ CHAVES ══════════════════════════════════════════════════════════════════
#
# 875 corais por chave, plano — o 16 e o 32 existem só para poupar clique. O
# lote de 10 já custava 900, então este é o preço que a via sempre teve.
#
# ═══ FLY TEMPORÁRIO ══════════════════════════════════════════════════════════
#
# ✅ Decisão do dono (06/08/2026), ancorada em TEMPO e não em valor: *"não pode
# ser muito caro, 1 hora de pesca deve comprar 30m de fly, 2 horas devem comprar
# 1h"*. A temporada fecha em 2,20 M de corais e a conta AFK pesca ~480h, ou seja
# ~4.580 corais/h — daí os 4.500 dos 30 minutos, e o dobro por hora de fly.
#
# ⚠️ O que esse preço assume, escrito para quem for recalibrar: o voo NÃO é
# bloqueado na fazenda (✅ decisão do dono: *"quem pode voar lá vai voar"*), e lá
# ele vale 1,55x de throughput — 12,5 contra 19,4 blocos/s, medido em
# 14-FARM-PESCA.md. Uma sessão de 3h de fazenda com fly rende ~+9,9% da diária e
# custa 27.000 corais, que é ~25% da renda diária da pesca. O item é lucrativo de
# propósito; o freio dele é o custo de oportunidade contra o armazém e as chaves,
# não o preço.
#
# ⚠️ Só funciona para quem NÃO é VIP: `TempFlyManager` recusa quem já tem
# `essentials.fly` (sem consumir o item). E o relógio corre OFFLINE — o expiry é
# absoluto, então 3h de fly são 3h de relógio, não de jogo.
#
# As doses LONGAS (6h, 24h, 3d) moram na loja de runas, não aqui. Runa é
# contagem e mantém o item difícil a temporada inteira; corais viram pó no dia 6
# e entregariam fly permanente.
#
# ═══ LIMITE DE ARMAZÉM ═══════════════════════════════════════════════════════
#
# 130 corais por unidade, plano. É o mesmo câmbio que os lotes de 5/15/30 já
# usavam na base — o que mudou foi o TAMANHO do lote, e por um motivo medido:
#
#   colheita no dia 20 (farm de 30.000) ...... 392 cactos/s
#   autosell no intervalo padrão de 20s ...... precisa de 7.834 de limite
#   `initial-limit` do armazém ............... 3.000
#
# A venda automática esvazia o armazém INTEIRO a cada ciclo, então a perda é zero
# sempre que `limite >= colheita durante o intervalo`. O jogador precisa comprar
# ~5.000 de limite ao longo da temporada — em lotes de 30 isso seriam 167 cliques.
#
# Comprar o teto custa ~650.000 corais, ou 30% da receita da temporada. É o maior
# sink da loja, e é o correto: o armazém tem teto físico (o plot) e o item só
# remove desperdício.
products:

  # -- Chaves -----------------------------------------------------------------
  chave-pesca-16:
    slot: 19
    cost: 14000
    command: crates givekey pesca {player} 16
    icon:
      material: TRIPWIRE_HOOK
      amount: 16
      glow: true
      display: '&bChave Pesca'
      lore:
      - '&7Consiga recompensas'
      - '&7abrindo essa chave.'
      - ''
      - '&8 ▪ &fQuantia: &7x16 '

