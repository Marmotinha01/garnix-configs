# -- Confirm ------------------------------------------------------------
# Menu de confirmação (Sim/Não) reutilizável.
# Plugins chamam: Confirm.open(player, "Título", onConfirm, onCancel);

confirm:
  rows: 3
  # Travamento anti-spam dos dois botoes, em ticks. Um cliente consegue mandar
  # varios pacotes de clique no mesmo tick e cada um dispararia a acao inteira.
  # Nao baixe para 0: e a barreira que vale para TODOS os menus de confirmacao.
  interaction-delay: 20
  confirm:
    slot: 15
    material: STAINED_GLASS_PANE
    data: 5
    display: '&aConfirmar'
    lore:
    - '&7A ação não poderá ser'
    - '&7desfeita após o clique.'
    - ''
    - '&aClique para confirmar.'
  cancel:
    slot: 11
    material: STAINED_GLASS_PANE
    data: 14
    display: '&cCancelar'
    lore:
    - '&7Nada será alterado.'
    - ''
    - '&cClique para cancelar.'