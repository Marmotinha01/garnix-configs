# =======================================
# GarnixCore Configuration
# =======================================

# Habilita logs de debug detalhados no console
debug: false

# -- Database -----------------------------------------------------------
# MySQL e MongoDB são centralizados no core.
# Todos os plugins usam a mesma conexão.
# SQLite é por plugin (não precisa configurar aqui).
database:
  
  # Número de threads dedicadas para operações async de banco.
  threads: 4
  
  # -- MySQL (HikariCP) -------------------------------------------------
  mysql:
    enabled: true
    address: 45.154.159.247:3306
    database: s7_rankup
    username: u7_HRFPzww5jV
    password: 'y2cGgHJ1Rt0VIMGrNW!+lIhd'
    pool:
      max-size: 10
      min-idle: 2
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000
      # Intervalo (ms) do ping em conexões OCIOSAS. Faz o pool trocar um socket que
      # morreu do lado do servidor ANTES de entregá-lo a um plugin — sem isso, um
      # restart do MySQL é descoberto um plugin de cada vez, cada um tomando a
      # exceção. Precisa ser >= 30000 e menor que max-lifetime; 0 desliga.
      keepalive: 120000
      leak-detection-threshold: 0
  
  # -- MongoDB ----------------------------------------------------------
  mongodb:
    enabled: false
    address: 45.154.159.247:27017
    database: admin
    username: 'admin'
    password: 'Gm$CFi_ES5O=7PO)X03'

