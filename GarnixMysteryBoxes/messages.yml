reload-success: '&aConfigurações recarregadas com sucesso.'

opened-win: '&aVocê abriu uma caixa e ganhou {reward}&a!'

# Abertura em lote (SHIFT + botão direito). A linha que contém SÓ {rewards} vira uma
# linha por prêmio, escrita no formato de 'opened-win-entry'; as outras saem como
# estão. Mover, tirar ou repetir linhas aqui muda a mensagem sem tocar no código.
# Placeholders: {box} e {amount} no bloco · {reward} na entrada.
opened-win-multi:
- ''
- '  &fx&l{amount}&fx caixas abertas:'
- ''
- '{rewards}'
- ''
opened-win-entry: ' &8 ▪ {reward} '

# Mostrada quando o jogador dá SHIFT + botão direito sem caixa suficiente na mão.
# {amount} = quantas o lote pede · {held} = quantas ele tem · {box} = a caixa.
not-enough-boxes: '&cVocê precisa de &cx{amount} {box} &cna mão para abrir.'

# Título do menu de confirmação ao abrir uma caixa. Placeholder: {box}
confirm-title: 'Abrir {box}'
# O mesmo, para o lote. Placeholders: {box} e {amount}
confirm-title-multi: 'Abrir x{amount} {box}'

animation:
  win-title: '&fVocê ganhou:'
  win-subtitle: '{reward}'
  # Usados no lote, onde não existe UM prêmio para mostrar. Placeholder: {amount}
  win-title-multi: '&fVocê ganhou:'
  win-subtitle-multi: '&6{amount} prêmios'

box-not-found: '&cCaixa &f{input} &cnão encontrada.'
player-not-found: '&cJogador não encontrado.'

admin:
  give-all: '&6Você deu &ex{amount} &f{box} &6para &eTODOS ONLINE&6.'
  give-player: '&6Você deu &ex{amount} &f{box} &6para &f{player}&6.'
  # Clique direito no hub /caixas, so para quem tem `caixas.admin`.
  give-self: '&6Você pegou &ex{amount} &f{box}&6.'

help:
- ''
- '  &6&lCAIXAS &8▶ &7Comandos'
- ''
- '  &7/caixas'
- '  &c/caixas give <caixa> <jogador/*> <quantidade>'
- '  &c/caixas reload'
