# O id da caixa é o nome do arquivo. A caixa É o item físico: o jogador
# segura e clica com o botão direito para abrir (esquerdo para ver os prêmios).

# Raridade desta caixa, usada para ordenar o menu /caixas: quanto MAIOR o peso,
# mais rara e mais tarde ela aparece na lista (omita para não aparecer nela).
weight: 40

box-item:
  material: CHEST
  display: '&eCaixa Skins &e[Tier &lI&e]'
  lore:
  - '&7Abra e descubra o que a sorte'
  - '&7guardou para você lá dentro.'
  - ''
  - '&eOpções de uso:'
  - '&fBotão esquerdo &8➟ &7Preview'
  - '&fBotão direito &8➟ &7Abrir x1'
  - '&fBotão dir. + SHIFT &8➟ &7Abrir x4'

# -- RECOMPENSAS -------------------------------------------------------
# Types: CURRENCY, COMMAND, COMMAND_ITEM, ITEM, NONE
# 'chance' é o peso do sorteio (não precisa somar 100).
#
# ⚠️ Esta caixa é de SKIN — ela não tem `azar`. Abrir sempre devolve prêmio:
# uma das quinze skins, ou o degrau para a Tier II em 1% das vezes.
#
# ⚠️ ESCADA DA TIER I — os degraus 2 a 6 de cada via, ou seja tudo que a
# forja alcança (a default, degrau 1, nunca sai de caixa). Os degraus 7 a
# 10 — os que a forja NÃO alcança — ficam na caixa skins-ii.
#   mineração: pedra · ferro · ouro · diamante · rubi
#   fazenda:   pedra · ferro · ouro · diamante · âmbar
#   pesca:     coral · escama · prata · turquesa · abissita
#
# ⚠️ AS TRES VIAS NAO VALEM O MESMO: a pesca sai mais que as outras duas, na
# razao 39 : 30 : 30. Mineracao e fazenda sao as vias mais raras e ficam
# empatadas entre si. O 1 que sobra e o degrau para a Tier II.
#
# ⚠️ Dentro da via a escada e sempre 38 : 28 : 18 : 11 : 5, repartindo o peso
# da via. Ela e ingreme de proposito: a skin de topo (rubi · ambar ·
# abissita, +20%) tem que ser um resultado notavel, nao o quinto degrau de
# uma escada plana. Se mexer num degrau, mexa nos cinco.
#
# ⚠️ O arquivo soma 100, entao o peso de cada entrada JA E a porcentagem: a
# Skin de Coral sai em 14,82% das aberturas e a Skin de Rubi em 1,5%.
#
# ⚠️ A lore de cada ícone espelha o item real (skins.yml de cada plugin) —
# preview e item recebido têm que bater linha a linha, sem nenhuma linha extra.
# Mineração e fazenda repetem os nomes dos quatro primeiros degraus (Pedra,
# Ferro, Ouro, Diamante): quem separa as duas é o material do ícone (picareta
# x enxada) e o sufixo do `display` da recompensa.
rewards:

