# O id da caixa é o nome do arquivo. A caixa É o item físico: o jogador
# segura e clica com o botão direito para abrir (esquerdo para ver os prêmios).

# Slot que esta caixa ocupa no menu /caixas (omita para não aparecer na lista).
slot: 33

box-item:
  material: TRAPPED_CHEST
  glow: true
  display: '&bCaixa Máquinas'
  lore:
  - '&7Abra e descubra o que a sorte'
  - '&7guardou para você lá dentro.'
  - ''
  - '&bOpções de uso:'
  - '&fBotão esquerdo &8➟ &7Preview'
  - '&fBotão direito &8➟ &7Abrir'

# ── RECOMPENSAS ───────────────────────────────────────────────────────
# Types: CURRENCY, COMMAND, COMMAND_ITEM, ITEM, NONE
# 'chance' é o peso do sorteio (não precisa somar 100).
#
# ⚠️ So entram as maquinas com `shop: false` em GarnixMachines/machines —
# as que NAO sao compraveis na loja de maquinas. Quem esta na loja tem preco
# em coins e nao precisa de rota de loot; estas sete so saem daqui, do site
# e da caixa garnix.
#
# ⚠️ Esta caixa nao tem `azar`: toda abertura devolve uma maquina. O que
# separa as sete e o valor — moeda secundaria em baixo, Cash e Limite no topo.
rewards:

  sementes:
    type: COMMAND
    chance: 20
    display: '&b&lMáquina de Sementes'
    command: maquina give {player} SEMENTES
    amount: 1
