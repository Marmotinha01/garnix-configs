# O id da caixa é o nome do arquivo. A caixa É o item físico: o jogador
# segura e clica com o botão direito para abrir (esquerdo para ver os prêmios).

# Raridade desta caixa, usada para ordenar o menu /caixas: quanto MAIOR o peso,
# mais rara e mais tarde ela aparece na lista (omita para não aparecer nela).
weight: 100

box-item:
  material: ENDER_CHEST
  display: '&aCaixa Farm &a[Tier &lII&a]'
  lore:
  - '&7Abra e descubra o que a sorte'
  - '&7guardou para você lá dentro.'
  - ''
  - '&aOpções de uso:'
  - '&fBotão esquerdo &8➟ &7Preview'
  - '&fBotão direito &8➟ &7Abrir x1'
  - '&fBotão dir. + SHIFT &8➟ &7Abrir x4'

# -- RECOMPENSAS -------------------------------------------------------
# Types: CURRENCY, COMMAND, COMMAND_ITEM, ITEM, NONE
# 'chance' é o peso do sorteio (não precisa somar 100).
#
# ⚠️ Esta caixa nao tem `azar`: toda abertura devolve premio. Azar so existe
# nas crates e nos bosses.
#
# ⚠️ GRADE DAS TRES CAIXAS TIER II — mineracao, pesca e farm usam a MESMA
# grade, familia por familia:
#
#   skins 22,5 · moeda 20 · armadura T-III 18 · armadura T-IV 13 ·
#   livros 10,5 · armadura T-V 7 · boosters 7 · a propria caixa x2 2
#
# A mineracao e a unica que difere, e so porque tem dois blocos a mais (6x6,
# 8x8 e britadeira, mais a vaga de visitante): la a grade acima vale
# multiplicada por 0,86, mais os 12% dos explosivos e os 2% da vaga. Se
# mexer numa familia aqui, mexa nas outras duas: e uma grade so.
#
# ⚠️ Peça de armadura INDIVIDUAL, nunca a coleção: `givearmor tier-v` sem o
# sufixo de slot entrega o set inteiro (+48%) num drop só.
#
# ⚠️ ARMADURA NUNCA VAI PARA O SITE. Ela existe só via caixa — e como a
# caixa II é comprável, quem paga compra CHANCE, não a peça.
#
# ⚠️ ESCADA DA ARMADURA — esta caixa sorteia as QUATRO peças dos tiers III,
# IV e V (12 peças). Os tiers I e II só saem na caixa farm-i; o tier III
# aparece nas duas, e é o degrau que liga uma caixa na outra.
#
# ⚠️ ESCADA DA SKIN — degraus 6 a 10 da enxada (âmbar · esmeralda ·
# ametista · cristal · marfim). Os degraus 2 a 5 ficam na caixa farm-i.
#
# ⚠️ A lore de cada ícone espelha o item real (GarnixFarm/skins.yml e
# GarnixFarm/armors/) — preview e item recebido têm que bater linha a
# linha, sem nenhuma linha extra.
#
# ⚠️ MOEDA E ESCADA DE 3 DEGRAUS espelhando a crate farm — os mesmos
# 250·500·1.000 coins e 150·300·600 sementes de la, multiplicados por 5. A
# Tier I usa a mesma escada da crate multiplicada por 3. Se mexer num
# degrau, mexa nos tres: a familia inteira e que da a escada.
#
# ⚠️ A MOEDA E O FILLER, mas aqui ela pesa 20% e nao os 30% da Tier I: esta
# caixa e comprada, e quem paga quer ITEM. Dentro da familia a escada e
# 50/30/20, NAO o 60/30/10 da crate — moeda nunca pode ser mais rara que
# item, e com 60/30/10 o degrau de cima ficaria abaixo da skin de topo.
#
# ⚠️ O TOPO SAO A SKIN DE TOPO (1,5) E A PECA T-V (1,75), nesta ordem. Nao
# existe degrau para cima aqui: a Tier II e o fim da escada de caixa.
#
# ⚠️ A PROPRIA CAIXA X2 (2%) e a unica recompensa que se auto-sorteia. Ela
# devolve DUAS caixas por uma consumida, entao o saldo e +1: e bonus, nao
# re-roll. Nao vira loop infinito porque 0,02 x 2 = 0,04 caixa por abertura,
# muito abaixo de 1 — a corrente sempre morre. So passaria a se sustentar
# sozinha se esse peso subisse acima de 50.
