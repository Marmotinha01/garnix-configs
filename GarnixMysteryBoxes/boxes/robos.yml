# O id da caixa é o nome do arquivo. A caixa É o item físico: o jogador
# segura e clica com o botão direito para abrir (esquerdo para ver os prêmios).

# Raridade desta caixa, usada para ordenar o menu /caixas: quanto MAIOR o peso,
# mais rara e mais tarde ela aparece na lista (omita para não aparecer nela).
weight: 160

box-item:
  material: ENDER_CHEST
  display: '&cCaixa Robôs'
  lore:
  - '&7Abra e descubra o que a sorte'
  - '&7guardou para você lá dentro.'
  - ''
  - '&cOpções de uso:'
  - '&fBotão esquerdo &8➟ &7Preview'
  - '&fBotão direito &8➟ &7Abrir x1'
  - '&fBotão dir. + SHIFT &8➟ &7Abrir x4'

# -- RECOMPENSAS -------------------------------------------------------
# Types: CURRENCY, COMMAND, COMMAND_ITEM, ITEM, NONE
# 'chance' é o peso do sorteio (não precisa somar 100).
#
# ⚠️ O robo NAO e cosmetico: com ~20.700 chaves/dia no servidor, ele e o que
# torna o volume de chaves utilizavel. O que se compra aqui e o TIER.
#
# ⚠️ Cada tier abre mais rapido E turbina mais os premios raros
# (boost-threshold / boost-multiplier em GarnixCrates/robots/). O Mitico e o
# unico que nao sai daqui em volume: 2 em 100 aberturas. Ele e produto de site.
#
# ⚠️ SO UM ROBO FICA ATIVO por jogador, entao tirar um tier igual ou menor do
# que o que voce ja tem nao vale nada. Por isso o Comum nao e mais o recheio
# de 45% que era: ele desceu para 35 e o Raro subiu para 32, quase empatando.
# A escada e 35 : 32 : 22 : 9 : 2.
#
# ⚠️ Consequencia disso, e e de proposito: esta caixa vale muito mais para
# quem ainda nao tem robo do que para quem ja tem um Lendario. Nao adianta
# mexer nos pesos para consertar isso — o unico jeito seria duplicata virar
# fusao ou upgrade, que hoje o plugin nao faz.
#
# ⚠️ Esta caixa nao tem `azar`: toda abertura devolve um robo.
rewards:

  comum:
    type: COMMAND_ITEM
    chance: 35
    display: '&ax&l{amount} &aRobô Comum'
    command: crates giverobot comum {player} {amount}
    amount: 1
    icon:
      texture: 6eeb623328cbcda01c4894b93c302be57f10a4dea93a7d54a907dd9caa4e45ca
      display: '&aRobô Comum'
      lore:
      - '&7Abre as chaves por você,'
      - '&7sem precisar clicar.'
      - ''
      - ' &8Informações: '
      - ' &8▪ &fAbre chaves a cada &a&l20&as&f. '

