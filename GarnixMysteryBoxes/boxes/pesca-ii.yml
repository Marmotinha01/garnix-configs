# O id da caixa é o nome do arquivo. A caixa É o item físico: o jogador
# segura e clica com o botão direito para abrir (esquerdo para ver os prêmios).

# Slot que esta caixa ocupa no menu /caixas (omita para não aparecer na lista).
slot: 24

box-item:
  material: TRAPPED_CHEST
  glow: true
  display: '&b&lCaixa Pesca &b[T&lII&b]'
  lore:
  - '&7Abra e descubra o que a sorte'
  - '&7guardou para você lá dentro.'
  - ''
  - '&bOpções de uso:'
  - '&fBotão esquerdo &8➟ &7Preview'
  - '&fBotão direito &8➟ &7Abrir'

# ── RECOMPENSAS ───────────────────────────────────────────────────────
# Types: CURRENCY, COMMAND, COMMAND_ITEM, ITEM, NONE
# 'chance' é o peso do sorteio (não precisa somar 100).
#
# ⚠️ Peça de armadura INDIVIDUAL, nunca a coleção: `givearmor tier-v` sem o
# sufixo de slot entrega o set inteiro (+48%) num drop só.
#
# ⚠️ ARMADURA NUNCA VAI PARA O SITE. Ela existe só via caixa — e como a
# caixa II é comprável, quem paga compra CHANCE, não a peça.
rewards:

  azar:
    type: NONE
    chance: 3
    display: '&8Azar'
    icon:
      material: BARRIER
      display: '&8Azar'
      lore:
      - '&7Raro, mas acontece.'

  armadura-iii:
    type: COMMAND
    chance: 17
    display: '&fPeça de Armadura &f[T&lIII&f]'
    command: pesca givearmor {player} tier-iii_boots
    amount: 1
    icon:
      material: IRON_BOOTS
      display: '&fPeça de Armadura &f[T&lIII&f]'

  armadura-iv:
    type: COMMAND
    chance: 14
    display: '&6Peça de Armadura &6[T&lIV&6]'
    command: pesca givearmor {player} tier-iv_chestplate
    amount: 1
    icon:
      material: GOLD_CHESTPLATE
      display: '&6Peça de Armadura &6[T&lIV&6]'

  armadura-v:
    type: COMMAND
    chance: 15
    display: '&5Peça de Armadura &5[T&lV&5]'
    command: pesca givearmor {player} tier-v_leggings
    amount: 1
    icon:
      material: DIAMOND_LEGGINGS
      glow: true
      display: '&5Peça de Armadura &5[T&lV&5]'

  skin-7:
    type: COMMAND
    chance: 15
    display: '&5Skin serenita'
    command: pesca giveskin {player} serenita
    amount: 1
    icon:
      material: NAME_TAG
      glow: true
      display: '&5Skin serenita'

  skin-8:
    type: COMMAND
    chance: 12
    display: '&5Skin oceanita'
    command: pesca giveskin {player} oceanita
    amount: 1
    icon:
      material: NETHER_STAR
      glow: true
      display: '&5Skin oceanita'

  livro:
    type: COMMAND
    chance: 6
    display: '&bLivro de Duplicata 4'
