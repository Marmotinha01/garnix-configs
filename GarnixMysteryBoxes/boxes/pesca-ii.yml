# O id da caixa é o nome do arquivo. A caixa É o item físico: o jogador
# segura e clica com o botão direito para abrir (esquerdo para ver os prêmios).

# Raridade desta caixa, usada para ordenar o menu /caixas: quanto MAIOR o peso,
# mais rara e mais tarde ela aparece na lista (omita para não aparecer nela).
weight: 110

box-item:
  material: ENDER_CHEST
  display: '&bCaixa Pesca &b[Tier &lII&b]'
  lore:
  - '&7Abra e descubra o que a sorte'
  - '&7guardou para você lá dentro.'
  - ''
  - '&bOpções de uso:'
  - '&fBotão esquerdo &8➟ &7Preview'
  - '&fBotão direito &8➟ &7Abrir x1'
  - '&fBotão dir. + SHIFT &8➟ &7Abrir x4'

# -- RECOMPENSAS -------------------------------------------------------
# Types: CURRENCY, COMMAND, COMMAND_ITEM, ITEM, NONE
# 'chance' é o peso do sorteio (não precisa somar 100).
#
# ⚠️ Esta caixa nao tem `azar`: toda abertura devolve premio. Azar so existe
# nas crates e nos bosses.
#
# ⚠️ RECALIBRADA COM A PESCA em 05/08/2026 — esta caixa DIVERGIU da grade
# compartilhada com mineracao-ii e farm-ii. A grade antiga era:
#
#   armadura T-III 24 · skins 22,5 · moeda 20 · livros 10,5 ·
#   armadura T-IV 10 · boosters 7 · armadura T-V 4 · a propria caixa x2 2
#
# A nova, so da pesca:
#
#   armadura T-V 40 · livros de NIVEL 3 30 · skins 20 · moeda 6 ·
#   boosters 3 · a propria caixa x2 1
#
# ⚠️ Levar mineracao-ii e farm-ii para esta grade quando aquelas duas vias
# forem calibradas. Ate la as tres divergem, e isso e sabido.
#
# A CAIXA II FICOU DENSA DE PROPOSITO. Ela cai 25 vezes na temporada e precisa
# entregar 7 itens especificos — as 4 pecas do T-V e as 3 skins que a forja nao
# alcanca. A conta de coletor de cupons pede ~18 aberturas so para juntar os 7,
# entao nao ha espaco para filler: moeda e booster cairam de 27 para 9 somados,
# e os tiers III e IV de armadura desceram inteiros para a Caixa I.
#
# ⚠️ MESMO ASSIM O CONJUNTO T-V E ~50/50 ate o dia 17. Isso e sabido e esta
# absorvido: a curva de levels.yml mira o conjunto T-IV (+16%) como referencia,
# e o T-V e upside. A diferenca no multiplicador e 3,4%, dentro do erro de
# banda que a escada ja tem.
#
# ⚠️ OS LIVROS DAQUI VALEM 3 NIVEIS, os da Caixa I valem 1. Somados
# (25 x 30% x 3 + 150 x 10,5% x 1) dao ~38 niveis de livro, e a arvore de
# encantes pede 30 (10 x 3 encantes). A folga e o colchao de variancia.
#
# ⚠️ AS TRES SKINS DE TOPO SAO SORTE, NAO PRAZO — decisao do dono. Oceanita
# 1,25 · Perola 0,63 · Tempestita 0,13 na temporada. Por isso NENHUMA
# recompensa de GarnixFishing/rewards.yml passa de peso 45 (Serenita): se a
# renda dependesse delas, quem nao tirasse ficaria 4x10^5 atras no dia 20.
# O max-weight 65/90/130 dessas tres e vitrine.
#
# ⚠️ Peça de armadura INDIVIDUAL, nunca a coleção: `givearmor tier-v` sem o
# sufixo de slot entrega o set inteiro (+20%) num drop só.
#
# ⚠️ ARMADURA NUNCA VAI PARA O SITE. Ela existe só via caixa — e como a
# caixa II é comprável, quem paga compra CHANCE, não a peça.
#
# ⚠️ ESCADA DA ARMADURA — esta caixa é a ÚNICA fonte do tier V, e só dele. Os
# tiers II, III e IV saem da caixa pesca-i e o tier I da crate de pesca. Não há
# mais tier compartilhado entre as duas caixas: cada uma tem o seu topo.
#
# ⚠️ ESCADA DA SKIN — degraus 7 a 10 da vara (serenita · oceanita · pérola ·
# tempestita). Os degraus 2 a 6 ficam na caixa pesca-i. A Serenita é o único
# dos quatro que a escada de níveis exige (peso 45, nível 39, dia 16,57) — os
# três acima dela são bônus.
#
# ⚠️ A lore de cada ícone espelha o item real (GarnixFishing/skins.yml e
# GarnixFishing/armors/) — preview e item recebido têm que bater linha a
# linha, sem nenhuma linha extra.
#
# ⚠️ MOEDA E ESCADA DE 3 DEGRAUS espelhando a crate pesca — os mesmos
# 2.500·5.000·10.000 coins e corais de la, multiplicados por 5. A Tier I usa a
# mesma escada da crate multiplicada por 3. Se mexer num degrau, mexa nos
# tres: a familia inteira e que da a escada.
#
# ⚠️ A MOEDA CAIU DE 20 PARA 6 e o booster de 7 para 3. Nao e desvalorizacao
# da moeda: e falta de espaco. Sao 25 aberturas na temporada para entregar 7
# itens especificos (4 pecas T-V + 3 skins), e cada ponto de peso em filler
# sai direto da chance de fechar o conjunto. Dentro da familia a escada
# continua 50/30/20.
#
# ⚠️ O TOPO E A TEMPESTITA (0,5), com a Perola (2,5) logo atras. Nao existe
# degrau para cima aqui: a Tier II e o fim da escada de caixa.
#
# ⚠️ Com o degrau 10 em 0,25 a Caixa Garnix (0,5) volta a ser a fonte mais
# provavel dele, que e como deve ser. A Caixa Skins II foi apertada junto,
# senao ela virava a rota facil.
#
# ⚠️ A PROPRIA CAIXA X2 (2%) e a unica recompensa que se auto-sorteia. Ela
# devolve DUAS caixas por uma consumida, entao o saldo e +1: e bonus, nao
# re-roll. Nao vira loop infinito porque 0,02 x 2 = 0,04 caixa por abertura,
# muito abaixo de 1 — a corrente sempre morre. So passaria a se sustentar
# sozinha se esse peso subisse acima de 50.
