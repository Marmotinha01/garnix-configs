    amount: 1
    icon:
      material: ENCHANTED_BOOK
      glow: true
      display: '&bLivro de Duplicata 4'

  booster:
    type: COMMAND
    chance: 2
    display: '&d&lBooster 3x &7(10min)'
    command: pesca givebooster {player} corais 3 10m
    amount: 1
    icon:
      material: POTION
      glow: true
      display: '&d&lBooster 3x &7(10min)'

  livro-luck:
