# O id da caixa é o nome do arquivo. A caixa É o item físico: o jogador
# segura e clica com o botão direito para abrir (esquerdo para ver os prêmios).

# Raridade desta caixa, usada para ordenar o menu /caixas: quanto MAIOR o peso,
# mais rara e mais tarde ela aparece na lista (omita para não aparecer nela).
weight: 65

box-item:
  material: CHEST
  display: '&4Caixa Bosses &4[Tier &lI&4]'
  lore:
  - '&7Abra e descubra o que a sorte'
  - '&7guardou para você lá dentro.'
  - ''
  - '&4Opções de uso:'
  - '&fBotão esquerdo &8➟ &7Preview'
  - '&fBotão direito &8➟ &7Abrir x1'
  - '&fBotão dir. + SHIFT &8➟ &7Abrir x4'

# ── RECOMPENSAS ───────────────────────────────────────────────────────
# Types: CURRENCY, COMMAND, COMMAND_ITEM, ITEM, NONE
# 'chance' é o peso do sorteio (não precisa somar 100).
#
# ⚠️ SEM AZAR, por decisão do dono: toda abertura devolve alguma coisa. O que
# varia é qual boss e quantos.
#
# ⚠️ `/boss give boss <jogador> <BOSS> <stacks> 1`: o PRIMEIRO int é o que
# escala — ele é a quantidade de bosses. O segundo é sempre 1. Inverter os
# dois entrega um boss só e o erro passa em silêncio.
#
# ⚠️ `/boss give killstack <jogador> <nivel> [quantia]`: aqui o NÍVEL vem
# primeiro (1) e a quantia depois. É a ordem oposta à do boss.
#
# ⚠️ As matadoras vão até a Ancestral nesta caixa. Rúnica e Abissal são
# exclusivas da Tier II — é o que separa as duas.
#
# ⚠️ Os três volumes de cada boss (1x, 3x e 5x) usam o mesmo ícone; quem
# mostra quantos são é a pilha (`amount:`) e o `{amount}x` do display.
rewards:

  # ── COLOSSO — o recheio da tabela
  boss-colosso:
    type: COMMAND
    chance: 18
    display: '&c&l{amount}x Boss Colosso'
