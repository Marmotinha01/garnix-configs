# O id da caixa é o nome do arquivo. A caixa É o item físico: o jogador
# segura e clica com o botão direito para abrir (esquerdo para ver os prêmios).

# Raridade desta caixa, usada para ordenar o menu /caixas: quanto MAIOR o peso,
# mais rara e mais tarde ela aparece na lista (omita para não aparecer nela).
weight: 10

box-item:
  material: CHEST
  display: '&6Caixa Mineração &6[Tier &lI&6]'
  lore:
  - '&7Abra e descubra o que a sorte'
  - '&7guardou para você lá dentro.'
  - ''
  - '&6Opções de uso:'
  - '&fBotão esquerdo &8➟ &7Preview'
  - '&fBotão direito &8➟ &7Abrir x1'
  - '&fBotão dir. + SHIFT &8➟ &7Abrir x4'

# -- RECOMPENSAS -------------------------------------------------------
# Types: CURRENCY, COMMAND, COMMAND_ITEM, ITEM, NONE
# 'chance' é o peso do sorteio (não precisa somar 100).
#
# ⚠️ Esta caixa nao tem `azar`: toda abertura devolve premio. Azar so existe
# nas crates e nos bosses.
#
# ⚠️ GRADE DAS TRES CAIXAS TIER I — mineracao, pesca e farm usam a MESMA
# grade, familia por familia:
#
#   moeda 32 · armadura T-II 24 · livros 12 · skins 11 · armadura T-III 7 ·
#   boosters 6,5 · forja 6,5 · caixa Tier II 1
#
# So que a mineracao tem tres premios que as outras duas nao tem (2x2, 4x4
# e britadeira). Entao ELA e a grade acima multiplicada por 0,88, mais os
# 12% do bloco de explosivos — as proporcoes entre as familias continuam
# identicas nas tres caixas e os tres arquivos fecham em 100. Se mexer numa
# familia aqui, mexa nas outras duas: e uma grade so.
#
# ⚠️ Peça de armadura INDIVIDUAL, nunca a coleção: `givearmor tier-v` sem o
# sufixo de slot entrega o set inteiro (+48%) num drop só.
#
# ⚠️ ARMADURA NUNCA VAI PARA O SITE. Ela existe só via caixa — e como a
# caixa II é comprável, quem paga compra CHANCE, não a peça.
#
# ⚠️ ESCADA DA ARMADURA — esta caixa sorteia as QUATRO peças dos tiers I, II
# e III (12 peças). Os tiers IV e V só saem na caixa mineracao-ii; o tier III
# aparece nas duas, e é o degrau que liga uma caixa na outra.
#
# ⚠️ ESCADA DA SKIN — degraus 2 a 5 da picareta (pedra · ferro · ouro ·
# diamante). A default (degrau 1) nunca sai de caixa e os degraus 6 a 10
# ficam na caixa mineracao-ii.
#
# ⚠️ A lore de cada ícone espelha o item real (GarnixMining/skins.yml e
# GarnixMining/armors/) — preview e item recebido têm que bater linha a
# linha, sem nenhuma linha extra.
#
# ⚠️ Os explosivos sao escadinha entre as duas caixas: 2x2 e 4x4 saem daqui,
# 6x6 e 8x8 so na Tier II. A britadeira sai nas duas, 1 aqui e 3 la.
#
# ⚠️ MOEDA E ESCADA DE 3 DEGRAUS espelhando a crate mineracao — os mesmos
# 250·500·1.000 coins e 150·300·600 gemas de la, multiplicados por 3. A
# Tier II usa a mesma escada da crate multiplicada por 5. Se mexer num
# degrau, mexa nos tres: a familia inteira e que da a escada.
#
# ⚠️ A MOEDA E O FILLER desta caixa, o mesmo papel que ela tem na crate:
# 28,16% das aberturas devolvem dinheiro. Dentro da familia a escada e
# 50/30/20, NAO o 60/30/10 da crate — com 60/30/10 o degrau de cima (3.000
# coins) ficaria mais raro que a skin de topo, e moeda nunca pode ser mais
# rara que item.
#
# ⚠️ O TOPO E A CAIXA TIER II (0,88%). Logo abaixo vem a peca de armadura
# T-III (1,54) e a skin de topo (1,76) — as duas coisas boas da caixa. Em
# 05/08/2026 a T-III passou a ser mais rara que a skin, a pedido do dono: o
# set inteiro sao 4 pecas, entao junta-lo ja era o objetivo mais longo daqui.
# Os pontos que a familia devolveu foram para a moeda (26,4 → 28,16).
#
# ⚠️ `/mina givebomb <jogador> <bombId> [quantidade]`: o bombId e a chave do
# bloco em `GarnixMining/bombs.yml`. Os quatro explosivos se chamam so
# "Explosivo" no item real — o `[2x2]` do display existe para o broadcast e o
# preview dizerem QUAL saiu.
