# O id da caixa é o nome do arquivo. A caixa É o item físico: o jogador
# segura e clica com o botão direito para abrir (esquerdo para ver os prêmios).

# Raridade desta caixa, usada para ordenar o menu /caixas: quanto MAIOR o peso,
# mais rara e mais tarde ela aparece na lista (omita para não aparecer nela).
weight: 180

box-item:
  material: ENDER_CHEST
  display: '&6Caixa Garnix'
  lore:
  - '&7Abra e descubra o que a sorte'
  - '&7guardou para você lá dentro.'
  - ''
  - '&6Opções de uso:'
  - '&fBotão esquerdo &8➟ &7Preview'
  - '&fBotão direito &8➟ &7Abrir x1'
  - '&fBotão dir. + SHIFT &8➟ &7Abrir x4'

# -- RECOMPENSAS -------------------------------------------------------
# Types: CURRENCY, COMMAND, COMMAND_ITEM, ITEM, NONE
# 'chance' é o peso do sorteio (não precisa somar 100).
#
# ⚠️ Esta caixa NAO tem `azar`: toda abertura devolve premio. Os 20 pesos
# somam 100 de proposito — aqui peso e porcentagem, e a leitura fica direta.
#
# ⚠️ As seis faixas, do recheio ao topo:
#   COMUM         19,25% x2  as duas maquinas de limite, 5 de cada
#   COMUM PLUS    16,25%     maquina de cash, 3 de uma vez
#   RARO            9% x3    vaga de visitante · robo lendario · torre 15
#   RARISSIMO     2,5% x6    25 caixas · 15 skins II · tempestita · torre 30 ·
#                            3 livros de kill-stack · papel imortal 3d
#   RARISSIMO+    0,5% x5    VENDA AUTOMATICA · mithril · marfim ·
#                            robo mitico · papel supremo 2d
#   JACKPOT      0,25% x3    combustivel infinito · matadora hit-kill ·
#                            papel garnix 1d
#
# ⚠️ A venda automatica e o unico jeito de conseguir o item fora do site (ele
# custa 250 de cash na loja). Os 0,5 dela sairam das duas faixas de recheio,
# 0,25 de cada (19,5 → 19,25) — nenhuma faixa rara foi diluida, mesmo criterio
# usado quando o livro e os 3 papeis entraram.
#
# ⚠️ Com 20 premios o preview tem 2 paginas (o menu mostra 15 por pagina,
# `menus/preview.yml`) — as setas ja existem na `shape`.
#
# ⚠️ `/boss give killstack <jogador> <nivel> [quantia]`: o NIVEL vem primeiro e
# a quantia depois. Aqui e nivel 1 e `{amount}` 3 — tres livros de +1, que o
# jogador junta com SHIFT + botao direito num unico +3 se quiser.
#
# ⚠️ O icone do livro e `BOOK`, igual ao item real (GarnixBosses/config.yml).
# Com `WRITTEN_BOOK` apareciam as linhas de autor e geracao ("by / Original")
# entre o display e a lore: `glow: true` so poe LURE + HIDE_ENCHANTS
# (ItemBuilder:272-278), quem esconde isso e o HIDE_POTION_EFFECTS, que na
# Bukkit tambem cobre "book and firework information". O item real nunca
# mostrou porque o KillStackItem aplica `ItemFlag.values()` inteiro. O material
# mudou por outro motivo (o livro abria a tela de leitura no clique direito) e
# levou a diferenca junto — `BOOK` nao tem essas linhas para esconder.
#
# ⚠️ `/vip givepaper <jogador> <vip> <duracao> [quantidade]` exige o jogador
# ONLINE (VipCommand:335) — o que sempre e o caso aqui, porque a caixa so abre
# na mao de quem esta no servidor. A duracao usa o formato d/h/m/s.
#
# ⚠️ `/maquina give <jogador> <tipo> [stack] [quantidade]`: o PRIMEIRO int e o
# stack gravado no NBT da maquina (MachineItemBuilder), ou seja o "5x" real, e
# por isso ele vem do `{amount}`. O segundo e quantos ITENS entregar e fica
# sempre 1 — senao virava 5 itens de 5.
#
# ⚠️ `{amount}` no display, na lore e no icone sai do `amount:` da recompensa —
# o mesmo numero que o comando recebe. Escreva a quantia UMA vez, no `amount:`.
#
# ⚠️ Icone de cabeca (`texture`) TAMBEM empilha desde que o `setAmount` saiu do
# ramo do `material` e foi para os atributos comuns (SpigotConfig). Antes so
# CHEST/ENDER_CHEST mostravam a pilha, e por isso a quantia das maquinas foi
# escrita na lore — ela pode continuar la, agora e reforco e nao remendo.
#
# ⚠️ O combustivel infinito estava sem `material` e o BoxManager descarta a
# recompensa quando `getItemStack` devolve null: o jackpot da caixa mais rara do
# servidor nunca era sorteado. Agora ele espelha o item real (COAL:1 + glow).
