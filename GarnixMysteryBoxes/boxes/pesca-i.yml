# O id da caixa é o nome do arquivo. A caixa É o item físico: o jogador
# segura e clica com o botão direito para abrir (esquerdo para ver os prêmios).

# Raridade desta caixa, usada para ordenar o menu /caixas: quanto MAIOR o peso,
# mais rara e mais tarde ela aparece na lista (omita para não aparecer nela).
weight: 30

box-item:
  material: CHEST
  display: '&bCaixa Pesca &b[Tier &lI&b]'
  lore:
  - '&7Abra e descubra o que a sorte'
  - '&7guardou para você lá dentro.'
  - ''
  - '&bOpções de uso:'
  - '&fBotão esquerdo &8➟ &7Preview'
  - '&fBotão direito &8➟ &7Abrir x1'
  - '&fBotão dir. + SHIFT &8➟ &7Abrir x4'

# -- RECOMPENSAS -------------------------------------------------------
# Types: CURRENCY, COMMAND, COMMAND_ITEM, ITEM, NONE
# 'chance' é o peso do sorteio (não precisa somar 100).
#
# ⚠️ Esta caixa nao tem `azar`: toda abertura devolve premio. Azar so existe
# nas crates e nos bosses.
#
# ⚠️ RECALIBRADA COM A PESCA em 05/08/2026 — esta caixa DIVERGIU da grade
# compartilhada com mineracao-i e farm-i. A grade antiga era:
#
#   moeda 32 · armadura T-II 24 · livros 12 · skins 11 · armadura T-III 7 ·
#   boosters 6,5 · forja 6,5 · caixa Tier II 1
#
# A nova, so da pesca:
#
#   moeda 27,5 · skins 23,5 · armadura T-III 10 · livros 10,5 · armadura T-II 8 ·
#   boosters 6,5 · forja 6,5 · armadura T-IV 6 · caixa Tier II 1,5
#
# ⚠️ Levar mineracao-i e farm-i para esta grade quando aquelas duas vias forem
# calibradas. Ate la as tres divergem, e isso e sabido.
#
# O QUE MUDOU E POR QUE:
#   T-II 24 -> 8    davam 36 pecas na temporada para um conjunto de 4
#   T-III 7 -> 10   e o tier do meio, e agora e so daqui que ele sai
#   T-IV  0 -> 6    desceu da Caixa II, que so tem 25 aberturas na temporada
#   skins 11 -> 23,5  a escada de 44 niveis de rewards.yml exige uma skin nova
#                     a cada ~6 niveis, com prazo. E daqui que elas saem, e e
#                     esta quantidade que faz a FORJA funcionar de verdade
#                     embaixo (13,5 Escama e 10,5 Prata dao para forjar)
#   livros 12 -> 10,5  junto com os livros de nivel 3 da Caixa II, fecham os
#                      ~30 niveis que a arvore de encantes pede
#
# ⚠️ MOEDA REESCALADA x10, mesma razao da crate: 450 corais nao era premio
# contra uma conta que faz 437 mil por dia no fim da temporada.
#
# ⚠️ Peça de armadura INDIVIDUAL, nunca a coleção: `givearmor tier-iv` sem o
# sufixo de slot entrega o set inteiro (+16%) num drop só.
#
# ⚠️ ARMADURA NUNCA VAI PARA O SITE. Ela existe só via caixa — e como a
# caixa II é comprável, quem paga compra CHANCE, não a peça.
#
# ⚠️ ESCADA DA ARMADURA — esta caixa sorteia as QUATRO peças dos tiers II, III
# e IV (12 peças). O tier I sai da crate de pesca e o tier V só sai da caixa
# pesca-ii, que é a única fonte dele.
#
# ⚠️ ESCADA DA SKIN — degraus 2 a 6 da vara (coral · escama · prata ·
# turquesa · abissita). A default (degrau 1) nunca sai de caixa, e do degrau 7
# (serenita) para cima só na caixa pesca-ii.
#
# O Coral aparece aqui E na crate de propósito: ele é o primeiro portão da
# escada de níveis (nível 8, dia 3,40) e não pode depender de uma fonte só.
#
# ⚠️ A lore de cada ícone espelha o item real (GarnixFishing/skins.yml e
# GarnixFishing/armors/) — preview e item recebido têm que bater linha a
# linha, sem nenhuma linha extra.
#
# ⚠️ MOEDA E ESCADA DE 3 DEGRAUS espelhando a crate pesca — os mesmos
# 2.500·5.000·10.000 coins e corais de la, multiplicados por 3. A Tier II usa
# a mesma escada da crate multiplicada por 5. Se mexer num degrau, mexa nos
# tres: a familia inteira e que da a escada.
#
# ⚠️ A MOEDA E O FILLER desta caixa, o mesmo papel que ela tem na crate:
# 27,5% das aberturas devolvem dinheiro. Dentro da familia a escada e
# 50/30/20, NAO o 60/30/10 da crate — com 60/30/10 o degrau de cima ficaria
# mais raro que a skin de topo, e moeda nunca pode ser mais rara que item.
#
# ⚠️ O TOPO DAQUI E A CAIXA TIER II (1,5). Logo abaixo vem a Abissita (2) e a
# peca T-IV (1,5) — a Abissita e o ultimo degrau de skin que esta caixa
# alcanca, e o T-IV o ultimo tier de armadura.
