# O id da caixa é o nome do arquivo. A caixa É o item físico: o jogador
# segura e clica com o botão direito para abrir (esquerdo para ver os prêmios).

# Slot que esta caixa ocupa no menu /caixas (omita para não aparecer na lista).
slot: 15

box-item:
  material: CHEST
  glow: true
  display: '&b&lCaixa Pesca &b[T&lI&b]'
  lore:
  - '&7Abra e descubra o que a sorte'
  - '&7guardou para você lá dentro.'
  - ''
  - '&bOpções de uso:'
  - '&fBotão esquerdo &8➟ &7Preview'
  - '&fBotão direito &8➟ &7Abrir'

# ── RECOMPENSAS ───────────────────────────────────────────────────────
# Types: CURRENCY, COMMAND, COMMAND_ITEM, ITEM, NONE
# 'chance' é o peso do sorteio (não precisa somar 100).
#
# ⚠️ Peça de armadura INDIVIDUAL, nunca a coleção: `givearmor tier-v` sem o
# sufixo de slot entrega o set inteiro (+48%) num drop só.
#
# ⚠️ ARMADURA NUNCA VAI PARA O SITE. Ela existe só via caixa — e como a
# caixa II é comprável, quem paga compra CHANCE, não a peça.
rewards:

  azar:
    type: NONE
    chance: 20
    display: '&8Azar'
    icon:
      material: BARRIER
      display: '&8Azar'
      lore:
      - '&7Não foi dessa vez...'

  armadura-i:
    type: COMMAND
    chance: 19
    display: '&7Peça de Armadura &7[T&lI&7]'
    command: pesca givearmor {player} tier-i_helmet
    amount: 1
    icon:
      material: LEATHER_HELMET
      color: '#24506B'
      display: '&7Capacete Pesca &7[T&lI&7]'
      flags:
      - HIDE_ATTRIBUTES

  armadura-ii:
    type: COMMAND
    chance: 18
    display: '&7Peça de Armadura &7[T&lII&7]'
    command: pesca givearmor {player} tier-ii_chestplate
    amount: 1
    icon:
      material: LEATHER_CHESTPLATE
      color: '#2C6E8C'
      display: '&aPeitoral Pesca &a[T&lII&a]'
      flags:
      - HIDE_ATTRIBUTES

  armadura-iii:
    type: COMMAND
    chance: 10
    display: '&fPeça de Armadura &f[T&lIII&f]'
    command: pesca givearmor {player} tier-iii_leggings
    amount: 1
    icon:
      material: LEATHER_LEGGINGS
      color: '#3494B0'
      display: '&bCalça Pesca &b[T&lIII&b]'
      flags:
      - HIDE_ATTRIBUTES

  skin-forjavel:
    type: COMMAND
    chance: 12
    display: '&aSkin prata'
    command: pesca giveskin {player} prata
    amount: 1
    icon:
      material: FISHING_ROD
      display: '&7Prata'

  forja:
    type: COMMAND
    chance: 8
    display: '&6Forja de Skin'
    command: pesca giveforge {player} 1
    amount: 1
    icon:
      material: ANVIL
      display: '&6Forja de Skin'

  secundaria:
    type: CURRENCY
    chance: 5
    display: '&b1.000 corais'
    currency-id: corais
    amount: '1000'
    icon:
      lore:
      - '&8 ▪ &fQuantia: &71K '
  booster:
    type: COMMAND
    chance: 2
    display: '&aBooster 2x &7(15min)'
    command: pesca givebooster {player} corais 2 15m
    amount: 1
    icon:
      material: POTION
      display: '&aBooster 2x &7(15min)'

  livro-luck:
    type: COMMAND
    chance: 6
    display: '&aLivro de Faro Aguçado 3'
    command: pesca givebook {player} luck 3
    amount: 1
    icon:
      material: ENCHANTED_BOOK
      display: '&aLivro de Faro Aguçado &7{level}'
      lore:
      - '&7Aumenta a chance de vir'
      - '&7recompensa melhor.'
      - ''
      - '&8 ▪ &fFaro Aguçado: &a{level} '
      - ''
      - '&7Arraste sobre a vara'
      - '&7para aplicar o livro.'

