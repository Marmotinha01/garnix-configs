# O id da caixa é o nome do arquivo. A caixa É o item físico: o jogador
# segura e clica com o botão direito para abrir (esquerdo para ver os prêmios).

# Raridade desta caixa, usada para ordenar o menu /caixas: quanto MAIOR o peso,
# mais rara e mais tarde ela aparece na lista (omita para não aparecer nela).
weight: 120

box-item:
  material: ENDER_CHEST
  display: '&eCaixa Skins &e[Tier &lII&e]'
  lore:
  - '&7Abra e descubra o que a sorte'
  - '&7guardou para você lá dentro.'
  - ''
  - '&eOpções de uso:'
  - '&fBotão esquerdo &8➟ &7Preview'
  - '&fBotão direito &8➟ &7Abrir x1'
  - '&fBotão dir. + SHIFT &8➟ &7Abrir x4'

# -- RECOMPENSAS -------------------------------------------------------
# Types: CURRENCY, COMMAND, COMMAND_ITEM, ITEM, NONE
# 'chance' é o peso do sorteio (não precisa somar 100).
#
# ⚠️ Esta caixa é de SKIN — ela não tem `azar`. Abrir sempre devolve prêmio:
# uma das doze skins, ou a própria caixa em dobro em 2% das vezes.
#
# ⚠️ ESCADA DA TIER II — os degraus 7 a 10 de cada via, ou seja tudo que a
# forja NÃO alcança (`forgeable: false` nos três skins.yml). Os degraus 2 a
# 6, que a forja alcança, ficam na caixa skins-i.
#   mineração: quartzo · jade · safira · mithril
#   fazenda:   esmeralda · ametista · cristal · marfim
#   pesca:     serenita · oceanita · pérola · tempestita
#
# ⚠️ O DEGRAU 10 (mithril · marfim · tempestita) era exclusivo da Caixa
# Garnix. Ele continua aqui no menor peso de todos — 2 de 100 dentro da via,
# ou seja 1,96% de sair alguma das três. A Garnix segue sendo a fonte mais
# provável dessas três skins, e de proposito.
#
# ⚠️ AS TRES VIAS NAO VALEM O MESMO: a pesca sai mais que as outras duas, na
# razao 38 : 30 : 30. Mineracao e fazenda sao as vias mais raras e ficam
# empatadas entre si. Os 2 que sobram sao a propria caixa em dobro.
#
# ⚠️ Dentro da via a escada e sempre 55 : 32 : 11 : 2, repartindo o peso da
# via. Ela despenca de proposito: o degrau 7 e o conteudo da caixa e o
# degrau 10 e o acidente. Se mexer num degrau, mexa nos quatro.
#
# ⚠️ APERTADA EM 05/08/2026 junto com as Tier II de linha. A escada era
# 50 : 30 : 16 : 4 e esta caixa entregava o degrau 9 quase o DOBRO do que as
# caixas de linha entregavam (6,08 contra 3 na pesca) — apertar so as de
# linha teria feito dela a rota facil para as skins de topo.
#
# ⚠️ A PROPRIA CAIXA X2 (2%) e a unica recompensa que nao e skin. Ela
# devolve DUAS caixas por uma consumida, entao o saldo e +1: e bonus, nao
# re-roll. Nao vira loop infinito porque 0,02 x 2 = 0,04 caixa por abertura,
# muito abaixo de 1 — a corrente sempre morre. So passaria a se sustentar
# sozinha se esse peso subisse acima de 50.
#
# ⚠️ O arquivo soma 100, entao o peso de cada entrada JA E a porcentagem: a
# Skin de Serenita sai em 20,9% das aberturas e a de Mithril em 0,6%.
#
# ⚠️ A lore de cada ícone espelha o item real (skins.yml de cada plugin) —
# preview e item recebido têm que bater linha a linha, sem nenhuma linha extra.
rewards:

  # -- MINERACAO --------------------------------------------------- 30%
  mineracao-quartzo:
    type: COMMAND_ITEM
    chance: 16.5
