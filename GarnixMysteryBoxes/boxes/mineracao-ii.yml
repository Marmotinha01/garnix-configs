    chance: 25
    display: '&fPeça de Armadura &f[T&lIII&f]'
    command: mina givearmor {player} tier-iii_boots
    amount: 1
    icon:
      material: LEATHER_BOOTS
      color: '#55FFFF'
      display: '&bBota Mineração &b[Tier &lIII&b]'
      lore:
      - ''
      - ' &8Especificações:'
      - '&8 ▪ &6Coins: &a+5.0% '
      - '&8 ▪ &dGemas: &a+3.5% '
      - '&8 ▪ &aXP: &a+3.5% '
