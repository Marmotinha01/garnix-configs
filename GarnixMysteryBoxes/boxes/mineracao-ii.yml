# O id da caixa é o nome do arquivo. A caixa É o item físico: o jogador
# segura e clica com o botão direito para abrir (esquerdo para ver os prêmios).

# Raridade desta caixa, usada para ordenar o menu /caixas: quanto MAIOR o peso,
# mais rara e mais tarde ela aparece na lista (omita para não aparecer nela).
weight: 90

box-item:
  material: ENDER_CHEST
  display: '&6Caixa Mineração &6[Tier &lII&6]'
  lore:
  - '&7Abra e descubra o que a sorte'
  - '&7guardou para você lá dentro.'
  - ''
  - '&6Opções de uso:'
  - '&fBotão esquerdo &8➟ &7Preview'
  - '&fBotão direito &8➟ &7Abrir x1'
  - '&fBotão dir. + SHIFT &8➟ &7Abrir x4'

# -- RECOMPENSAS -------------------------------------------------------
# Types: CURRENCY, COMMAND, COMMAND_ITEM, ITEM, NONE
# 'chance' é o peso do sorteio (não precisa somar 100).
#
# ⚠️ Esta caixa nao tem `azar`: toda abertura devolve premio. Azar so existe
# nas crates e nos bosses.
#
# ⚠️ GRADE DAS TRES CAIXAS TIER II — mineracao, pesca e farm usam a MESMA
# grade, familia por familia:
#
#   armadura T-III 24 · skins 22,5 · moeda 20 · livros 10,5 ·
#   armadura T-IV 10 · boosters 7 · armadura T-V 4 · a propria caixa x2 2
#
# So que esta caixa tem dois blocos que as outras duas nao tem (6x6, 8x8 e
# britadeira, mais a vaga de visitante). Entao ELA e a grade acima
# multiplicada por 0,86, mais os 12% dos explosivos e os 2% da vaga — as
# proporcoes entre as familias continuam identicas nas tres caixas e os tres
# arquivos fecham em 100. Se mexer numa familia aqui, mexa nas outras duas.
#
# ⚠️ Peça de armadura INDIVIDUAL, nunca a coleção: `givearmor tier-v` sem o
# sufixo de slot entrega o set inteiro (+48%) num drop só.
#
# ⚠️ ARMADURA NUNCA VAI PARA O SITE. Ela existe só via caixa — e como a
# caixa II é comprável, quem paga compra CHANCE, não a peça.
#
# ⚠️ ESCADA DA ARMADURA — esta caixa sorteia as QUATRO peças dos tiers III,
# IV e V (12 peças). Os tiers I e II só saem na caixa mineracao-i; o tier III
# aparece nas duas, e é o degrau que liga uma caixa na outra.
#
# ⚠️ ESCADA DA SKIN — degraus 6 a 10 da picareta (rubi · quartzo · jade ·
# safira · mithril). Os degraus 2 a 5 ficam na caixa mineracao-i.
#
# ⚠️ A lore de cada ícone espelha o item real (GarnixMining/skins.yml e
# GarnixMining/armors/) — preview e item recebido têm que bater linha a
# linha, sem nenhuma linha extra.
#
# ⚠️ Os explosivos sao escadinha entre as duas caixas: 2x2 e 4x4 ficam na
# Tier I, 6x6 e 8x8 so aqui. A britadeira sai nas duas, 1 la e 3 aqui.
#
# ⚠️ `/mina givebomb <jogador> <bombId> [quantidade]`: o bombId e a chave do
# bloco em `GarnixMining/bombs.yml`. Os quatro explosivos se chamam so
# "Explosivo" no item real — o `[6x6]` do display existe para o broadcast e o
# preview dizerem QUAL saiu.
#
# ⚠️ As 3 britadeiras nao entram no display: quem mostra a quantia e a pilha
# do proprio icone (`amount: 3`), igual ao x2 da caixa `caixas`. HOPPER
# empilha, entao o icone renderiza o numero sozinho.
#
# ⚠️ MOEDA E ESCADA DE 3 DEGRAUS espelhando a crate mineracao — os mesmos
# 250·500·1.000 coins e 150·300·600 gemas de la, multiplicados por 5. A
# Tier I usa a mesma escada da crate multiplicada por 3. Se mexer num
# degrau, mexa nos tres: a familia inteira e que da a escada.
#
# ⚠️ A VAGA sai 1 por vez, sempre — `/mina giveslot <jogador> [quantidade]`
# nao tem escada. Ela tambem sai da caixa `garnix`, que e a unica outra
# fonte dela em caixa.
#
# ⚠️ A MOEDA E O FILLER, mas aqui ela pesa 17,2% e nao os 26,4% da Tier I:
# esta caixa e comprada, e quem paga quer ITEM. Dentro da familia a escada e
# 50/30/20, NAO o 60/30/10 da crate — moeda nunca pode ser mais rara que
# item, e com 60/30/10 o degrau de cima ficaria abaixo da skin de topo.
#
# ⚠️ O TOPO E A SKIN DE MITHRIL (0,22), com a peca T-V (0,86) logo atras.
# Nao existe degrau para cima aqui: a Tier II e o fim da escada de caixa.
#
# ⚠️ APERTADO EM 05/08/2026 a pedido do dono, que achou facil demais tirar as
# duas ultimas skins e as armaduras T-IV e T-V. A Safira caiu 3x (2,58 →
# 0,86) e a Mithril 6x (1,29 → 0,22); a peca T-V caiu de 1,5 para 0,86 e a
# T-IV de 2,8 para 2,15. O peso saiu de dentro da propria familia — o rubi,
# o quartzo e o jade, mais o T-III da armadura, absorveram tudo.
#
# ⚠️ Com a Mithril em 0,22 a Caixa Garnix (0,5) volta a ser a fonte mais
# provavel dela, que e como deve ser. A Caixa Skins II foi apertada junto,
# senao ela virava a rota facil.
#
# ⚠️ A PROPRIA CAIXA X2 (1,72%) e a unica recompensa que se auto-sorteia.
# Ela devolve DUAS caixas por uma consumida, entao o saldo e +1: e bonus,
# nao re-roll. Nao vira loop infinito porque 0,0172 x 2 = 0,034 caixa por
# abertura, muito abaixo de 1 — a corrente sempre morre. So passaria a se
# sustentar sozinha se esse peso subisse acima de 50.
