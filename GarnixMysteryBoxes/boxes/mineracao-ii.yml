# O id da caixa é o nome do arquivo. A caixa É o item físico: o jogador
# segura e clica com o botão direito para abrir (esquerdo para ver os prêmios).

# Slot que esta caixa ocupa no menu /caixas (omita para não aparecer na lista).
slot: 20

box-item:
  material: TRAPPED_CHEST
  glow: true
  display: '&e&lCaixa Mineração &e[T&lII&e]'
  lore:
  - '&7Abra e descubra o que a sorte'
  - '&7guardou para você lá dentro.'
  - ''
  - '&eOpções de uso:'
  - '&fBotão esquerdo &8➟ &7Preview'
  - '&fBotão direito &8➟ &7Abrir'

# ── RECOMPENSAS ───────────────────────────────────────────────────────
# Types: CURRENCY, COMMAND, COMMAND_ITEM, ITEM, NONE
# 'chance' é o peso do sorteio (não precisa somar 100).
#
# ⚠️ Peça de armadura INDIVIDUAL, nunca a coleção: `givearmor tier-v` sem o
# sufixo de slot entrega o set inteiro (+48%) num drop só.
#
# ⚠️ ARMADURA NUNCA VAI PARA O SITE. Ela existe só via caixa — e como a
# caixa II é comprável, quem paga compra CHANCE, não a peça.
rewards:

  azar:
    type: NONE
    chance: 3
    display: '&8Azar'
    icon:
      material: BARRIER
      display: '&8Azar'
      lore:
      - '&7Raro, mas acontece.'

  armadura-iii:
    type: COMMAND
    chance: 25
    display: '&fPeça de Armadura &f[T&lIII&f]'
    command: mina givearmor {player} tier-iii_boots
    amount: 1
    icon:
      material: LEATHER_BOOTS
      color: '#C8922C'
      display: '&bBota Mineração &b[T&lIII&b]'
      flags:
      - HIDE_ATTRIBUTES

  armadura-iv:
    type: COMMAND
    chance: 22
    display: '&6Peça de Armadura &6[T&lIV&6]'
    command: mina givearmor {player} tier-iv_chestplate
    amount: 1
    icon:
      material: LEATHER_CHESTPLATE
      color: '#F0B429'
      display: '&dPeitoral Mineração &d[T&lIV&d]'
      flags:
      - HIDE_ATTRIBUTES

  armadura-v:
    type: COMMAND
    chance: 15
    display: '&5Peça de Armadura &5[T&lV&5]'
    command: mina givearmor {player} tier-v_leggings
    amount: 1
    icon:
      material: LEATHER_LEGGINGS
      color: '#FFD54A'
      display: '&6Calça Mineração &6[T&lV&6]'
      flags:
      - HIDE_ATTRIBUTES

  skin-7:
    type: COMMAND
    chance: 15
    display: '&5Skin quartzo'
    command: mina giveskin {player} quartzo
    amount: 1
    icon:
      material: DIAMOND_PICKAXE
      display: '&fQuartzo'
      flags:
      - HIDE_ATTRIBUTES

  skin-8:
    type: COMMAND
    chance: 12
    display: '&5Skin jade'
    command: mina giveskin {player} jade
    amount: 1
    icon:
      material: DIAMOND_PICKAXE
      glow: true
      display: '&aJade'
      flags:
      - HIDE_ATTRIBUTES

  livro:
    type: COMMAND
    chance: 6
    display: '&aLivro de Pilhagem 2'
    command: lamina givebook {player} pilhagem 2
    amount: 1
    icon:
      material: ENCHANTED_BOOK
      display: '&aLivro de Pilhagem &7{level}'
      lore:
      - '&7Aumenta os drops que os'
      - '&7mobs deixam ao morrer.'
      - ''
      - '&8 ▪ &fPilhagem: &a{level} '
      - ''
      - '&7Arraste sobre a lâmina'
      - '&7para aplicar o livro.'

  booster:
    type: COMMAND
    chance: 2
    display: '&d&lBooster 3x &7(10min)'
    command: mina givebooster {player} coins 3 10m
    amount: 1
    icon:
      material: POTION
      glow: true
      display: '&d&lBooster 3x &7(10min)'
