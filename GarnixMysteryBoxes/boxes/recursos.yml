# O id da caixa é o nome do arquivo. A caixa É o item físico: o jogador
# segura e clica com o botão direito para abrir (esquerdo para ver os prêmios).

# Raridade desta caixa, usada para ordenar o menu /caixas: quanto MAIOR o peso,
# mais rara e mais tarde ela aparece na lista (omita para não aparecer nela).
weight: 60

box-item:
  material: CHEST
  display: '&2Caixa Recursos'
  lore:
  - '&7Abra e descubra o que a sorte'
  - '&7guardou para você lá dentro.'
  - ''
  - '&2Opções de uso:'
  - '&fBotão esquerdo &8➟ &7Preview'
  - '&fBotão direito &8➟ &7Abrir x1'
  - '&fBotão dir. + SHIFT &8➟ &7Abrir x4'

# -- RECOMPENSAS -------------------------------------------------------
# Types: CURRENCY, COMMAND, COMMAND_ITEM, ITEM, NONE
# 'chance' é o peso do sorteio (não precisa somar 100).
#
# ⚠️ Esta caixa nao tem `azar`: toda abertura devolve recurso. Os 39 pesos
# somam 100 de proposito — aqui peso e porcentagem, e a leitura fica direta.
#
# ⚠️ A ESCALA SAI DA CRATE RANKUP, com a regra "tira o degrau mais baixo dela
# e acrescenta um mais alto". A escala literal 25/50/100 que este arquivo
# usava foi aposentada: ela dava 25 coins (a crate de linha da 250) ao lado
# de 25 limites de spawner (que valem 100.000 no cash shop).
#
#   coins        2.000 · 4.000 · 8.000     (RankUP: 1.000 · 2.000 · 4.000)
#   combustivel  2.000 · 4.000 · 8.000     (RankUP: 2.000)
#   dracmas      1.000 · 2.000 · 4.000     (RankUP:   500 · 1.000 · 2.000)
#   gemas/sementes/corais  300 · 600 · 1.200   (crate de linha: 150·300·600)
#   limite de armazem  30 · 50 · 100 · 150  (RankUP: 15 · 30 · 50 · 100)
#   maquina e spawner   5 · 10 ·  20 ·  30  (RankUP:  1 ·  3 ·  5 ·  10)
#
# As runas sao a unica familia que NAO subiu: 25 e 50 continuam sendo os dois
# degraus mais baixos da Caixa Runas, que vai ate 500. Elas tem economia
# propria (a loja de fragmentos cobra 90 a 120), entao 25 ja e meia compra.
#
# ⚠️ OS TRES LIMITES TINHAM A MESMA QUANTIA E CHANCES DIFERENTES, na razao
# 6 : 3 : 1 — a mesma que a RankUP e a Mineracao usam. So que a razao no PESO
# nunca fechou a conta do VALOR: 30 de armazem valem 48 de cash e 30 de spawner
# valem 120.000. Este comentario ja dizia que "se um dia ele virar problema, o
# caminho e tirar ele daqui, nao afinar mais o peso" — e em 07/08/2026 virou.
#
# A saida foi o LOTE, nao o peso nem a remocao: maquina e spawner desceram de
# 30·50·100·150 para 5·10·20·30. O EV por abertura vai de 0,79 para 0,15 no
# spawner e de 2,37 para 0,45 na maquina, e a contribuicao da caixa na
# temporada cai de ~8,3 para ~1,6 unidades de limite de spawner.
#
# Os lotes ficaram 5x os da crate (que usa 1·3·5·10) de proposito: esta caixa e
# rara e precisa continuar valendo mais que girar uma chave comum. O ARMAZEM
# nao foi tocado — ele e o limite barato e de volume, a via do cacto pede ~5.000
# dele na temporada e ele tem teto fisico no plot.
#
# ⚠️ O PESO NAO MUDOU: as familias continuam em 9 · 4,5 · 1,5, que e 6:3:1
# exato. Quem quiser mexer na dose mexe no `amount`, nunca no `chance` — o peso
# e o que mantem os 39 premios somando 100 neste arquivo.
#
# ⚠️ As familias, do recheio ao topo:
#   SECUNDARIAS     30%  gemas · sementes · corais · dracmas, 3 lotes cada
#   RUNAS           18%  as 4 runas, 2 lotes cada
#   COMBUSTIVEL   10,5%
#   COINS           10%
#   L. ARMAZEM       9%  4 degraus
#   ATIVADOR       5,5%  um bau a mais na lista
#   LIMPADOR       5,5%  limpa o terreno inteiro
#   L. MAQUINAS    4,5%  4 degraus
#   CAIXA RUNAS      3%  a unica recompensa que nao e recurso solto
#   RESET DE KDR   2,5%
#   L. SPAWNERS    1,5%  4 degraus
#
# ⚠️ Dentro de cada familia o lote cai pela metade a cada degrau. Nos limites,
# que tem quatro degraus, isso da 8 : 4 : 2 : 1 sobre o peso da familia.
#
# ⚠️ As runas usam `givevirtual`: caem no armazenamento e o jogador retira
# pelo /runas quando quiser, sem ocupar slot na hora da abertura.
#
# ⚠️ AS 4 RUNAS NAO TEM MAIS O MESMO PESO (07/08/2026). A familia continua em
# 18 e o EV continua em 6 runas por abertura — o que mudou e a reparticao, que
# agora segue a DEMANDA de `GarnixFragments/shop.yml` em vez de dar 4,5 para
# cada tipo:
#
#           demanda   familia   25      50     EV
#   eterna    60,8%    10,98    7,32   3,66   3,66
#   sagrada   17,9%     3,24    2,16   1,08   1,08
#   primal    13,4%     2,34    1,56   0,78   0,78
#   divina     7,9%     1,44    0,96   0,48   0,48
#
# A forma 2:1 entre o lote de 25 e o de 50 e preservada em todos. Antes eram
# 3,0 e 1,5 para os quatro, e a loja pedia 7,7x mais eterna que divina — cerca
# de 56% de tudo que caia era runa que ninguem gastava.
#
# ⚠️ A mesma correcao foi feita em `boxes/runas.yml`, com a explicacao longa.
# Os 5 BOSSES ficaram DE FORA de proposito: a linha "sagrada = bosses" do
# `GarnixFragments/runas.yml` e o que sobrou da identidade de fonte, e o boss
# e o unico canal onde ela ainda pode ser restaurada.
#
# ⚠️ Recompensa `type: CURRENCY` nao declara material: o C15 resolve o icone
# pela propria moeda (`GarnixCurrencies/currencies/<id>.yml`). So a lore vem
# daqui — que e justamente o que se quer acrescentar.
#
# ⚠️ `{amount}` na lore e no comando sai do `amount:` da recompensa. Escreva
# a quantia UMA vez, no `amount:`.
