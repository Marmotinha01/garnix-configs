# O id da caixa é o nome do arquivo. A caixa É o item físico: o jogador
# segura e clica com o botão direito para abrir (esquerdo para ver os prêmios).

# Raridade desta caixa, usada para ordenar o menu /caixas: quanto MAIOR o peso,
# mais rara e mais tarde ela aparece na lista (omita para não aparecer nela).
weight: 140

box-item:
  material: ENDER_CHEST
  display: '&aCaixa Boosters'
  lore:
  - '&7Abra e descubra o que a sorte'
  - '&7guardou para você lá dentro.'
  - ''
  - '&aOpções de uso:'
  - '&fBotão esquerdo &8➟ &7Preview'
  - '&fBotão direito &8➟ &7Abrir x1'
  - '&fBotão dir. + SHIFT &8➟ &7Abrir x4'

# -- RECOMPENSAS -------------------------------------------------------
# Types: CURRENCY, COMMAND, COMMAND_ITEM, ITEM, NONE
# 'chance' é o peso do sorteio (não precisa somar 100).
#
# ⚠️ 15 boosters × 5 variações = 75 premios. Os 15 sao TODOS os providers de
# booster do servidor: mineracao (coins·gemas·xp·both), fazenda
# (coins·sementes·xp·both), pesca (corais·xp·both), maquinas (drops),
# spawners (drops·heads) e armazem (venda de cactos).
#
# ⚠️ OS 15 PROVIDERS ESTAO EM TRES FAIXAS, na razao 3 : 2 : 1 —
#
#   fraco    12  coins de mineracao · coins de fazenda
#   neutro    8  gemas · sementes · corais · os tres de XP
#   roubado   4  os tres `both` · maquina · spawner (drops e heads) · armazem
#
# O `both` turbina XP, coins e a moeda da linha numa pocao so: ele vale por
# tres boosters, entao pesa um terco do de coins. Maquina, spawner e armazem
# multiplicam renda PASSIVA, que roda com o jogador offline, e por isso caem
# na mesma faixa do `both`.
#
# ⚠️ Dentro de cada provider a escada e sempre a mesma, na razao
# 4 : 3 : 2,5 : 1,5 : 1, repartindo o peso da faixa:
#
#   2x 15m  ·  2x 30m  ·  3x 5m  ·  2x 1h  ·  3x 10m
#
# O 2x de 1h e mais raro que o 3x de 5m de proposito: uma hora inteira de
# dobro rende muito mais que cinco minutos de triplo. O 3x 10m fecha como o
# mais raro de toda linha.
#
# ⚠️ O arquivo soma 100, entao o peso de cada entrada JA E a porcentagem: o
# 2x 15m de coins da mineracao sai em 4% das aberturas e o 3x 10m do armazem
# em 0,3%.
#
# ⚠️ Esta caixa nao tem `azar`: toda abertura devolve um booster.
rewards:

  # -- Booster de Mineração — Coins  ·  faixa fraco, peso 12
  mina-coins-2x-15m:
    type: COMMAND_ITEM
    chance: 4
    display: '&6x&l{amount} &6Booster de Mineração'
    command: mina givebooster {player} coins 2 15m {amount}
    amount: 1
    icon:
      material: POTION
      data: 8201
      display: '&6Booster de Mineração'
      lore:
      - '&7Use este booster para ter'
      - '&7seus ganhos aumentados.'
      - ''
      - ' &8Informações: '
      - ' &8▪ &fTipo: &aCoins '
      - ' &8▪ &fBônus: &a2x '
      - ' &8▪ &fDuração: &715m '
