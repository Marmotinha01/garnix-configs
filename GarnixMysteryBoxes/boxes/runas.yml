# O id da caixa é o nome do arquivo. A caixa É o item físico: o jogador
# segura e clica com o botão direito para abrir (esquerdo para ver os prêmios).

# Raridade desta caixa, usada para ordenar o menu /caixas: quanto MAIOR o peso,
# mais rara e mais tarde ela aparece na lista (omita para não aparecer nela).
weight: 50

box-item:
  material: CHEST
  display: '&5Caixa Runas'
  lore:
  - '&7Abra e descubra o que a sorte'
  - '&7guardou para você lá dentro.'
  - ''
  - '&5Opções de uso:'
  - '&fBotão esquerdo &8➟ &7Preview'
  - '&fBotão direito &8➟ &7Abrir x1'
  - '&fBotão dir. + SHIFT &8➟ &7Abrir x4'

# -- RECOMPENSAS -------------------------------------------------------
# Types: CURRENCY, COMMAND, COMMAND_ITEM, ITEM, NONE
# 'chance' é o peso do sorteio (não precisa somar 100).
#
# ⚠️ 4 runas × 6 lotes = 24 premios. A entrega e VIRTUAL (`givevirtual`):
# cai direto no armazenamento do jogador, que retira pelo /runas quando
# quiser. Nao ocupa slot no inventario na hora da abertura.
#
# ⚠️ A ESCADA DE LOTE E 25 · 50 · 75 · 100 · 250 · 500, igual para as quatro
# runas, com a MESMA FORMA de peso 11 · 6,5 · 4 · 2,5 · 0,75 · 0,25. O degrau
# de 75 entrou em 05/08/2026 — antes a escada pulava de 50 direto para 100.
#
# ⚠️ Os quatro primeiros degraus sao um passo curto entre si (25 → 50 → 75 →
# 100) e por isso os pesos deles caem devagar. O salto de verdade e do 100
# para o 250, e o peso acompanha: cai para ~30% do degrau anterior.
#
# ⚠️ Os lotes conversam com a loja de runas, onde o item mais barato custa
# 90 e o mais caro 1.000 de cada tipo. Um lote de 25 e um passo, o de 500
# e meio item caro.
#
# -- A OFERTA SEGUE A DEMANDA (07/08/2026) --------------------------------
#
# Ate 07/08/2026 as quatro runas tinham 25% cada, e a loja NAO pedia elas
# nessa proporcao. Contado em `GarnixFragments/shop.yml`:
#
#   eterna    20 itens · 7.120 · 60,8% da demanda
#   sagrada    9 itens · 2.100 · 17,9%
#   primal     7 itens · 1.570 · 13,4%
#   divina     6 itens ·   930 ·  7,9%
#
# A eterna era 7,7x mais demandada que a divina e caia na mesma taxa. Para
# comprar a loja inteira o jogador precisava de 7.120 eterna, o que exigia
# ~28.500 runas totais — e sobravam ~5.000 sagradas, ~6.200 divinas e ~5.500
# primais. Perto de 56% de tudo que caia era lixo, e o custo multi-runa da
# loja virava teatro: a restricao efetiva era SEMPRE a eterna.
#
# Agora a ESCADA DE CADA RUNA E MULTIPLICADA POR UM FATOR que a leva ate a
# sua fatia da demanda. A forma 11/6,5/4/2,5/0,75/0,25 e preservada:
#
#   eterna   x2,44  →  61 de peso   (26,84 · 15,86 · 9,76 · 6,10 · 1,83 · 0,61)
#   sagrada  x0,72  →  18           ( 7,92 ·  4,68 · 2,88 · 1,80 · 0,54 · 0,18)
#   primal   x0,52  →  13           ( 5,72 ·  3,38 · 2,08 · 1,30 · 0,39 · 0,13)
#   divina   x0,32  →   8           ( 3,52 ·  2,08 · 1,28 · 0,80 · 0,24 · 0,08)
#
# Soma 100. O EV TOTAL DA CAIXA NAO MUDOU — continua em 58,5 runas por
# abertura (5.850 ÷ 100); o que mudou e a repartição:
#
#   eterna 35,69 · sagrada 10,53 · primal 7,61 · divina 4,68
#
# ⚠️ MEXER NA LOJA MEXE AQUI. Se um item novo pedir muita divina, ou se um
# custo em eterna cair, os pesos saem de sincronia com a demanda de novo. A
# conta e uma so: fatia_da_runa = soma_dela_na_loja ÷ soma_de_todas.
#
# ⚠️ E MEXER AQUI MEXE NA LOJA DA PESCA, porque esta caixa e vendida por coral
# em `GarnixFishing/shop.yml` a 60.000 e e a UNICA ponte coral → runa do
# servidor. Concentrar peso na eterna barateia a rota coral → eterna em 2,44x.
# O preco de la NAO precisou mudar, e a conta e esta:
#
# Uma temporada de pesca AFK rende 2,20 M de corais = 36,67 caixas, ou seja
# 1.308 eterna · 386 sagrada · 279 primal · 172 divina. A britadeira (o item
# que mais empurra o Ranking de Apeloes) pede 1000/700/400/500, entao a eterna
# deixou de ser o gargalo e quem passou a segurar foi a DIVINA: sao precisas
# 85,5 caixas, 5,13 M de corais, 2,33 temporadas. Antes do reajuste o gargalo
# era a eterna em 68,4 caixas, 4,10 M, 1,87 temporadas.
#
# ⚠️ Ou seja o reajuste deixou a britadeira 25% MAIS CARA pela rota do coral,
# nao mais barata. O que ficou 2,44x mais acessivel foram os quatro itens de
# eterna pura (limpador 90 · ativador 120 · bomba-2x2 150 · fly-6h 200), e os
# quatro sao de baixo impacto ou tem rota direta mais barata na loja da pesca —
# o fly-6h por runa sai a 336 mil corais contra os 54 mil das duas doses de 3h.
#
# ⚠️ Se um dia um item CARO passar a custar so eterna, esta conta inverte e o
# preco da caixa na loja da pesca precisa subir junto.
#
# ⚠️ Esta caixa nao tem `azar`: toda abertura devolve runa.
