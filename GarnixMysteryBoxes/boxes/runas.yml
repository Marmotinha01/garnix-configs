# O id da caixa é o nome do arquivo. A caixa É o item físico: o jogador
# segura e clica com o botão direito para abrir (esquerdo para ver os prêmios).

# Raridade desta caixa, usada para ordenar o menu /caixas: quanto MAIOR o peso,
# mais rara e mais tarde ela aparece na lista (omita para não aparecer nela).
weight: 50

box-item:
  material: TRAPPED_CHEST
  display: '&5Caixa Runas'
  lore:
  - '&7Abra e descubra o que a sorte'
  - '&7guardou para você lá dentro.'
  - ''
  - '&5Opções de uso:'
  - '&fBotão esquerdo &8➟ &7Preview'
  - '&fBotão direito &8➟ &7Abrir'

# ── RECOMPENSAS ───────────────────────────────────────────────────────
# Types: CURRENCY, COMMAND, COMMAND_ITEM, ITEM, NONE
# 'chance' é o peso do sorteio (não precisa somar 100).
#
# ⚠️ 4 runas × 5 lotes = 20 premios. A entrega e VIRTUAL (`givevirtual`):
# cai direto no armazenamento do jogador, que retira pelo /runas quando
# quiser. Nao ocupa slot no inventario na hora da abertura.
#
# ⚠️ Peso por lote, igual para as 4: 25 = 12 · 50 = 7 · 100 = 4 ·
# 250 = 1,5 · 500 = 0,5. Soma 25 por runa e 100 no total, entao cada runa
# tem 25% e o lote de 500 dela sai em 0,5%.
#
# ⚠️ Os lotes conversam com a loja de runas, onde o item mais barato custa
# 90 e o mais caro 1.000 de cada tipo. Um lote de 25 e um passo, o de 500
# e meio item caro.
#
# ⚠️ Esta caixa nao tem `azar`: toda abertura devolve runa.
rewards:

  # ── Runa Sagrada
  sagrada-25:
    type: COMMAND
    chance: 12
    display: '&4Runa Sagrada'
    command: runas givevirtual {player} sagrada {amount}
    amount: 25
