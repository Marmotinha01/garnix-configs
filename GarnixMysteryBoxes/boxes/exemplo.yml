# O id da caixa é o nome do arquivo. A caixa É o item físico: o jogador
# segura e clica com o botão direito para abrir (esquerdo para ver os prêmios).

# Slot que esta caixa ocupa no menu /caixas (omita para não aparecer na lista).
slot: 11

box-item:
  material: CHEST
  glow: true
  display: '&b&lCaixa Misteriosa'
  lore:
  - '&7Uma caixa com prêmios que'
  - '&7são sorteados na hora.'
  - ''
  - '&bOpções de uso:'
  - '&fBotão esquerdo &8➟ &7Preview'
  - '&fBotão direito &8➟ &7Abrir'

# Types: CURRENCY, COMMAND, COMMAND_ITEM, ITEM, NONE
# 'chance' é o peso do sorteio (não precisa somar 100).
rewards:

  moedas:
    type: CURRENCY
    chance: 40.0
    display: '&6Moedas'
    currency-id: coins
    amount: 2500
    icon:
      material: DOUBLE_PLANT
      display: '&6&lMoedas'
      lore:
        - '&7Um bom punhado de moedas.'

  experiencia:
    type: COMMAND
    chance: 25.0
    display: '&aExperiência'
    command: 'xp {amount} {player}'
    amount: 500
    icon:
      material: EXP_BOTTLE
      display: '&a&lExperiência'
      lore:
        - '&7500 de XP na conta.'

  pedra:
    type: COMMAND_ITEM
    chance: 15.0
    display: '&9Pedra'
    command: 'give {player} minecraft:stone {amount}'
    amount: 64
    item:
      material: STONE
      amount: 64
      display: '&9&lPedra'
      lore:
        - '&7Um stack inteirinho.'

  diamantes:
    type: ITEM
    chance: 12.0
    display: '&b&lDiamantes'
    item:
      material: DIAMOND
      amount: 5
      display: '&b&lDiamantes'
      lore:
        - '&75 diamantes brilhantes!'

  armadura:
    type: ITEM
    chance: 5.0
    display: '&6Peitoral de Diamante'
    item:
      material: DIAMOND_CHESTPLATE
      glow: true
      display: '&6&lPeitoral Lendário'
      enchants:
        - 'PROTECTION_ENVIRONMENTAL:4'
        - 'DURABILITY:3'
      lore:
        - '&7Forjado para os campeões.'

  estrela:
    type: ITEM
    chance: 2.0
    display: '&c&lEstrela do Nether'
    item:
      material: NETHER_STAR
      glow: true
      display: '&c&lEstrela do Nether'
      lore:
        - '&7O prêmio máximo!'

  azar:
    type: NONE
    chance: 1.0
    display: '&8Azar!'
    icon:
      material: BARRIER
      display: '&8&lAzar!'
      lore:
        - '&7Não foi dessa vez...'
