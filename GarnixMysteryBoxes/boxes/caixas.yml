# O id da caixa é o nome do arquivo. A caixa É o item físico: o jogador
# segura e clica com o botão direito para abrir (esquerdo para ver os prêmios).

# Raridade desta caixa, usada para ordenar o menu /caixas: quanto MAIOR o peso,
# mais rara e mais tarde ela aparece na lista (omita para não aparecer nela).
weight: 170

box-item:
  material: ENDER_CHEST
  display: '&dCaixa Caixas'
  lore:
  - '&7Abra e descubra o que a sorte'
  - '&7guardou para você lá dentro.'
  - ''
  - '&dOpções de uso:'
  - '&fBotão esquerdo &8➟ &7Preview'
  - '&fBotão direito &8➟ &7Abrir x1'
  - '&fBotão dir. + SHIFT &8➟ &7Abrir x4'

# -- RECOMPENSAS -------------------------------------------------------
# Types: CURRENCY, COMMAND, COMMAND_ITEM, ITEM, NONE
# 'chance' é o peso do sorteio (não precisa somar 100).
#
# ⚠️ Esta caixa sorteia OUTRAS CAIXAS — ela não tem `azar`. Abrir sempre
# devolve uma caixa, e o que varia é qual. Ela também nao se sorteia a si
# mesma: sem isso, uma abertura poderia so devolver a propria caixa.
#
# ⚠️ Ela sorteia TODAS as outras 17 caixas do servidor. Se voce criar uma
# caixa nova, ela entra aqui tambem — a regra e "todas menos ela mesma".
#
# ⚠️ A ORDEM DESTE ARQUIVO E A ORDEM DO CAMPO `weight:` de cada caixa, que e
# a mesma raridade que o menu /caixas ja mostra. A mineracao-i abre a lista
# (weight 10) e a garnix fecha (weight 180). Se voce mudar o `weight:` de
# alguma caixa, mova a entrada dela aqui junto — as duas ordens tem que
# contar a mesma historia.
#
#   comum    mineracao-i 11 · farm-i 10,5 · pesca-i 10 · skins-i 9
#            runas 8 · recursos 7,5 · bosses-i 7 · chaves 6,5
#   medio    mineracao-ii 5,5 · farm-ii 5 · pesca-ii 4,5 · skins-ii 4
#            bosses-ii 3,5 · boosters 3 · maquinas 2,5
#   raro     robos 1,5 · garnix 1
#
# ⚠️ Cada caixa tem duas entradas: a de x1 e a de x2, com a de x2 valendo
# metade do peso da de x1 — os numeros acima sao a soma das duas. O x2 nao
# muda display nem lore: a pilha do icone (amount: 2) e o que mostra que sao
# duas.
#
# ⚠️ O piso e o teto vem das caixas sorteadas, nao daqui. NENHUMA caixa tem
# azar — nem estas, nem as de via, nem as de skins, nem as de bosses, nem a
# garnix. Azar so existe nas crates e nos bosses. Entao sortear qualquer
# caixa aqui sempre vira premio, e a corrente inteira e premio garantido.
