# O id da caixa é o nome do arquivo. A caixa É o item físico: o jogador
# segura e clica com o botão direito para abrir (esquerdo para ver os prêmios).

# Raridade desta caixa, usada para ordenar o menu /caixas: quanto MAIOR o peso,
# mais rara e mais tarde ela aparece na lista (omita para não aparecer nela).
weight: 130

box-item:
  material: ENDER_CHEST
  display: '&4Caixa Bosses &4[Tier &lII&4]'
  lore:
  - '&7Abra e descubra o que a sorte'
  - '&7guardou para você lá dentro.'
  - ''
  - '&4Opções de uso:'
  - '&fBotão esquerdo &8➟ &7Preview'
  - '&fBotão direito &8➟ &7Abrir x1'
  - '&fBotão dir. + SHIFT &8➟ &7Abrir x4'

# -- RECOMPENSAS -------------------------------------------------------
# Types: CURRENCY, COMMAND, COMMAND_ITEM, ITEM, NONE
# 'chance' é o peso do sorteio (não precisa somar 100).
#
# ⚠️ SEM AZAR, igual à Tier I: toda abertura devolve alguma coisa.
#
# ⚠️ O que separa esta caixa da Tier I é o PISO, não só o topo:
#   · bosses — só Arauto, Titã e Devorador. Colosso e Inferno não entram.
#   · matadoras — começa na Sombria e vai até a Abissal. A Bruta não entra,
#     e a Rúnica e a Abissal são exclusivas daqui.
#   · kill-stack — sai em 1x e 2x (na Tier I só 1x).
#
# ⚠️ `/boss give boss <jogador> <BOSS> <stacks> 1`: o PRIMEIRO int escala.
# ⚠️ `/boss give killstack <jogador> <nivel> [quantia]`: o NÍVEL vem primeiro.
#
# ⚠️ A ESCADA DE VOLUME e 1 : 0,5 : 0,25 dentro de cada boss, a mesma da
# Tier I. A ESCADA DE BOSS aqui e 20 : 14 : 9 nos pesos de x1 — Arauto 75k ·
# Tita 150k · Devorador 300k. Os tres bosses somam 75,25% da caixa.
#
# ⚠️ A MATADORA E O TOPO, nao o boss. A espada e permanente e escala tudo o
# que vem depois; o boss e consumido numa luta so. Por isso a Abissal (0,25,
# 9.000 de dano) e o item mais raro do arquivo, e a Runica (1,5) vem logo
# atras. As duas so existem aqui — e o que separa esta caixa da Tier I.
#
# ⚠️ A PROPRIA CAIXA X2 (2%) devolve DUAS caixas por uma consumida, entao o
# saldo e +1: e bonus, nao re-roll. Nao vira loop infinito porque
# 0,02 x 2 = 0,04 caixa por abertura, muito abaixo de 1 — a corrente sempre
# morre. So passaria a se sustentar sozinha se esse peso subisse acima de 50.
#
# ⚠️ O arquivo soma 100, entao o peso de cada entrada JA E a porcentagem: o
# Arauto x1 sai em 20% das aberturas e a Matadora Abissal em 0,25%.
