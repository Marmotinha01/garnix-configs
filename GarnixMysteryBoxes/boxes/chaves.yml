# O id da caixa é o nome do arquivo. A caixa É o item físico: o jogador
# segura e clica com o botão direito para abrir (esquerdo para ver os prêmios).

# Raridade desta caixa, usada para ordenar o menu /caixas: quanto MAIOR o peso,
# mais rara e mais tarde ela aparece na lista (omita para não aparecer nela).
weight: 80

box-item:
  material: CHEST
  display: '&9Caixa Chaves'
  lore:
  - '&7Abra e descubra o que a sorte'
  - '&7guardou para você lá dentro.'
  - ''
  - '&9Opções de uso:'
  - '&fBotão esquerdo &8➟ &7Preview'
  - '&fBotão direito &8➟ &7Abrir x1'
  - '&fBotão dir. + SHIFT &8➟ &7Abrir x4'

# ── RECOMPENSAS ───────────────────────────────────────────────────────
# Types: CURRENCY, COMMAND, COMMAND_ITEM, ITEM, NONE
# 'chance' é o peso do sorteio (não precisa somar 100).
#
# ⚠️ Esta caixa só sorteia CHAVE — ela não tem `azar`. Abrir sempre devolve
# chave, e o que varia é de qual crate e quantas.
#
# ⚠️ AS SEIS CHAVES DO SERVIDOR, todas aqui: mineração · farm · pesca ·
# bosses · rankup · vip. Cada uma soma 100 de peso, então abrir é 1/6 para
# cada crate — nenhuma via é favorecida. O total do arquivo é 600 de
# propósito, mesmo desenho da caixa `skins-i`.
#
# ⚠️ A ESCADA DE QUANTIDADE é igual nas seis: 3x (45) · 5x (27) · 10x (16) ·
# 15x (9) · 30x (3). O 30x é ~3% do peso da via, ou 0,5% da caixa inteira.
#
# ⚠️ `/crate givekey <crate> <jogador> <quantidade>`: o ID DA CRATE vem
# PRIMEIRO, antes do jogador — é a ordem inversa da maioria dos outros give*
# do servidor. Trocar os dois faz o comando falhar em silêncio.
#
# ⚠️ Quem mostra quantas chaves saíram é a pilha do próprio ícone (`amount:`)
# e o `{amount}x` do display. TRIPWIRE_HOOK empilha, então o ícone renderiza
# o número sozinho — sem linha de "Quantia" na lore.
#
# ⚠️ A lore de cada ícone espelha o `key-item` real da crate correspondente
# (`GarnixCrates/crates/*.yml`) — preview e item recebido têm que bater linha
# a linha. Por isso a rankup e a vip têm as duas primeiras linhas diferentes
# das outras quatro: a chave delas não se consegue jogando a via.
rewards:

  # ── CHAVE MINERAÇÃO ─────────────────────────────────────────── 1/6

  mineracao-x3:
    type: COMMAND
    chance: 45
    display: '&eChave Mineração'
    command: crates givevirtualkey mineracao {player} {amount}
    amount: 3
