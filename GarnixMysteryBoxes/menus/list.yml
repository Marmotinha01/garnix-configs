title: Caixas Misteriosas

# Menu paginado: os slots das caixas saem daqui ('.'), e a ORDEM sai do `weight`
# de cada arquivo em boxes/ — peso menor primeiro (as piores), peso maior por
# ultimo (as melhores). Caixa sem `weight` nao aparece nesta lista.
#
# '<' e '>' sao os botoes de pagina anterior/proxima; so aparecem quando ha
# mais de uma pagina. Sao 15 slots livres por pagina e 18 caixas hoje, entao a
# lista ocupa 2 paginas: as 15 mais comuns na primeira e as 3 mais raras
# (boosters, maquinas e robos vem antes de caixas e garnix) na segunda.
shape:
- XXXXXXXXX
- XX.....XX
- <X.....X>
- XX.....XX
- XXXXXXXXX

box-lore:
- ''
- '&8 ▪ &fRecompensas: &a{rewards} '
- ''
- '&aClique para acessar.'

# Linhas extras que SO aparecem para quem tem a permissao `caixas.admin`. O
# jogador comum nunca ve estas linhas, e para ele o botao direito continua
# abrindo o preview — o hub nao muda em nada.
box-lore-staff:
- ''
- '&cStaff:'
- '&fBotão direito &8➟ &7Pegar a caixa'
