title: Vender Item
rows: 4

# O item que está na mão do jogador. Apenas preview — não é clicável e só sai da
# mão quando o anúncio é confirmado. As linhas entram sob a lore original dele.
item-icon:
  slot: 11
  lore:
  - ''
  - '&8 ▪ &fPreço: {currency_prefix}{price} '
  - '{tax_info}'
  - ''
  - '&7Este item será anunciado.'

# A linha {tax_info}, que sempre diz se a economia escolhida cobra taxa — trocar
# de economia troca a linha. {net} é o que sobra para você e {tax} é a alíquota.
tax-free: '&8 ▪ &fTaxa: &aIsento '
tax-charged: '&8 ▪ &fTaxa: &c&l{tax}&c% '

# O ícone da economia vem do próprio GarnixCurrencies — só a lore é definida aqui.
currency-icon:
  slot: 15
  lore:
  - '&eClique para alterar.'

confirm-icon:
  slot: 32
  material: STAINED_GLASS_PANE
  data: 5
  display: '&aColocar à Venda'
  lore:
  - '&7Publica o item no mercado'
  - '&7pelo preço definido.'
  - ''
  - '&aClique para anunciar.'

cancel-icon:
  slot: 30
  material: STAINED_GLASS_PANE
  data: 14
  display: '&cCancelar'
  lore:
  - '&7O item continua com você'
  - '&7e nada é anunciado.'
  - ''
  - '&cClique para cancelar.'
