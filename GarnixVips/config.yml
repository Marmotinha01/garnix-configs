debug: false

# LuckPerms group a player falls back to when they own no active VIP.
default-group: default

# How often (in seconds) the plugin sweeps online players for expired VIPs,
# notifies them, re-applies their active group, and re-reads the freeze clock.
# VIP time is real-world wall-clock time, so this only needs to be frequent
# enough for timely expiry notifications — 60s is plenty even at 500 players.
expiry-check-interval-seconds: 30

# Codes generated by /vip genkey are formatted as N groups of 4 characters
# separated by dashes (e.g. 4 → "AA34-DFS1-ZZS5-HS8Z"). Each character is an
# uppercase letter or digit.
key-groups: 4

# Configuration for VIP paper items (/vip givepaper command).
# Papers are given via /vip givepaper <player> <vip> <duration> and contain NBT data
# that allows them to be activated by right-clicking. The VIP is granted with the
# specified duration and the paper is consumed.
paper-vip:
  blacklist: [ "ajudante", "moderador", "yt", "miniyt", "tiktoker", "streamer", "investidor" ]
  display: '{color}Papel &lVIP {vip}'
  lore:
  - '&fDuração: &7{duration}'
  - ''
  - '{color}Clique para resgatar!'
