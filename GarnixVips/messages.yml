  player-not-found: '&cO jogador &f{player} &cnão foi encontrado online.'

admin:
  help:
  - ''
  - '  &e&lVIPS &8- &fComandos administrativos'
  - ''
  - '  &e/vip add <jogador> <vip> <duração> &8- &7Concede um VIP.'
  - '  &e/vip remove <jogador> <vip> [duração] &8- &7Remove um VIP (ou parte do tempo).'
  - '  &e/vip info <jogador> &8- &7Mostra os VIPs de um jogador.'
  - '  &e/vip genkey <vip> <duração> &8- &7Gera uma chave de VIP.'
  - '  &e/vip listkeys &8- &7Lista todas as chaves criadas.'
  - '  &e/vip delkey <chave> &8- &7Apaga uma chave.'
  - '  &e/vip listvips &8- &7Abre o menu de jogadores com VIP.'
  - '  &e/vip givepaper <jogador> <vip> <duração> [quantidade] &8- &7Dá um papel VIP clicável.'
  - '  &e/vip freeze &8- &7Congela o tempo de todos os VIPs. &8(console)'
  - '  &e/vip unfreeze &8- &7Descongela o tempo de todos os VIPs. &8(console)'
  - '  &e/vip reload &8- &7Recarrega configs, mensagens e VIPs.'
  - ''

