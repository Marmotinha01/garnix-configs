order: 2

# false = não aparece no menu de shop e não pode ser comprada.
# A máquina continua funcional: só é obtida via /maquina give.
shop: true

delay: 10s

translated: "Pedra"
display: '&eMáquina de {translated}'

texture: ""

# Máquina B libera no dia 6 da temporada.
# ⚠️ A data-base é placeholder — o dono define a data real do lançamento.
release: "12/08/2026 20:00"

rank: '&e[Rank 11]'

# ⚠️ Gate autoritativo. Concedida em GarnixRankUP/ranks/*.yml -> commands do rank 11.
buy-permission: machines.buy.pedra

block:
  material: STONE
  data: 0

# 'default' e 'infinite' são os únicos combustíveis que existem em fuels.yml.
# (Os arquivos antigos listavam 'coal' e 'blaze', que não existem.)
fuels:
- default
- infinite

machine-item:
  material: STONE
  data: 0
  display: '&aMáquina de {translated}'
  lore:
  - '&7Produz sozinha dentro'
  - '&7do seu terreno.'
  - ''
  - '&8 ▪ &fQuantia: &7{amount} '
  - ''
  - '&aColoque no seu terreno.'

costs:
  coins: '11100000'

# ⚠️ 'chance' aqui é FRAÇÃO 0.0-1.0 (MachineDrop.java:40), não porcentagem.
# Convenção OPOSTA à dos spawners, que usam 0-100. Escrever 5 aqui significa
# "sempre", não "5%".
drops:
  coins:
    type: CURRENCY
    currency-id: coins
    chance: 1.0
    amount: '793'
