- default
- infinite

machine-item:
  material: STAINED_CLAY
  data: 11
  display: '&aMáquina de {translated}'
  lore:
  - '&7Rende drops sozinha no'
  - '&7terreno, dia e noite.'
  - ''
  - '&8 ▪ &fQuantia: &7x{amount} '
  - ''
  - '&aColoque no seu terreno.'

costs:
  coins: '14600000000000000'

# ⚠️ 'chance' aqui é FRAÇÃO 0.0-1.0 (MachineDrop.java:40), não porcentagem.
# Convenção OPOSTA à dos spawners, que usam 0-100. Escrever 5 aqui significa
# "sempre", não "5%".
drops:
  coins:
    type: CURRENCY
    currency-id: coins
    chance: 1.0
    amount: '229000000000'
