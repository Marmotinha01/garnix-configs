# GarnixFarm — Tipos de farm (progressão só avança, nunca volta).
#
# A ORDEM É A DESTE ARQUIVO. A primeira chave abaixo é o tipo inicial, e cada chave
# seguinte é o próximo degrau. Adicionar plantação é editar aqui — não existe mais lista
# fixa no código (o GarnixFarm.FARM_TYPES sobrou só como socorro se este bloco sumir).
#
# É UMA ÁREA SÓ: o tipo muda só QUAL cultura o jogador vê/colhe (render por-jogador).
# Um /fazenda scan <raio> registra as posições e /fazenda setspawn define o spawn.
#
# crop: WHEAT | SUNFLOWER | CARROT | POTATO | COTTON | NETHER_WART
#
#   ⚠️ SUNFLOWER e COTTON são o MESMO bloco (DOUBLE_PLANT) e se comportam ao contrário
#   um do outro. O 1.8 guarda a variante só na metade DE BAIXO; uma metade de cima
#   sozinha é decodificada como um sentinela fixo e o cliente sempre a desenha como
#   PEÔNIA (a variante real só é recuperada lendo o bloco de baixo, que aqui é farmland).
#
#   SUNFLOWER  -> 2 blocos: metade de baixo na célula + metade de cima logo acima.
#                 É a única forma de existir girassol. O plugin pinta e limpa os dois
#                 sozinho, e o clique no bloco de cima é normalizado para a célula.
#   COTTON     -> 1 bloco: a metade de cima sozinha, ou seja, a peônia — de propósito.
#                 A flor do algodoeiro abre branca e vira rosa-roxa antes do capulho,
#                 então a textura combina com o nome em vez de brigar com ele.
#
# exp: XP de fazenda ganho por plantação colhida deste tipo (alimenta o nível; a curva
#   de XP por nível fica em levels.yml). Boostável pelo provider "xp".
# currencies.primary / secondary: pagamento por colheita (o primeiro tipo é o inicial,
#   sem upgrade).
#
# upgrade (evoluir PARA este tipo) — o PREÇO É O ÚNICO REQUISITO:
#   cost / currency:                     preço em coins.
#   secondary-cost / secondary-currency: preço em sementes.
#   Os dois lados são independentes e qualquer um pode ser 0 (a linha some da lore).
#
# ⚠️ NÃO EXISTE REQUISITO DE NÍVEL NEM DE COLHEITAS. O bloco 'require' continua lido
# pelo plugin (level / crops / crop-type / permission), mas nenhuma plantação usa: quem
# trava a evolução é o preço. Se algum dia voltar a usar, o requisito que NÃO for usar
# deve ser REMOVIDO (linha fora, não vazia).
#
# -- De onde saem os valores (recalibrado em 07/08/2026, 6 plantações) -------------
#
# Ver GARNIX - REORGANIZAÇÃO DA ECO/fazenda-pesca.md. Resumo:
#
# PRIMÁRIA (coins). O pagamento é `primary x payout-multiplier(nível)`. O multiplicador
# do levels.yml é UMA CURVA CONTÍNUA de 0 a 300 — não reseta. Ele sobe 1,5% por nível e
# dá um salto de x3,0611 a cada múltiplo de 15, MENOS nos níveis 45, 105, 150, 195 e
# 255: nessas cinco costuras o salto não vem da curva, vem da COMPRA DA PLANTAÇÃO.
#
#   trigo x1 · girassol x3,0611 · cenoura ^2 · batata ^3 · algodão ^4 · fungo ^5
#
# Comprar plantação e subir 15 níveis valem exatamente o mesmo degrau. São 20 degraus na
# temporada, 5 deles comprados — foi assim que o requisito de nível pôde sair. As duas
# escadas MULTIPLICAM em vez de resetar: quem comprar as 5 plantações no nível 0 rende
# 269x um trigo nível 0, que é exatamente o que as 5 compras valem, e continua sendo uma
# fração ínfima do que a mesma planta rende no nível certo.
#
# SECUNDÁRIA (sementes) = linear no nível de ancoragem, 1,80 + 0,11306 x nível. Os
# extremos (1,80 no trigo e 30,63 no fungo) são os mesmos desde a grade de 06/08 — a
# renda total de sementes da temporada não mudou, só ganhou degraus no meio.
#
# A secundária NÃO leva o payout-multiplier (é linear por projeto, como as gemas da
# mina), então estes seis números são o valor final antes da Fertilidade.
#
# CUSTO EM COINS = 10% da casa/dia no tier de ancoragem (tier = nível / 15).
#
# CUSTO EM SEMENTES = fatia do orçamento de encantamento (3,333e9 sementes para maxar os
# 10 encantes). As cinco evoluções somam 15%: 0,0045 / 0,50 / 1,5 / 4,0 / 9,0 %.
#
# ⚠️ A PRIMEIRA EVOLUÇÃO NÃO CUSTA COINS DE PROPÓSITO. Coins entram por spawner, máquina
# e cacto — se o girassol custasse coins, dava para evoluir sem nunca ter colhido. Só
# sementes, e sementes só saem da fazenda.
#
# Tokens de currency na lore do ícone (pagamento por colheita):
#   {primary_symbol_color}{primary_symbol}{primary_color}{primary_value}{primary_currency}
#   {secondary_*} idem.  ({*_currency} = nome da moeda no plural.)

