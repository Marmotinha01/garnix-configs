# GarnixFarm — Tipos de farm (progressão só avança, nunca volta).
#
# Ordem fixa no código (GarnixFarm.FARM_TYPES): trigo -> cenoura -> batata -> fungo.
# É UMA ÁREA SÓ: o tipo muda só QUAL cultura o jogador vê/colhe (render por-jogador).
# Um /fazenda scan <raio> registra as posições e /fazenda setspawn define o spawn.
#
# crop: WHEAT | CARROT | POTATO | NETHER_WART
# exp: XP de fazenda ganho por plantação colhida deste tipo (alimenta o nível; a curva
#   de XP por nível fica em levels.yml). Boostável pelo provider "xp".
# currencies.primary / secondary: pagamento por colheita (o primeiro tipo é o inicial,
#   sem upgrade/require).
#
# upgrade (evoluir PARA este tipo):
#   cost / currency: preço.  (cost 0 = grátis; a linha de custo some da lore.)
# require (requisito além do custo). O requisito que NÃO for usar: REMOVA a linha (não
#   deixe vazia). Sem nenhum requisito, remova o bloco 'require' inteiro.
#   level:      nível de fazenda mínimo. Remova a linha se não exigir nível.
#   crops:      quantas colheitas são necessárias.
#   crop-type:  de QUAL tipo contam essas colheitas — OBRIGATÓRIO quando há 'crops'.
#               A contagem é POR TIPO, não a soma geral (o total geral fica no
#               ranking/estatísticas). Ex.: cenoura conta trigo; batata conta cenoura.
#   permission:         node checado — NUNCA aparece pro jogador. Remova se não usar.
#   permission-display: rótulo amigável na lore (ex. "&6VIP+"). Remova se não usar.
#               Ex.: permission "grupo.vip" + permission-display "&6VIP+".
#
# -- De onde saem os valores de currencies (calibrado contra o GarnixMining) --------
#
# PRIMÁRIA (coins) = curva de coins da mina no nível de desbloqueio da plantação,
# multiplicada por 2,1933. O fator parece alto e não é: o que importa é coins por
# HORA, não por colheita, e a fazenda dispara 3x menos eventos por ação que a mina.
#
#   mina     2,64e13/bloco    x 112,2 blocos por quebra manual = 2,96e15 por ação
#   fazenda  5,79e13/colheita x  63,9 plantas por colheita      = 3,70e15 por ação
#
# O campo é 2D: não existe coluna vertical nem camada para explodir, então nenhum
# encantamento da fazenda chega perto da Aniquilação. Compensar isso no valor por
# evento é o que mantém os dois modos equivalentes — com o x1,25 "óbvio" a fazenda
# rendia 59% MENOS que a mina por hora, não 25% a mais.
#
# SECUNDÁRIA (sementes) = gemas da mina no mesmo nível, x1,4413. Mesma lógica: as
# sementes compram encantamento, e o que precisa empatar é quantas ações manuais
# custa maxar tudo. Com estes valores são 81.053 colheitas contra 81.053 quebras.
#
# A secundária NÃO leva o payout-multiplier do levels.yml (é linear por projeto,
# como as gemas), então estes quatro números são o valor final antes da Fertilidade.
#
# Tokens de currency na lore do ícone (pagamento por colheita):
#   {primary_symbol_color}{primary_symbol}{primary_color}{primary_value}{primary_currency}
#   {secondary_*} idem.  ({*_currency} = nome da moeda no plural.)

farms:
  trigo:
    display: '&eTrigo'
    crop: WHEAT
    exp: 1.0
    currencies:
      primary: 2.478
      secondary: 1.80
    icon:
      slot: 11
      material: WHEAT
      display: '&eTrigo'
      lore:
      - '&7O tipo inicial de fazenda.'
      - '&7Coins por colheita: {primary_symbol_color}{primary_symbol}{primary_color}{primary_value}'
      - '&7Sementes por colheita: {secondary_symbol_color}{secondary_symbol}{secondary_color}{secondary_value}'
  
  cenoura:
    display: '&6Cenoura'
    crop: CARROT
    exp: 3.0
    upgrade:
      cost: 10800000.0
      currency: coins
    require:
      level: 60
      crops: 1105000
      crop-type: trigo
    currencies:
      primary: 682.132
      secondary: 9.01
    icon:
      slot: 12
      material: CARROT_ITEM
      display: '&6Cenoura'
      lore:
      - '&7Coins por colheita: {primary_symbol_color}{primary_symbol}{primary_color}{primary_value}'
      - '&7Sementes por colheita: {secondary_symbol_color}{secondary_symbol}{secondary_color}{secondary_value}'
  
  batata:
    display: '&eBatata'
    crop: POTATO
    exp: 6.0
    upgrade:
      cost: 903000000000.0
      currency: coins
    require:
      level: 150
      crops: 5865000
      crop-type: cenoura
    currencies:
      primary: 3092622
      secondary: 19.82
    icon:
      slot: 13
      material: POTATO_ITEM
      display: '&eBatata'
      lore:
      - '&7Coins por colheita: {primary_symbol_color}{primary_symbol}{primary_color}{primary_value}'
      - '&7Sementes por colheita: {secondary_symbol_color}{secondary_symbol}{secondary_color}{secondary_value}'
  
  fungo:
    display: '&cFungo do Nether'
    crop: NETHER_WART
    exp: 12.0
    upgrade:
      cost: 11400000000000000.0
      currency: coins
    require:
      level: 240
      crops: 22066000
      crop-type: batata
    currencies:
      primary: 14103235067
      secondary: 30.63
    icon:
      slot: 14
      material: NETHER_STALK
      display: '&cFungo do Nether'
      lore:
      - '&7Coins por colheita: {primary_symbol_color}{primary_symbol}{primary_color}{primary_value}'
      - '&7Sementes por colheita: {secondary_symbol_color}{secondary_symbol}{secondary_color}{secondary_value}'
