# GarnixFarm — Tipos de farm (progressão só avança, nunca volta).
#
# A ORDEM É A DESTE ARQUIVO. A primeira chave abaixo é o tipo inicial, e cada chave
# seguinte é o próximo degrau. Adicionar plantação é editar aqui — não existe mais lista
# fixa no código (o GarnixFarm.FARM_TYPES sobrou só como socorro se este bloco sumir).
#
# É UMA ÁREA SÓ: o tipo muda só QUAL cultura o jogador vê/colhe (render por-jogador).
# Um /fazenda scan <raio> registra as posições e /fazenda setspawn define o spawn.
#
# crop: WHEAT | SUNFLOWER | CARROT | POTATO | NETHER_WART
#   SUNFLOWER é pintado como a METADE DE CIMA do girassol (DOUBLE_PLANT data 8), que é a
#   metade que tem a flor. Um bloco só: o girassol inteiro custaria dois block-changes
#   por célula e deixaria o campo com 2 blocos de altura, tapando a visão do próprio
#   jogador enquanto ele colhe.
# exp: XP de fazenda ganho por plantação colhida deste tipo (alimenta o nível; a curva
#   de XP por nível fica em levels.yml). Boostável pelo provider "xp".
# currencies.primary / secondary: pagamento por colheita (o primeiro tipo é o inicial,
#   sem upgrade).
#
# upgrade (evoluir PARA este tipo) — o PREÇO É O ÚNICO REQUISITO:
#   cost / currency:                     preço em coins.
#   secondary-cost / secondary-currency: preço em sementes.
#   Os dois lados são independentes e qualquer um pode ser 0 (a linha some da lore).
#
# ⚠️ NÃO EXISTE MAIS REQUISITO DE NÍVEL NEM DE COLHEITAS. O bloco 'require' continua
# lido pelo plugin (level / crops / crop-type / permission), mas nenhuma plantação usa:
# quem trava a evolução é o preço. Se algum dia voltar a usar, o requisito que NÃO for
# usar deve ser REMOVIDO (linha fora, não vazia).
#
# -- De onde saem os valores (recalibrado em 07/08/2026) ---------------------------
#
# Ver GARNIX - REORGANIZAÇÃO DA ECO/fazenda-pesca.md. Resumo:
#
# PRIMÁRIA (coins). O pagamento é `primary x payout-multiplier(nível)`. O multiplicador
# do levels.yml agora é UMA CURVA CONTÍNUA de 0 a 300 — não reseta mais. Ele sobe 1,5%
# por nível e dá um salto de x3,0634 a cada múltiplo de 15, MENOS nos níveis 60, 120,
# 180 e 240: nesses quatro o salto não vem da curva, vem da COMPRA DA PLANTAÇÃO.
#
#   trigo x1  ·  girassol x3,0634  ·  cenoura x3,0634^2  ·  batata ^3  ·  fungo ^4
#
# É por isso que o requisito de nível pôde sair. Antes o multiplicador resetava a 1 em
# cada troca de planta, então comprar cenoura no nível 0 dava 206x de renda antecipada.
# Agora as duas escadas MULTIPLICAM: comprar tudo no nível 0 rende 88x um trigo nível 0,
# e continua sendo uma fração ínfima do que a mesma planta rende no nível certo.
#
# SECUNDÁRIA (sementes) = linear no nível de ancoragem, 1,80 + 0,12012 x nível. Os
# extremos (1,80 no trigo e 30,63 no fungo) são os mesmos de antes — a renda total de
# sementes da temporada não mudou, só ganhou um degrau a mais no meio.
#
# A secundária NÃO leva o payout-multiplier (é linear por projeto, como as gemas da
# mina), então estes cinco números são o valor final antes da Fertilidade.
#
# CUSTO EM COINS = 10% da casa/dia no tier de ancoragem (tier = nível / 15). Os 10% são
# a régua que a cenoura e a batata já seguiam; o fungo estava em 1,5% e foi corrigido.
#
# CUSTO EM SEMENTES = fatia do orçamento de encantamento (3,333e9 sementes para maxar os
# 10 encantes). As quatro evoluções somam 15%: 0,0045% / 0,99% / 3,0% / 11,0%.
#
# ⚠️ A PRIMEIRA EVOLUÇÃO NÃO CUSTA COINS DE PROPÓSITO. Coins entram por spawner, máquina
# e cacto — se o girassol custasse coins, dava para evoluir sem nunca ter colhido. Só
# sementes, e sementes só saem da fazenda.
#
# Tokens de currency na lore do ícone (pagamento por colheita):
#   {primary_symbol_color}{primary_symbol}{primary_color}{primary_value}{primary_currency}
#   {secondary_*} idem.  ({*_currency} = nome da moeda no plural.)

farms:
  trigo:
    display: '&eTrigo'
    crop: WHEAT
    exp: 1.0
    currencies:
