# Botões do hotbar dentro da fazenda (slot = índice 0-8).
#
# Layout: 1 relatório · 3 enxada · 5 chaves · 7 sair.
# A enxada não fica aqui — o slot dela é o 'hoe-item.hotbar-slot' do config.yml.

# Chaves de fazenda guardadas. O tamanho da pilha acompanha a contagem e o item
# brilha enquanto houver pelo menos uma chave, então dá para ler o progresso sem
# abrir nada. Clique com o botão direito abre o menu da caixa (/crates), com abrir,
# retirar e o preview das recompensas.
#
# {keys} = a contagem REAL, e é ela que vale. A pilha é só um indicador grosseiro:
# satura em 64 e nunca desce abaixo de 1 (pilha de tamanho 0 não sobrevive no
# servidor). Com zero chaves o item mostra 1 e SEM brilho — quem diz "tem chave" é
# o brilho, não o número da pilha.
#
# A caixa aberta é a do 'key-id' do Trevo (enchants/clover.yml). Sem esse
# encantamento configurado o botão não aparece.
keys-icon:
  slot: 5
  material: TRIPWIRE_HOOK
  display: '&aChaves Farm'
  lore:
  - '&fQuantia: &ax&l{keys}'
  - ''
  - '&7Clique para gerenciar.'

# Toggle do relatório periódico (dois estados no mesmo slot).
report-enabled-icon:
  slot: 1
  material: INK_SACK
  data: 10
  display: '&aRelatório Ativado'
  lore:
  - '&7Clique para desativar.'

report-disabled-icon:
  slot: 1
  material: INK_SACK
  data: 8
  display: '&cRelatório Desativado'
  lore:
  - '&7Clique para ativar.'

exit-icon:
  slot: 7
  material: INK_SACK
  data: 1
  display: '&cSair da Fazenda'
  lore:
  - '&7Clique para sair.'
