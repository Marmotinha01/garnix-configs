# Botões do hotbar dentro da fazenda (slot = índice 0-8).

# Toggle do relatório periódico (dois estados no mesmo slot).
report-enabled-icon:
  slot: 1
  material: INK_SACK
  data: 10
  display: '&aRelatório Ativado'
  lore:
  - '&7Clique para desativar.'

report-disabled-icon:
  slot: 1
  material: INK_SACK
  data: 8
  display: '&cRelatório Desativado'
  lore:
  - '&7Clique para ativar.'

exit-icon:
  slot: 7
  material: INK_SACK
  data: 1
  display: '&cSair da Fazenda'
  lore:
  - '&7Clique para sair.'
