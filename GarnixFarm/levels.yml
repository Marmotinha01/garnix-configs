# GarnixFarm — Curva de XP dos níveis de fazenda.
#
# O XP por plantação colhida é definido POR TIPO em farms.yml (exp:). Esta curva diz
# quanto XP cada nível exige, por uma fórmula progressiva (sem listar nível a nível).
# xp(L) = XP para avançar do nível L-1 para o L.
#
# type: polynomial | geometric | linear
#   polynomial: xp(L) = base * L^growth        (growth = expoente, ~2.0–2.5)
#   geometric:  xp(L) = base * growth^(L-1)    (growth = fator ×/nível, ~1.06–1.10)
#   linear:     xp(L) = base + growth*(L-1)    (growth = passo/nível)

max-level: 300
formula:
  type: geometric
  base: 11992.1
  growth: 1.02216

# -- Escada de valor por nível (C2) -------------------------------------------
# Multiplicador aplicado ao pagamento da colheita, sobre `currencies.primary` de
# farms.yml. A chave é o NÍVEL em que o degrau passa a valer, e ele vale até o
# próximo declarado. Seção ausente = 1.0 sempre.
#
# Por que existe: o farm só tinha as plantações como degrau de pagamento — e são
# poucas por um teto da 1.8, não do config. Sem esta tabela não há onde guardar as
# ~16 ordens de grandeza que a curva de tiers pede, e do nível 50 ao 100 a fazenda
# não ganhava nada. É o mesmo padrão do GarnixMining/levels.yml, que reusa material
# com valor maior em vez de exigir 21 minérios.
#
# Só a moeda PRIMÁRIA leva o multiplicador. `sementes` fica linear de propósito,
# como as gemas na mineração.
#
# ⚠️ ESTA CURVA NÃO RESETA (mudou em 07/08/2026).
#
# Ela era serrote: subia dentro de um bloco e voltava a 1 a cada troca de plantação.
# Isso amarrava a plantação ao nível — e era o que obrigava a evolução a ter requisito
# de nível, já que comprar a cultura seguinte no nível 0 pegava o valor base novo com o
# multiplicador velho e antecipava 206x de renda.
#
# Agora ela é contínua de 0 a 300: +1,5% por nível, com um salto de x3,0611 a cada
# múltiplo de 15 — MENOS nos níveis 45, 105, 150, 195 e 255. Nessas cinco costuras o
# salto não está aqui: ele é a COMPRA DA PLANTAÇÃO, no farms.yml. Comprar planta e subir
# 15 níveis passaram a valer exatamente o mesmo degrau, e são 20 degraus na temporada,
# 5 deles comprados.
#
# As costuras saem de 300/6 = 50 níveis por faixa, cada fronteira arredondada ao
# múltiplo de 15 mais próximo: 45, 105, 150, 195, 255.
#
# Como as duas escadas MULTIPLICAM em vez de resetar, comprar tudo cedo não antecipa
# renda: o teto de quem comprar as 5 plantações no nível 0 é 269x um trigo nível 0, e
# 269x é exatamente o que as 5 compras valem — o nível continua valendo o resto.
#
# ⚠️ Quem for reescalar: rode as três conferências (nenhuma entrada abaixo de 1, nenhuma
# quebra de monotonia, extremo do nível 300 preservado). Uma versão antiga desta escada
# produziu um degrau de 0,82 — subir de nível fazia ganhar MENOS, e é o tipo de erro que
# teste de banda não pega, porque as pontas fechavam. E cuidado com awk: `"150" < "60"`
# é verdadeiro em string, force `lvl = lvl + 0` antes de comparar.
