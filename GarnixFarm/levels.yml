# GarnixFarm — Curva de XP dos níveis de fazenda.
#
# O XP por plantação colhida é definido POR TIPO em farms.yml (exp:). Esta curva diz
# quanto XP cada nível exige, por uma fórmula progressiva (sem listar nível a nível).
# xp(L) = XP para avançar do nível L-1 para o L.
#
# type: polynomial | geometric | linear
#   polynomial: xp(L) = base * L^growth        (growth = expoente, ~2.0–2.5)
#   geometric:  xp(L) = base * growth^(L-1)    (growth = fator ×/nível, ~1.06–1.10)
#   linear:     xp(L) = base + growth*(L-1)    (growth = passo/nível)

max-level: 300
formula:
  type: geometric
  base: 11992.1
  growth: 1.02216

# -- Escada de valor por nível (C2) -------------------------------------------
# Multiplicador aplicado ao pagamento da colheita, sobre `currencies.primary` de
# farms.yml. A chave é o NÍVEL em que o degrau passa a valer, e ele vale até o
# próximo declarado. Seção ausente = 1.0 sempre.
#
# Por que existe: o farm só tinha os 4 tipos de plantação como degrau de
# pagamento — e são 4 por um teto da 1.8, não do config. Sem esta tabela não há
# onde guardar as ~16 ordens de grandeza que a curva de tiers pede, e do nível 50
# ao 100 a fazenda não ganhava nada. É o mesmo padrão do GarnixMining/levels.yml,
# que reusa material com valor maior em vez de exigir 21 minérios.
#
# Só a moeda PRIMÁRIA leva o multiplicador. `sementes` fica linear de propósito,
# como as gemas na mineração.
#
# A escada anda de 15 em 15 níveis (x4,0885 acumulado, o mesmo passo da mina) mas é
# declarada nível a nível, com +2% por nível entre os degraus. Sem isso o jogador
# subia 14 níveis sem ver um coin a mais e levava o salto inteiro no 15º.
#
# Esta tabela é a curva de coins do GarnixMining PURA — o fator que põe a fazenda
# acima da mina mora no valor base de cada plantação, no farms.yml. Ver o cabeçalho
# de lá para o porquê do x3,7857 (resumo: a fazenda dispara 3x menos eventos por
# ação, então +25% por hora exige bem mais que +25% por colheita).
#
# O reset a 1 nos níveis 60, 150 e 240 acompanha a troca de plantação — o valor base
# da nova cultura dá o salto, e o multiplicador recomeça. Conferido: nenhuma das três
# trocas é rebaixamento.
