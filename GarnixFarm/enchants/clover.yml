display: "Trevo"
farm-level-unlock: 0

max-level: 500
# Cópia exata do Abençoado do Mining: a chave tem que ser igualmente fácil nos dois
# modos, senão um deles vira o único caminho de caixa que vale a pena.
base-cost: 1000
increase-cost: 18.75

# CHANCE flavour (percent)
# 0,02% no nível 1 e 10,00% no 500, andando 0,02 por nível — os mesmos dois números do
# Abençoado do Mining, de propósito. O passo de duas casas é o pedido: todo nível cai
# numa decimal limpa (0,02 → 0,04 → 0,06) em vez de 0,1038076.
#
# Rola em TODA planta colhida, inclusive as de área, então o ritmo real é este vezes
# quantas plantas os encantamentos derrubam por minuto. Com tudo maxado a enxada colhe
# ~64 plantas por colheita manual, então 10% viram ~6.400 chaves a cada 1.000 colheitas.
#
# Mexeu aqui, mexa no blessed.yml do GarnixMining junto.
base-chance: 0.02
increase-chance: 0.02
# ⚠️ `farm`, nao `fazenda`. O CrateManager tira o id da crate do NOME DO ARQUIVO
# (`CrateManager:156`), e o arquivo e `GarnixCrates/crates/farm.yml`. Apontando para
# "fazenda" o encante rodava e nao entregava chave nenhuma, em silencio — e o clover
# e o faucet de chave da fazenda inteira (~1.000/dia no orcamento da Fase 5).
key-id: "farm"

# As chaves são creditadas em lote a cada tique do relatório.
#
# Este encantamento não tem 'messages', 'title' nem 'subtitle' de propósito: quem
# anuncia as chaves é o relatório da fazenda, na linha de encantamentos ativados
# (uma ativação = uma chave). Não recolocar — seria o mesmo aviso duas vezes, e o
# título genérico formata {crops}/{coins}, então um {count} aqui sairia literal.

icon:
  slot: 14
  texture: "ac92e5111ea7d7eb3f055833e1f35d651c0da55643c9383e0bce6c23696d58b9"
  display: "&a{display}"
  lore:
    - "&7Chance de achar chaves de"
    - "&7fazenda enquanto você colhe."
    - ""
    - "&fNível: &a{level}&8/&c{max-level}"
    - "&fChance: &7{chance}%"
