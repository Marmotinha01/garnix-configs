display: "Trevo"
max-level: 500
base-cost: 1952
increase-cost: 780.6

# CHANCE flavour (percent)
base-chance: 0.0000815
increase-chance: 0.0000815
# ⚠️ `farm`, nao `fazenda`. O CrateManager tira o id da crate do NOME DO ARQUIVO
# (`CrateManager:156`), e o arquivo e `GarnixCrates/crates/farm.yml`. Apontando para
# "fazenda" o encante rodava e nao entregava chave nenhuma, em silencio — e o clover
# e o faucet de chave da fazenda inteira (~1.000/dia no orcamento da Fase 5).
key-id: "farm"

# Anunciado no flush em lote (a cada 30s), tokens {count} / {enchant}.
stacked-messages:
  - "&a&lTREVO! &fVocê encontrou &7x{count} &fchave(s) de fazenda!"
  - "&7Chaves colhidas nos últimos 30s."

title: "&a&lTREVO!"
subtitle: "&fx{count} chave(s) encontrada(s)"

icon:
  slot: 17
  material: DOUBLE_PLANT
  display: "&a{display}"
  lore:
    - "&7Chance de encontrar chaves de"
    - "&7fazenda enquanto colhe."
    - ""
    - "&fNível: &a{level}&8/&c{max-level}"
    - "&fChance: &7{chance}%"
