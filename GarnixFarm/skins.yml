# GarnixFarm — Skins da enxada. A skin muda o material da enxada e pode dar bônus.
#
# Cada skin declara:
#   display   — nome colorido
#   material  — material visual da enxada dentro da fazenda
#   forgeable — true = 7 desta skin forjam a PRÓXIMA declarada abaixo
#   icon      — ícone do menu
#   bonuses   — bônus por provider (value + percent)
#
# ── LADDER DA TEMPORADA ──────────────────────────────────────────────
# Ordem de raridade (a ordem DESTE arquivo é a ordem da forja):
#   Madeira · Pedra · Ferro · Ouro · Diamante · Âmbar · Esmeralda ·
#   Cristal · Marfim
#
# A forja (7 skins iguais) sobe de Pedra até Esmeralda. Cristal e Marfim
# têm forgeable: false e só saem de caixa (marcadas com glow no menu).
# ─────────────────────────────────────────────────────────────────────

unlock-lore:
- ''
- '&aClique para desbloquear.'

bonus-format: " &8 ▪ &f{Display}: &a+&l{value}&a{unit} "

skins:
  default:
    display: '&eMadeira'
    material: WOOD_HOE
    forgeable: false
    icon:
      material: WOOD_HOE
      display: '&eSkin de Madeira'
      lore:
      - ''
      - '&8 ▾ &cSem bônus. '
      flags:
      - HIDE_ATTRIBUTES

  pedra:
    display: '&8Pedra'
    material: STONE_HOE
    forgeable: true
    icon:
      material: STONE_HOE
      display: '&8Skin de Pedra'
      lore:
      - ''
      - ' &8Especificações:'
      - '{bonus}'
      flags:
      - HIDE_ATTRIBUTES
    bonuses:
      coins:
        value: 2.0
        percent: true
      sementes:
        value: 1.0
        percent: true

