# GarnixFarm — Skins da enxada. A skin muda o material da enxada e pode dar bônus.

unlock-lore:
  - ""
  - "&aClique para desbloquear."

bonus-format: "  &8► {color}+{value}{unit} {display}"

skins:
  default:
    display: "&fSkin de Madeira"
    material: WOOD_HOE
    icon:
      material: WOOD_HOE
      display: "&fSkin de Madeira"
      lore:
        - ""
        - " &8 ▾ &cSem bônus. "
        - ""

  ferro:
    display: "&7Skin de Ferro"
    material: IRON_HOE
    forgeable: true
    icon:
      material: IRON_HOE
      display: "&7Skin de Ferro"
      lore:
        - ""
        - " &fBônus: "
        - "{bonus}"
        - ""
    bonuses:
      coins:
        value: 5
        percent: true

  ouro:
    display: "&6Skin de Ouro"
    material: GOLD_HOE
    forgeable: true
    icon:
      material: GOLD_HOE
      display: "&6Skin de Ouro"
      lore:
        - ""
        - " &fBônus: "
        - "{bonus}"
        - ""
    bonuses:
      coins:
        value: 10
        percent: true

  diamante:
    display: "&bSkin de Diamante"
    material: DIAMOND_HOE
    icon:
      material: DIAMOND_HOE
      display: "&bSkin de Diamante"
      lore:
        - ""
        - " &fBônus: "
        - "{bonus}"
        - ""
    bonuses:
      coins:
        value: 15
        percent: true
