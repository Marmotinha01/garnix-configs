# GarnixFarm — Skins da enxada. A skin muda o material da enxada e pode dar bônus.
#
# Cada skin declara:
#   display   — nome colorido
#   material  — material visual da enxada dentro da fazenda
#   forgeable — true = 7 desta skin forjam a PRÓXIMA declarada abaixo
#   icon      — ícone do menu
#   bonuses   — bônus por provider (value + percent)
#
# -- MESMO PERCENTUAL PARA TODA MOEDA ---------------------------------
# Toda skin dá o MESMO percentual em coins, sementes e XP. É o que permite a
# actionbar e a scoreboard mostrarem um número só de bônus ({bonus} e
# %farm_bonus%) que fecha com o que está escrito aqui. Se um dia as moedas forem
# diferenciadas, esse número passa a ser só o da moeda escolhida em
# config.yml → bonus-display-provider, e a conta deixa de fechar para as outras.
# A ladder é 2 · 5 · 9 · 14 · 20 · 28 · 38 · 50 · 65, igual à de Mining e Pesca.
#
# -- LADDER DA TEMPORADA ----------------------------------------------
# Ordem de raridade (a ordem DESTE arquivo é a ordem da forja):
#   Madeira · Pedra · Ferro · Ouro · Diamante · Âmbar · Esmeralda ·
#   Cristal · Marfim
#
# A forja (7 skins iguais) sobe de Pedra até Esmeralda. Cristal e Marfim
# têm forgeable: false e só saem de caixa (marcadas com glow no menu).
# ---------------------------------------------------------------------

unlock-lore:
- '&aClique para desbloquear.'

bonus-format: "&8 ▪ &a+&l{value}&a{unit} {primary_color}{Display} "

skins:
  default:
    display: '&eMadeira'
    material: WOOD_HOE
    forgeable: false
    icon:
      material: WOOD_HOE
      display: '&eSkin de Madeira'
      lore:
      - ''
      - '&8 ▾ &cSem bônus. '
      flags:
      - HIDE_ATTRIBUTES

  pedra:
    display: '&7Pedra'
    material: STONE_HOE
    forgeable: true
    icon:
      material: STONE_HOE
      display: '&7Skin de Pedra'
      lore:
      - ''
      - ' &8Especificações: '
      - '{bonus}'
      - ''
      flags:
      - HIDE_ATTRIBUTES
    bonuses:
      coins:
        value: 2.0
        percent: true
      sementes:
        value: 2.0
        percent: true
      xp:
        value: 2.0
        percent: true

