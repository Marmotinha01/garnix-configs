# Status anexado ao ícone de cada plantação (listas de lore).
status-current:
- ''
- '&aEsta é a plantação atual.'
status-done:
- ''
- '&8Plantação já desbloqueada.'
status-locked:
- ''
- '&cPlantação ainda bloqueada.'
# Próxima plantação: clicável para comprar (evolução one-way).
# {requirements} vira uma linha por requisito ATIVO, montada dos templates de
# requirement-entries abaixo (só entra o que se aplica; sem requisito nenhum, some).
status-next:
- ''
- ' &8Requisitos da evolução:'
- '{requirements}'
- ''
- '&aClique para desbloquear.'

# Um template por tipo de requisito. Entram só quando o requisito existe:
#   currency           -> só se upgrade.cost > 0.  {cost} = valor em coins.
#   secondary-currency -> só se upgrade.secondary-cost > 0.  {cost} = valor em sementes.
#                         Cada uma das duas resolve os tokens de moeda na SUA moeda:
#                         {symbol_color}{symbol}{primary_color}{currency} (singular/plural
#                         pelo valor).
#   level      -> só se require.level > 0.  {require-level} = nível exigido.
#   crops      -> só se require.crops > 0.  {require-crops} = qtd; {require-crop} = cultura.
#   permission -> só se houver permission-display (o node NUNCA aparece).  {permission-display}
#
# A progressão que vem no farms.yml usa só as duas primeiras: o preço é o requisito
# inteiro. As outras três continuam aqui porque o plugin ainda as lê — se algum dia
# voltar um gate de nível ou de colheitas, o template já está pronto.
requirement-entries:
  currency: '&8 ▪ {symbol_color}{symbol}{primary_color}{cost} {currency} '
  secondary-currency: '&8 ▪ {symbol_color}{symbol}{primary_color}{cost} {currency} '
  level: '&8 ▪ &7Nível &f{require-level}&f de fazenda '
  crops: '&8 ▪ &cx&l{require-crops}&r {require-crop} &fcolhidos '
  permission: '&8 ▪ {permission-display} '
