  texture: 7437346d8bda78d525d19f540a95e4e79daeda795cbc5a13256236312cf
  display: '&cVoltar'
  lore:
  - '&7Clique para voltar.'

# Status anexado ao ícone de cada plantação (listas de lore).
status-current:
- ''
- '&aPlantação atual'
status-done:
- ''
- '&8Já desbloqueada'
status-locked:
- ''
- '&cBloqueada'
# Próxima plantação: clicável para comprar (evolução one-way).
# {requirements} vira uma linha por requisito ATIVO, montada dos templates de
# requirement-entries abaixo (só entra o que se aplica; sem requisito nenhum, some).
status-next:
- ''
- ' &8Requisitos da evolução:'
- '{requirements}'
- ''
- '&aClique para desbloquear!'

# Um template por tipo de requisito. Entram só quando o requisito existe:
#   level     -> só se require.level > 0.  {require-level} = nível exigido.
#   currency  -> só se cost > 0.  {cost} = valor; moeda (singular/plural pelo valor):
#                {symbol_color}{symbol}{primary_color}{currency}
#   crops     -> só se require.crops > 0.  {require-crops} = qtd; {require-crop} = cultura.
#   permission-> só se houver permission-display (o node NUNCA aparece).  {permission-display}
requirement-entries:
  level: ' &8▪ &7Nível &f{require-level}&7 de fazenda'
  currency: ' &8▪ {symbol_color}{symbol}{primary_color}{cost} &7{currency}'
  crops: ' &8▪ &7x{require-crops} {require-crop} &7colhidos'
  permission: ' &8▪ {permission-display}'
