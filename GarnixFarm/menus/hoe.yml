# Menu — Gerenciar Enxada (abre com Shift + Botão-direito na enxada)

title: Gerenciar Enxada
rows: 6

# Ícone de skins (animado pelos materiais da enxada) — abre a galeria de skins.
skins-icon:
  slot: 48
  materials:
  - WOOD_HOE
  - STONE_HOE
  - IRON_HOE
  - GOLD_HOE
  - DIAMOND_HOE
  interval: 20
  display: '&eSkins de Enxada'
  lore:
  - '&7Ganhe bônus especiais ao'
  - '&7trocar a skin da enxada.'
  - ''
  - '&eClique para gerenciar.'
  flags:
  - HIDE_ATTRIBUTES

# Cabeça do jogador com o saldo e o total colhido.
info-icon:
  slot: 50
  display: '&aSuas Informações'
  lore:
  - '&7Seu saldo e o total de'
  - '&7culturas que você colheu.'
  - ''
  - '&8 ▪ &fSementes: {symbol_color}{symbol}{primary_color}{sementes} '
  - '&8 ▪ &fColhidas: &7{crops} '
  - ''

# Anexado ao ícone de cada encantamento (abaixo do máximo).
enchant-lore:
- ''
- '&aClique para gerenciar.'

# Anexado ao ícone de um encantamento já no nível máximo.
maxed-enchant-lore:
- ''
- ' &8 ▾ &cNível máximo atingido.'
- ''
- '&aClique para gerenciar.'
