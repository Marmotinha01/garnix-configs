# -- Leitura do {total} -------------------------------------------------
# O {total} e a quantia REAL que o correio entrega, somando todas as linhas
# agrupadas naquele icone. Como o mesmo numero significa coisas diferentes,
# muda o simbolo na frente dele E o jeito de escrever o numero:
#
#   chaves, itens  ▶  x165      (quantia de itens, sempre por extenso)
#   moedas         ▶  $1K       (valor — simbolo E formato vem da moeda)
#   limites        ▶  ∞1.500    (valor — simbolo vem do command-totals abaixo)
#
# O formato do numero das MOEDAS sai do 'formatter' da moeda no GarnixCurrencies
# (SUFFIX escreve 1K, DECIMAL escreve 1.000) — nao tem nada para configurar aqui.
# Item e comando sao contagem, e contagem se le por extenso: 1.000 chaves, nunca
# 1K chaves.

# Usado quando nao e moeda e nao casa em nenhum command-totals.
default-total:
  symbol: 'x'
  symbol-color: '&a'
  primary-color: '&a'

# Comandos cujo {total} e um VALOR, nao uma quantia de itens.
# Os limites entram aqui porque a caixa da o ITEM de limite por comando, e nao
# um deposito de saldo — entao nem maquinas e spawners, que sao moedas de
# verdade, seriam reconhecidos sozinhos. A cor acompanha a lore da recompensa.
# A chave casa com o COMECO do comando; a primeira que casar vence.
command-totals:
  'armazem givelimititem':
    symbol: '∞'
    symbol-color: '&2'
    primary-color: '&2'
  'maquina givelimite':
    symbol: '∞'
    symbol-color: '&9'
    primary-color: '&9'
  'spawner givelimite':
    symbol: '∞'
    symbol-color: '&b'
    primary-color: '&b'

mail-lore:
- ''
- '&8 ▪ &fTotal: {symbol_color}{symbol}{primary_color}{total} '
- '&8 ▪ &fRemetente: &7{sender} '
- '&8 ▪ &fData: &7{date} '
- ''
- '&aClique para resgatar.'
