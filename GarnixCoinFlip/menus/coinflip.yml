# Lore de cada desafio. O item é a cabeça do criador.
challenge-lore:
- ''
- ' &8 ▪ &fAposta: {currency_prefix}{amount} '
- ' &8 ▪ &fExpira em: &c{time_remaining} '
- '{tax_info}'
- ''
- '{action}'

action-accept: '&aClique para aceitar.'
action-own: '&cEste desafio é seu.'

# A linha {tax_info}, que sempre diz se uma vitória sua paga taxa. A taxa incide
# só sobre o lucro — a sua aposta volta inteira de qualquer jeito. {net} é o
# lucro líquido e {tax} é a alíquota. Nos desafios dos outros mostra o que VOCÊ
# pagaria ao aceitar; no seu, a alíquota travada quando você criou.
tax-free: ' &8 ▪ &fTaxa: &aIsento '
tax-charged: ' &8 ▪ &fTaxa: &c&l{tax}&c% '