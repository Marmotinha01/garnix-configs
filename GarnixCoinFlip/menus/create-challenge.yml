title: Criar Desafio
rows: 4

# O ícone da economia vem do próprio GarnixCurrencies — só a lore é definida aqui.
currency-icon:
  slot: 11
  lore:
  - '&eClique para alterar.'

amount-icon:
  slot: 15
  material: GOLD_INGOT
  display: '&aValor da Aposta'
  unselected-lore:
  - '&7Defina quanto cada lado'
  - '&7arrisca neste desafio.'
  - ''
  - '&aClique para definir.'
  selected-lore:
  - '&7Defina quanto cada lado'
  - '&7arrisca neste desafio.'
  - ''
  - '&8 ▪ &fAtual: {currency_prefix}{amount} '
  - ''
  - '&aClique para alterar.'

confirm-icon:
  slot: 32
  material: STAINED_GLASS_PANE
  data: 5
  display: '&aCriar Desafio'
  lore:
  - '&7Publica o desafio para'
  - '&7qualquer um aceitar.'
  - ''
  - '{tax_info}'
  - ''
  - '&aClique para criar.'

# A linha {tax_info}, que sempre diz se uma vitória sua paga taxa — a alíquota é
# travada neste clique. A taxa incide só sobre o lucro: a sua aposta volta
# inteira de qualquer jeito. {net} é o lucro líquido e {tax} é a alíquota.
tax-free: '&8 ▪ &fTaxa: &aIsento '
tax-charged: '&8 ▪ &fTaxa: &c&l{tax}&c% '

no-amount-icon:
  slot: 32
  material: STAINED_GLASS_PANE
  data: 14
  display: '&cCriar Desafio'
  lore:
  - '&7Defina o valor da aposta'
  - '&7para poder confirmar.'

back-icon:
  slot: 30
  texture: '7437346d8bda78d525d19f540a95e4e79daeda795cbc5a13256236312cf'
  display: '&eVoltar'
  lore:
  - '&7Clique para voltar.'
