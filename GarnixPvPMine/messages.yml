  no-altar-location: '&cLocal do altar não definido. Use &f/mpvp setaltar&c.'
  altar-spawned: '&aAltar invocado.'
  altar-already-up: '&cJá existe um altar de pé.'
  altar-removed: '&aAltar removido.'
  altar-status: '&eAltar: {state}'
  rewards-saved: '&aRecompensas salvas &7(&f{items} &7itens)&a.'
  chance-updated: '&aChance: &f{chance}%'

  status-idle: '&aparada'
  status-running: '&een andamento &e({progress}%)'
  status-timer-off: '&cdesligado'
  status-domination-idle: '&cninguém dominando'
  status-domination-claiming: '{clan} &fdominando &e({percent}%)'
  status-domination-dominated: '{clan} &fdominou &a({time} restantes)'
