# Broadcasts da dominação. {clan} {percent} {hp} {player} {duration} {multiplier}
# {clan} é a TAG colorida do clan — a cor dela vale até o próximo código, então
# reponha a cor logo depois. Lista vazia desliga o aviso.
domination:
  progress:
  - ''
  - '  &4&lMINA PVP &7(/minapvp)'
  - '  {clan} &cestá dominando a Mina PVP! &8(&e&l{percent}&e%&8)'
  - ''
  - '  &fAo concluir terão ganhos e chances &a&ldobrados&f.'
  - ''

  progress-altar:
  - ''
  - '  &4&lMINA PVP &7(/minapvp)'
  - '  {clan} &cestá dominando a Mina PVP! &8(&e&l{percent}&e%&8)'
  - ''
  - '  &fO altar permanece vivo com &4❤{hp}&f.'
  - ''

  altar-spawned:
  - ''
  - '  &d&lALTAR &7(/minapvp)'
  - '  &fO altar surgiu com &4❤{hp} &fdurante a dominação do clan &7[{clan}&7]&f!'
  - ''
  - '  &eQualquer jogador pode atacá-lo.'
  - ''

  # Disparado ao cruzar cada % de altar.broadcast-at-percent.
  # {threshold} é a % que acabou de cair.
  altar-damaged:
  - ''
  - '  &d&lALTAR &7(/minapvp)'
  - '  &fO altar caiu para &c&l{percent}&c% &8(&4❤{hp}&8)'
  - ''
  - '  &fÚltimo golpe de &e{player}&f.'
  - ''

  altar-killed:
  - ''
  - '  &d&lALTAR &7(/minapvp)'
  - '  &e{player} &fdestruiu o altar e levou as &a&lrecompensas&f!'
  - ''

  completed:
  - ''
  - '  &a&lMINA PVP &7(/minapvp)'
  - '  &fO clan &7[{clan}&7] &cdominou a Mina PVP!'
  - ''
  - '  &fGanhos e chances &a&ldobrados &fpor &c{duration}&f.'
  - ''

  contested:
  - ''
  - '  &c&lMINA PVP &7(/minapvp)'
  - '  &fO clan &7[{clan}&7] &cfoi impedido de dominar por outro clan!'
  - ''

  # Nenhum membro do clan ficou na região por domination.abandon-timeout.
  abandoned:
  - ''
  - '  &c&lMINA PVP &7(/minapvp)'
  - '  &fO clan &7[{clan}&7] &cabandonou a dominação e perdeu os &e{percent}%&c!'
  - ''

# Actionbar enviada a quem bate no altar. Vazio desliga.
# {damage} {hp} {max_hp} {percent} {bar}
# Vida sai como 10.000; use {hp_suffix} / {max_hp_suffix} para a forma curta (10K).
altar:
  hit-actionbar: '&d&lALTAR &4❤{hp} &8(&c-{damage}&8)'

menus:
  rewards-title: 'Recompensas do Altar'
  chances-title: 'Chances do Altar'
  # Os passos anunciados aqui têm que bater com altar.drops.chance-step e
  # chance-step-shift do config.yml — esta lore é o único lugar onde o admin
  # lê quanto cada clique vale.
  chance-lore:
  - ''
  - ' &fChance: &e{chance}%'
  - ''
  - '&aEsquerdo &f+0.05% &8· &aShift+Esquerdo &f+1%'
  - '&cDireito &f-0.05% &8· &cShift+Direito &f-1%'

# ── PLACEHOLDERS (%pvpmine_*%) ───────────────────────────────────────────────
# Textos que a scoreboard não conseguiria montar sozinha: uma linha de board não
# tem 'se', então o galho entre "ninguém dominando", "dominando" e "dominou"
# acontece AQUI ou não acontece em lugar nenhum.
#
# {clan} sai como a TAG COLORIDA do clan e a cor dela vale até o próximo código —
# reponha a sua logo depois, igual nos broadcasts.
placeholders:
  # %pvpmine_state% — um dos três, conforme o estado da dominação.
  #
  # ⚠️ O TEMPO SAIU DAQUI. Uma linha de scoreboard no 1.8 é prefix (16 chars) +
  # suffix (16), e o FastBoard corta no caractere 16 CONTANDO OS CÓDIGOS DE COR.
  # A metade de baixo é remontada com ChatColor.getLastColors(prefix), que anda
  # de trás para frente e PARA na primeira cor que encontra — então formatação
  # que veio ANTES dessa cor não é reconstruída, e a linha renderiza em dois
  # estilos diferentes no meio de uma palavra. Era esse o '&f&l9m' seguido de
  # '&8e 54s': o corte caía dentro do tempo.
  #
  # Com '{clan} &8- &l{time}' isso é inevitável — a tag do clan tem tamanho
  # variável, então o ponto de corte muda de clan para clan. A saída foi dar
  # ao tempo a sua própria linha na board, curta e de uma cor só.
  state-idle: '&7Ninguém dominando'
  state-claiming: '{clan} &8- &e{percent}%'
  state-dominated: '{clan}'

  # %pvpmine_altar_hp% e família, quando não existe altar de pé.
  altar-none: '&8-'
  # %pvpmine_next_reset% com reset.interval desligado.
  reset-off: '&8-'

labels:
  wand-name: '&aSeletor da Mina PvP'
  wand-lore:
  - ''
  - '&fClique &aesquerdo &fpara a &apos1&f.'
  - '&fClique &cdireito &fpara a &cpos2&f.'
  - ''
  - '&fDepois use &e/mpvp setregion&f.'
