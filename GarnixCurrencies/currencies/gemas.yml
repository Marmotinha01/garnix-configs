info:
  order: 2
  starting: '0'
  formatter: 'SUFFIX' # DECIMAL ou SUFFIX
  text:
    singular: 'gema'
    plural: 'gemas'
    symbol: '۞'
    ranking-tag: '&d[۞]'
  colors:
    symbol: '&d'
    primary: '&d'
    secondary: '&d'

icon:
  material: 'INK_SACK'
  data: 9
  display: '&dGemas'

command:
  name: 'gema'
  aliases: ['gemas']
  cooldown: 5 # segundos
  subcommands:
    help:
      enabled: true
      aliases: ['ajuda']
      cooldown: 5 # segundos
      admin-permission: 'currencies.admin'
    ranking:
      enabled: true
      aliases: ['top']
      cooldown: 5 # segundos
    send:
      enabled: true
      aliases: ['enviar', 'pay', 'transfer']
      cooldown: 5 # segundos
      tax:
        enabled: true
        message:
          to-sender: true
          to-receiver: true
        percentage: 10
        bypass-permission: 'currencies.tax.bypass'
    set:
      enabled: true
      aliases: ['definir']
      permission: 'currencies.admin'
    add:
      enabled: true
      aliases: ['give', 'dar']
      permission: 'currencies.admin'
    remove:
      enabled: true
      aliases: ['take', 'remover']
      permission: 'currencies.admin'

ranking:
  mode: 'MENU' # CHAT ou MENU
  chat:
    format: '  &8#{position}º {lp_prefix}{player} &8▶ {symbol_color}{symbol}{primary_color}{balance}'
    empty: '  &7Nenhum jogador no ranking.'
    header:
      - ''
      - '  &d&lRANKING DE GEMAS'
      - ''
    footer:
      - ''
  menu:
    title: 'TOP Gemas'
    shape:
      - 'XXXXXXXXX'
      - 'XXX...XXX'
      - 'X.......X'
      - 'XXXXXXXXX'
      - 'XXXXXXXXX'
    position-user:
      display: '&8#{position}º {lp_prefix} {player}'
      lore:
        - '&fGemas: {symbol_color}{symbol}{primary_color}{balance}'
    empty-position-icon:
      material: 'BARRIER'
      display: '&8#{position}º &7Ninguém'
    info-icon:
      slot: 40
      material: 'PAPER'
      display: '&eAtualização Periódica'
      lore:
        - '&7O ranking é atualizado'
        - '&7a cada &f{refresh} &7minutos.'
        - ''
        - '&8&oÚltima atualização &7&o{last_update}&8&o.'

help:
  - ''
  - '  &d&lGEMAS &8▶ &dComandos de Ajuda'
  - ''
  - '  &d/{command} &8- &7Ver suas gemas.'
  - '  &d/{command} <jogador> &8- &7Ver as gemas de alguém.'
  - '  &d/{command} ranking &8- &7Ver o top gemas.'
  - '  &d/{command} enviar <jogador> <quantia> &8- &7Envia gemas para alguém.'
  - ''

help-admin:
  - '  &4&lGEMAS ADMIN &8▶ &4Comandos Administrativos'
  - ''
  - '  &c/{command} set <jogador> <quantia> &8- &7Define as gemas de alguém.'
  - '  &c/{command} add <jogador> <quantia> &8- &7Adiciona gemas a alguém.'
  - '  &c/{command} remove <jogador> <quantia> &8- &7Remove gemas de alguém.'
  - ''