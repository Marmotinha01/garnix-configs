info:
  order: 3
  starting: '0'
  formatter: 'SUFFIX' # DECIMAL ou SUFFIX
  text:
    singular: 'semente'
    plural: 'sementes'
    symbol: '❋'
    ranking-tag: '&5[❋]'
  colors:
    symbol: '&5'
    primary: '&5'
    secondary: '&5'

icon:
  material: 'INK_SACK'
  data: 5
  display: '&5Sementes'

command:
  name: 'sementes'
  aliases: ['semente']
  cooldown: 5 # segundos
  subcommands:
    help:
      enabled: true
      aliases: ['ajuda']
      cooldown: 5 # segundos
      admin-permission: 'currencies.admin'
    ranking:
      enabled: true
      aliases: ['top']
      cooldown: 5 # segundos
    send:
      enabled: true
      aliases: ['enviar', 'pay', 'transfer']
      cooldown: 5 # segundos
      tax:
        enabled: true
        message:
          to-sender: true
          to-receiver: true
        percentage: 10
        bypass-permission: 'currencies.tax.bypass'
    set:
      enabled: true
      aliases: ['definir']
      permission: 'currencies.admin'
    add:
      enabled: true
      aliases: ['give', 'dar']
      permission: 'currencies.admin'
    remove:
      enabled: true
      aliases: ['take', 'remover']
      permission: 'currencies.admin'

ranking:
  mode: 'MENU' # CHAT ou MENU
  chat:
    format: '  &8#{position}º {lp_prefix}{player} &8▶ {symbol_color}{symbol}{primary_color}{balance}'
    empty: '  &7Nenhum jogador no ranking.'
    header:
      - ''
      - '  &5&lRANKING DE SEMENTES'
      - ''
    footer:
      - ''
  menu:
    title: 'TOP Sementes'
    shape:
      - 'XXXXXXXXX'
      - 'XXX...XXX'
      - 'X.......X'
      - 'XXXXXXXXX'
      - 'XXXXXXXXX'
    position-user:
      display: '&8#{position}º {lp_prefix} {player}'
      lore:
        - '&fSementes: {symbol_color}{symbol}{primary_color}{balance}'
    empty-position-icon:
      material: 'BARRIER'
      display: '&8#{position}º &7Ninguém'
    info-icon:
      slot: 40
      material: 'PAPER'
      display: '&eAtualização Periódica'
      lore:
        - '&7O ranking é atualizado'
        - '&7a cada &f{refresh} &7minutos.'
        - ''
        - '&8&oÚltima atualização &7&o{last_update}&8&o.'

help:
  - ''
  - '  &5&lSEMENTES &8▶ &5Comandos de Ajuda'
  - ''
  - '  &5/{command} &8- &7Ver suas sementes.'
  - '  &5/{command} <jogador> &8- &7Ver as sementes de alguém.'
  - '  &5/{command} ranking &8- &7Ver o top sementes.'
  - '  &5/{command} enviar <jogador> <quantia> &8- &7Envia sementes para alguém.'
  - ''

help-admin:
  - '  &4&lSEMENTES ADMIN &8▶ &4Comandos Administrativos'
  - ''
  - '  &c/{command} set <jogador> <quantia> &8- &7Define as sementes de alguém.'
  - '  &c/{command} add <jogador> <quantia> &8- &7Adiciona sementes a alguém.'
  - '  &c/{command} remove <jogador> <quantia> &8- &7Remove sementes de alguém.'
  - ''