info:
  order: 8
  starting: '0'
  formatter: 'SUFFIX' # DECIMAL ou SUFFIX
  text:
    singular: 'cash'
    plural: 'cash'
    symbol: '❂'
    ranking-tag: '&6[❂]'
  colors:
    symbol: '&6'
    primary: '&6'
    secondary: '&6'

icon:
  material: 'GOLD_INGOT'
  data: 0
  display: '&6Cash'

command:
  name: 'cash'
  aliases: []
  cooldown: 5 # segundos
  subcommands:
    help:
      enabled: true
      aliases: ['ajuda']
      cooldown: 5 # segundos
      admin-permission: 'currencies.admin'
    ranking:
      enabled: true
      aliases: ['top']
      cooldown: 5 # segundos
    send:
      enabled: true
      aliases: ['enviar', 'pay', 'transfer']
      cooldown: 5 # segundos
      tax:
        enabled: true
        message:
          to-sender: true
          to-receiver: true
        percentage: 10
        bypass-permission: 'currencies.tax.bypass'
    set:
      enabled: true
      aliases: ['definir']
      permission: 'currencies.admin'
    add:
      enabled: true
      aliases: ['give', 'dar']
      permission: 'currencies.admin'
    remove:
      enabled: true
      aliases: ['take', 'remover']
      permission: 'currencies.admin'

ranking:
  mode: 'MENU' # CHAT ou MENU
  chat:
    format: '  &8#{position}º {lp_prefix}{lp_suffix}{player} &8▶ {symbol_color}{symbol}{primary_color}{balance}'
    empty: '  &7Nenhum jogador no ranking.'
    header:
      - ''
      - '  &6&lRANKING DE CASH'
      - ''
    footer:
      - ''
  menu:
    title: 'TOP Cash'
    shape:
      - 'XXXXXXXXX'
      - 'XXX...XXX'
      - 'X.......X'
      - 'XXXXXXXXX'
      - 'XXXXXXXXX'
    position-user:
      display: '&8#{position}º {lp_prefix} {player}'
      lore:
        - '&fCash: {symbol_color}{symbol}{primary_color}{balance}'
    empty-position-icon:
      material: 'BARRIER'
      display: '&8#{position}º &7Ninguém'
    info-icon:
      slot: 40
      material: 'PAPER'
      display: '&aAtualização Periódica'
      lore:
        - '&7O ranking é atualizado'
        - '&7a cada &f{refresh} &7minutos.'
        - ''
        - '&8&oÚltima atualização &7&o{last_update}&8&o.'

help:
  - ''
  - '  &6&lCASH &8▶ &6Comandos de Ajuda'
  - ''
  - '  &6/{command} &8- &7Ver seu cash.'
  - '  &6/{command} <jogador> &8- &7Ver o cash de alguém.'
  - '  &6/{command} ranking &8- &7Ver o top cash.'
  - '  &6/{command} enviar <jogador> <quantia> &8- &7Envia cash para alguém.'
  - ''

help-admin:
  - '  &4&lCASH ADMIN &8▶ &4Comandos Administrativos'
  - ''
  - '  &c/{command} set <jogador> <quantia> &8- &7Define o cash de alguém.'
  - '  &c/{command} add <jogador> <quantia> &8- &7Adiciona cash a alguém.'
  - '  &c/{command} remove <jogador> <quantia> &8- &7Remove cash de alguém.'
  - ''