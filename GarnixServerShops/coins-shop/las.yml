# Coins Shop — categoria de exemplo (sem broadcast).

title: Loja - Lãs

# paginated: true  → produtos fluem pelas páginas usando o 'shape'
# paginated: false → cada produto tem seu 'slot' e 'rows' é obrigatório
paginated: true

# Layout paginado. Caracteres: . = produto · < = página anterior · > = próxima · resto = decoração
shape:
- XXXXXXXXX
- XX.....XX
- <X.....X>
- XX.....XX
- XXXXXXXXX
- XXXXXXXXX

# Slot do botão de voltar (omita para não exibir).
back-slot: 49

# Ícone da categoria no menu de categorias.
icon:
  slot: 23
  material: WOOL
  data: 1
  display: '&aLãs'
  lore:
  - '&7Clique para ver.'

# Comando direto opcional que abre a categoria:
# command: 'lojagod'
# command-aliases: ['god']
# command-permission: 'loja.god'

# Em categorias paginadas, produtos NÃO declaram 'slot'.
