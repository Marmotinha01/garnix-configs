# Coins Shop — GOD. Kit de PvP.
#
# -- Preço: 1 a 3 minutos de jogo, por decisão do dono ------------------------
#
# "não impacta economicamente, pode deixar um valor simples para qualquer um comprar,
#  mas tem que jogar — não é logar no servidor e comprar, tem que jogar uns 2-3 minutinhos"
#
# A âncora é a renda ativa do dia 1: 6,94×10^4 coins/h = 1.157 coins/min (02-TIERS.md,
# batendo com os 70.000/h cronometrados no V5-A).
#
#   1.500  →  1,3 min   poções
#   2.500  →  2,2 min   P5 (por peça) · espada e machado S5
#   3.500  →  3,0 min   P6 (por peça) · espada e machado S6 · capa
#
# Era 150.000 a 500.000, que no dia 1 são 2 a 7 HORAS de mineração — longe de "uns
# minutinhos". Do dia 5 em diante os dois preços dão no mesmo (a renda passa de
# 10^8/dia), então este número só governa a PRIMEIRA sessão do jogador — que é
# exatamente o que ele precisa governar.
#
# Estes preços NÃO entram no orçamento de sinks: é conveniência de PvP, não economia.

title: Loja - GOD

# paginated: true  → produtos fluem pelas páginas usando o 'shape'
# paginated: false → cada produto tem seu 'slot' e 'rows' é obrigatório
paginated: false

# Layout paginado. Caracteres: . = produto · < = página anterior · > = próxima · resto = decoração
rows: 6

# Slot do botão de voltar (omita para não exibir).
back-slot: 49

# Ícone da categoria no menu de categorias.
icon:
  slot: 4
  material: DIAMOND_CHESTPLATE
  display: '&cLoja GOD'
  lore:
  - '&7Equipamentos lendários'
  - '&7para os mais fortes.'
  - ''
  - '&cClique para acessar.'

# Comando direto opcional que abre a categoria:
