# Coins Shop — Farm. A ÚNICA categoria da /loja com peso econômico.
#
# O resto da loja é QoL: bloco de decoração fica barato de propósito e vira de graça
# a partir do dia 4, e tudo bem. Aqui não — esta categoria é a fonte de insumo da via
# do cacto, e a via do cacto é reinvestimento composto. Preço errado aqui não deixa a
# loja barata: deixa a VIA inteira sem rampa.
#
# -- Por que a areia é o número que importa -----------------------------------
#
# Varri o repo: SAND e CACTUS não existem em nenhuma outra categoria, não caem da mina
# (`GarnixMining/levels.yml`) e não saem de crate, caixa ou boss (as tabelas de loot não
# têm uma recompensa `type: ITEM` sequer). Esta categoria é a fonte única dos dois.
#
# A diferença entre eles decide o desenho:
#
#   CACTO  cresce. Comprar é só a SEMENTE — quem tem 9 cactos chega aos 30.000 sozinho,
#          replantando o que colheu. Também sai de graça do armazém, puxando de volta.
#   AREIA  NÃO cresce, não se replanta e não tem rota grátis. É 1 por coluna e é o que
#          de fato limita o tamanho do plot.
#
# Ou seja: a areia é o único sink em coins da via do cacto, e ele é linear no tamanho
# do plot. É o freio nº 3 dos 4 de 11-CACTO.md ("espaço do plot") virando preço.
#
# -- A âncora da AREIA — o sink linear ----------------------------------------
#
#   plot cheio = 30.000 cactos (número do dono) em colunas de 3 = 10.000 colunas
#   1 coluna   = 1 areia = 5.000 coins
#   plot cheio = 5,00×10^7 coins em areia
#
# Contra a renda diária da casa (02-TIERS.md):
#
#   T1 (dia 1)  3,75×10^5  →  o plot cheio custa 133 dias   (só dá para semear)
#   T4 (dia 4)  1,08×10^8  →  o plot cheio custa 0,46 dia   ← a âncora
#   T6 (dia 6)  4,74×10^9  →  1,1% de um dia                (vira conveniência)
#
# Encher o plot de areia é meia diária de renda no dia 4, que é quando as pessoas montam
# a farm. Antes disso o jogador semeia poucas colunas e deixa o composto trabalhar —
# que é a via funcionando como projetada. Depois do dia 6 comprar vira atalho barato,
# e tudo bem: a essa altura a rampa já aconteceu e o plot tem teto físico de qualquer
# jeito, então o atalho não fura nada, só poupa tempo.
#
# -- O CACTO é semente, e é caro de propósito ---------------------------------
#
# ✅ Decisão do dono (05/08/2026): *"não deve ser algo alcançável tão facilmente"*.
# ✅ Revisada em 06/08/2026 para **150.000**, depois de passar por 35.000.
#
#   renda ativa por hora no dia 1 = renda(1) / 5,4 = 69.444 coins/h
#   150.000                       = 2,16 HORAS de mineração por UNIDADE
#
# A escada foi 6.000 → 35.000 → 150.000, ou seja de ~5 minutos para mais de duas
# horas. O motivo de poder ser tão caro é que comprar cacto NUNCA é obrigatório: o
# cacto se replanta sozinho (quem tem 9 chega aos 30.000) e sai de graça do armazém,
# puxando de volta o que já foi colhido. Comprar é só ATALHO para quem não quer
# esperar o composto — então o preço é o que separa "esperei" de "paguei para pular".
#
# ⚠️ E o preço alto é METADE de um par. ✅ Decisão do dono (06/08/2026): *"o jogador
# consegue dinheiro para comprar o cacto ou consegue suadamente em uma crate ou caixa
# (...) o ganho tem que ser justificável"*. A entrada cara só se sustenta se o retorno
# for rápido — e com o `sell-price` atual de 0,499 uma torre de 20 andares leva ~7
# dias AFK para se pagar, que é o oposto do que a decisão pede.
#
#   9 cactos-semente a 150.000 ..... 1.350.000
#   180 areias a 5.000 .............   900.000
#   entrada de 20 andares .......... 2.250.000  = 6 diarias do dia 1
#
# ⏳ A OUTRA METADE DO PAR ESTA EM ABERTO: quanto o `sell-price` do GarnixWarehouse
# precisa subir para o payback ser de horas e nao de dias. Ver 11-CACTO.md — o alvo
# do dono ("5 min de mina = 1 min de cacto") pede `sell-price` 13,68 e leva a via a
# 22x a renda diaria de toda a casa, entao o numero ainda depende de decisao.
#
# ⚠️ Se o M2 (cactos/h medidos in-game) mudar o tamanho útil do plot, o que muda aqui é
# só o preço da AREIA — o do cacto é semente e não escala com o tamanho.

