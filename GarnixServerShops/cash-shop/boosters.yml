# Cash Shop — Boosters.
#
# Faixa A. O in-game so tem 5m e 10m; o 3x de 1h e do site, por decisao
# do dono. O tempo EMPILHA sem teto entre boosters de mesmo multiplicador,
# entao comprar seis 1h vale exatamente seis horas — nada se perde.

title: 'SHOP - Boosters'

paginated: false
rows: 3
back-slot: 22

icon:
  slot: 10
  material: BLAZE_POWDER
  display: '&6Boosters'
  lore:
  - '&7O 3x de 1 hora, que quase'
  - '&7nao sai jogando.'
  - ''
  - '&6Clique para acessar.'

broadcast-message:
- ''
- ' &6&lCASH SHOP &8- &f{player} &eadquiriu &f{item} &epor {symbol_color}{symbol}{primary_color}{value} {currency}&e!'
- ''

