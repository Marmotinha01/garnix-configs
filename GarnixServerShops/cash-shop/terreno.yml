# Cash Shop — Terreno.
#
# Substitui a antiga categoria "Limites" (11/08/2026). O recorte agora e por
# LUGAR e nao por natureza: tudo aqui vive dentro do plot do jogador — o que
# aumenta capacidade, o que automatiza e o que constroi.
#
# O `spawnerslimite` continua sendo o item nº 1 do Ranking de Apeloes: ele
# multiplica a unica via SEM teto fisico, e por isso e o produto mais caro da
# faixa C mesmo dividindo linha com limites bem mais baratos.
#
# ⚠️ Ele NAO tem mais rota in-game por compra: a loja da pesca vendia limite de
# spawner e de maquina por corais, e os dois sairam em 06/08/2026 pela regua do
# dono — "so itens uteis e que nao impactam de maneira forte na economia". Uma
# via AFK de 24h nao pode financiar a via sem teto. O que sobrou de limite por
# corais e o do ARMAZEM, que tem teto fisico (o plot).
#
# ⚠️ +25% em `autosell` e `limpador` — os dois estao no site tambem. Os tres
# limites e a torre nao estao, entao ficam no preco base. A `maquina-cash` sai
# de 25.000 base (R$ 24,90 no site) x 1,25.

