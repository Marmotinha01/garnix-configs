# Cash Shop — Livros.
#
# A taxa de faucet de livro e o FREIO da temporada: livro nao tem preco em
# coins, entao se cai facil o multiplicador vem cedo e a curva de tiers
# desanda. Por isso o site vende so os niveis de topo — os baixos ficam
# 100% in-game, senao a via de quem nao paga fica inviavel.
#
# ⚠️ O comando e `/lamina givebook`, NAO `/spawner givebook`.

title: 'SHOP - Livros'

paginated: false
rows: 5
back-slot: 40

icon:
  slot: 14
  material: ENCHANTED_BOOK
  display: '&eLivros'
  lore:
  - '&7Os niveis de topo, que'
  - '&7so caem em jackpot.'
  - ''
  - '&6Clique para acessar.'

