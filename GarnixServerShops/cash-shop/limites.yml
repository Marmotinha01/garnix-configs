# O `spawnerslimite` e o item nº 1 do Ranking de Apeloes: multiplica a unica
# via SEM teto fisico. Por isso e o produto mais caro da faixa C e tem rota
# in-game deliberadamente lenta (corais, com cambio decrescente na /pesca).

