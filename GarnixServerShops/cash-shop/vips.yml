# Cash Shop — VIPs.
#
# O VIP e a unica fonte de DESCONTO do servidor — rank so da ganho. E o que
# faz o P2W ser perceptivel sem ser humilhante: um sem-VIP ganha quase o
# mesmo por hora, mas o VIP compra mais barato e avanca ~meio dia antes.
#
# Vendido como PAPEL (item negociavel), entao tem mercado in-game tambem.
# Celestial e o VIP de ENTRADA, nao o topo — a hierarquia real e
# celestial < imortal < supremo < garnix.

title: 'SHOP - VIPs'

paginated: false
rows: 3
back-slot: 22

icon:
  slot: 16
  material: NETHER_STAR
  display: '&6VIPs'
  lore:
  - '&7O unico lugar do servidor'
  - '&7que da DESCONTO de compra.'
  - ''
  - '&6Clique para acessar.'

broadcast-message:
- ''
- ' &6&lCASH SHOP &8- &f{player} &eadquiriu &f{item} &epor {symbol_color}{symbol}{primary_color}{value} {currency}&e!'
- ''

products:

  celestial:
    slot: 10
    amount: 1
    price: 20000
    broadcast: true
    commands:
    - 'vip givepaper {player} celestial 30d 1'
    item:
      display: '{color}Papel &lVIP {vip}'
      lore:
      - '&fDuração: &7{duration}'
      - ''
      - '{color}Clique para resgatar!'

