# Cash Shop — Caixas.
#
# A caixa e o unico jeito de tirar ARMADURA do jogo — ela nunca e vendida
# direta, por decisao do dono. Quem paga compra CHANCE, nao a peca. As
# caixas II tambem saem in-game, beeem raro.
#
# ⚠️ Precos com +25% desde 11/08/2026: as oito caixas viraram produto de site
# tambem, e a regra e que o site cobra o preco base (1.000 cash = R$ 1,00) e o
# cash-shop cobra o quarto a mais. O `robo-mitico` e as `chaves-rankup` NAO
# levam o acrescimo — o robo avulso saiu do site e a chave nunca esteve la.
#
# ⚠️ A `caixa-robos` a 1.250 nao e chute: com 35/32/22/9/2% em
# `MysteryBoxes/boxes/robos.yml`, o valor esperado da abertura fica em ~870
# cash contra o Robo Mitico avulso a 6.000. O preco aguenta ser a unica rota
# de cash para o Mitico sem virar atalho mais barato que ele.

title: 'SHOP - Caixas'

paginated: false
rows: 5
back-slot: 40

icon:
  slot: 12
  material: ENDER_CHEST
  display: '&dCaixas'
  lore:
  - '&7Clique para acessar.'

# Comando proprio da categoria. Existe para o botao de VOLTAR do preview de
# caixa ter para onde levar: o /caixas ver abre o preview e o back-shop-command
# do GarnixMysteryBoxes roda ISTO, devolvendo o jogador a categoria de onde ele
# veio. Sem o comando proprio o unico destino possivel era o menu principal do
# /shop, que faz o jogador perder o lugar.
command: 'shopcaixas'

broadcast-message:
- ''
- ' &6&lCASH SHOP &8- &f{player} &eadquiriu &f{item} &epor {symbol_color}{symbol}{primary_color}{value} {currency}&e!'
- ''

