# Cash Shop — Mineração.
#
# Throughput da mina: o que quebra muito bloco de uma vez. A escada dos quatro
# explosivos e depois a britadeira, que quebra a COLUNA inteira e por isso e o
# maior throughput do jogo.
#
# ⚠️ A loja de fragmentos (`GarnixFragments/shop.yml`) para no 4x4, mas a rota
# in-game do 6x6 e do 8x8 existe em outro lugar: os dois saem da caixa
# `mineracao-ii` e da crate `mineracao`. A britadeira sai das duas caixas de
# mineracao e da crate. Paridade fechada sem precisar mexer em loot.
#
# ⚠️ Os precos saem da proporcao da loja de fragmentos, nao de intuicao: a
# britadeira custa la 1.000 eterna + 700 sagrada + 400 divina + 500 primal,
# de longe o item mais caro daquele menu (a divina sozinha e 43% de toda a
# renda de divina da temporada). Dai os 10.000, contra os 1.125 do 4x4.
#
# ⚠️ +25% em `bomba-4x4` (10x por R$ 8,90 no site), `bomba-6x6` (R$ 19,90),
# `bomba-8x8` (R$ 39,90) e `britadeira` (R$ 7,90 avulsa). O 2x2 nao esta no
# site e fica no preco base.

title: 'SHOP - Mineração'

