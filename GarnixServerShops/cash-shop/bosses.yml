# Cash Shop — Bosses.
#
# So as tres matadoras logo abaixo da Hit-Kill. A HK e exclusiva do site
# (R$ 44,90), por decisao do dono — o cash-shop vai ate a Abissal e para.
#
# ⚠️ Nenhuma delas esta no site, entao as tres ficam no preco base, sem o +25%.
#
# ⚠️ A lore aqui e LITERAL de proposito. Em `GarnixBosses/swords.yml` o dano vem
# de {damage}, {kill_stack} e {kills}, que so resolvem no item real entregue
# pelo plugin — num icone de loja eles apareceriam crus. O numero escrito tem
# que ser conferido contra o swords.yml se a escada de dano mudar.
#
# ⚠️ O comando e `boss give sword <jogador> <variante> [quantia]`, e o
# `/boss` e `playerOnly()`. Funciona mesmo assim porque o CommandHandler do
# core avalia o tipo de sender DEPOIS de resolver o subcomando
# (CommandHandler:195) e o `give sword` nao declara playerOnly — a loja
# despacha como console (PurchaseService:227).

title: 'SHOP - Bosses'

paginated: false
rows: 3
back-slot: 22

icon:
  slot: 15
  material: DIAMOND_SWORD
  display: '&4Bosses'
  lore:
  - '&7As matadoras logo abaixo'
  - '&7da Hit-Kill.'
  - ''
  - '&6Clique para acessar.'
  flags:
  - HIDE_ATTRIBUTES

