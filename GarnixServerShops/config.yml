# Ativa logs de depuração detalhados no console.
debug: false

# Permissão admin (reload, additens): servershops.admin

# ── Cash Shop ──
cash-shop:
  command: shop
  aliases: []
  currency: cash

# ── Coins Shop ──
coins-shop:
  command: loja
  aliases: []
  currency: coins

# ── Menu de categorias ──
categories-menu:
  cash:
    title: SHOP
    rows: 5
  coins:
    title: Loja
    rows: 5

# ── Aparência das categorias ──
# Moeda: {value} {symbol} {symbol_color} {primary_color} {secondary_color} {currency}
# Outros: {amount} {discount} {purchase-hint} {right-click-hint} {name} {release-date}
