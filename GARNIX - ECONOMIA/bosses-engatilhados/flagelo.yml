# Boss Flagelo — ENGATILHADO, banda T8–T10
#
# Não está no ar. Para lançar: copie este arquivo para GarnixBosses/bosses/
# e dê reload. NENHUM dos 5 bosses ativos precisa ser tocado — este encaixa
# no vão entre dois deles e paga a média geométrica dos vizinhos, então as
# bandas existentes seguem válidas.
#
# ⚠️ `texture:` está vazio de propósito: é a cabeça do boss e é escolha
#    cosmética. Cole um hash de head antes de lançar. O menu já funciona
#    sem ela, porque o `boss-icon` usa material.

order: 25

type: WITCH

health: 62000

translated: 'Boss Flagelo'
display: '&5{translated}'

texture: ''

reward-rolls: 3

boss-icon:
  material: BREWING_STAND_ITEM
  display: '{display}'
  lore:
    - '&7Invoque este boss dentro'
    - '&7do seu próprio terreno.'
    - ''
    - '&8 ▪ &fVida: &4❤{health} '
    - '&8 ▪ &fStacks: &7x{stacks} '
    - ''
    - '&7Coloque-o em um terreno'
    - '&7para começar a atacar.'

# Types:
# NONE, CURRENCY, ITEM, COMMAND, COMMAND_ITEM

rewards:
  azar:
    type: NONE
    chance: 25.0
    display: '&8Azar'
    icon:
      material: WEB
      display: '&8Azar'

  # 0,01% da renda diária da banda. Com ~250 abates/dia dá ~2,5% do dia:
  # sentido para o jogador, sem virar via de renda paralela.
  coins:
    type: CURRENCY
    chance: 100.0
    currency-id: coins
    amount: '904000000'
    icon:
      lore:
      - '&fQuantia: &7904M '
  secundaria:
    type: CURRENCY
    chance: 45.0
    currency-id: sementes
    amount: '500'
    icon:
      lore:
      - '&fQuantia: &7500 '
  chave-boss:
    type: COMMAND
    chance: 30.0
    display: '&cChave de Boss'
    command: crates givevirtualkey bosses {player} {amount}
    amount: 1
    icon:
      material: TRIPWIRE_HOOK
      glow: true
      display: '&4Chave Bosses'
      lore:
      - '&7Consiga recompensas'
      - '&7abrindo essa chave.'

  livro:
    type: COMMAND
    chance: 4
    display: '&5Livro de Ceifador 2'
    command: lamina givebook {player} ceifador 2
    amount: 1
    icon:
      material: ENCHANTED_BOOK
      display: '&dLivro de Ceifador &7II'
      lore:
      - '&7Chance de o abate soltar'
      - '&7o dobro de cabeças.'
      - ''
      - '&8 ▪ &fCeifador: &dII '

  matadora:
    type: COMMAND
    chance: 2
    display: '&6Matadora Sombria'
    command: boss give sword {player} sombria
    amount: 1
    icon:
      material: IRON_SWORD
      glow: true
      display: '&5Matadora Sombria'
      lore:
      - ''
      - ' &8Informações: '
      - '&8 ▪ &fDano: &e{damage} '
      - '&8 ▪ &fKill-Stack: &e{kill_stack} '
      - '&8 ▪ &fBosses abatidos: &e{kills} '
