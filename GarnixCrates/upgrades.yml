# Cooldown (em segundos) entre cada clique do botão "Abrir Chaves" no menu.
open-seconds: 1

# Currency usada para pagar os upgrades (GarnixCurrencies).
currency: coins

# Cada nível define quantas keys abre por clique e o custo para chegar nele.
# O nível 0 é o inicial (jogadores novos começam aqui).
# O último nível definido é o nível máximo. Adicione/remova conforme quiser.
levels:
  '0':
    opens: 20
    cost: 0
  '1':
    opens: 50
    cost: 5000
  '2':
    opens: 100
    cost: 15000
  '3':
    opens: 250
    cost: 50000
  '4':
    opens: 500
    cost: 150000
  '5':
    opens: 1000
    cost: 300000
  '6':
    opens: 2500
    cost: 600000
  '7':
    opens: 5000
    cost: 2000000