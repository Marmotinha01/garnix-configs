# Tipos: CURRENCY, COMMAND, COMMAND_ITEM, ITEM, NONE
#
# FAIXAS desta crate (os numeros sao PESO):
#   comum 84 · mediano 11 · mediano plus 4,3 · raro 0,7 · azar 50
#
# ⚠️ ESTA CRATE TEM O AZAR MAIS PESADO DA REDE, e e de proposito: peso 50 contra
# os 33,3333 das outras. Como o azar entra POR FORA dos 100 dos premios, a conta
# e `peso / (100 + peso)` — 50/150 = 33,3% das aberturas, ou 333 a cada 1.000.
# Nas outras crates 33,3333/133,3333 da 25%. Mexer neste numero muda TODAS as
# porcentagens da tabela, porque ele e o denominador de todo mundo.
#
# ⚠️ A escada acompanha a VIDA do boss — Colosso 25K, Inferno 50K, Arauto 75K,
# Tita 150K, Devorador 300K — e o Colosso e o recheio: abrir uma chave que nao
# deu azar quase sempre devolve um boss para matar.
#
# ⚠️ O teto do boost de robo aqui e 4,5 (total 150 x 3 / 100), nao 3,999999 como
# nas crates de profissao, justamente porque o total e outro. Cai dentro dele
# toda a cauda: as duas caixas, Tita, Devorador e as duas matadoras (5,0 de peso).
#
# ⚠️ Os premios somam 100 CRAVADOS. E o que faz a % do preview ser verdade.
#
# ⚠️ `chance` e PESO, nao porcentagem — Crate.java:100-105 normaliza por
# totalChance. Somar 100 e so legibilidade.
rewards:

  # -- COMUM ------------------------------------------------- peso 84
  boss-colosso:
    type: COMMAND_ITEM
    chance: 56
    display: '&cBoss Colosso'
    command: boss give boss {player} COLOSSO {amount} 1
    amount: 1
    icon:
      texture: 590591f78e6bcbd800d5864cb297b98460c35aa6cf52af26fb240618fcee2fb7
      display: '&cBoss Colosso'
      lore:
      - '&fVida: &4❤25.000'

  boss-inferno:
