      flags: [ 'HIDE_ATTRIBUTES' ]

  # -- AZAR ------------------------------- peso 50 = 33,3% real (333/1.000)
  # type: NONE = slot vazio de verdade. O RewardDelivery pula a entrega
  # (RewardDelivery.java:60), entao o jogador ve o giro parar aqui e nao
  # recebe absolutamente nada. Aparece no preview, some do /crates manage
  # (nao da para filtrar o azar) e NUNCA e turbinado por robo.
  #
  # Peso 50 sobre os 100 dos premios: 50/150 = 33,3% das aberturas, ou 333
  # a cada 1.000 — o alvo pedido de 300 a 400. E o azar mais pesado da rede;
  # as outras crates usam 33,3333, que da 25%.
  azar:
    type: NONE
    chance: 50
    display: '&8Azar'
    icon:
      material: WEB
      display: '&8Azar'
      lore:
      - '&7Não foi dessa vez.'
