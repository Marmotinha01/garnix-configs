# Tipos: CURRENCY, COMMAND, COMMAND_ITEM, ITEM, NONE
#
# FAIXAS desta crate:
#   comum 87,5% · comum plus 12% · rara 0,4% ·
#   raro plus 0,09% · raríssima 0,009% · jackpot 0,001%
#
# ⚠️ A crate de boss NAO tem faixa mediana: ela so entrega bosses e matadoras,
# sem moeda nem recheio. Os 2,5% da mediana foram para o Colosso, que e o
# recheio desta tabela — abrir uma chave sempre devolve um boss para matar.
#
# ⚠️ `chance` e PESO, nao porcentagem — Crate.java:100-105 normaliza por
# totalChance. Somar 100 e so legibilidade.
rewards:

  # ── COMUM ────────────────────────────────────────────────────────── 87,5%
  boss-colosso:
    type: COMMAND
    chance: 87.5
    display: '&cBoss Colosso'
    command: boss give boss {player} COLOSSO 1 1
    amount: 1
    icon:
      texture: 590591f78e6bcbd800d5864cb297b98460c35aa6cf52af26fb240618fcee2fb7
      display: '&cBoss Colosso'
      lore:
      - '&fVida: &4❤25K'

  # ── COMUM PLUS ───────────────────────────────────────────────────── 12%
  boss-inferno:
    type: COMMAND
    chance: 12
    display: '&6Boss Inferno'
    command: boss give boss {player} INFERNO 1 1
    amount: 1
    icon:
      texture: 1c4d7ff18bda1d81288c12b126bb538310b191c4dea96c0db4f32f8d2365d502
      display: '&6Boss Inferno'
      lore:
      - '&fVida: &4❤50K'

  # ── RARA ────────────────────────────────────────────────────────── 0,4%
  boss-arauto:
    type: COMMAND
    chance: 0.3
    display: '&dBoss Arauto'
    command: boss give boss {player} ARAUTO 1 1
    amount: 1
    icon:
      texture: 38eef639b9c151ee810adf488f29f74b9077dcc8c4816e27a34a6491fce04677
      display: '&dBoss Arauto'
      lore:
      - '&fVida: &4❤75K'

  matadora-sombria:
    type: COMMAND
    chance: 0.1
    display: '&5Matadora Sombria'
    command: boss give sword {player} sombria
    amount: 1
    icon:
      material: IRON_SWORD
      glow: true
      display: '&5Matadora Sombria'
      lore:
      - '&fDano: &c750'
      flags: [ 'HIDE_ATTRIBUTES' ]

  # ── RARO PLUS ──────────────────────────────────────────────────── 0,09%
  boss-tita:
    type: COMMAND
    chance: 0.09
    display: '&5Boss Titã'
    command: boss give boss {player} TITA 1 1
    amount: 1
    icon:
      texture: efec3e24551726cb3d64cbd1604a1a9f8a1e11693722a8aad5109a1fffa8d43c
      display: '&5Boss Titã'
      lore:
      - '&fVida: &4❤150K'

  # ── RARÍSSIMA ─────────────────────────────────────────────────── 0,009%
  boss-devorador:
    type: COMMAND
    chance: 0.009
    display: '&4Boss Devorador'
    command: boss give boss {player} DEVORADOR 1 1
    amount: 1
    icon:
      texture: ef93e9e1de7c1f721514968e4cd7c30082be02061a0e1ce91e67c3f0d70d5840
      display: '&4Boss Devorador'
      lore:
      - '&fVida: &4❤300K'

  # ── JACKPOT ─────────────────────────────────────────────────────── 0,001%
  jackpot:
    type: COMMAND
    chance: 0.001
    display: '&bMatadora Ancestral'
    command: boss give sword {player} ancestral
    amount: 1
    icon:
      material: DIAMOND_SWORD
      glow: true
      display: '&bMatadora Ancestral'
      lore:
      - '&fDano: &c1.500'
      flags: [ 'HIDE_ATTRIBUTES' ]

  # ── AZAR ────────────────────────────────────────────────────────── 25%
  # type: NONE = slot vazio de verdade. O RewardDelivery pula a entrega
  # (RewardDelivery.java:60), entao o jogador ve o giro parar aqui e nao
  # recebe absolutamente nada. Aparece no preview, some do /crates manage
  # (nao da para filtrar o azar) e NUNCA e turbinado por robo.
  #
  # Peso 33,3333 sobre os 100 dos premios: 33,3333/133,3333 = 25% das
  # aberturas, ou 250 a cada 1.000. Os pesos acima ficaram intactos — o
  # que muda e que cada um agora vale 0,75x do que valia (47 = 35,25%).
  azar:
    type: NONE
    chance: 33.3333
    display: '&8Azar'
    icon:
      material: WEB
      display: '&8Azar'
      lore:
      - '&7Não foi dessa vez.'
