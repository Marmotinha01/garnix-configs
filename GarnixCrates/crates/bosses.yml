# Tipos: CURRENCY, COMMAND, COMMAND_ITEM, ITEM, NONE
#
# FAIXAS desta crate:
#   comum 60% · comum plus 30% · mediana 6% · rara 2% ·
#   raro plus 1,8% · jackpot 0,001%
#
# ⚠️ CURVA ACHATADA (ago/2026). Era 87,5% de Colosso e 12% de Inferno, com todo
# o resto somando 0,5% — a crate inteira era "voce ganhou um Colosso". Agora a
# escada acompanha a VIDA do boss: Colosso 25K (60) · Inferno 50K (30) ·
# Arauto 75K (6) · Tita 150K (2) · Devorador 300K (0,5).
#
# ⚠️ O achatamento tambem consertou o boost de robo. So peso ABAIXO de 3,999999
# e elegivel ao rate-up, e antes so 0,769 de peso cabia ai — o robo praticamente
# nao agia nesta crate. Agora sao 4,0 de peso elegivel (Tita, Devorador, as duas
# caixas e as duas matadoras), 5,2x mais.
#
# ⚠️ Os pesos agora somam 100 CRAVADOS. Antes somavam 100,27, entao a % que o
# preview mostrava nao era a % real de nenhuma recompensa desta crate.
#
# ⚠️ A crate de boss NAO tem faixa mediana: ela so entrega bosses e matadoras,
# sem moeda nem recheio. Os 2,5% da mediana foram para o Colosso, que e o
# recheio desta tabela — abrir uma chave sempre devolve um boss para matar.
#
# ⚠️ `chance` e PESO, nao porcentagem — Crate.java:100-105 normaliza por
# totalChance. Somar 100 e so legibilidade.
rewards:

  # -- COMUM ---------------------------------------------------------- 60%
  boss-colosso:
    type: COMMAND
    chance: 60
    display: '&cBoss Colosso'
    command: boss give boss {player} COLOSSO 1 1
    amount: 1
    icon:
      texture: 590591f78e6bcbd800d5864cb297b98460c35aa6cf52af26fb240618fcee2fb7
      display: '&cBoss Colosso'
      lore:
      - '&fVida: &4❤25.000'

  # -- COMUM PLUS ----------------------------------------------------- 30%
  boss-inferno:
