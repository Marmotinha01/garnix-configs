location: world:84:60:2

hologram:
  height: 2.3
  lines:
  - '&4&lCAIXA BOSSES'
  - ''
  - '&4Opções de uso:'
  - '&fBotão esquerdo &8➟ &7Preview'
  - '&fBotão direito &8➟ &7Abrir'

# Slot que esta crate ocupa no menu /crates.
slot: 14

# Item visual no menu de crates.
crate-item:
  glow: true
  material: TRIPWIRE_HOOK
  display: '&4Chave Bosses'
  lore:
  - '&7Consiga abatendo os bosses'
  - '&7que aparecem no servidor.'

# Item físico da chave (segurar e clicar com botão direito na crate abre).
key-item:
  glow: true
  material: TRIPWIRE_HOOK
  display: '&4Chave Bosses'
  lore:
  - '&7Consiga abatendo os bosses'
  - '&7que aparecem no servidor.'
  - ''
  - '&4Clique esquerdo para armazenar'
  - '&4ou abrir a chave em uma caixa.'

# Tipos: CURRENCY, COMMAND, COMMAND_ITEM, ITEM, NONE
#
# FAIXAS (ver 15-LOOT.md): recheio · bom · raro · epico · jackpot.
# Calibradas para ~20.700 aberturas/dia no servidor inteiro.
#
# ⚠️ Crate NAO tem gate de tier — o jogador do dia 1 e o do dia 20 abrem a
# mesma tabela. Por isso o premio em coins e FIXO e pequeno: no dia 1 e um
# empurrao real, no dia 5 vira ruido. O valor da crate sao os ITENS.
rewards:

  coins:
    type: CURRENCY
    chance: 39.56
    display: '&6Moedas'
    currency-id: coins
    amount: '250'
  xp:
    type: COMMAND
    chance: 26.37
    display: '&aExperiência'
    command: xp {amount} {player}
    amount: 500
    icon:
      material: EXP_BOTTLE
      display: '&aExperiência'

  secundaria:
    type: CURRENCY
    chance: 21.98
    display: '&bdracmas'
    currency-id: dracmas
    amount: '25'
  combustivel:
    type: COMMAND
    chance: 4
    display: '&eCombustível'
    command: maquina givefuel {player} default {amount}
    amount: 500
    icon:
      material: COAL
      display: '&eCombustível &7(500L)'

  fragmento:
    type: COMMAND
    chance: 3
    display: '&dFragmento'
    command: fragmentos givevirtual {player} selo {amount}
