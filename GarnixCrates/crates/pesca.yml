    chance: 0.3
    display: '&bLivro de Correnteza 3'
    command: pesca givebook {player} speed 3
    amount: 1
    icon:
      material: ENCHANTED_BOOK
      glow: true
      display: '&bLivro de Correnteza 3'

  armadura-alta:
    type: COMMAND
    chance: 0.0495
    display: '&6Peça de Armadura &6[T&lIV&6]'
    command: pesca givearmor {player} tier-iv_boots
    amount: 1
    icon:
      material: DIAMOND_CHESTPLATE
      glow: true
      display: '&6Peça de Armadura &6[T&lIV&6]'

  skin:
    type: COMMAND
    chance: 0.0297
    display: '&5Skin serenita'
    command: pesca giveskin {player} serenita
    amount: 1
    icon:
      material: NETHER_STAR
      glow: true
      display: '&5Skin serenita'

  booster-3x:
    type: COMMAND
    chance: 0.0198
    display: '&d&lBooster 3x &7(10min)'
    command: pesca givebooster {player} corais 3 10m
    amount: 1
    icon:
      material: POTION
      glow: true
      display: '&d&lBooster 3x &7(10min)'

  jackpot:
    type: COMMAND
    chance: 0.001
    display: '&3&lSkin de Tempestita'
    command: pesca giveskin {player} tempestita
    amount: 1
    icon:
      material: BEACON
      glow: true
      display: '&3&lSkin de Tempestita'
