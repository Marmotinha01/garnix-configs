location: world:81:60:-7

hologram:
  height: 2.3
  lines:
  - '&b&lCAIXA PESCA'
  - ''
  - '&bOpções de uso:'
  - '&fBotão esquerdo &8➟ &7Preview'
  - '&fBotão direito &8➟ &7Abrir'

# Slot que esta crate ocupa no menu /crates.
slot: 12

# Item visual no menu de crates.
crate-item:
  glow: true
  material: TRIPWIRE_HOOK
  display: '&bChave Pesca'
  lore:
  - '&7Consiga pescando peixes'
  - '&7nas águas do servidor.'

# Item físico da chave (segurar e clicar com botão direito na crate abre).
key-item:
  glow: true
  material: TRIPWIRE_HOOK
  display: '&bChave Pesca'
  lore:
  - '&7Consiga pescando peixes'
  - '&7nas águas do servidor.'
  - ''
  - '&bClique esquerdo para armazenar'
  - '&bou abrir a chave em uma caixa.'

# Tipos: CURRENCY, COMMAND, COMMAND_ITEM, ITEM, NONE
#
# FAIXAS (ver 15-LOOT.md): recheio · bom · raro · epico · jackpot.
# Calibradas para ~20.700 aberturas/dia no servidor inteiro.
#
# ⚠️ Crate NAO tem gate de tier — o jogador do dia 1 e o do dia 20 abrem a
# mesma tabela. Por isso o premio em coins e FIXO e pequeno: no dia 1 e um
# empurrao real, no dia 5 vira ruido. O valor da crate sao os ITENS.
rewards:

  coins:
    type: CURRENCY
    chance: 39.26
    display: '&6Moedas'
    currency-id: coins
    amount: '250'
  xp:
    type: COMMAND
    chance: 26.37
    display: '&aExperiência'
    command: xp {amount} {player}
    amount: 500
    icon:
      material: EXP_BOTTLE
      display: '&aExperiência'

  secundaria:
    type: CURRENCY
    chance: 21.98
    display: '&bcorais'
    currency-id: corais
    amount: '25'
  combustivel:
    type: COMMAND
    chance: 4
    display: '&eCombustível'
    command: maquina givefuel {player} default {amount}
    amount: 500
    icon:
      material: COAL
      display: '&eCombustível &7(500L)'

  fragmento:
    type: COMMAND
    chance: 3
    display: '&dFragmento'
    command: fragmentos givevirtual {player} selo {amount}
    amount: 5
    icon:
      material: PAPER
      display: '&eFragmento: Selo Lacrado'

  secundaria-lote:
    type: CURRENCY
    chance: 3
    display: '&bcorais (lote)'
    currency-id: corais
    amount: '500'
  chave-boss:
    type: COMMAND
    chance: 1.2
    display: '&c&lChave de Boss'
    command: crates givevirtualkey bosses {player} {amount}
    amount: 1
    icon:
      material: TRIPWIRE_HOOK
      glow: true
      display: '&c&lChave de Boss'

  armadura-baixa:
    type: COMMAND
    chance: 0.5
    display: '&7Peça de Armadura &7[T&lII&7]'
