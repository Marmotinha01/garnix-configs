location: world:81:60:-7

hologram:
  height: 2.3
  lines:
  - '&b&lCAIXA PESCA'
  - ''
  - '&bOpções de uso:'
  - '&fBotão esquerdo &8➟ &7Preview'
  - '&fBotão direito &8➟ &7Abrir'

# Slot que esta crate ocupa no menu /crates.
slot: 12

# Item visual no menu de crates.
crate-item:
  glow: true
  material: TRIPWIRE_HOOK
  display: '&bChave Pesca'
  lore:
  - '&7Consiga pescando peixes'
  - '&7nas águas do servidor.'

# Item físico da chave (segurar e clicar com botão direito na crate abre).
key-item:
  glow: true
  material: TRIPWIRE_HOOK
  display: '&bChave Pesca'
  lore:
  - '&7Consiga pescando peixes'
  - '&7nas águas do servidor.'
  - ''
  - '&bClique esquerdo para armazenar'
  - '&bou abrir a chave em uma caixa.'

# Tipos: CURRENCY, COMMAND, COMMAND_ITEM, ITEM, NONE
#
# FAIXAS desta crate:
#   comum 85% · comum plus 12% · mediana 2,5% ·
#   rara 0,4% · raro plus 0,099% · jackpot 0,001%
#
# ⚠️ Crate NAO tem gate de tier — o jogador do dia 1 e o do dia 20 abrem a
# mesma tabela. Por isso o premio em coins e FIXO e pequeno: no dia 1 e um
# empurrao real, no dia 5 vira ruido. O valor da crate sao os ITENS.
#
# ⚠️ `chance` e PESO, nao porcentagem — Crate.java:100-105 normaliza por
# totalChance. Somar 100 e so legibilidade.
rewards:

  # ── COMUM ────────────────────────────────────────────────────────── 85%
  coins:
    type: CURRENCY
    chance: 47
    currency-id: coins
    amount: '250'
    icon:
      lore:
      - '&fQuantia: &7250 '

  secundaria:
    type: CURRENCY
    chance: 28
    currency-id: corais
    amount: '25'
    icon:
      lore:
      - '&fQuantia: &725 '

  combustivel:
    type: COMMAND
    chance: 10
    display: '&eCombustível'
    command: maquina givefuel {player} default {amount}
    amount: 500
    icon:
      material: COAL
      display: '&eCombustível &7(500L)'

  # ── COMUM PLUS ───────────────────────────────────────────────────── 12%
  lim-armazem:
    type: COMMAND
    chance: 3
    display: '&6Limite de Armazém'
    command: armazem givelimititem {player} 500 1
    amount: 1
    icon:
      material: CACTUS
      data: 0
      glow: true
      display: '&2Limite de Armazém'
      lore:
      - '&7Aumenta quantos cactos o'
      - '&7seu armazém comporta.'
      - ''
      - '&fQuantia: &a500 '

  lim-maquina:
    type: COMMAND
    chance: 2.5
    display: '&9Limite de Máquinas'
    command: maquina givelimite {player} 1 1
    amount: 1
    icon:
      material: INK_SACK
      data: 4
      glow: true
      display: '&9Limite de Máquinas'
      lore:
      - '&7Aumenta quantas máquinas'
      - '&7você pode ter no terreno.'
      - ''
      - '&fQuantia: &91 '

  lim-spawner:
    type: COMMAND
    chance: 2
    display: '&cLimite de Spawners'
    command: spawner givelimite {player} 1 1
    amount: 1
    icon:
      material: INK_SACK
      data: 12
      glow: true
      display: '&bLimite de Spawners'
      lore:
      - '&7Aumenta quantos spawners'
      - '&7você pode ter no terreno.'
      - ''
      - '&fQuantia: &b1 '

  chave-vip:
    type: COMMAND
    chance: 2
    display: '&d&lChave VIP'
    command: crate givekey vip {player} {amount}
    amount: 1
    icon:
      material: TRIPWIRE_HOOK
      glow: true
      display: '&dChave Vip'
      lore:
      - '&7Consiga jogando bastante'
      - '&7no servidor todo dia.'

  chave-boss:
    type: COMMAND
    chance: 1.5
    display: '&c&lChave de Boss'
    command: crate givekey bosses {player} {amount}
    amount: 1
    icon:
      material: TRIPWIRE_HOOK
      glow: true
      display: '&4Chave Bosses'
      lore:
      - '&7Consiga abatendo os bosses'
      - '&7que aparecem no servidor.'

  chave-rankup:
    type: COMMAND
    chance: 1
    display: '&6&lChave RankUP'
    command: crate givekey rankup {player} {amount}
    amount: 1
    icon:
      material: TRIPWIRE_HOOK
      glow: true
      display: '&6Chave RankUP'
      lore:
      - '&7Consiga subindo de rank'
      - '&7ao longo da sua jornada.'

  # ── MEDIANA ─────────────────────────────────────────────────────── 2,5%
  booster-2x:
    type: COMMAND
    chance: 2.5
    display: '&b&lBooster 2x &7(5min)'
    command: pesca givebooster {player} corais 2 5m
    amount: 1
    icon:
      material: POTION
      data: 8203
      display: '&bBooster de Pesca'
      lore:
      - '&7Use este booster para ter'
      - '&7seus ganhos aumentados.'
      - ''
      - ' &8Informações: '
      - ' &8▪ &fTipo: &3Corais '
      - ' &8▪ &fBônus: &a2x '
      - ' &8▪ &fDuração: &75m '
      flags:
      - HIDE_POTION_EFFECTS

  # ── RARA ────────────────────────────────────────────────────────── 0,4%
  caixa-pesca-i:
    type: COMMAND
    chance: 0.4
    display: '&b&lCaixa Pesca &b[T&lI&b]'
    command: caixas give pesca-i {player} {amount}
    amount: 1
    icon:
      material: CHEST
      glow: true
      display: '&b&lCaixa Pesca &b[T&lI&b]'
      lore:
      - '&7Abra e descubra o que a sorte'
      - '&7guardou para você lá dentro.'

  # ── RARO PLUS ─────────────────────────────────────────────────── 0,099%
  skin-coral:
    type: COMMAND
    chance: 0.06
    display: '&3Skin de Coral'
    command: pesca giveskin {player} coral
    amount: 1
    icon:
      material: FISHING_ROD
      glow: true
      display: '&3Skin de Coral'
      lore:
      - ''
      - ' &8Especificações:'
      - '&8 ▪ &fCorais: &a+&l2&a% '
      - '&8 ▪ &fPeso máximo: &c&l6&ckg '

  skin-escama:
    type: COMMAND
    chance: 0.039
    display: '&6Skin de Escama'
    command: pesca giveskin {player} escama
    amount: 1
    icon:
      material: FISHING_ROD
      glow: true
      display: '&6Skin de Escama'
      lore:
      - ''
      - ' &8Especificações:'
      - '&8 ▪ &fCorais: &a+&l5&a% '
      - '&8 ▪ &fPeso máximo: &c&l10&ckg '

  # ── JACKPOT ─────────────────────────────────────────────────────── 0,001%
  jackpot:
    type: COMMAND
    chance: 0.001
    display: '&b&lCaixa Pesca &b[T&lII&b]'
    command: caixas give pesca-ii {player} {amount}
    amount: 1
    icon:
      material: TRAPPED_CHEST
      glow: true
      display: '&b&lCaixa Pesca &b[T&lII&b]'
      lore:
      - '&7Abra e descubra o que a sorte'
      - '&7guardou para você lá dentro.'
