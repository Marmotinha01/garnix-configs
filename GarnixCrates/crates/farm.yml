location: world:83:60:-5

hologram:
  height: 2.3
  lines:
  - '&a&lCAIXA FARM'
  - ''
  - '&aOpções de uso:'
  - '&fBotão esquerdo &8➟ &7Preview'
  - '&fBotão direito &8➟ &7Abrir'

# Slot que esta crate ocupa no menu /crates.
slot: 11

# Item visual no menu de crates.
crate-item:
  glow: true
  material: TRIPWIRE_HOOK
  display: '&aChave Farm'
  lore:
  - '&7Consiga quebrando as suas'
  - '&7plantações no terreno.'

# Item físico da chave (segurar e clicar com botão direito na crate abre).
key-item:
  glow: true
  material: TRIPWIRE_HOOK
  display: '&aChave Farm'
  lore:
  - '&7Consiga quebrando as suas'
  - '&7plantações no terreno.'
  - ''
  - '&aClique esquerdo para armazenar'
  - '&aou abrir a chave em uma caixa.'

# Tipos: CURRENCY, COMMAND, COMMAND_ITEM, ITEM, NONE
#
# FAIXAS desta crate:
#   comum 85% · comum plus 12% · mediana 2,5% ·
#   rara 0,4% · raro plus 0,099% · jackpot 0,001%
#
# ⚠️ Crate NAO tem gate de tier — o jogador do dia 1 e o do dia 20 abrem a
# mesma tabela. Por isso o premio em coins e FIXO e pequeno: no dia 1 e um
# empurrao real, no dia 5 vira ruido. O valor da crate sao os ITENS.
#
# ⚠️ `chance` e PESO, nao porcentagem — Crate.java:100-105 normaliza por
# totalChance. Somar 100 e so legibilidade.
rewards:

  # ── COMUM ────────────────────────────────────────────────────────── 85%
  coins:
    type: CURRENCY
    chance: 47
    currency-id: coins
    amount: '250'
    icon:
      lore:
      - '&fQuantia: &7250 '

  secundaria:
    type: CURRENCY
    chance: 28
    currency-id: sementes
    amount: '25'
    icon:
      lore:
      - '&fQuantia: &725 '

  combustivel:
    type: COMMAND
    chance: 10
    display: '&eCombustível'
    command: maquina givefuel {player} default {amount}
    amount: 500
    icon:
      material: COAL
      display: '&eCombustível &7(500L)'

  # ── COMUM PLUS ───────────────────────────────────────────────────── 12%
  lim-armazem:
    type: COMMAND
    chance: 3
    display: '&6Limite de Armazém'
    command: armazem givelimititem {player} 500 1
    amount: 1
    icon:
      material: CACTUS
      data: 0
      glow: true
      display: '&2Limite de Armazém'
      lore:
      - '&7Aumenta quantos cactos o'
      - '&7seu armazém comporta.'
      - ''
      - '&fQuantia: &a500 '

  lim-maquina:
    type: COMMAND
    chance: 2.5
    display: '&9Limite de Máquinas'
    command: maquina givelimite {player} 1 1
    amount: 1
    icon:
      material: INK_SACK
      data: 4
      glow: true
      display: '&9Limite de Máquinas'
      lore:
      - '&7Aumenta quantas máquinas'
      - '&7você pode ter no terreno.'
      - ''
      - '&fQuantia: &91 '

  lim-spawner:
    type: COMMAND
    chance: 2
    display: '&cLimite de Spawners'
    command: spawner givelimite {player} 1 1
    amount: 1
    icon:
      material: INK_SACK
      data: 12
      glow: true
      display: '&bLimite de Spawners'
      lore:
      - '&7Aumenta quantos spawners'
      - '&7você pode ter no terreno.'
      - ''
      - '&fQuantia: &b1 '

  chave-vip:
    type: COMMAND
    chance: 2
    display: '&d&lChave VIP'
    command: crate givekey vip {player} {amount}
    amount: 1
    icon:
      material: TRIPWIRE_HOOK
      glow: true
      display: '&dChave Vip'
      lore:
      - '&7Consiga jogando bastante'
      - '&7no servidor todo dia.'

  chave-boss:
    type: COMMAND
    chance: 1.5
    display: '&c&lChave de Boss'
    command: crate givekey bosses {player} {amount}
    amount: 1
    icon:
      material: TRIPWIRE_HOOK
      glow: true
      display: '&4Chave Bosses'
      lore:
      - '&7Consiga abatendo os bosses'
      - '&7que aparecem no servidor.'

  chave-rankup:
    type: COMMAND
    chance: 1
    display: '&6&lChave RankUP'
    command: crate givekey rankup {player} {amount}
    amount: 1
    icon:
      material: TRIPWIRE_HOOK
      glow: true
      display: '&6Chave RankUP'
      lore:
      - '&7Consiga subindo de rank'
      - '&7ao longo da sua jornada.'

  # ── MEDIANA ─────────────────────────────────────────────────────── 2,5%
  booster-2x:
    type: COMMAND
    chance: 2.5
    display: '&e&lBooster 2x &7(5min)'
    command: fazenda givebooster {player} coins 2 5m
    amount: 1
    icon:
      material: POTION
      data: 8227
      display: '&eBooster de Fazenda'
      lore:
      - '&7Use este booster para ter'
      - '&7seus ganhos aumentados.'
      - ''
      - ' &8Informações: '
      - ' &8▪ &fTipo: &aCoins '
      - ' &8▪ &fBônus: &a2x '
      - ' &8▪ &fDuração: &75m '
      flags:
      - HIDE_POTION_EFFECTS

  # ── RARA ────────────────────────────────────────────────────────── 0,4%
  caixa-farm-i:
    type: COMMAND
    chance: 0.4
    display: '&a&lCaixa Farm &a[T&lI&a]'
    command: caixas give farm-i {player} {amount}
    amount: 1
    icon:
      material: CHEST
      glow: true
      display: '&a&lCaixa Farm &a[T&lI&a]'
      lore:
      - '&7Abra e descubra o que a sorte'
      - '&7guardou para você lá dentro.'

  # ── RARO PLUS ─────────────────────────────────────────────────── 0,099%
  skin-pedra:
    type: COMMAND
    chance: 0.06
    display: '&8Skin de Pedra'
    command: fazenda giveskin {player} pedra
    amount: 1
    icon:
      material: STONE_HOE
      display: '&8Skin de Pedra'
      lore:
      - ''
      - ' &8Especificações:'
      - '&8 ▪ &6Coins: &a+2.0% '
      - '&8 ▪ &5Sementes: &a+1.0% '
      flags:
      - HIDE_ATTRIBUTES

  skin-ferro:
    type: COMMAND
    chance: 0.039
    display: '&7Skin de Ferro'
    command: fazenda giveskin {player} ferro
    amount: 1
    icon:
      material: IRON_HOE
      display: '&7Skin de Ferro'
      lore:
      - ''
      - ' &8Especificações:'
      - '&8 ▪ &6Coins: &a+5.0% '
      - '&8 ▪ &5Sementes: &a+3.0% '
      flags:
      - HIDE_ATTRIBUTES

  # ── JACKPOT ─────────────────────────────────────────────────────── 0,001%
  jackpot:
    type: COMMAND
    chance: 0.001
    display: '&a&lCaixa Farm &a[T&lII&a]'
    command: caixas give farm-ii {player} {amount}
    amount: 1
    icon:
      material: TRAPPED_CHEST
      glow: true
      display: '&a&lCaixa Farm &a[T&lII&a]'
      lore:
      - '&7Abra e descubra o que a sorte'
      - '&7guardou para você lá dentro.'
