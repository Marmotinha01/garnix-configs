location: world:83:60:-5

hologram:
  height: 2.4
  lines:
  - '&a&lCAIXA FARM'
  - '%crates_stored_farm%'
  - ''
  - '&aOpções de uso:'
  - '&fBotão esquerdo &8➟ &7Preview'
  - '&fBotão direito &8➟ &7Abrir'

# Slot que esta crate ocupa no menu /crates.
slot: 11

# Item visual no menu de crates.
crate-item:
  glow: true
  material: TRIPWIRE_HOOK
  display: '&aChave Farm'
  lore:
  - '&7Consiga recompensas'
  - '&7abrindo essa chave.'

# Item físico da chave (segurar e clicar com botão direito na crate abre).
key-item:
  glow: true
  material: TRIPWIRE_HOOK
  display: '&aChave Farm'
  lore:
  - '&7Consiga recompensas'
  - '&7abrindo essa chave.'
  - ''
  - '&aOpções de uso:'
  - '&fBotão esquerdo &8➟ &7Preview'
  - '&fBotão direito &8➟ &7Armazenar'

# Tipos: CURRENCY, COMMAND, COMMAND_ITEM, ITEM, NONE
#
# FAIXAS desta crate:
#   comum 85% · comum plus 12% · mediana 2,5% ·
#   rara 0,4% · raro plus 0,099% · jackpot 0,001%
#
# ⚠️ Crate NAO tem gate de tier — o jogador do dia 1 e o do dia 20 abrem a
# mesma tabela. Por isso o premio em coins e FIXO e pequeno: no dia 1 e um
# empurrao real, no dia 5 vira ruido. O valor da crate sao os ITENS.
#
# ⚠️ `chance` e PESO, nao porcentagem — Crate.java:100-105 normaliza por
# totalChance. Somar 100 e so legibilidade.
rewards:

  # ── COMUM ────────────────────────────────────────────────────────── 85%
  coins:
    type: CURRENCY
    chance: 47
    currency-id: coins
    amount: '250'
    icon:
      lore:
      - '&fValor: &2$&a{amount}'

  secundaria:
    type: CURRENCY
    chance: 28
    currency-id: sementes
    amount: '25'
    icon:
      lore:
      - '&fValor: &5❋{amount}'

  combustivel:
    type: COMMAND
    chance: 10
    display: '&eCombustível'
    command: maquina givefuel {player} default {amount}
    amount: 500
    icon:
      material: COAL
      display: '&eCombustível'
      lore:
      - '&fLitros: &7{amount}L'

  # ── COMUM PLUS ───────────────────────────────────────────────────── 12%
  lim-armazem:
    type: COMMAND
    chance: 3
    display: '&2Limite de Armazém'
    command: armazem givelimititem {player} {amount} 1
    amount: 500
    icon:
      material: INK_SACK
      data: 2
      glow: true
      display: '&2Limite de Armazém'
      lore:
      - '&fValor: &2∞{amount}'

  lim-maquina:
    type: COMMAND
    chance: 2.5
    display: '&9Limite de Máquinas'
    command: maquina givelimite {player} {amount} 1
    amount: 1
    icon:
      material: INK_SACK
      data: 4
      glow: true
      display: '&9Limite de Máquinas'
      lore:
      - '&fValor: &9∞{amount}'

  lim-spawner:
    type: COMMAND
    chance: 2
    display: '&bLimite de Spawners'
    command: spawner givelimite {player} {amount} 1
    amount: 1
    icon:
      material: INK_SACK
      data: 12
      glow: true
      display: '&bLimite de Spawners'
      lore:
      - '&fValor: &b∞{amount}'

  chave-vip:
    type: COMMAND
    chance: 2
    display: '&dChave VIP'
    command: crate givekey vip {player} {amount}
    amount: 1
    icon:
      material: TRIPWIRE_HOOK
      glow: true
      display: '&dChave VIP'
      lore:
      - '&7Consiga recompensas'
      - '&7abrindo essa chave.'
      - ''
      - '&8▪ &fQuantia: &7{amount}'

  chave-boss:
    type: COMMAND
    chance: 1.5
    display: '&cChave de Boss'
    command: crate givekey bosses {player} {amount}
    amount: 1
    icon:
      material: TRIPWIRE_HOOK
      glow: true
      display: '&4Chave Bosses'
      lore:
      - '&7Consiga recompensas'
      - '&7abrindo essa chave.'
      - ''
      - '&8▪ &fQuantia: &7{amount}'

  chave-rankup:
    type: COMMAND
    chance: 1
    display: '&6Chave RankUP'
    command: crate givekey rankup {player} {amount}
    amount: 1
    icon:
      material: TRIPWIRE_HOOK
      glow: true
      display: '&6Chave RankUP'
      lore:
      - '&7Consiga recompensas'
      - '&7abrindo essa chave.'
      - ''
      - '&8▪ &fQuantia: &7{amount}'

  # ── MEDIANA ─────────────────────────────────────────────────────── 2,5%
  booster-sementes-2x:
    type: COMMAND
    chance: 1.5
    display: '&eBooster de Fazenda'
    command: fazenda givebooster {player} sementes 2 5m {amount}
    amount: 1
    icon:
      material: POTION
      data: 8227
      display: '&eBooster de Fazenda'
      lore:
      - '&7Use este booster para ter'
      - '&7seus ganhos aumentados.'
      - ''
      - ' &8Informações: '
      - ' &8▪ &fTipo: &5Sementes '
      - ' &8▪ &fBônus: &a2x '
      - ' &8▪ &fDuração: &75m '
      flags:
      - HIDE_POTION_EFFECTS

  booster-coins-2x:
    type: COMMAND
    chance: 1
    display: '&eBooster de Fazenda'
    command: fazenda givebooster {player} coins 2 5m {amount}
    amount: 1
    icon:
      material: POTION
      data: 8227
      display: '&eBooster de Fazenda'
      lore:
      - '&7Use este booster para ter'
      - '&7seus ganhos aumentados.'
      - ''
      - ' &8Informações: '
      - ' &8▪ &fTipo: &aCoins '
      - ' &8▪ &fBônus: &a2x '
      - ' &8▪ &fDuração: &75m '
      flags:
      - HIDE_POTION_EFFECTS

  # ── RARA ────────────────────────────────────────────────────────── 0,4%
  caixa-farm-i:
    type: COMMAND
    chance: 0.4
    display: '&aCaixa Farm &a[Tier &lI&a]'
    command: caixas give farm-i {player} {amount}
    amount: 1
    icon:
      material: CHEST
      display: '&aCaixa Farm &a[Tier &lI&a]'
      lore:
      - '&7Abra e descubra o que a sorte'
      - '&7guardou para você lá dentro.'

  # ── RARO PLUS ─────────────────────────────────────────────────── 0,099%
  skin-pedra:
    type: COMMAND
    chance: 0.06
    display: '&7Skin de Pedra'
    command: fazenda giveskin {player} pedra {amount}
    amount: 1
    icon:
      material: STONE_HOE
      display: '&7Skin de Pedra'
      lore:
      - ''
      - ' &8Especificações: '
      - '&8 ▪ &a+&l2&a% Coins '
      - '&8 ▪ &5+&l1&5% Sementes '
      flags:
      - HIDE_ATTRIBUTES

  skin-ferro:
    type: COMMAND
    chance: 0.039
    display: '&fSkin de Ferro'
    command: fazenda giveskin {player} ferro {amount}
    amount: 1
    icon:
      material: IRON_HOE
      display: '&fSkin de Ferro'
      lore:
      - ''
      - ' &8Especificações: '
      - '&8 ▪ &a+&l5&a% Coins '
      - '&8 ▪ &5+&l3&5% Sementes '
      flags:
      - HIDE_ATTRIBUTES

  # ── JACKPOT ─────────────────────────────────────────────────────── 0,001%
  jackpot:
    type: COMMAND
    chance: 0.001
    display: '&aCaixa Farm &a[Tier &lII&a]'
    command: caixas give farm-ii {player} {amount}
    amount: 1
    icon:
      material: CHEST
      display: '&aCaixa Farm &a[Tier &lII&a]'
      lore:
      - '&7Abra e descubra o que a sorte'
      - '&7guardou para você lá dentro.'

  # ── AZAR ────────────────────────────────────────────────────────── 25%
  # type: NONE = slot vazio de verdade. O RewardDelivery pula a entrega
  # (RewardDelivery.java:60), entao o jogador ve o giro parar aqui e nao
  # recebe absolutamente nada. Aparece no preview, some do /crates manage
  # (nao da para filtrar o azar) e NUNCA e turbinado por robo.
  #
  # Peso 33,3333 sobre os 100 dos premios: 33,3333/133,3333 = 25% das
  # aberturas, ou 250 a cada 1.000. Os pesos acima ficaram intactos — o
  # que muda e que cada um agora vale 0,75x do que valia (47 = 35,25%).
  azar:
    type: NONE
    chance: 33.3333
    display: '&8Azar'
    icon:
      material: WEB
      display: '&8Azar'
      lore:
      - '&7Não foi dessa vez.'