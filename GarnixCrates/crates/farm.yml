location: world:83:60:-5

hologram:
  height: 2.4
  lines:
  - '&a&lCAIXA FARM'
  - '%crates_stored_farm%'
  - ''
  - '&aOpções de uso:'
  - '&fBotão esquerdo &8➟ &7Preview'
  - '&fBotão direito &8➟ &7Abrir'

# Slot que esta crate ocupa no menu /crates.
slot: 11

# Item visual no menu de crates.
crate-item:
  glow: true
  material: TRIPWIRE_HOOK
  display: '&aChave Farm'
  lore:
  - '&7Consiga recompensas'
  - '&7abrindo essa chave.'

# Item físico da chave (segurar e clicar com botão direito na crate abre).
key-item:
  glow: true
  material: TRIPWIRE_HOOK
  display: '&aChave Farm'
  lore:
  - '&7Consiga recompensas'
  - '&7abrindo essa chave.'
  - ''
  - '&aOpções de uso:'
  - '&fBotão esquerdo &8➟ &7Preview'
  - '&fBotão direito &8➟ &7Armazenar'

# Tipos: CURRENCY, COMMAND, COMMAND_ITEM, ITEM, NONE
#
# FAIXAS desta crate:
#   comum 83% · comum plus 12% · armadura 2% · mediana 2,5% ·
#   rara 0,4% · raro plus 0,099% · jackpot 0,001%
#
# ⚠️ Crate NAO tem gate de tier — o jogador do dia 1 e o do dia 20 abrem a
# mesma tabela. Por isso o premio em coins e FIXO e pequeno: no dia 1 e um
# empurrao real, no dia 5 vira ruido. O valor da crate sao os ITENS.
#
# ⚠️ `chance` e PESO, nao porcentagem — Crate.java:100-105 normaliza por
# totalChance. Somar 100 e so legibilidade.
#
# ⚠️ A faixa ARMADURA e a T-I INTEIRA — as quatro pecas, peso igual. E o
# tier mais fraco de todos (+1,5% coins, +1% sementes e +1% XP por peca),
# entao ele pode viver na crate, que nao tem gate: no dia 1 e um empurrao,
# no dia 20 e ruido. Os tiers II a V continuam so nas caixas misteriosas.
#
# ⚠️ Peca INDIVIDUAL, nunca a colecao: `givearmor tier-i` sem o sufixo de
# slot entrega o set inteiro num drop so. O `{amount}` no fim e o padrao de
# todo item fisico do servidor — skin e armadura passam a quantia sorteada.
rewards:

  # -- COMUM ---------------------------------------------------------- 83%
  coins:
    type: CURRENCY
    chance: 45
    currency-id: coins
    amount: '250'
    icon:
      lore:
      - '&fValor: &2$&a{amount}'

  secundaria:
    type: CURRENCY
    chance: 28
    currency-id: sementes
    amount: '25'
    icon:
      lore:
      - '&fValor: &5❋{amount}'

  combustivel:
    type: COMMAND
    chance: 10
    display: '&eCombustível'
    command: maquina givefuel {player} default {amount}
    amount: 500
    icon:
      material: COAL
      display: '&eCombustível'
      lore:
      - '&fLitros: &7{amount}L'

  # -- COMUM PLUS ----------------------------------------------------- 12%
  lim-armazem:
    type: COMMAND
    chance: 3
    display: '&2Limite de Armazém'
    command: armazem givelimititem {player} {amount} 1
    amount: 500
    icon:
      material: INK_SACK
      data: 2
      glow: true
      display: '&2Limite de Armazém'
      lore:
      - '&fValor: &2∞{amount}'

  lim-maquina:
    type: COMMAND
    chance: 2.5
    display: '&9Limite de Máquinas'
    command: maquina givelimite {player} {amount} 1
    amount: 1
    icon:
      material: INK_SACK
      data: 4
      glow: true
      display: '&9Limite de Máquinas'
      lore:
      - '&fValor: &9∞{amount}'

  lim-spawner:
    type: COMMAND
    chance: 2
    display: '&bLimite de Spawners'
