  chave-vip:
    type: COMMAND
    chance: 2
    display: '&dChave VIP'
    command: crate givekey vip {player} {amount}
    amount: 1
    icon:
      material: TRIPWIRE_HOOK
      glow: true
      display: '&dChave VIP'
      lore:
      - '&7Consiga recompensas'
      - '&7abrindo essa chave.'
      - ''
      - '&8 ▪ &fQuantia: &7x{amount}'

