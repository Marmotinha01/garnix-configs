  - '&6&lCAIXA RANKUP'
  - ''
  - '&6Opções de uso:'
  - '&fBotão esquerdo &8➟ &7Preview'
  - '&fBotão direito &8➟ &7Abrir'

# Slot que esta crate ocupa no menu /crates.
slot: 15

# Item visual no menu de crates.
crate-item:
  glow: true
  material: TRIPWIRE_HOOK
  display: '&6Chave Rankup'
  lore:
  - '&7Consiga subindo de rank'
  - '&7ao longo da sua jornada.'

# Item físico da chave (segurar e clicar com botão direito na crate abre).
key-item:
  glow: true
  material: TRIPWIRE_HOOK
  display: '&6Chave Rankup'
  lore:
  - '&7Consiga subindo de rank'
  - '&7ao longo da sua jornada.'
  - ''
  - '&6Clique esquerdo para armazenar'
  - '&6ou abrir a chave em uma caixa.'

# Tipos disponíveis: CURRENCY, COMMAND, COMMAND_ITEM, ITEM, NONE
rewards:
  azar:
    type: NONE
    chance: 0.5
    display: '&cAzar!'
    icon:
      material: BARRIER
      display: '&c&lAzar!'
      lore:
      - '&7Não foi dessa vez!'
  
  coins:
    type: CURRENCY
    chance: 50.0
    display: '&6Moedas'
    currency-id: coins
    amount: 5000
    icon:
      material: DOUBLE_PLANT
      display: '&6&lMoedas'
  
  xp:
    type: COMMAND
    chance: 25.0
    display: '&aExperiência'
    command: xp {amount} {player}
    amount: 500
    icon:
      material: EXP_BOTTLE
      display: '&aExperiência'
  
  stone:
    type: COMMAND_ITEM
    chance: 15.0
    display: '&9Pedra'
    command: give {player} minecraft:stone {amount}
    amount: 100
    item:
      material: STONE
      display: '&9Pedra'
      lore:
      - '&7Pedra TOP!'
  
  diamonds:
    type: ITEM
    chance: 8.0
    display: '&bDiamantes'
    item:
      material: DIAMOND
      amount: 5
      display: '&b&lDiamantes'
  
  leather-armor:
    type: ITEM
    chance: 1.5
    display: '&cArmadura Vermelha'
    item:
      material: LEATHER_CHESTPLATE
      color: '#FF5555'
      display: '&cArmadura Vermelha'
      lore:
      - '&7Uma armadura de couro vermelha!'
