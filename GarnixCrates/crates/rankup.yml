# Tipos: CURRENCY, COMMAND, COMMAND_ITEM, ITEM, NONE
#
# FAIXAS desta crate (DESLOCADAS PARA CIMA de proposito):
#   comum 60% · comum plus 28% · mediana 9% · mediana plus 2,3% ·
#   raríssima 0,699% · jackpot 0,001%
#
# ⚠️ O jackpot e o Cash 500, com peso 0,001 como o das outras crates — a regra do
# servidor e "cash e sempre jackpot".
#
# ⚠️ As caixas da faixa RARÍSSIMA sao ordenadas pelo `weight` do menu /caixas,
# que e a ordem de raridade oficial do servidor — quanto MAIOR o weight, mais
# rara: boosters 140 (0,4) · robos 160 (0,2) · caixas 170 (0,099).
# A Caixa Chaves (weight 80) subiu para a `mediana plus` por ser bem mais comum
# que as tres, e o preco em cash confirma (Caixa Robos custa 1.200 cash).
#
# ⚠️ A rankup e a EXCECAO do servidor e tem que ser. O volume dela e ~20 chaves
# por volta de prestigio, contra as ~18.000/dia da mineracao — e a unica cujo
# topo pode ser generoso sem inflar nada. E por isso que a faixa comum dela e so
# 60%, contra 82-83% das crates de profissao.
#
# ⚠️ Crate NAO tem gate de tier — o jogador do dia 1 e o do dia 20 abrem a
# mesma tabela. Por isso o premio em coins e pequeno.
#
# ⚠️ MOEDA E LIMITE SAO ESCADAS. O peso da FAMILIA nao mudou (coins 32,
# dracmas 28, limites 28) — o que mudou e que ele agora esta repartido. Se mexer
# num degrau, mexa nos outros: a soma da familia e o que mantem o arquivo em 100.
#
# ⚠️ A RankUP e a crate mais alta da escada de moeda: paga 4x a crate de
# profissao (250/500/1.000) e 2x a VIP (500/1.000/2.000). As tres usam a mesma
# razao x2, entao da para mover a crate inteira multiplicando por 2.
#
#   coins    1.000 · 2.000 · 4.000   pesos 19,2 · 9,6 · 3,2   (60/30/10)
#   dracmas    500 · 1.000 · 2.000   pesos 16,8 · 8,4 · 2,8   (60/30/10)
#
# ⚠️ Dracmas e a moeda de SPAWNER — a escada de precos vai de 22 (PIG) a 7.040
# (WITHER). Os 500 do degrau de baixo compram um WOLF (500); os 2.000 do topo
# chegam no GUARDIAN (2.200). Era 25, que nao comprava nem o porco.
#
# ⚠️ Os tres limites sao repartidos por VALOR, na razao 6:3:1 — o cash shop
# cobra 800 (armazem), 1.500 (maquina) e 4.000 (spawner). Sao QUATRO degraus
# aqui, 5·15·30·50, com peso 50/30/15/5 (a basica usa tres, 1·3·5).
#
#   armazem  5 · 15 · 30 · 50   pesos 8,4 · 5,04 · 2,52 · 0,84   (familia 16,8)
#   maquina  5 · 15 · 30 · 50   pesos 4,2 · 2,52 · 1,26 · 0,42   (familia 8,4)
#   spawner  5 · 15 · 30 · 50   pesos 1,4 · 0,84 · 0,42 · 0,14   (familia 2,8)
#
# ⚠️ A familia de limites vale 28 de peso aqui — o MESMO que dracmas e quase o
# mesmo que coins. Nas outras crates ela vale 7,5 ou 12. Se a ideia e "limite e
# mais raro que moeda", esta e a crate que ainda precisa de uma decisao.
#
# ⚠️ `chance` e PESO, nao porcentagem — Crate.java:100-105 normaliza por
# totalChance. Somar 100 e so legibilidade (o azar entra por cima, ver no fim).
