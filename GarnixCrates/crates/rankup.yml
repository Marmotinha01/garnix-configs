location: world:83:60:5

hologram:
  height: 2.3
  lines:
  - '&6&lCAIXA RANKUP'
  - ''
  - '&6Opções de uso:'
  - '&fBotão esquerdo &8➟ &7Preview'
  - '&fBotão direito &8➟ &7Abrir'

# Slot que esta crate ocupa no menu /crates.
slot: 15

# Item visual no menu de crates.
crate-item:
  glow: true
  material: TRIPWIRE_HOOK
  display: '&6Chave Rankup'
  lore:
  - '&7Consiga subindo de rank'
  - '&7ao longo da sua jornada.'

# Item físico da chave (segurar e clicar com botão direito na crate abre).
key-item:
  glow: true
  material: TRIPWIRE_HOOK
  display: '&6Chave Rankup'
  lore:
  - '&7Consiga subindo de rank'
  - '&7ao longo da sua jornada.'
  - ''
  - '&6Clique esquerdo para armazenar'
  - '&6ou abrir a chave em uma caixa.'

# Tipos: CURRENCY, COMMAND, COMMAND_ITEM, ITEM, NONE
#
# FAIXAS (ver 15-LOOT.md): recheio · bom · raro · epico · jackpot.
# Calibradas para ~20.700 aberturas/dia no servidor inteiro.
#
# ⚠️ Crate NAO tem gate de tier — o jogador do dia 1 e o do dia 20 abrem a
# mesma tabela. Por isso o premio em coins e FIXO e pequeno: no dia 1 e um
# empurrao real, no dia 5 vira ruido. O valor da crate sao os ITENS.
rewards:

  coins:
    type: CURRENCY
    chance: 27
    display: '&6Moedas'
    currency-id: coins
    amount: '250'
  xp:
    type: COMMAND
    chance: 18
    display: '&aExperiência'
    command: xp {amount} {player}
    amount: 500
    icon:
      material: EXP_BOTTLE
      display: '&aExperiência'

  secundaria:
    type: CURRENCY
    chance: 15
    display: '&bdracmas'
    currency-id: dracmas
    amount: '25'
  combustivel:
    type: COMMAND
    chance: 12
    display: '&eCombustível'
    command: maquina givefuel {player} default {amount}
    amount: 500
    icon:
      material: COAL
      display: '&eCombustível &7(500L)'

  fragmento:
    type: COMMAND
    chance: 9
    display: '&dFragmento'
    command: fragmentos givevirtual {player} fogo {amount}
    amount: 5
    icon:
      material: BLAZE_POWDER
      display: '&dFragmento de Fogo'

  secundaria-lote:
    type: CURRENCY
    chance: 9
    display: '&bdracmas (lote)'
    currency-id: dracmas
    amount: '500'
  chave-boss:
    type: COMMAND
    chance: 5.1
    display: '&c&lChave de Boss'
    command: crates givevirtualkey bosses {player} {amount}
    amount: 1
    icon:
      material: TRIPWIRE_HOOK
      glow: true
      display: '&c&lChave de Boss'

  armadura-baixa:
    type: COMMAND
    chance: 2.125
    display: '&7Peça de Armadura &7[T&lII&7]'
    command: mina givearmor {player} tier-ii_helmet
    amount: 1
    icon:
      material: IRON_CHESTPLATE
      display: '&7Peça de Armadura &7[T&lII&7]'

  livro:
    type: COMMAND
    chance: 1.275
    display: '&dLivro de Ceifador 2'
    command: lamina givebook {player} ceifador 2
    amount: 1
    icon:
      material: ENCHANTED_BOOK
      glow: true
      display: '&dLivro de Ceifador 2'

  armadura-alta:
    type: COMMAND
    chance: 0.725
    display: '&6Peça de Armadura &6[T&lIV&6]'
    command: mina givearmor {player} tier-iv_chestplate
    amount: 1
    icon:
      material: DIAMOND_CHESTPLATE
      glow: true
      display: '&6Peça de Armadura &6[T&lIV&6]'

  skin:
    type: COMMAND
    chance: 0.435
    display: '&5Skin safira'
    command: mina giveskin {player} safira
    amount: 1
    icon:
      material: NETHER_STAR
      glow: true
      display: '&5Skin safira'

  booster-3x:
    type: COMMAND
    chance: 0.29
    display: '&d&lBooster 3x &7(10min)'
    command: mina givebooster {player} coins 3 10m
    amount: 1
    icon:
      material: POTION
      glow: true
      display: '&d&lBooster 3x &7(10min)'

  jackpot:
    type: COMMAND
    chance: 0.05
    display: '&b&lMáquina de Cash'
    command: maquina give {player} CASH
    amount: 1
    icon:
      material: BEACON
      glow: true
      display: '&b&lMáquina de Cash'
      lore:
      - '&7O prêmio mais raro desta caixa.'
