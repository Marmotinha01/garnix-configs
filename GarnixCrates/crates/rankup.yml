location: world:83:60:5

hologram:
  height: 2.4
  lines:
  - '&6&lCAIXA RankUP'
  - '%crates_stored_rankup%'
  - ''
  - '&6Opções de uso:'
  - '&fBotão esquerdo &8➟ &7Preview'
  - '&fBotão direito &8➟ &7Abrir'

# Slot que esta crate ocupa no menu /crates.
slot: 15

# Item visual no menu de crates.
crate-item:
  glow: true
  material: TRIPWIRE_HOOK
  display: '&6Chave RankUP'
  lore:
  - '&7Consiga subindo de rank'
  - '&7ao longo da sua jornada.'

# Item físico da chave (segurar e clicar com botão direito na crate abre).
key-item:
  glow: true
  material: TRIPWIRE_HOOK
  display: '&6Chave RankUP'
  lore:
  - '&7Consiga subindo de rank'
  - '&7ao longo da sua jornada.'
  - ''
  - '&6Opções de uso:'
  - '&fBotão esquerdo &8➟ &7Preview'
  - '&fBotão direito &8➟ &7Armazenar'

# Tipos: CURRENCY, COMMAND, COMMAND_ITEM, ITEM, NONE
#
# FAIXAS desta crate (DESLOCADAS PARA CIMA de proposito):
#   comum 60% · comum plus 30% · mediana 7% · mediana plus 2% ·
#   raríssima 0,95% · jackpot 0,05%
#
# ⚠️ A rankup e a EXCECAO do servidor e tem que ser. O volume dela e ~20 chaves
# por volta de prestigio, contra as ~18.000/dia da mineracao — e a unica cujo
# topo pode ser generoso sem inflar nada. Por isso o jackpot dela e 50x mais
# provavel que o das outras (0,05% contra 0,001%) e a faixa comum e so 60%.
#
# ⚠️ Crate NAO tem gate de tier — o jogador do dia 1 e o do dia 20 abrem a
# mesma tabela. Por isso o premio em coins e FIXO e pequeno.
#
# ⚠️ `chance` e PESO, nao porcentagem — Crate.java:100-105 normaliza por
# totalChance. Somar 100 e so legibilidade (o azar entra por cima, ver no fim).
rewards:

  # ── COMUM ────────────────────────────────────────────────────────── 60%
  coins:
    type: CURRENCY
    chance: 32
    currency-id: coins
    amount: '250'
    icon:
      lore:
      - '&fValor: &2$&a{amount}'

  dracmas:
    type: CURRENCY
    chance: 28
    currency-id: dracmas
    amount: '25'
    icon:
      lore:
      - '&fValor: &e✆{amount}'

  # ── COMUM PLUS ───────────────────────────────────────────────────── 30%
  lim-armazem:
    type: COMMAND
    chance: 12
    display: '&2Limite de Armazém'
    command: armazem givelimititem {player} {amount} 1
    amount: 500
    icon:
      material: INK_SACK
      data: 2
      glow: true
      display: '&2Limite de Armazém'
      lore:
      - '&fValor: &2∞{amount}'

  lim-maquina:
    type: COMMAND
    chance: 10
    display: '&9Limite de Máquinas'
    command: maquina givelimite {player} {amount} 1
    amount: 1
    icon:
      material: INK_SACK
      data: 4
      glow: true
      display: '&9Limite de Máquinas'
      lore:
      - '&fValor: &9∞{amount}'

  lim-spawner:
    type: COMMAND
    chance: 8
    display: '&bLimite de Spawners'
    command: spawner givelimite {player} {amount} 1
    amount: 1
    icon:
      material: INK_SACK
      data: 12
      glow: true
      display: '&bLimite de Spawners'
      lore:
      - '&fValor: &b∞{amount}'

  # ── MEDIANA ───────────────────────────────────────────────────────── 7%
  chaves-boss-5:
    type: COMMAND
    chance: 4
    display: '&cChave de Boss'
    command: crate givekey bosses {player} {amount}
    amount: 5
    icon:
      material: TRIPWIRE_HOOK
      glow: true
      display: '&4Chave Bosses'
      lore:
      - '&7Consiga recompensas'
      - '&7abrindo essa chave.'
      - ''
      - '&8▪ &fQuantia: &7{amount}'

  caixa-runas:
    type: COMMAND
    chance: 3
    display: '&5Caixa Runas'
    command: caixas give runas {player} {amount}
    amount: 1
    icon:
      material: TRAPPED_CHEST
      display: '&5Caixa Runas'
      lore:
      - '&7Abra e descubra o que a sorte'
      - '&7guardou para você lá dentro.'

  # ── MEDIANA PLUS ──────────────────────────────────────────────────── 2%
  chaves-boss-10:
    type: COMMAND
    chance: 2
    display: '&cChave de Boss'
    command: crate givekey bosses {player} {amount}
    amount: 10
    icon:
      material: TRIPWIRE_HOOK
      glow: true
      display: '&4Chave Bosses'
      lore:
      - '&7Consiga recompensas'
      - '&7abrindo essa chave.'
      - ''
      - '&8▪ &fQuantia: &7{amount}'

  # ── RARÍSSIMA ───────────────────────────────────────────────────── 0,95%
  cash:
    type: CURRENCY
    chance: 0.3
    currency-id: coins
    amount: '100'
    icon:
      lore:
      - '&fValor: &6❂{amount}'

  caixa-boosters:
    type: COMMAND
    chance: 0.25
    display: '&aCaixa Booster'
    command: caixas give boosters {player} {amount}
    amount: 1
    icon:
      material: TRAPPED_CHEST
      display: '&aCaixa Booster'
      lore:
      - '&7Abra e descubra o que a sorte'
      - '&7guardou para você lá dentro.'

  caixa-caixas:
    type: COMMAND
    chance: 0.2
    display: '&dCaixa Caixas'
    command: caixas give caixas {player} {amount}
    amount: 1
    icon:
      material: ENDER_CHEST
      display: '&dCaixa Caixas'
      lore:
      - '&7Abra e descubra o que a sorte'
      - '&7guardou para você lá dentro.'

  caixa-robos:
    type: COMMAND
    chance: 0.2
    display: '&cCaixa Robôs'
    command: caixas give robos {player} {amount}
    amount: 1
    icon:
      material: TRAPPED_CHEST
      display: '&cCaixa Robôs'
      lore:
      - '&7Abra e descubra o que a sorte'
      - '&7guardou para você lá dentro.'

  # ── JACKPOT ──────────────────────────────────────────────────────── 0,05%
  jackpot:
    type: COMMAND
    chance: 0.05
    display: '&6Caixa Garnix'
    command: caixas give garnix {player} {amount}
    amount: 1
    icon:
      material: ENDER_CHEST
      display: '&6Caixa Garnix'
      lore:
      - '&7Abra e descubra o que a sorte'
      - '&7guardou para você lá dentro.'

  # ── AZAR ────────────────────────────────────────────────────────── 25%
  # type: NONE = slot vazio de verdade. O RewardDelivery pula a entrega
  # (RewardDelivery.java:60), entao o jogador ve o giro parar aqui e nao
  # recebe absolutamente nada. Aparece no preview, some do /crates manage
  # (nao da para filtrar o azar) e NUNCA e turbinado por robo.
  #
  # Peso 33,3333 sobre os 100 dos premios: 33,3333/133,3333 = 25% das
  # aberturas, ou 250 a cada 1.000.
  azar:
    type: NONE
    chance: 33.3333
    display: '&8Azar'
    icon:
      material: WEB
      display: '&8Azar'
      lore:
      - '&7Não foi dessa vez.'