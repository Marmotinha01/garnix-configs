# Tipos: CURRENCY, COMMAND, COMMAND_ITEM, ITEM, NONE
#
# FAIXAS desta crate (os numeros sao PESO):
#   comum 60 · comum plus 28 · comum plus plus 10 · raro 1,55 ·
#   rarissimo 0,4 · jackpot 0,05 · azar 33,3333
#
# ⚠️ A ESCADA DE LIMITE DESTA CRATE COMECA EM 15, nao em 5, e vai ate 100 —
# 15 no comum, 30 no comum plus, 50 no comum plus plus e 100 no rarissimo.
# E a unica crate que entrega limite de 100, e a unica sem o degrau de 5.
# A escada de moeda tambem sobe uma faixa por degrau, como na VIP.
#
# ⚠️ A rankup e a EXCECAO do servidor e tem que ser. O volume dela e ~20 chaves
# por volta de prestigio, contra as ~18.000/dia da mineracao — e a unica cujo
# topo pode ser generoso sem inflar nada. E por isso que a faixa comum dela e so
# 60 de peso, contra 82-83 das crates de profissao.
#
# ⚠️ As recompensas estao ORDENADAS POR FAIXA no arquivo, e cada separador traz
# a soma da faixa. Se mover um bloco de lugar, mova para dentro da faixa certa —
# senao o comentario passa a mentir sobre o que vem depois dele.
#
# ⚠️ Crate NAO tem gate de tier — o jogador do dia 1 e o do dia 20 abrem a
# mesma tabela. Por isso o premio em coins e pequeno.
#
# ⚠️ A RankUP e a crate mais alta da escada de moeda: paga 4x a crate de
# profissao (250/500/1.000) e 2x a VIP (500/1.000/2.000).
#
#   coins    1.000 (comum) · 2.000 (comum plus) · 4.000 (comum plus plus)
#   dracmas    500 (comum) · 1.000 (comum plus) · 2.000 (comum plus plus)
#
# ⚠️ Dracmas e a moeda de SPAWNER — a escada de precos vai de 22 (PIG) a 7.040
# (WITHER). Os 500 do degrau de baixo compram um WOLF (500); os 2.000 do topo
# chegam no GUARDIAN (2.200).
#
# ⚠️ Os tres limites sao repartidos por VALOR, na razao 6:3:1 — o cash shop
# cobra 800 (armazem), 1.500 (maquina) e 4.000 (spawner):
#
#   armazem  9 (15) · 3,6 (30) · 1,8 (50) · 0,24 (100)
#   maquina  4,5    · 1,8      · 0,9      · 0,12
#   spawner  1,5    · 0,6      · 0,3      · 0,04
#
# ⚠️ `chance` e PESO, nao porcentagem — Crate.java:100-105 normaliza por
# totalChance. Somar 100 e so legibilidade (o azar entra por cima, ver no fim).
rewards:

  # -- COMUM ------------------------------------------------- peso 60
  coins-4000:
    type: CURRENCY
    chance: 22
    currency-id: coins
    amount: '4000'
    icon:
      lore:
      - '&fValor: &2$&a{amount}'

