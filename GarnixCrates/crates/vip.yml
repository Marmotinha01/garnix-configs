# Tipos: CURRENCY, COMMAND, COMMAND_ITEM, ITEM, NONE
#
# FAIXAS desta crate (os numeros sao PESO):
#   comum 62 · comum plus 27 · comum plus plus 8 · raro 2,5 ·
#   rarissimo 0,45 · jackpot 0,05 · azar 33,3333
#
# ⚠️ AS CAIXAS AQUI NAO SEGUEM O `weight` DO MENU /caixas, e e decisao do dono.
# Pela ordem oficial de raridade a Caixa Skins I (weight 40) seria a mais comum
# das sete e a Caixa Chaves (weight 80) viria so em 4o. Nesta crate e o inverso:
# Chaves e Recursos sao COMUM e Skins I e RARO. A VIP e crate paga, e a chave e
# o que se quer entregar. Nas outras crates a ordem do menu continua valendo.
#
# ⚠️ As recompensas estao ORDENADAS POR FAIXA no arquivo, e cada separador traz
# a soma da faixa. Se mover um bloco de lugar, mova para dentro da faixa certa —
# senao o comentario passa a mentir sobre o que vem depois dele.
#
# ⚠️ Crate NAO tem gate de tier — o jogador do dia 1 e o do dia 20 abrem a
# mesma tabela. Por isso o premio em coins e pequeno: no dia 1 e um empurrao
# real, no dia 5 vira ruido. O valor da crate sao os ITENS.
#
# ⚠️ MOEDA E LIMITE SAO ESCADAS de 3 e 4 degraus, e os degraus agora vivem em
# FAIXAS DIFERENTES: 500/300 no comum, 1.000/600 no comum plus, 2.000/1.200 no
# comum plus plus; limite 5 no comum, 15 no comum plus, 30 no comum plus plus e
# 50 no raro. Subir um degrau de faixa e o que separa esta crate das de profissao.
#
# ⚠️ A VIP fica UM DEGRAU ACIMA das crates de profissao (que pagam 250/500/1.000
# de coins) e UM ABAIXO da RankUP (1.000/2.000/4.000). As tres escadas usam a
# mesma razao x2, entao da para mover a crate inteira multiplicando por 2.
#
#   coins    500 · 1.000 · 2.000   pesos 24,8 · 12,3 · 3,9   (60/30/10)
#   dracmas  300 ·   600 · 1.200   pesos 22,8 · 11,4 · 3,8   (60/30/10)
#
# ⚠️ Dracmas e a moeda de SPAWNER — a escada de precos vai de 22 (PIG) a 7.040
# (WITHER). Os 300 do degrau de baixo compram um BAT (228); os 1.200 do topo
# chegam perto do PIG_ZOMBIE (1.460). Era 25, que nao comprava nem o porco.
#
# ⚠️ Os tres limites sao repartidos por VALOR, na razao 6:3:1 — o cash shop
# cobra 800 (armazem), 1.500 (maquina) e 4.000 (spawner). Sao QUATRO degraus
# aqui, 5·15·30·50, com peso 50/30/15/5 (a basica usa tres, 1·3·5).
#
#   armazem  5 · 15 · 30 · 50   pesos 3,6 · 2,16 · 1,08 · 0,36   (familia 7,2)
#   maquina  5 · 15 · 30 · 50   pesos 1,8 · 1,08 · 0,54 · 0,18   (familia 3,6)
#   spawner  5 · 15 · 30 · 50   pesos 0,6 · 0,36 · 0,18 · 0,06   (familia 1,2)
#
# ⚠️ O degrau de cima de cada moeda fica ABAIXO de 3,999999 de proposito: esse
# e o teto real do boost de robo (total 133,3333 x 3 / 100), e um peso 4 cravado
# ficaria de fora do rate-up por 0,000001. Nao arredonde 3,9 para 4.
#
# ⚠️ Esta e a crate de MAIOR VOLUME do servidor: cada ativacao de VIP da uma
# chave para TODOS os online. E por isso que o topo dela e caixa e robo — item
# que nao inflaciona moeda — e que o cash do jackpot e um evento raro.
#
# ⚠️ `chance` e PESO, nao porcentagem — Crate.java:100-105 normaliza por
# totalChance. Somar 100 e so legibilidade (o azar entra por cima, ver no fim).
