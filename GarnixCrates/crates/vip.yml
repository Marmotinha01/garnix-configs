location: world:81:60:7

hologram:
  height: 2.4
  lines:
  - '&d&lCAIXA VIP'
  - '%crates_stored_vip%'
  - ''
  - '&dOpções de uso:'
  - '&fBotão esquerdo &8➟ &7Preview'
  - '&fBotão direito &8➟ &7Abrir'

# Slot que esta crate ocupa no menu /crates.
slot: 16

# Item visual no menu de crates.
crate-item:
  glow: true
  material: TRIPWIRE_HOOK
  display: '&dChave VIP'
  lore:
  - '&7Consiga jogando bastante'
  - '&7no servidor todo dia.'

# Item físico da chave (segurar e clicar com botão direito na crate abre).
key-item:
  glow: true
  material: TRIPWIRE_HOOK
  display: '&dChave VIP'
  lore:
  - '&7Consiga jogando bastante'
  - '&7no servidor todo dia.'
  - ''
  - '&dOpções de uso:'
  - '&fBotão esquerdo &8➟ &7Preview'
  - '&fBotão direito &8➟ &7Armazenar'

# Tipos: CURRENCY, COMMAND, COMMAND_ITEM, ITEM, NONE
#
# FAIXAS desta crate:
#   comum 84% · comum plus 12% · mediana 2,5% · mediana plus 1% ·
#   rara 0,4% · raríssima 0,099% · jackpot 0,001%
#
# ⚠️ Crate NAO tem gate de tier — o jogador do dia 1 e o do dia 20 abrem a
# mesma tabela. Por isso o premio em coins e FIXO e pequeno: no dia 1 e um
# empurrao real, no dia 5 vira ruido. O valor da crate sao os ITENS.
#
# ⚠️ Esta e a crate de MAIOR VOLUME do servidor: cada ativacao de VIP da uma
# chave para TODOS os online. E por isso que o topo dela e caixa e robo — item
# que nao inflaciona moeda — e que o cash do jackpot e um evento raro.
#
# ⚠️ `chance` e PESO, nao porcentagem — Crate.java:100-105 normaliza por
# totalChance. Somar 100 e so legibilidade (o azar entra por cima, ver no fim).
rewards:

  # ── COMUM ────────────────────────────────────────────────────────── 84%
  coins:
    type: CURRENCY
    chance: 44
    currency-id: coins
    amount: '250'
    icon:
      lore:
      - '&fValor: &2$&a{amount}'

  dracmas:
    type: CURRENCY
    chance: 40
    currency-id: dracmas
    amount: '25'
    icon:
      lore:
      - '&fValor: &e✆{amount}'

  # ── COMUM PLUS ───────────────────────────────────────────────────── 12%
  lim-armazem:
    type: COMMAND
    chance: 5
    display: '&2Limite de Armazém'
    command: armazem givelimititem {player} {amount} 1
    amount: 500
    icon:
      material: INK_SACK
      data: 2
      glow: true
      display: '&2Limite de Armazém'
      lore:
      - '&fValor: &2∞{amount}'

  lim-maquina:
    type: COMMAND
    chance: 4
    display: '&9Limite de Máquinas'
    command: maquina givelimite {player} {amount} 1
    amount: 1
    icon:
      material: INK_SACK
      data: 4
      glow: true
      display: '&9Limite de Máquinas'
      lore:
      - '&fValor: &9∞{amount}'

  lim-spawner:
    type: COMMAND
    chance: 3
    display: '&bLimite de Spawners'
    command: spawner givelimite {player} {amount} 1
    amount: 1
    icon:
      material: INK_SACK
      data: 12
      glow: true
      display: '&bLimite de Spawners'
      lore:
      - '&fValor: &b∞{amount}'

  # ── MEDIANA ─────────────────────────────────────────────────────── 2,5%
  chaves-boss-3:
    type: COMMAND
    chance: 2.5
    display: '&cChave de Boss'
    command: crate givekey bosses {player} {amount}
    amount: 3
    icon:
      material: TRIPWIRE_HOOK
      glow: true
      display: '&4Chave Bosses'
      lore:
      - '&7Consiga recompensas'
      - '&7abrindo essa chave.'
      - ''
      - '&8▪ &fQuantia: &7{amount}'

  # ── MEDIANA PLUS ──────────────────────────────────────────────────── 1%
  chaves-boss-5:
    type: COMMAND
    chance: 0.6
    display: '&cChave de Boss'
    command: crate givekey bosses {player} {amount}
    amount: 5
    icon:
      material: TRIPWIRE_HOOK
      glow: true
      display: '&4Chave Bosses'
      lore:
      - '&7Consiga recompensas'
      - '&7abrindo essa chave.'
      - ''
      - '&8▪ &fQuantia: &7{amount}'

  robo-comum:
    type: COMMAND
    chance: 0.4
    display: '&aRobô Comum'
    command: crates giverobot comum {player} {amount}
    amount: 1
    icon:
      texture: 6eeb623328cbcda01c4894b93c302be57f10a4dea93a7d54a907dd9caa4e45ca
      display: '&aRobô Comum'
      lore:
      - '&7Abre as chaves por você,'
      - '&7sem precisar clicar.'
      - ''
      - ' &8Informações: '
      - ' &8▪ &fAbre chaves a cada &a&l20&as&f. '

  # ── RARA ────────────────────────────────────────────────────────── 0,4%
  robo-raro:
    type: COMMAND
    chance: 0.4
    display: '&bRobô Raro'
    command: crates giverobot raro {player} {amount}
    amount: 1
    icon:
      texture: 639faf58180d8c3228c6d6d107b28c748dd11b9a18a4cb1681d2feff7549e888
      display: '&bRobô Raro'
      lore:
      - '&7Abre as chaves por você e'
      - '&7aumenta suas chances raras.'
      - ''
      - ' &8Informações: '
      - ' &8▪ &fAbre chaves a cada &a&l10&as&f. '
      - ''
      - ' &fPrêmios abaixo de &c&l2&c% &fganham'
      - ' &a+&l15&a% &fsobre a chance deles.'

  # ── RARÍSSIMA ───────────────────────────────────────────────────── 0,099%
  caixa-boosters:
    type: COMMAND
    chance: 0.04
    display: '&aCaixa Booster'
    command: caixas give boosters {player} {amount}
    amount: 1
    icon:
      material: TRAPPED_CHEST
      display: '&aCaixa Booster'
      lore:
      - '&7Abra e descubra o que a sorte'
      - '&7guardou para você lá dentro.'

  caixa-caixas:
    type: COMMAND
    chance: 0.035
    display: '&dCaixa Caixas'
    command: caixas give caixas {player} {amount}
    amount: 1
    icon:
      material: ENDER_CHEST
      display: '&dCaixa Caixas'
      lore:
      - '&7Abra e descubra o que a sorte'
      - '&7guardou para você lá dentro.'

  caixa-maquinas:
    type: COMMAND
    chance: 0.024
    display: '&bCaixa Máquinas'
    command: caixas give maquinas {player} {amount}
    amount: 1
    icon:
      material: TRAPPED_CHEST
      display: '&bCaixa Máquinas'
      lore:
      - '&7Abra e descubra o que a sorte'
      - '&7guardou para você lá dentro.'

  # ── JACKPOT ─────────────────────────────────────────────────────── 0,001%
  jackpot:
    type: CURRENCY
    chance: 0.001
    currency-id: coins
    amount: '250'
    icon:
      lore:
      - '&fValor: &6❂{amount}'

  # ── AZAR ────────────────────────────────────────────────────────── 25%
  # type: NONE = slot vazio de verdade. O RewardDelivery pula a entrega
  # (RewardDelivery.java:60), entao o jogador ve o giro parar aqui e nao
  # recebe absolutamente nada. Aparece no preview, some do /crates manage
  # (nao da para filtrar o azar) e NUNCA e turbinado por robo.
  #
  # Peso 33,3333 sobre os 100 dos premios: 33,3333/133,3333 = 25% das
  # aberturas, ou 250 a cada 1.000. Os pesos acima ficaram intactos — o
  # que muda e que cada um agora vale 0,75x do que valia (44 = 33%).
  azar:
    type: NONE
    chance: 33.3333
    display: '&8Azar'
    icon:
      material: WEB
      display: '&8Azar'
      lore:
      - '&7Não foi dessa vez.'