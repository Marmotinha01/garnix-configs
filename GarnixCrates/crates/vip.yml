location: world:81:60:7

hologram:
  height: 2.4
  lines:
  - '&d&lCAIXA VIP'
  - '%crates_stored_vip%'
  - ''
  - '&dOpções de uso:'
  - '&fBotão esquerdo &8➟ &7Preview'
  - '&fBotão direito &8➟ &7Abrir'

# Slot que esta crate ocupa no menu /crates.
slot: 16

# Item visual no menu de crates.
crate-item:
  glow: true
  material: TRIPWIRE_HOOK
  display: '&dChave VIP'
  lore:
  - '&7Consiga jogando bastante'
  - '&7no servidor todo dia.'

# Item físico da chave (segurar e clicar com botão direito na crate abre).
key-item:
  glow: true
  material: TRIPWIRE_HOOK
  display: '&dChave VIP'
  lore:
  - '&7Consiga jogando bastante'
  - '&7no servidor todo dia.'
  - ''
  - '&dOpções de uso:'
  - '&fBotão esquerdo &8➟ &7Preview'
  - '&fBotão direito &8➟ &7Armazenar'

# Tipos: CURRENCY, COMMAND, COMMAND_ITEM, ITEM, NONE
#
# FAIXAS desta crate:
#   comum 79% · comum plus 17% · mediana 2,5% · mediana plus 1% ·
#   rara 0,4% · raríssima 0,099% · jackpot 0,001%
#
# ⚠️ Crate NAO tem gate de tier — o jogador do dia 1 e o do dia 20 abrem a
# mesma tabela. Por isso o premio em coins e FIXO e pequeno: no dia 1 e um
# empurrao real, no dia 5 vira ruido. O valor da crate sao os ITENS.
#
# ⚠️ Esta e a crate de MAIOR VOLUME do servidor: cada ativacao de VIP da uma
# chave para TODOS os online. E por isso que o topo dela e caixa e robo — item
# que nao inflaciona moeda — e que o cash do jackpot e um evento raro.
#
# ⚠️ `chance` e PESO, nao porcentagem — Crate.java:100-105 normaliza por
# totalChance. Somar 100 e so legibilidade (o azar entra por cima, ver no fim).
rewards:

  # -- COMUM ---------------------------------------------------------- 79%
  coins:
    type: CURRENCY
    chance: 41
    currency-id: coins
    amount: '250'
    icon:
      lore:
      - '&fValor: &2$&a{amount}'

  dracmas:
    type: CURRENCY
    chance: 38
    currency-id: dracmas
    amount: '25'
    icon:
      lore:
      - '&fValor: &e✆{amount}'

  # -- COMUM PLUS ----------------------------------------------------- 17%
  #
  # ⚠️ O cacto e `type: ITEM` e vai SEM display e SEM lore, igual ao produto da
  # loja de coins (`GarnixServerShops/coins-shop/farm.yml`). Nome ou lore
  # customizada muda o NBT e o item deixa de empilhar com o cacto que o jogador
  # ja tem no armazem e no plot — 1 cacto que nao empilha nao serve para nada.
  cacto:
    type: ITEM
    chance: 2
    display: '&aCacto'
    amount: 1
    item:
      material: CACTUS
      data: 0
      amount: 1

  combustivel:
    type: COMMAND
    chance: 3
    display: '&eCombustível'
    command: maquina givefuel {player} default {amount}
    amount: 500
    icon:
      material: COAL
      display: '&eCombustível'
      lore:
      - '&fLitros: &7{amount}L'

  lim-armazem:
    type: COMMAND
    chance: 5
    display: '&2Limite de Armazém'
    command: armazem givelimititem {player} {amount} 1
    amount: 500
    icon:
      material: INK_SACK
      data: 2
      glow: true
      display: '&2Limite de Armazém'
      lore:
      - '&fValor: &2∞{amount}'

  lim-maquina:
    type: COMMAND
    chance: 4
    display: '&9Limite de Máquinas'
    command: maquina givelimite {player} {amount} 1
    amount: 1
    icon:
      material: INK_SACK
      data: 4
      glow: true
      display: '&9Limite de Máquinas'
      lore:
      - '&fValor: &9∞{amount}'

  lim-spawner:
    type: COMMAND
    chance: 3
    display: '&bLimite de Spawners'
    command: spawner givelimite {player} {amount} 1
    amount: 1
    icon:
      material: INK_SACK
      data: 12
      glow: true
      display: '&bLimite de Spawners'
      lore:
      - '&fValor: &b∞{amount}'

  # -- MEDIANA ------------------------------------------------------- 2,5%
  chaves-boss-3:
    type: COMMAND
    chance: 2.5
    display: '&cChave de Boss'
    command: crate givekey bosses {player} {amount}
    amount: 3
    icon:
      material: TRIPWIRE_HOOK
      glow: true
      display: '&4Chave Bosses'
      lore:
      - '&7Consiga recompensas'
      - '&7abrindo essa chave.'
      - ''
      - '&8 ▪ &fQuantia: &7x{amount}'

  # -- MEDIANA PLUS ---------------------------------------------------- 1%
  chaves-boss-5:
    type: COMMAND
    chance: 0.6
    display: '&cChave de Boss'
    command: crate givekey bosses {player} {amount}
    amount: 5
    icon:
      material: TRIPWIRE_HOOK
      glow: true
      display: '&4Chave Bosses'
      lore:
      - '&7Consiga recompensas'
      - '&7abrindo essa chave.'
      - ''
      - '&8 ▪ &fQuantia: &7x{amount}'

  robo-comum:
    type: COMMAND
    chance: 0.4
    display: '&aRobô Comum'
    command: crates giverobot comum {player} {amount}
    amount: 1
    icon:
      texture: 6eeb623328cbcda01c4894b93c302be57f10a4dea93a7d54a907dd9caa4e45ca
      display: '&aRobô Comum'
      lore:
      - '&7Abre as chaves por você,'
      - '&7sem precisar clicar.'
      - ''
      - ' &8Informações: '
      - ' &8▪ &fAbre chaves a cada &a&l20&as&f. '

  # -- RARA ---------------------------------------------------------- 0,4%
  robo-raro:
    type: COMMAND
    chance: 0.4
    display: '&bRobô Raro'
    command: crates giverobot raro {player} {amount}
    amount: 1
    icon:
      texture: 639faf58180d8c3228c6d6d107b28c748dd11b9a18a4cb1681d2feff7549e888
      display: '&bRobô Raro'
      lore:
      - '&7Abre as chaves por você e'
      - '&7aumenta suas chances raras.'
      - ''
      - ' &8Informações: '
      - ' &8▪ &fAbre chaves a cada &a&l10&as&f. '
      - ''
      - ' &fPrêmios abaixo de &c&l2&c% &fganham'
      - ' &a+&l15&a% &fsobre a chance deles.'

  # -- RARÍSSIMA ----------------------------------------------------- 0,099%
  #
  # ⚠️ A caixa chaves entrou nesta faixa sem aumenta-la: os 0,016 dela saíram de
  # dentro dos 0,099 que ja existiam, cada uma das outras seis cedendo um pouco.
  # A faixa continua 0,099% e o arquivo continua somando 100 — nao "arredonde"
  # nenhum destes numeros de volta sem refazer a conta das sete.
  caixa-boosters:
    type: COMMAND
    chance: 0.02
    display: '&aCaixa Boosters'
    command: caixas give boosters {player} {amount}
    amount: 1
    icon:
