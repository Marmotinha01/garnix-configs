# Tipos: CURRENCY, COMMAND, COMMAND_ITEM, ITEM, NONE
#
# FAIXAS desta crate:
#   comum 81,93 · comum plus 15,35 · armadura 1 · mediana 0,92 ·
#   mediana plus 0,35 (skins) · rara 0,4 (caixas) · jackpot 0,05
#
# Os numeros acima sao PESO, nao porcentagem: multiplique por 0,75 para a chance
# real. Os separadores de faixa la embaixo seguem a mesma unidade.
#
# ⚠️ As SKINS foram cortadas em 50% a pedido do dono, entao a faixa delas
# (0,35) ficou ABAIXO da faixa das caixas (0,4) — por isso ela se chama RARISSIMA.
# Individualmente a Caixa Mineracao [Tier I] (0,3) segue mais provavel que a
# Skin de Pedra (0,2). Foi decisao de balanceamento, nao descuido: a medicao
# de 20.000 chaves mostrou skin demais e a caixa ficou onde ja estava.
#
# ⚠️ Crate NAO tem gate de tier — o jogador do dia 1 e o do dia 20 abrem a
# mesma tabela. Por isso o premio em coins e pequeno: no dia 1 e um empurrao
# real, no dia 5 vira ruido. O valor da crate sao os ITENS.
#
# ⚠️ MOEDA E LIMITE SAO ESCADAS DE 3 DEGRAUS, dobrando a cada degrau, com peso
# 60/30/10 dentro da familia. O peso da FAMILIA nao mudou (coins 39, gemas 25,
# limites 7,5) — o que mudou e que ele agora esta repartido. Se mexer num
# degrau, mexa nos tres: a soma da familia e o que mantem o arquivo em 100.
#
#   coins   250 · 500 · 1.000      pesos 23,4 · 11,7 · 3,9
#   gemas   150 · 300 ·   600      pesos 15   ·  7,5 · 2,5
#
# ⚠️ Os tres limites sao repartidos por VALOR, na razao 6:3:1 — o cash shop
# cobra 800 (armazem 500), 1.500 (maquina 1) e 4.000 (spawner 1), entao o
# spawner tem que ser ~5x mais raro que o armazem, nao 1,5x como era.
#
#   armazem  1 · 3 · 5   pesos 2,7  · 1,35 · 0,45   (familia 4,5)
#   maquina  1 · 3 · 5   pesos 1,35 · 0,68 · 0,22   (familia 2,25)
#   spawner  1 · 3 · 5   pesos 0,45 · 0,22 · 0,08   (familia 0,75)
#
# ⚠️ A escada 1·3·5 e a das crates BASICAS. VIP e RankUP usam 5·15·30·50, quatro
# degraus, com peso 50/30/15/5. A escada 5·15·30 e a mesma da loja da /pesca.
#
# ⚠️ O degrau de cima de cada moeda fica ABAIXO de 3,999999 de proposito: esse
# e o teto real do boost de robo (total 133,3333 x 3 / 100), e um peso 4 cravado
# ficaria de fora do rate-up por 0,000001. Nao arredonde 3,9 para 4.
#
# ⚠️ `chance` e PESO, nao porcentagem — Crate.java:100-105 normaliza por
# totalChance. Somar 100 e so legibilidade.
#
# ⚠️ `/mina givebomb <jogador> <bombId> [quantidade]`: o bombId e a chave do
# bloco em `GarnixMining/bombs.yml` — 2x2, 4x4, 6x6 e 8x8. Ja a britadeira
# nao tem id: `/mina givedrill <jogador> [quantidade]`.
#
# ⚠️ Os quatro explosivos se chamam "Explosivo" no item real, os quatro. O
# `[2x2]` do display existe so para o broadcast e o preview dizerem QUAL
# saiu — sem ele os quatro premios ficam com o mesmo nome.
#
# ⚠️ A faixa ARMADURA e a T-I INTEIRA — as quatro pecas, peso igual. E o
# tier mais fraco de todos (+1,5% coins, +1% gemas e +1% XP por peca),
# entao ele pode viver na crate, que nao tem gate: no dia 1 e um empurrao,
# no dia 20 e ruido. Os tiers II a V continuam so nas caixas misteriosas.
#
# ⚠️ Peca INDIVIDUAL, nunca a colecao: `givearmor tier-i` sem o sufixo de
# slot entrega o set inteiro num drop so. O `{amount}` no fim e o padrao de
# todo item fisico do servidor — skin e armadura passam a quantia sorteada.
