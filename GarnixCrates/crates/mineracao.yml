location: world:84:60:-2

hologram:
  height: 2.3
  lines:
  - '&e&lCAIXA MINERAÇAO'
  - ''
  - '&eOpções de uso:'
  - '&fBotão esquerdo &8➟ &7Preview'
  - '&fBotão direito &8➟ &7Abrir'

# Slot que esta crate ocupa no menu /crates.
slot: 10

# Item visual no menu de crates.
crate-item:
  glow: true
  material: TRIPWIRE_HOOK
  display: '&eChave Mineração'
  lore:
  - '&7Consiga na mineração upando'
  - '&7o encantamento abençoado.'

# Item físico da chave (segurar e clicar com botão direito na crate abre).
key-item:
  glow: true
  material: TRIPWIRE_HOOK
  display: '&eChave Mineração'
  lore:
  - '&7Consiga na mineração upando'
  - '&7o encantamento abençoado.'
  - ''
  - '&eClique esquerdo para armazenar'
  - '&eou abrir a chave em uma caixa.'

# Tipos: CURRENCY, COMMAND, COMMAND_ITEM, ITEM, NONE
#
# FAIXAS desta crate:
#   comum 85% · comum plus 12% · mediana 2,5% ·
#   rara 0,4% · raro plus 0,099% · jackpot 0,001%
#
# ⚠️ Crate NAO tem gate de tier — o jogador do dia 1 e o do dia 20 abrem a
# mesma tabela. Por isso o premio em coins e FIXO e pequeno: no dia 1 e um
# empurrao real, no dia 5 vira ruido. O valor da crate sao os ITENS.
#
# ⚠️ `chance` e PESO, nao porcentagem — Crate.java:100-105 normaliza por
# totalChance. Somar 100 e so legibilidade.
rewards:

  # ── COMUM ────────────────────────────────────────────────────────── 85%
  coins:
    type: CURRENCY
    chance: 47
    currency-id: coins
    amount: '250'
    icon:
      lore:
      - '&fValor: &2$&a250 '

  secundaria:
    type: CURRENCY
    chance: 28
    currency-id: gemas
    amount: '25'
    icon:
      lore:
      - '&fValor: &d۞25 '

  combustivel:
    type: COMMAND
    chance: 10
    display: '&eCombustível'
    command: maquina givefuel {player} default {amount}
    amount: 500
    icon:
      material: COAL
      display: '&eCombustível &7(500L)'

  combustivel:
    type: COMMAND
    chance: 10
    display: '&eCombustível'
