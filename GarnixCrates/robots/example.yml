# ─────────────────────────────────────────────────────────────────────────────
# Robô (auto-opener) — UM arquivo por robô. O nome do arquivo é o ID do robô
# (este é "example"). Copie este arquivo para criar novos tiers.
#
# Este example.yml só é gerado quando a pasta robots/ está vazia. Assim que
# existir qualquer robô aqui, o plugin para de gerá-lo — e nunca sobrescreve um
# arquivo já existente, então pode editar à vontade.
#
# seconds          — intervalo (segundos) entre cada abertura automática.
#
# boost-threshold  — teto de chance REAL (%) até o qual as recompensas recebem o
#                    rate-up DESTE robô. Ex.: 3.0 = turbina prêmios com chance
#                    real <= 3%. É calculado sobre a chance real (peso ÷ soma dos
#                    pesos do baú), então "3%" vale 3% de verdade em qualquer baú.
#                    A recompensa do tipo NONE (azar) NUNCA é turbinada.
#                    Por robô: um tier mais forte pode ter um threshold maior.
#
# boost-multiplier — multiplica o peso das recompensas elegíveis (<= threshold).
#                    1.0 = sem boost (só abre). É a força do rate-up deste tier
#                    (ex.: básico 1.25 / avançado 1.5 / lendário 2.0). O ganho
#                    real sentido fica um pouco abaixo do fator (o total cresce ao
#                    turbinar), então anuncie a odd real, não o fator nominal.
# ─────────────────────────────────────────────────────────────────────────────
seconds: 4
boost-threshold: 3.0
boost-multiplier: 2.0

