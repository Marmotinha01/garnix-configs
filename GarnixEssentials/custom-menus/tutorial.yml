title: "Tutorial"
rows: 6

# -- A GRADE -----------------------------------------------------------------
#
# Quatro linhas na ORDEM DA JORNADA, e não por família de plugin: o jogador lê
# de cima para baixo na mesma sequência em que vai encostar em cada sistema.
#
#   linha 2 (10-16)   comece aqui      terreno · as vias de renda
#   linha 3 (19-25)   sua renda        moeda · limite · equipamento
#   linha 4 (28-34)   mais recompensa  caixa · runa · evento · boss · prestígio
#   linha 5 (38-42)   entre jogadores  clan · mercado · leilão · loja · correio
#
# A linha 5 tem cinco ícones e fica centralizada (colunas 2 a 6); as outras três
# têm sete e ocupam as colunas 1 a 7. Só assim as quatro ficam simétricas numa
# grade de 9 de largura.
#
# -- O QUE ENTRA, E O QUE NÃO ------------------------------------------------
#
# ✅ Escopo aprovado pelo dono em 08/08/2026. O tutorial NÃO é índice dos 40
# plugins: ele explica o que cada sistema é e como funciona, para o jogador
# entender as regras — não para ser conduzido pela mão.
#
# ⚠️ VIP E CASH FICARAM DE FORA: VIP em tutorial soa como vitrine.
#
# ⚠️ WARPS, REGRAS E DISCORD SAÍRAM em 08/08/2026 (decisão do dono). Os três já
# são comando próprio e não precisam de vaga aqui — o tutorial explica sistema,
# não serve de atalho para o que o jogador já digita.
#
# Também fora: punições, anti-nuker, chat, baús e scoreboard.
#
# -- A GRAMÁTICA DO MIOLO DA LORE --------------------------------------------
#
# ✅ Regra do dono (08/08/2026): o bloco do meio é HARMÔNICO — toda linha tem a
# MESMA forma, para as 26 lores lerem como um sistema só e não como 26 estilos:
#
#     &8 ▪ &fRótulo: &<cor>valor
#
#   · o marcador é sempre ` &8 ▪ ` e a linha termina com espaço
#   · o RÓTULO é sempre `&f` — é a parte fixa, e é ela que dá o alinhamento
#   · o VALOR é sempre COLORIDO, nunca `&f`
#   · o conectivo entre dois valores é `&7` (` &acoins &7e &dgemas `)
#   · a cor do valor é a da MOEDA quando for moeda, e a do próprio ícone quando
#     não for — é o que faz cada ícone ter identidade sem quebrar o padrão
#
# ⚠️ NADA DO MIOLO REPETE O TOPO. A explicação de duas linhas diz o que o
# sistema É; o miolo só acrescenta o que ela não disse. Se uma linha do meio
# parafraseia o topo, ela sai — não vira sinônimo.
#
# ⚠️ NÃO ESCREVER "moeda X não compra moeda Y" (decisão do dono, 08/08/2026).
# O tutorial diz o que cada moeda FAZ; o que ela não faz o jogador descobre
# tentando, e a frase negativa só ocupa linha.
#
# -- CORES DAS MOEDAS --------------------------------------------------------
#
# Toda moeda citada vai na cor dela, em qualquer lugar da lore — inclusive no
# meio de uma linha `&7`, onde a cor volta para `&7` logo depois. As cores saem
# de `GarnixCurrencies/currencies/<id>.yml`, bloco `colors`:
#
#   coins      simbolo &2$    nome &a      ⚠️ a UNICA em que as duas diferem
#   gemas      simbolo &d۞    nome &d
#   sementes   simbolo &5❋    nome &5
#   corais     simbolo &3✶    nome &3
#   dracmas    simbolo &e✆    nome &e
#   cash       simbolo &6❂    nome &6
#   s.limite   simbolo &b∞    nome &b
#   m.limite   simbolo &9∞    nome &9
#
# O erro fácil é escrever `&2coins`, que é a cor do CIFRÃO e não a do nome.
#
# -- ÍCONE INFORMATIVO -------------------------------------------------------
#
# Seis sistemas NÃO têm menu próprio (Terreno, Moedas, Limites, Encantamentos,
# Skins e Armaduras). Eles seguem a regra do repo para ícone não-clicável: sem
# CTA, e um rodapé em `&7` no lugar dela dizendo onde a coisa mora. Clicar não
# faz nada, que é o comportamento correto — não é bug.
#
# ⚠️ TERRENO é informativo por outro motivo: o plugin de terreno é EXTERNO e os
# comandos dele não estão neste repositório. Escrever `/plot auto` aqui seria
# um chute, e comando errado num tutorial é pior que comando nenhum.
#
# -- MANUTENÇÃO --------------------------------------------------------------
#
# ⚠️ Todo comando abaixo foi conferido no CÓDIGO-FONTE (CommandBuilder.create e
# aliases), não nos messages.yml. Se um plugin renomear o comando raiz, o ícone
# daqui para de funcionar em silêncio — o menu não valida destino.
#
# ⚠️ MINA E FAZENDA TÊM MUNDO PRÓPRIO (`GarnixWorldManager/worlds/mina.yml` e
# `fazenda.yml`) e NÃO ficam no terreno. O terreno abriga spawner, máquina,
# cacto e a invocação de boss — só isso.
#
# ⚠️ CACTO E ARMAZÉM SÃO O MESMO SISTEMA. O cacto do terreno estoca no armazém
# e o autosell vende de lá; por isso é um ícone só, chamado Armazém, que é como
# os menus do GarnixWarehouse se chamam.
#
# ⚠️ Os números da lore saem do config e envelhecem: 20 ranks, 10 skins por via,
# 5 tiers de armadura, +65% da skin de topo, +48% do conjunto T-V, 16 rodadas
# de chat e 10 de arena por dia, armazém em 3.000. Mexeu no config, confira aqui.

