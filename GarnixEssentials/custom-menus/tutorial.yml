open-sound: ""

title: "Tutorial"
rows: 6

# -- A GRADE -----------------------------------------------------------------
#
# Quatro linhas na ORDEM DA JORNADA, e não por família de plugin: o jogador lê
# de cima para baixo na mesma sequência em que vai encostar em cada sistema.
#
#   linha 2 (10-16)   comece aqui      terreno · as vias de renda
#   linha 3 (19-25)   sua renda        moeda · limite · equipamento
#   linha 4 (28-34)   mais recompensa  caixa · runa · evento · boss · prestígio
#   linha 5 (38-42)   entre jogadores  clan · mercado · leilão · loja · correio
#
# A linha 5 tem cinco ícones e fica centralizada (colunas 2 a 6); as outras três
# têm sete e ocupam as colunas 1 a 7. Só assim as quatro ficam simétricas numa
# grade de 9 de largura.
#
# ⚠️ FORA DE PROPÓSITO: VIP e cash (soa como vitrine), warps, regras e discord
# (já são comando próprio — o tutorial explica sistema, não é atalho), punições,
# anti-nuker, chat, baús e scoreboard.
#
# -- A GRAMÁTICA DA LORE -----------------------------------------------------
#
# ✅ Padrão definido pelo dono em 08/08/2026 no ícone `terreno` — os outros 25
# foram escritos a partir dele. Uma lore tem TRÊS partes:
#
#   1. duas linhas `&7` dizendo o que o sistema É (a primeira fecha em vírgula)
#   2. o miolo: 3 ou 4 linhas de AÇÃO, o que o jogador FAZ ali
#   3. a CTA colorida — e só quando o ícone abre alguma coisa
#
# O miolo é o que dá a harmonia, e a forma dele é sempre:
#
#     &8 ▪ &fFrase no imperativo&f.
#
#   · o marcador é `&8 ▪ ` COLADO na margem, sem espaço antes do `&8`
#   · o corpo da frase é `&f`, sempre em voz de AÇÃO (abra, ganhe, compre)
#   · substantivo de SISTEMA e de MOEDA vai na cor dele, e volta para `&f`
#   · COMANDO vai em `&7` (`&7/mina`)
#   · a frase fecha em `&f.` e a linha termina com um espaço
#
# ⚠️ SÓ O BÁSICO. Nada de linha genérica ("é importante", "evolua mais rápido"),
# nada que o topo já disse, e nenhum número que o config possa desmentir.
#
# ⚠️ NÃO ESCREVER "moeda X não compra moeda Y". O tutorial diz o que cada moeda
# FAZ; a frase negativa só ocupa linha.
#
# -- AS CORES ----------------------------------------------------------------
#
# Cada sistema tem UMA cor, e ela é a mesma em todo lugar que ele for citado —
# é isso que faz as 26 lores lerem como um menu só:
#
#   terrenos &2   spawners &2   máquinas &9   armazém &2   bosses &c
#   ranks &b      mineração &6  fazenda &a    pesca &3     runas &5
#   caixas &e     eventos &d    skins &e      armaduras &b encantes &d
#   heads &c      clãs &d       prestígio &6  duelos &c    limites &b
#
# ⚠️ `spawners` usa &2 porque foi o que o dono escreveu no ícone `terreno`. O
# repo usa &b em 76 displays de "Limite de Spawners" — se um dia unificar, é
# trocar &2 por &b nas 5 citações daqui e no display do ícone.
#
# ⚠️ `heads` usa &c: o repo não tem cor canônica para elas (`&cHeads de {mob}` e
# `&aHeads de {display}` empatam), então &c foi escolhido por não colidir com
# nenhuma moeda.
#
# Moedas (`GarnixCurrencies/currencies/<id>.yml`, bloco `colors`):
#
#   coins  simbolo &2$  nome &a   ⚠️ a UNICA em que as duas cores diferem
#   gemas  &d۞ &d    sementes &5❋ &5    corais &3✶ &3    dracmas &e✆ &e
#   cash   &6❂ &6    s.limite &b∞ &b    m.limite &9∞ &9
#
# -- MANUTENÇÃO --------------------------------------------------------------
#
# ⚠️ Todo comando abaixo foi conferido no CÓDIGO-FONTE (CommandBuilder.create e
# aliases), não nos messages.yml. Se um plugin renomear o comando raiz, o ícone
# daqui para de funcionar em silêncio — o menu não valida destino.
#
# ⚠️ MINA E FAZENDA TÊM MUNDO PRÓPRIO (`GarnixWorldManager/worlds/`) e NÃO ficam
# no terreno. O terreno abriga spawner, máquina, cacto e a invocação de boss.
#
# ⚠️ CACTO E ARMAZÉM SÃO O MESMO SISTEMA — um ícone só, chamado Armazém, que é
# como os menus do GarnixWarehouse se chamam.
#
# ⚠️ HEAD E DROP NÃO CAEM NO CHÃO: ficam guardados no spawner até o jogador
# retirar (o drop é vendido de lá, a head vai para o `/heads`).
#
# ⚠️ Seis ícones não abrem menu e por isso NÃO têm CTA — terreno, moedas,
# limites, encantamentos, skins e armaduras. Clicar neles não faz nada, e é o
# comportamento correto.

