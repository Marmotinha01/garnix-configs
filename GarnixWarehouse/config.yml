# Mundo dos terrenos (deve casar com o plot world do PlotSquared).
world: plotworld

# Limite inicial de armazenamento de cada armazém ao ser criado.
initial-limit: 3000

# Duração (segundos) da isenção do captcha após resolvê-lo.
captcha-duration: 30

booster:
  # Tempo restante mínimo (segundos) para recuperar um booster ativo do armazém.
  # Ao recuperar, o jogador recebe de volta um item valendo 50% do tempo restante
  # (perde a outra metade). O piso bloqueia o abuso de recuperar boosters quase
  # expirados só para reativar outro sem esperar.
  min-remove-seconds: 30

autosell:
  # Intervalo padrão (segundos) ao desbloquear a venda automática.
  default-interval: 20
  # Moeda usada para comprar melhorias de velocidade.
  upgrade-currency: cash
  # <segundos_alvo>: <custo>. Aponta sempre para o menor alvo abaixo do intervalo atual.
  #
  # A venda automatica esvazia o armazem INTEIRO a cada ciclo, entao a perda e zero
  # sempre que `limite >= colheita durante o intervalo`. Ou seja subir o limite e
  # baixar o intervalo sao SUBSTITUTOS, e o limite tinha a rota mais barata ate
  # dentro do cash: os 3.917 de limite que o salto de 20s para 10s poupa no dia 20
  # custam 6.400 cash na loja (500 por 800), contra os 10.000 desta escada. O
  # produto estava estritamente dominado — ninguem que fizesse a conta compraria.
  #
  # A faixa 150-800 conserta as duas coisas de uma vez: o upgrade volta a ser mais
  # barato que o limite equivalente, e um free que guarde os 400 cash da temporada
  # compra o primeiro nivel (antes nao alcancava nem o mais barato).
  upgrade-prices:
    '18': 150
    '16': 275
    '14': 400
    '12': 550
    '10': 800

# Plantação suportada (apenas cacto). material/data = ícone,
# currency = moeda (GarnixCurrencies), sell-price = preço unitário base,
# release (opcional) = data dd/MM/yyyy HH:mm.
farms:
  CACTUS:
    material: CACTUS
    data: 0
    display: '&aCacto'
    currency: coins
    # ✅ ANCORA (06/08/2026): o cacto e 19% da renda diaria da casa.
    #
    #   casa/dia no T1 ......... 1.500.000
    #   cacto = 19% ............   285.000 por dia
    #   farm do dia 1 .......... 2.500 cactos/min = 3.600.000/dia
    #   sell-price ............. 285.000 / 3.600.000 = 0,0792
    #
    # ⚠️ POR QUE NAO E A REGUA DOS "5 MINUTOS". O dono pediu *"o que ele ganha
    # minerando em 5 minutos ele tem que ganhar em 1 minuto de cacto"*. Medido:
    # essa regua e IMPOSSIVEL de satisfazer junto com a reparticao por via, e
    # nao por causa dos numeros — por causa do tempo. O cacto roda 24h e a mina
    # 3h, ou seja 8x mais tempo; pedir 5x de taxa em cima disso da 40x de renda
    # total, e a mineracao inteira e 14% da casa. Nao existe reparticao em que
    # os dois caibam em 100%.
    #
    # ✅ A saida, decidida pelo dono: medir a via POR DIA e nao por minuto. Numa
    # via AFK o jogador nao cronometra — ele olha quanto entrou no dia. E por
    # dia a hierarquia que ele queria acontece: cacto (19%) rende 1,36x a
    # mineracao (14%), e os spawners (28,9%) rendem mais que os dois.
    #
    # A ESCADA DE BUFF e 5,51x por dia — derivada, nao escolhida: a economia
    # cresce 6,146x/dia e a farm cresce 1,115x/dia (de 5% para 40% do maximo ao
    # longo da temporada), entao o preco carrega a diferenca. Conferido: no dia
    # 20 a via entrega 2,742x10^20, contra o alvo de 2,742x10^20.
    #
    # ✅ A TAXA DE COLHEITA E MEDIDA, NAO DERIVADA (dono, 06/08/2026):
    #
    #   144.345 cactos colocados  →  50.000 cactos por MINUTO
    #   = 3,00x10^6 por hora  →  20,8 cactos/h POR CACTO COLOCADO
    #   = 0,3464 por minuto por cacto colocado
    #
    # ⚠️ ESTA MEDICAO DERRUBOU A DERIVACAO TEORICA, e vale registrar para
    # ninguem refazer a conta errada. Pelos parametros do servidor
    # (`randomTickSpeed: 8` + `growth.cactus-modifier: 20000` no spigot.yml do
    # PandaSpigot) a conta dava 140,6/h por ponta:
    #
    #   random ticks por bloco = 20 ticks/s x 8 / 4096 = 1 a cada 25,6 s
    #   supondo que o modifier de 200x estoura os 16 estagios de `age` num
    #   unico random tick, ou seja que SATURA → 140,6/h por ponta
    #
    # A medicao da 20,8/h por cacto colocado — 6,8x menos. Mesmo assumindo
    # colunas de 3 (so o topo cresce, `world.isEmpty(pos.up())`), sobra 62,4/h
    # por ponta, ainda 2,3x abaixo. Conclusao: **o modifier NAO satura** como a
    # teoria supunha. Use SEMPRE o numero medido.
    #
    # ⚠️ A unidade certa e "por CACTO COLOCADO", nao "por ponta": e o que o dono
    # consegue contar no plot e nao depende de saber a geometria da farm.
    #
    # ⚠️ Este numero e uma alavanca VIVA: ele sobe por update ao longo da
    # temporada. A amplitude da via mora aqui desde que o `warehouse.sellmult`
    # foi removido em 06/08/2026.
    #
    # 🚩 O QUE ESTE NUMERO EXPOE: com ele, a renda da via passa a ser decidida
    # pelo AUTOSELL, nao pelo preco. Uma farm de 20 andares sem venda automatica
    # rende ~123.000 coins/dia (3 coletas manuais); com ela, 8,33 MILHOES —
    # 68x mais, ou 22x a renda diaria de toda a casa. Um item de 250 de cash
    # virou a maior alavanca do servidor. Ver 11-CACTO.md.
    sell-price: 0.0792