  # -- Marcos de prestígio (C6) ------------------------------------------------
  # Níveis sem entrada são permitidos e não fazem nada, então só aparece aqui o
  # que de fato recompensa. Roda DEPOIS de `commands`.
  #
  # Os marcos seguem o RITMO REAL de prestígio (~30/dia a partir do dia 10), não
  # números redondos: o dia 10 sozinho já dá 39 prestígios, então marcos em
  # 1/5/10/25 abririam 8 máquinas de uma vez. Assim cai uma máquina nova por dia,
  # do dia 10 ao dia 20. Teto alcançável na temporada: ~345.
  #
  # Os marcos são INTERCALADOS: nos pares vem máquina, nos ímpares vem conteúdo.
  # Nenhuma volta parece vazia, que era a reclamação original sobre o prestígio.
  #
  # ⏳ Os marcos de conteúdo estão COMENTADOS porque o alvo de cada um ainda não
  #    existe: as caixas de prestígio nascem na Fase 5 e as tags na Fase 7. Um
  #    comando apontando para um id inexistente falharia em silêncio, então eles
  #    entram quando o alvo entrar. As 12 máquinas já estão vivas.
  rewards:
    '1':    # dia 10
      commands:
      - 'lp user {player} permission set machines.buy.ouro true'
    # '10':  trocador de dracmas
    # - 'runas give {player} <tipo> 1'   # ⏳ Fase 5
    '20':   # dia 10
      commands:
      - 'lp user {player} permission set machines.buy.redstone true'
    # '35':  4o slot de booster
    # ⏳ nao existe permissao de slot de booster no codigo — precisaria de C novo
    '50':   # dia 11
      commands:
      - 'lp user {player} permission set machines.buy.lapis true'
    # '65':  slot extra de maquina especial
    # ⏳ nao existe teto de slot de maquina — o dono definiu que nao tem teto
    '80':   # dia 12
      commands:
      - 'lp user {player} permission set machines.buy.diamante true'
    # '95':  caixa de prestigio I
    # - 'caixas give {player} prestigio 1'   # ⏳ Fase 5
    '110':  # dia 13
      commands:
      - 'lp user {player} permission set machines.buy.esmeralda true'
    # '125':  tag de prestigio I
    # ⏳ Fase 7, junto com as tags
    '140':  # dia 14
      commands:
      - 'lp user {player} permission set machines.buy.obsidiana true'
    '155':    # +1 vaga de visitante
      commands:
      - 'mina giveslot {player} 1'
    '170':  # dia 15
      commands:
      - 'lp user {player} permission set machines.buy.quartzo true'
    # '185':  caixa de prestigio II
    # - 'caixas give {player} prestigio 1'   # ⏳ Fase 5
    '200':  # dia 16
      commands:
      - 'lp user {player} permission set machines.buy.titanio true'
    # '215':  tag de prestigio II
    # ⏳ Fase 7
    '230':  # dia 17
      commands:
      - 'lp user {player} permission set machines.buy.rubi true'
    '245':    # +1 vaga de visitante
      commands:
      - 'mina giveslot {player} 1'
    '260':  # dia 18
      commands:
      - 'lp user {player} permission set machines.buy.safira true'
    # '275':  tag de prestigio III
    # ⏳ Fase 7
    '290':  # dia 19
      commands:
      - 'lp user {player} permission set machines.buy.platina true'
    # '305':  caixa de prestigio III
    # - 'caixas give {player} prestigio 1'   # ⏳ Fase 5
    '320':  # dia 20
      commands:
      - 'lp user {player} permission set machines.buy.adamantita true'
    # '345':  TETO da temporada — titulo
    # ⏳ Fase 7


# Ranking refresh interval (minutes). Top size is fixed at 10.
ranking-refresh-minutes: 5

# -- Confirmation menu titles --
confirm:
  rankup-title: Evoluir de Rank
  prestige-title: Evoluir Prestígio

# Placeholders
placeholders:
  # Shown by %rankup_next_rank_name% / %rankup_next_rank_tag% at the last rank.
  no-next: '&b/prestigio'
  # LuckPerms primary groups that make %rankup_rank_tag_chat% return empty.
  chat-tag-blacklist:
    - 'master'
    - 'gerente'
    - 'admin'
  
# -- Progress bar --
# Look of %rankup_progress_bar%.
progress-bar:
  # Number of characters in the bar.
  length: 10
  # Character repeated for each segment.
  symbol: '▪'
  # Color of completed segments.
  completed-color: '&a'
  # Color of incomplete segments.
  incomplete-color: '&c'