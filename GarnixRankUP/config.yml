# -- Prestige --
prestige:
  # Cost increase per prestige level (percent). E.g. 10 = +10% per level.
  # LINEAR: custo = base × (1 + prestigio × percent/100). Confirmado no V8.
  # Vale também para os custos em `head`, então é a trava de ritmo da esteira.
  cost-increase-percent: 2

  # Comandos que rodam em QUALQUER prestígio. Placeholders: {player}, {prestige}.
  #
  # ⚠️ NÃO removemos as permissões de COMPRA aqui, de propósito. O prestígio reseta
  # SÓ a escada de rank (o plugin já zera `rank_order` para 1). Tudo o que o
  # jogador acumulou fica: cabeças, dracmas, equipamento, spawners colocados e as
  # permissões `spawner.buy.*` e `machines.buy.*` — isso é PATRIMÔNIO.
  #
  # As QUATRO escadas de BÔNUS (`mining.bonus.*`, `farm.bonus.*`,
  # `fishing.bonus.*`, `warehouse.bonus.*`) são o oposto e saem todas, mais
  # abaixo: elas são o que o rank paga, não o que o jogador comprou.
  #
  # ⚠️ As quatro andam SEMPRE juntas, com o mesmo número — regra do dono: um ator
  # tem um bônus só, igual em todo sistema. Se acrescentar uma quinta via com
  # bônus por permissão, ela entra aqui e nos 19 arquivos de rank no mesmo passo.
  #
  # É isso que transforma prestigiar de castigo em VOLTA RÁPIDA — e o V6 já tinha
  # provado que os spawners colocados continuam produzindo. A escada de rank vira
  # o sink de cabeças que move o contador, que é exatamente o papel dela no eixo
  # de cabeças.
  #
  # (Nota técnica: `lp permission unset` não aceita curinga, então remover exigiria
  # 60 comandos por prestígio × ~345 prestígios. Além de errado pelo desenho,
  # seria caro.)
  commands:
  - 'crate givevirtualkey rankup {player} 1'
  # -- Os 20 kits de rank voltam à estaca zero --------------------------------
  #
  # É o ÚNICO custo real do prestígio, e é de propósito que seja este. Tudo o mais
  # que o jogador acumulou é PATRIMÔNIO — cabeças, dracmas, equipamento, spawners
  # colocados, `spawner.buy.*` e `machines.buy.*` — e tirar patrimônio faria
  # prestigiar virar castigo. O kit é a única coisa da lista que é TORNEIRA
  # RECORRENTE: 20 kits × 4 resgates/dias × 3 contas = ~1.572 chaves/dia.
  #
  # Resetar só ele dá ao prestígio um preço que se sente, sem desfazer nada que
  # ele construiu. E a volta é rápida: com o estoque de cabeças e o equipamento no
  # máximo, ele reescala os 20 ranks numa fração do tempo.
  #
  # A permissão é `rank.<mob>`, lida dos próprios kits em
  # GarnixEssentials/data/kits/kits/<mob>.yml.
  - 'lp user {player} permission unset rank.porco'
  - 'lp user {player} permission unset rank.ovelha'
  - 'lp user {player} permission unset rank.vaca'
  - 'lp user {player} permission unset rank.morcego'
  - 'lp user {player} permission unset rank.jaguatirica'
  - 'lp user {player} permission unset rank.lobo'
  - 'lp user {player} permission unset rank.zumbi'
  - 'lp user {player} permission unset rank.esqueleto'
  - 'lp user {player} permission unset rank.aranha'
  - 'lp user {player} permission unset rank.pigzombie'
  - 'lp user {player} permission unset rank.slime'
  - 'lp user {player} permission unset rank.guardian'
  - 'lp user {player} permission unset rank.magmacube'
  - 'lp user {player} permission unset rank.endermite'
  - 'lp user {player} permission unset rank.bruxa'
  - 'lp user {player} permission unset rank.blaze'
  - 'lp user {player} permission unset rank.golem'
  - 'lp user {player} permission unset rank.ghast'
  - 'lp user {player} permission unset rank.wither'
  # O `rank.coelho` NAO entra aqui: fica no grupo default do LuckPerms, por
  # decisao do dono. Assim ele vale para quem esta comecando e para quem
  # prestigiou, sem precisar de comando nenhum.
  # -- As escadas de bonus voltam a estaca zero -------------------------------
  #
  # Sem isto, quem prestigia fica no rank 1 carregando o bonus do rank 20 para
  # SEMPRE — o prestigio deixaria de custar o bonus e a escada de rank viraria
  # decoracao a partir da primeira volta.
  #
  # So as escadas onde o maior vence. `spawner.buy.*` e `machines.buy.*` ficam:
  # sao patrimonio, e tirar patrimonio faria prestigiar virar castigo.
  - 'lp user {player} permission unset mining.bonus.10'
  - 'lp user {player} permission unset farm.bonus.10'
  - 'lp user {player} permission unset warehouse.bonus.10'
  - 'lp user {player} permission unset fishing.bonus.10'
