title: Ranks

shape:
- XXXXXXXXX
- XX.....XX
- <X.....X>
- XX.....XX
- XXXXXXXXX
- XXXXXXXXX

# Duas cores disponíveis nas linhas de custo:
#
#   {rank_color} = a cor do rank sendo PAGO (no available-icon, o próximo rank).
#   {color}      = só na linha de head: a cor do rank do MOB da head, igual à do
#                  item que o jogador tem na mão. Não é a do rank anterior — cada
#                  mob paga dois ranks seguidos (a Vaca custa head de PIG, não de
#                  SHEEP), então ela vem do mob, nunca de `order - 1`.
#
# {amount} já sai abreviado (3000 vira 3K, 1500 vira 1.5K) e {display} é só o
# nome do mob ("Coelho"), então a palavra "Heads de" é escrita aqui.
#
# Currency cost line. Placeholders: {rank_color} {symbol_color} {symbol} {primary_color} {secondary_color} {amount} {currency}
cost-format: '&8 ▪ {symbol_color}{symbol}{primary_color}{amount} {currency} '
# Head cost line. Placeholders: {color} {rank_color} {amount} {display}
cost-format-head: '&8 ▪ {color}x{amount} {color}Heads de {display} '

empty-icon:
  slot: 22
  material: BOWL
  amount: 0
  display: '&cVazio'
  lore:
  - '&7Nenhum rank encontrado.'

info-icon:
  slot: 48
  material: BOOK
  display: '&aSuas Informações'
  lore:
  - '&7Onde você está na'
  - '&7jornada de ranks.'
  - ''
  - '&8 ▪ &fRank: {rank_color}{rank_name} '
  - '&8 ▪ &fPrestígio: &b★{prestige} '
  - ''

ranking-icon:
  slot: 50
  material: GOLD_NUGGET
  display: '&6TOP'
  lore:
  - '&7Os jogadores de rank'
  - '&7mais alto do servidor.'
  - ''
  - '&6Clique para acessar.'

initial-icon:
  display: '{rank_color}Rank {rank_name}'
  lore:
  - '&7O primeiro rank de todos'
  - '&7os jogadores do servidor.'

completed-icon:
  display: '{rank_color}Rank {rank_name}'
  lore:
  - '&7Você já passou por este'
  - '&7rank na sua jornada.'

current-icon:
  display: '{rank_color}Rank {rank_name}'
  lore:
  - '&7Este é o seu rank atual'
  - '&7na jornada de evolução.'

available-icon:
  display: '{rank_color}Rank {rank_name}'
  lore:
  - '&7O próximo rank da sua'
  - '&7jornada de evolução.'
  - ''
  - ' &8Custos:'
  - '{costs}'
  - ''
  - '&aClique para evoluir.'

locked-icon:
  display: '{rank_color}Rank {rank_name}'
  lore:
  - '&7Este rank ainda está'
  - '&7fora do seu alcance.'
  - ''
  - '&8 ▾ &cLibere o rank anterior. '
  - ''

unreleased-icon:
  material: BARRIER
  display: '&cRank Indisponível'
  lore:
  - '&7Este rank ainda não foi'
  - '&7liberado no servidor.'
  - ''
  - '&8 ▪ &fLibera em: &7{date} '
  - ''
  - '&8 ▾ &cAinda não foi liberado. '
  - ''
