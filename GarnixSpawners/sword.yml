material: DIAMOND_SWORD

display: '&cLâmina'

lore:
- '&7Use esta lâmina para'
- '&7abater mobs de spawners.'
- ''
- ' &8Encantamentos:'
- '{enchantments}'
- ''
- ' &8 ▪ &fMobs abatidos: &e{kills} '
- ''
- '&7Arraste um livro sobre a'
- '&7lâmina para aplicá-lo.'

glow: true

enchant-line: ' &8 ▪ {display} {level} '
no-enchants: ' &8 ▾ &cNenhum encantamento. '

# Os encantamentos são elevados aplicando livros na lâmina (arraste o livro sobre
# ela no inventário). Cada encantamento define seu próprio livro em "book"
# (material/display/lore), com os placeholders {enchant} e {level}. O teto de cada
# encantamento é o maior nível configurado em "levels"; "value"/"chance" por nível
# definem o efeito no combate.
enchantments:
  massacre:
    display: '&4Massacre'
    book:
      material: ENCHANTED_BOOK
      display: '&4Livro de Massacre &7{level}'
      lore:
      - '&7Aumenta o dano da sua'
      - '&7lâmina contra os mobs.'
      - ''
      - ' &8 ▪ &fMassacre: &4{level}'
      - ''
      - '&7Arraste sobre a lâmina'
      - '&7para aplicar o livro.'
    levels:
      '1':
        value: 2
      '2':
        value: 4
      '3':
        value: 8
      '4':
        value: 16
      '5':
        value: -1
  pilhagem:
    display: '&aPilhagem'
    book:
      material: ENCHANTED_BOOK
      display: '&aLivro de Pilhagem &7{level}'
      lore:
      - '&7Aumenta os drops que os'
      - '&7mobs deixam ao morrer.'
      - ''
      - ' &8 ▪ &fPilhagem: &a{level}'
      - ''
      - '&7Arraste sobre a lâmina'
      - '&7para aplicar o livro.'
    levels:
      '1':
        value: 1.25
      '2':
        value: 1.5
      '3':
        value: 2.0
  ceifador:
    display: '&dCeifador'
    book:
      material: ENCHANTED_BOOK
      display: '&dLivro de Ceifador &7{level}'
      lore:
      - '&7Chance de abater o mob'
      - '&7com um golpe só.'
      - ''
      - ' &8 ▪ &fCeifador: &d{level}'
      - ''
      - '&7Arraste sobre a lâmina'
      - '&7para aplicar o livro.'
    levels:
      '1':
        chance: 25
      '2':
        chance: 50
      '3':
        chance: 75
