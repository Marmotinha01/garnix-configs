material: DIAMOND_SWORD

display: '&cLâmina'

lore:
- ''
- ' &8Informações: '
- '&8 ▪ &fMobs abatidos: &e{kills} '
- ''
- ' &c▎ &fEncantamentos: '
- '{enchantments}'
- ''

glow: true

# O {value} e o efeito do nivel que a lamina TEM: "Massacre 5 (x∞)". Ele so pode
# viver aqui. No livro ele seria mentira, porque la o {level} e quantos niveis o
# livro aplica, e nao o nivel final — um livro de 1 numa lamina em Massacre 4
# entrega o Massacre 5, entao o livro mostraria o efeito do 1 e o jogador ficaria
# com o do 5. A moldura do numero (sinal, unidade, cor) e o "value-format" de cada
# encantamento.
enchant-line: ' &8◗ &7{display} {level} &8({value}&8) '
no-enchants: ' &8◗ &cNenhum encantamento '

# Os encantamentos são elevados aplicando livros na lâmina (arraste o livro sobre
# ela no inventário). Cada encantamento define seu próprio livro em "book"
# (material/display/lore), com os placeholders {enchant} e {level}. O teto de cada
# encantamento é o maior nível configurado em "levels"; "value"/"chance" por nível
# definem o efeito no combate, e o nível pode declarar "value-display" quando o
# número não se explica sozinho (o Massacre 5 é -1, que na lore vira "∞").
enchantments:
  # Quantos mobs do empilhamento morrem por golpe (MobManager:618-624).
  # -1 abate a pilha inteira.
  #
  # A escada precisou subir. O bloco acumula ate `spawner-stack` por ciclo — 64 no
  # comeco, 512 maxado — entao com os valores antigos (2/4/8/16) so o nivel 5
  # dava conta no fim: 512 mobs a cada 4s exigem 128 abates/s, e a 5 cliques/s o
  # nivel 4 entregava 80. Os quatro primeiros niveis eram decorativos.
  #   nivel 1 (4)   -> 20 abates/s: cobre o bloco nu (64 a cada 10s = 6,4/s)
  #   nivel 3 (64)  -> 320 abates/s: cobre o bloco maxado (128/s)
  #   nivel 5 (-1)  -> a pilha inteira num golpe. Obrigatorio quando o `mob-stack`
  #                    esta ilimitado e a pilha cresceu enquanto voce estava fora.
  massacre:
    display: '&4Massacre'
    value-format: '&4x&l{value}'
    book:
      material: ENCHANTED_BOOK
      display: '&4Livro de Massacre'
      lore:
      - '&7Mobs empilhados morrem'
      - '&7juntos no mesmo golpe.'
      - ''
      - ' &8Especificações: '
      - '&8 ▪ &fNível: &7{level} '
      - '&8 ▪ &fTipo: &cLâmina '
      - ''
      - '&7Segurando SHIFT você abate'
      - '&7um por vez, sem o efeito.'
      - ''
      - '&7Arraste sobre a lâmina'
      - '&7para aplicar o livro.'
    levels:
      '1':
        value: 4
      '2':
        value: 16
      '3':
        value: 64
      '4':
        value: 256
      '5':
        value: -1
        # O "x" do value-format cola no numero, entao aqui nao cabe frase: "-1"
        # sairia errado e "a pilha inteira" viraria "xa pilha inteira".
        value-display: '∞'
  # Multiplicador direto sobre os drops (MobManager:715-717). E o encantamento
  # mais apeloes do servidor: multiplica a unica via sem teto fisico.
  # 2,0 no maximo — ja e o valor que o orcamento de 8,10x da via passiva assume
  # (1,35 de bonus x pilhagem 2,0 x booster de drops 3,0). NAO subir sem
  # recalcular `drops.coins.amount` dos 20 spawners.
  pilhagem:
    display: '&aPilhagem'
    value-format: '&ax&l{value}'
    book:
      material: ENCHANTED_BOOK
      display: '&aLivro de Pilhagem'
      lore:
      - '&7Multiplica os drops que'
      - '&7os mobs deixam ao morrer.'
      - ''
      - ' &8Especificações: '
      - '&8 ▪ &fNível: &7{level} '
      - '&8 ▪ &fTipo: &cLâmina '
      - ''
      - '&7Só multiplica os drops. As'
      - '&7cabeças são do Ceifador.'
      - ''
      - '&7Arraste sobre a lâmina'
      - '&7para aplicar o livro.'
    levels:
      '1':
        value: 1.25
      '2':
        value: 1.5
      '3':
        value: 2.0
  # ⚠️ A lore MENTIA. Dizia "chance de abater o mob com um golpe so", mas
  # MobManager:634-641 e claro: e chance de DOBRAR as cabecas do abate.
  # Quem abate em um golpe e o `massacre`, nao este.
  #
  # As chances ficam como estao — 25/50/75% ja e o que o modelo de cabecas da
  # Fase 3a assumiu (fator esperado 1,00 -> 1,75).
  ceifador:
    display: '&dCeifador'
    value-format: '&a+&l{value}&a%'
    book:
      material: ENCHANTED_BOOK
      display: '&dLivro de Ceifador'
      lore:
      - '&7Chance de o abate soltar'
      - '&7o dobro de cabeças.'
      - ''
      - ' &8Especificações: '
      - '&8 ▪ &fNível: &7{level} '
      - '&8 ▪ &fTipo: &cLâmina '
      - ''
      - '&7Rola uma vez por golpe e'
      - '&7dobra o abate inteiro.'
      - ''
      - '&7Arraste sobre a lâmina'
      - '&7para aplicar o livro.'
    levels:
      '1':
        chance: 25
      '2':
        chance: 50
      '3':
        chance: 75
