material: DIAMOND_SWORD

display: '&cLâmina'

lore:
- '&7Utilize esta lâmina para'
- '&7abater mobs de spawners.'
- ''
- ' &fEncantamentos:'
- '{enchantments}'
- ''
- ' &fMobs Abatidos: &e{kills} '
- ''
- '&7Arraste um livro de encantamento'
- '&7sobre esta lâmina para aplicá-lo.'

glow: true

enchant-line: ' {display} {level} '
no-enchants: ' &cNenhum encantamento. '

# Os encantamentos são elevados aplicando livros na lâmina (arraste o livro sobre
# ela no inventário). Cada encantamento define seu próprio livro em "book"
# (material/display/lore), com os placeholders {enchant} e {level}. O teto de cada
# encantamento é o maior nível configurado em "levels"; "value"/"chance" por nível
# definem o efeito no combate.
enchantments:
  massacre:
    display: '&4Massacre'
    book:
      material: ENCHANTED_BOOK
      display: '&4Livro de Massacre &7{level}'
      lore:
      - '&fMassacre: &4{level}'
      - ''
      - '&7Arraste sobre a sua Lâmina'
      - '&7para aplicar.'
    levels:
      '1':
        value: 2
      '2':
        value: 4
      '3':
        value: 8
      '4':
        value: 16
      '5':
        value: -1
  pilhagem:
    display: '&aPilhagem'
    book:
      material: ENCHANTED_BOOK
      display: '&aLivro de Pilhagem &7{level}'
      lore:
      - '&fPilhagem: &a{level}'
      - ''
      - '&7Arraste sobre a sua Lâmina'
      - '&7para aplicar.'
    levels:
      '1':
        value: 1.25
      '2':
        value: 1.5
      '3':
        value: 2.0
  ceifador:
    display: '&dCeifador'
    book:
      material: ENCHANTED_BOOK
      display: '&dLivro de Ceifador &7{level}'
      lore:
      - '&fCeifador: &d{level}'
      - ''
      - '&7Arraste sobre a sua Lâmina'
      - '&7para aplicar.'
    levels:
      '1':
        chance: 25
      '2':
        chance: 50
      '3':
        chance: 75
