material: DIAMOND_SWORD

display: '&cLâmina'

lore:
- ''
- ' &8Informações: '
- '&8 ▪ &fMobs abatidos: &e{kills} '
- ''
- ' &c▎ &fEncantamentos: '
- '{enchantments}'
- ''

glow: true

# O {value} e o efeito do nivel que a lamina TEM: "Massacre 5 (x∞)". Ele so pode
# viver aqui. No livro ele seria mentira, porque la o {level} e quantos niveis o
# livro aplica, e nao o nivel final — um livro de 1 numa lamina em Massacre 4
# entrega o Massacre 5, entao o livro mostraria o efeito do 1 e o jogador ficaria
# com o do 5. A moldura do numero (sinal, unidade, cor) e o "value-format" de cada
# encantamento.
enchant-line: ' &8◗ &7{display} {level} &8({value}&8) '
no-enchants: ' &8◗ &cNenhum encantamento '

# Os encantamentos são elevados aplicando livros na lâmina (arraste o livro sobre
# ela no inventário). Cada encantamento define seu próprio livro em "book"
# (material/display/lore), com os placeholders {enchant} e {level}. O teto de cada
# encantamento é o maior nível configurado em "levels"; "value"/"chance" por nível
# definem o efeito no combate, e o nível pode declarar "value-display" quando o
# número não se explica sozinho (o Massacre 5 é -1, que na lore vira "∞").
enchantments:
  # Quantos mobs do empilhamento morrem por golpe (MobManager:618-624).
  # -1 abate a pilha inteira.
  #
  # A escada precisou subir. O bloco acumula ate `spawner-stack` por ciclo — 64 no
  # comeco, 512 maxado — entao com os valores antigos (2/4/8/16) so o nivel 5
  # dava conta no fim: 512 mobs a cada 4s exigem 128 abates/s, e a 5 cliques/s o
  # nivel 4 entregava 80. Os quatro primeiros niveis eram decorativos.
  #   nivel 1 (4)   -> 20 abates/s: cobre o bloco nu (64 a cada 10s = 6,4/s)
  #   nivel 3 (64)  -> 320 abates/s: cobre o bloco maxado (128/s)
  #   nivel 5 (-1)  -> a pilha inteira num golpe. Obrigatorio quando o `mob-stack`
  #                    esta ilimitado e a pilha cresceu enquanto voce estava fora.
  massacre:
    display: '&4Massacre'
    value-format: '&4x&l{value}'
    book:
      material: ENCHANTED_BOOK
      display: '&4Livro de Massacre'
      lore:
      - '&7Mobs empilhados morrem'
      - '&7juntos no mesmo golpe.'
      - ''
      - ' &8Especificações: '
      - '&8 ▪ &fNível: &7{level} '
      - '&8 ▪ &fTipo: &cLâmina '
      - ''
      - '&7Arraste sobre a lâmina'
      - '&7para aplicar o livro.'
    # ✅ De 5 para 10 degraus em 06/08/2026, acompanhando pilhagem e ceifador —
    # o teto (∞) NAO muda e nao vai mudar, so o caminho ate ele ficou mais longo.
    #
    # ⚠️ O ∞ NAO e "um numero grande": `MobManager:620` tem um caminho de codigo
    # separado para `value: -1` que pega `mob.getStackSize()` inteiro, e o
    # killCount e BigDecimal — nao existe teto de int para estourar. Uma pilha de
    # bilhoes morre num golpe igual.
    #
    # ⚠️ E o ∞ e o par do upgrade `mob-stack: -1`: com o buffer ilimitado a pilha
    # cresce enquanto o jogador esta fora, e so este nivel limpa o acumulo num
    # golpe. Comprar um sem o outro e acumular o que nao se consegue colher.
    levels:
      '1':
        value: 4
      '2':
        value: 8
      '3':
        value: 16
      '4':
        value: 32
      '5':
        value: 64
      '6':
        value: 128
      '7':
        value: 256
      '8':
        value: 512
      '9':
        value: 2048
      '10':
        value: -1
        # O "x" do value-format cola no numero, entao aqui nao cabe frase: "-1"
        # sairia errado e "a pilha inteira" viraria "xa pilha inteira".
        value-display: '∞'
  # Multiplicador direto sobre os drops (MobManager:715-717). E o encantamento
  # mais apeloes do servidor: multiplica a unica via sem teto fisico.
  # 2,0 no maximo — ja e o valor que o orcamento de 8,10x da via passiva assume
  # (1,35 de bonus x pilhagem 2,0 x booster de drops 3,0). NAO subir sem
  # recalcular `drops.coins.amount` dos 20 spawners.
  pilhagem:
    display: '&aPilhagem'
    value-format: '&a&l{value}&ax'
    book:
      material: ENCHANTED_BOOK
      display: '&aLivro de Pilhagem'
      lore:
      - '&7Multiplica os drops que'
      - '&7os mobs deixam ao morrer.'
      - ''
      - ' &8Especificações: '
      - '&8 ▪ &fNível: &7{level} '
      - '&8 ▪ &fTipo: &cLâmina '
      - ''
      - '&7Arraste sobre a lâmina'
      - '&7para aplicar o livro.'
    # ✅ Decisao do dono (06/08/2026): *"os players pediriam pilhagem infinita
    # pois eles gostam bastante, mas podemos ir controlando definindo um valor
    # bom e se necessario ir aumentando o maximo"*.
    #
    # Foi de 3 para 10 degraus SEM mexer no teto: o jogador evolui 10 vezes em
    # vez de 3, e o 2,0 continua sendo o que o orcamento de 8,10x da via passiva
    # assume. Nada de drop precisou ser recalculado.
    #
    # ⚠️ COMO SUBIR O TETO DEPOIS (o "ir aumentando o maximo"): acrescentar
    # niveis '11', '12'... e retrocompativel — `MobConfig.getMaxLevel` devolve o
    # ultimo nivel declarado, entao quem esta no 10 continua no 10 e passa a ver
    # o 11. MAS cada ponto acima de 2,0 infla a via inteira: subir para 2,5
    # exige dividir `drops.coins.amount` dos 20 spawners por 1,25. O teto e uma
    # ALAVANCA VIVA, igual ao `sell-price` do cacto — mexe-se nele de proposito,
    # com o recalculo junto, nunca sozinho.
    #
    # ⚠️ Os niveis tem que ser CONTIGUOS (1, 2, 3...): o upgrade sobe de um em
    # um, entao um pulo de 10 para 12 deixa o 12 inalcancavel para sempre.
    # ✅ Decisao do dono (06/08/2026): *"a pilhagem nao vai ter teto 2x, ate
    # porque os players nao vao gostar"*. O teto foi de 2,0x para 11,0x.
    #
    # ⚠️ A ESCADA E GEOMETRICA, +26,8% por degrau, e nao +1x por nivel. Com o
    # passo fixo de +1x o primeiro degrau valeria +50% (2->3) e o ultimo +10%
    # (10->11): o jogador sentiria os livros valendo cada vez menos, justamente
    # quando ficam mais dificeis de juntar. Geometrico, todo livro vale o mesmo.
    #
    # 🚩 O QUE ISSO ARRASTOU: a pilha de multiplicadores da via passiva foi de
    # 8,10x (1,35 bonus x 2,0 pilhagem x 3,0 booster) para 44,55x. Os
    # `drops.coins.amount` dos 20 spawners foram recalculados no mesmo passo,
    # divididos por `5,5^((N-1)/19)` — interpolado, porque a pilha cresce com o
    # tier: o T1 nao muda e o T20 divide por 5,5 inteiro.
    #
    # ⚠️ E o efeito que nao se recalcula: a distancia entre quem tem a lamina
    # maxada e quem nao tem saiu de 2,0x para 11,0x. Como os drops assumem a
    # pilha cheia, quem ainda nao juntou os 10 livros fica 11x abaixo do alvo.
    # E o preco de a pilhagem ser o premio grande da via — decisao consciente.
    levels:
      '1':
        value: 1.3
      '2':
        value: 1.65
      '3':
        value: 2.1
      '4':
        value: 2.65
      '5':
        value: 3.35
      '6':
        value: 4.25
      '7':
        value: 5.4
      '8':
        value: 6.85
      '9':
        value: 8.7
      '10':
        value: 11.0
  # ⚠️ A lore MENTIA. Dizia "chance de abater o mob com um golpe so", mas
  # MobManager:634-641 e claro: e chance de DOBRAR as cabecas do abate.
  # Quem abate em um golpe e o `massacre`, nao este.
  #
  # As chances ficam como estao — 25/50/75% ja e o que o modelo de cabecas da
  # Fase 3a assumiu (fator esperado 1,00 -> 1,75).
  ceifador:
    display: '&dCeifador'
    value-format: '&a+&l{value}&a%'
    book:
      material: ENCHANTED_BOOK
      display: '&dLivro de Ceifador'
      lore:
      - '&7Chance de o abate soltar'
      - '&7o dobro de cabeças.'
      - ''
      - ' &8Especificações: '
      - '&8 ▪ &fNível: &7{level} '
      - '&8 ▪ &fTipo: &cLâmina '
      - ''
      - '&7Arraste sobre a lâmina'
      - '&7para aplicar o livro.'
    # ✅ Decisao do dono (06/08/2026): mesmo esquema da pilhagem, *"os jogadores
    # gostam de bastante niveis"* — mas com um TETO ABSOLUTO menor: *"teto
    # maximo para ceifador 50%, mas nao nos niveis iniciais que configurarmos e
    # sim ao longo dos updates para ir aumentando o nivel"*.
    #
    #   configurado AGORA ...... 10 degraus, 3% -> 25%   (fator esperado 1,25x)
    #   teto ABSOLUTO da via ... 50%                     (fator esperado 1,50x)
    #   espaco de update ....... os degraus de 25% a 50%
    #
    # ⚠️ O TETO CAIU DE 75% PARA 50%, e isso arrasta o eixo de cabecas junto. O
    # modelo da Fase 3a derivou o custo em `head` dos 19 ranks assumindo fator
    # 1,75x (75% de chance de dobrar). Com o configurado de hoje o fator e 1,25x,
    # ou seja a producao de cabecas cai 28,6% — e sem ajuste a escada de rank
    # ficaria ~40% mais lenta. Os custos em `head` foram multiplicados por
    # 1,25/1,75 = 0,714 nos 19 arquivos de rank, no mesmo passo.
    #
    # ⚠️ QUANDO SUBIR O TETO por update, o mesmo acerto vale ao contrario: ir de
    # 25% para 50% leva o fator de 1,25x para 1,50x, entao os custos em cabeca
    # sobem 20% (1,50/1,25) junto. Teto e alavanca viva — nunca sozinho.
    levels:
      '1':
        chance: 3
      '2':
        chance: 5
      '3':
        chance: 8
      '4':
        chance: 10
      '5':
        chance: 13
      '6':
        chance: 15
      '7':
        chance: 18
      '8':
        chance: 20
      '9':
        chance: 23
      '10':
        chance: 25
