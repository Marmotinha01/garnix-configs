# Tabela unica de desconto (na compra) e bonus (na venda dos drops).
#
# ⚠️ NAO SOMAM ENTRE SI. O desconto vem da entrada de MAIOR discount que o
#    jogador alcanca; o bonus, da de MAIOR bonus. Sao duas buscas independentes
#    (getDiscountRank / getBonusRank), entao um nao cancela o outro — mas dentro
#    de cada um deles vale o maior, nunca a soma.
#
# discount -> aplicado na COMPRA (ShopMenu:430). Exclusivo de VIP: rank e 0.
# bonus    -> aplicado na VENDA dos drops (DropsMenu:56), so em moeda.
#             ⚠️ o desconto NAO vale nos upgrades (UpgradeManager:137).
#
# ═══ UM NUMERO POR ATOR, IGUAL EM TODO SISTEMA (06/08/2026) ══════════════════
#
# ✅ Decisao do dono: "TODOS OS RANKS devem ser seus valores em bonus IGUAIS em
# todos os sistemas, assim como os vips e os influencers. Se o vip X tem bonus de
# 20% na mina ele vai ter de 20% nos spawners e nas maquinas tambem".
#
# Entao o "bonus" daqui e o MESMO numero dos nos mining.bonus / farm.bonus /
# fishing.bonus / warehouse.bonus:
#
#   rank N ................................ N%   (rank 2 = 2 … rank 20 = 20)
#   celestial e miniyt ..................... 8%
#   imortal, yt, tiktoker e streamer ...... 12%
#   supremo ............................... 16%
#   garnix ................................ 20%
#   investidor ............................ 22%   (o topo: melhor que o garnix em TUDO)
#
# ⚠️ O rank subiu 1 ponto em toda a escada. Ele estava desalinhado: dava 1% no
# rank 2 aqui contra 2% no no mining.bonus.2. Agora bate.
#
# ⚠️ DESCONTO E BONUS SAO RESOLVIDOS SEPARADAMENTE (06/08/2026).
#
# Antes, os dois saiam do MESMO registro — o de maior (discount + bonus) — e por
# isso o VIP baixo perdia o DESCONTO que pagou assim que o bonus do rank passasse
# a soma dele: um celestial (3+8=11) no rank 12 (0+12=12) recebia o registro do
# rank e comprava pelo preco cheio. O no do VIP nem era testado.
#
# Agora sao duas buscas:
#   getDiscountRank(player) -> a entrada de MAIOR discount que o jogador alcanca
#   getBonusRank(player)    -> a entrada de MAIOR bonus
#
# Cada numero vem de onde ele e maior e um nao cancela o outro. Um celestial no
# rank 12 leva 3% de desconto (do VIP) e 12% de bonus (do rank).
#   MobConfigManager / MachineConfigManager  -> os dois metodos
#   ShopMenu (preco e lore)                  -> usa o de desconto
#   DropsMenu (venda dos drops)              -> usa o de bonus
#
# O getRank(player) antigo continua existindo, mas SO para exibir uma tag unica.
# Nao use ele para calcular nada: somar discount + bonus trata os dois numeros
# como se fossem a mesma moeda, e eles nao sao.
#
# Os tiers de influencer ESPELHAM um VIP pago, por decisao do dono: yt, tiktoker
# e streamer valem um IMORTAL (6% / 12%); miniyt vale um CELESTIAL (3% / 8%).
# Espelhar em vez de inventar uma escada propria mantem uma regra so no servidor —
# e como os valores sao identicos, ter dois desses grupos ao mesmo tempo nao muda
# nada, que e o comportamento certo.
#
# ⚠️ NAO EXISTE GRUPO "influencer" AQUI. Os influenciadores sao SEMPRE os quatro
# grupos concretos (yt, tiktoker, streamer, miniyt) — decisao do dono em
# 06/08/2026. Havia uma entrada `influencer` guarda-chuva, e ela foi removida das
# tres tabelas (spawners, maquinas e coins-shop). Se voltar a aparecer, e engano.
#
# ⚠️ O INVESTIDOR NAO E INFLUENCER. Ele e o topo pago e, por decisao do dono, e
# melhor que o garnix nos DOIS numeros: 20% de desconto contra 15%, e 22% de
# bonus contra 20%. Ele nao tem nada acima dele em lugar nenhum do servidor.

celestial:
  discount: 3 # porcentagem de desconto na compra
  bonus: 8 # porcentagem de bonus nos drops
  tag: '&e&lCELESTIAL'
  permission: vip.celestial

imortal:
  discount: 6 # porcentagem de desconto na compra
  bonus: 12 # porcentagem de bonus nos drops
  tag: '&b&lIMORTAL'
  permission: vip.imortal

supremo:
  discount: 10 # porcentagem de desconto na compra
  bonus: 16 # porcentagem de bonus nos drops
  tag: '&4&lSUPREMO'
  permission: vip.supremo

garnix:
  discount: 15 # porcentagem de desconto na compra
  bonus: 20 # porcentagem de bonus nos drops
  tag: '&6&lGARNIX'
  permission: vip.garnix

investidor:
  discount: 20 # ACIMA do garnix (15): o investidor e melhor em TUDO
  bonus: 22 # porcentagem de bonus nos drops
  tag: '&a&lINVESTIDOR'
  permission: vip.investidor

miniyt:
  discount: 3 # igual ao celestial
  bonus: 8 # igual ao celestial
  tag: '&b&lMINIYT'
  permission: vip.miniyt

tiktoker:
  discount: 6 # igual ao imortal
  bonus: 12 # igual ao imortal
  tag: '&b&lTIKTOKER'
  permission: vip.tiktoker

yt:
  discount: 6 # igual ao imortal
  bonus: 12 # igual ao imortal
  tag: '&b&lYT'
  permission: vip.yt

streamer:
  discount: 6 # igual ao imortal
  bonus: 12 # igual ao imortal
  tag: '&b&lSTREAMER'
  permission: vip.streamer

# -- Ranks — so ganho, NUNCA desconto --------------------------------------
# +1% por rank, linear e chato de proposito: previsivel, sempre visivel, e
# nunca e a razao de alguem disparar ou travar. NAO tierar — se crescesse
# geometricamente dobraria o exponencial que ja esta no valor-base.
# O no e concedido em GarnixRankUP/ranks/<rank>.yml -> commands.

# -- A escada comeca no rank 2, de proposito -------------------------------
#
# O rank 1 e o inicial: ninguem "sobe" para ele, entao a lista de comandos do
# coelho.yml nunca roda. O no rank.coelho existe (vive no grupo default do
# LuckPerms, pelo kit), mas uma entrada aqui para ele so poderia valer 0% — que
# e exatamente o que "nenhuma entrada" ja vale.
#
# Entao a escada da N% no rank N: rank 1 vale 0%, rank 2 vale 2%, teto 20% no
# rank 20 — o mesmo numero dos nos <via>.bonus.<N>. O nome do no e o MESMO do kit
# (rank.<mob>), entao subir de rank concede uma permissao so, que serve para as
# duas coisas.

