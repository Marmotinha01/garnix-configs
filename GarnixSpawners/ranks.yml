# Tabela unica de desconto (na compra) e bonus (na venda dos drops).
#
# ⚠️ NAO SOMAM. O plugin ordena por (discount + bonus) decrescente e devolve
#    a PRIMEIRA entrada cuja permissao o jogador tem — ou seja O MAIOR VENCE.
#    Por isso todo no de VIP fica acima do teto do rank (19), senao o VIP nao
#    valeria nada para quem chegou ao rank 20.
#      MobConfigManager:313 / MachineConfigManager:247  -> a ordenacao
#      MobConfigManager:319 / MachineConfigManager:242  -> o "primeiro vence"
#
# discount -> aplicado na COMPRA (ShopMenu:430). Exclusivo de VIP: rank e 0.
# bonus    -> aplicado na VENDA dos drops (DropsMenu:56), so em moeda.
#             ⚠️ o desconto NAO vale nos upgrades (UpgradeManager:137).
#
# Ordem efetiva (discount + bonus): garnix 50 > supremo 41 > investidor e
# influencer 35 > imortal, yt, tiktoker e streamer 33 > celestial e miniyt 27 >
# rank.wither (19%) > ... > rank.porco (1%).
#
# Os tiers de influencer ESPELHAM um VIP pago, por decisao do dono: yt, tiktoker
# e streamer valem um imortal; miniyt vale um celestial. Espelhar em vez de
# inventar uma escada propria mantem uma regra so no servidor — e como a tabela
# devolve a primeira entrada por (discount + bonus), empatar significa que ter
# os dois nao muda nada, que e o comportamento certo.

celestial:
  discount: 3 # porcentagem de desconto na compra
  bonus: 24 # porcentagem de bonus nos drops
  tag: '&e&lCELESTIAL'
  permission: vip.celestial

imortal:
  discount: 6 # porcentagem de desconto na compra
  bonus: 27 # porcentagem de bonus nos drops
  tag: '&b&lIMORTAL'
  permission: vip.imortal

supremo:
  discount: 10 # porcentagem de desconto na compra
  bonus: 31 # porcentagem de bonus nos drops
  tag: '&4&lSUPREMO'
  permission: vip.supremo

garnix:
  discount: 15 # porcentagem de desconto na compra
  bonus: 35 # porcentagem de bonus nos drops
  tag: '&6&lGARNIX'
  permission: vip.garnix

investidor:
  discount: 0 # porcentagem de desconto na compra
  bonus: 35 # porcentagem de bonus nos drops
  tag: '&a&lINVESTIDOR'
  permission: vip.investidor

influencer:
  discount: 0 # porcentagem de desconto na compra
  bonus: 35 # porcentagem de bonus nos drops
  tag: '&c&lINFLUENCER'
  permission: vip.influencer

miniyt:
  discount: 3 # igual ao celestial
  bonus: 24 # igual ao celestial
  tag: '&b&lMINIYT'
  permission: vip.miniyt

tiktoker:
  discount: 6 # igual ao imortal
  bonus: 27 # igual ao imortal
  tag: '&b&lTIKTOKER'
  permission: vip.tiktoker

yt:
  discount: 6 # igual ao imortal
  bonus: 27 # igual ao imortal
  tag: '&b&lYT'
  permission: vip.yt

streamer:
  discount: 6 # igual ao imortal
  bonus: 27 # igual ao imortal
  tag: '&b&lSTREAMER'
  permission: vip.streamer

# -- Ranks — so ganho, NUNCA desconto --------------------------------------
# +1% por rank, linear e chato de proposito: previsivel, sempre visivel, e
# nunca e a razao de alguem disparar ou travar. NAO tierar — se crescesse
# geometricamente dobraria o exponencial que ja esta no valor-base.
# O no e concedido em GarnixRankUP/ranks/<rank>.yml -> commands.

# -- A escada comeca no rank 2, de proposito -------------------------------
#
# O rank 1 e o inicial: ninguem "sobe" para ele, entao a lista de comandos do
# coelho.yml nunca roda. O no rank.coelho existe (vive no grupo default do
# LuckPerms, pelo kit), mas uma entrada aqui para ele so poderia valer 0% — que
# e exatamente o que "nenhuma entrada" ja vale.
#
# Entao a escada da N-1% no rank N: rank 1 vale 0%, rank 2 vale 1%, teto 19% no
# rank 20. O nome do no e o MESMO do kit (rank.<mob>), entao subir de rank
# concede uma permissao so, que serve para as duas coisas.

rank-porco:
  discount: 0
  bonus: 1
  tag: '&7[Rank 2]'
  permission: rank.porco

