# Evento — Matemática (chat)
#
# Uma conta é gerada na hora (não há banco). O primeiro que responder o resultado
# com /matematica <resultado> vence. Sem acerto na duração, termina sem vencedor e
# revela a resposta.
#
# Toda conta tem resultado INTEIRO: a subtração nunca fica negativa e a divisão é
# gerada a partir de um quociente inteiro (nunca divide por zero).
#
#   /matematica iniciar     » abre o evento (staff)  (também /mat, /conta)
#   /matematica cancelar    » encerra sem vencedor (staff)
#   /matematica <resultado> » palpite de um jogador

display: '&a&lMATEMÁTICA'

# A cor deste evento. Todo '{c}' nas mensagens vira esta cor, então retematizar
# o evento inteiro é editar esta linha e mais nada.
color: '&a'

start-time: 3s
duration: 30s
# De quantos em quantos segundos a conta é REENVIADA enquanto ninguém acerta —
# o chat anda rápido e quem chegou no meio da rodada não viu a conta.
# Vazio ("") ou "0s" = manda só uma vez, no começo.
repeat: 10s

# Quantas contas ficam de molho antes de poderem ser geradas de novo. Aqui não há
# banco, então o padrão são as 10 últimas contas. "no-repeat: 0" desliga.
# Numa faixa curta (min 1, max 3, só "+") o gerador pode não ter contas novas o
# bastante: nesse caso ele desiste depois de algumas tentativas e repete mesmo.
#no-repeat: 10

# ── Geração da conta ──────────────────────────────────────────────────
math:
  # Faixa dos operandos.
  min: 1
  max: 12
  # Operações sorteadas. Válidas: "+", "-", "x", "/".
  operations:
  - +
  - '-'
  - x

rewards:
- eco give {player} 5000

# ── COMO ESCREVER AS MENSAGENS ────────────────────────────────────────
#
# As mensagens longas usam bloco '|2': escreva as linhas como o jogador vai ler.
#
# O '2' é o que preserva os DOIS ESPAÇOS de recuo no começo de cada linha — sem
# ele o YAML come o recuo e o texto cola na borda do chat. Na prática: o conteúdo
# fica a 6 espaços da margem do arquivo, e os 2 que sobram são os que aparecem.
# Uma linha com só '&r' vira uma linha em branco.
#
# O desenho do bloco:
#   &8▎  barra lateral, só nas linhas de texto corrido — é o cabeçalho do bloco
#   &8▶  o item principal (o prêmio, a chamada para agir) — sem a barra
#   &8▪  os detalhes secundários — sem a barra
# Uma linha em branco (só '&r') separa os grupos: ela entra quando o marcador muda,
# não entre dois '▪' seguidos. Nunca leva barra nem marcador.
#
# O formato antigo (lista com '- ') continua funcionando em qualquer mensagem.
#
# Tags de chat, válidas em qualquer mensagem:
#   <click:run_command:/comando>texto</click>       clicar executa o comando
#   <click:suggest_command:/comando >texto</click>  clicar escreve no chat
#   <hover:show_text:&fdica>texto</hover>           o mouse em cima mostra a dica
# As duas se combinam — o normal é um botão ter as duas.
#
# ATENÇÃO no 'suggest_command': o espaço antes do '>' faz parte do comando
# sugerido. É ele que deixa o cursor pronto para o jogador digitar só a resposta.
#
# Tokens sempre disponíveis: {c} = a cor deste evento (a chave 'color' acima)
#                            {event} = o nome colorido do evento
# Os demais tokens estão anotados em comentário acima de cada mensagem.
messages:
  
  # Mostrado por /matematica sem argumento. {command} = matematica (sem barra)
  help: |2

      &8▎ {c}&lMatemática
      &8▪ &a/{command} <resposta> &8- &fResolva a conta antes dos outros.
      &r
# {seconds} até revelar · {command} = /matematica
  announce: |2

      &8▎ {c}Evento {c}&lMatemática {c}iniciando!
      &8▎ &fResponda clicando &a&l<click:suggest_command:/matematica ><hover:show_text:&fClique para já digitar &7/matematica &fno chat.>AQUI</hover></click>&f.
      &r
      &8▶ &fPrêmio: {c}5K de Cash
      &r
      &8▪ &fRevela em: &7{seconds}s
      &r
# {prompt} = o que foi sorteado nesta rodada
  prompt: |2

      &8▎ {c}Evento {c}&lMatemática {c}iniciado!
      &r
      &8▶ &fConta: &7{prompt}
      &r
      &8▪ &fResponda clicando &a&l<click:suggest_command:/matematica ><hover:show_text:&fClique para já digitar &7/matematica &fno chat.>AQUI</hover></click>&f.
      &r
# Reenviada a cada 'repeat' segundos enquanto ninguém acerta. Apague este bloco
# para que o 'prompt' acima seja reenviado no lugar. {prompt} = a conta sorteada
  reminder: |2

      &8▎ {c}Evento {c}&lMatemática {c}rolando - ninguém resolveu ainda!
      &r
      &8▶ &fConta: &7{prompt}
      &r
      &8▪ &fResponda clicando &a&l<click:suggest_command:/matematica ><hover:show_text:&fClique para já digitar &7/matematica &fno chat.>AQUI</hover></click>&f.
      &r
  wrong: '&cResultado errado! Tente de novo.'
  
  # {player} acertou · {answer} a resposta certa
  winner: |2

      &8▎ {c}Evento {c}&lMatemática&f, {c}temos um vencedor!
      &r
      &8▶ &7{player} &fresolveu a conta primeiro.
      &r
      &8▪ &fResposta: &7{answer}
      &8▪ &fPrêmio: {c}5K de Cash
      &r
# {answer} a resposta que ninguém acertou
  no-winner: |2

      &8▎ {c}Evento {c}&lMatemática {c}encerrado.
      &r
      &8▪ &fMotivo: &7Tempo esgotado - ninguém resolveu.
      &8▪ &fResposta: &7{answer}
      &r
  cancelled: |2

      &8▎ {c}Evento {c}&lMatemática {c}cancelado.
      &r
      &8▪ &fMotivo: &7Cancelado pela staff.
      &r
