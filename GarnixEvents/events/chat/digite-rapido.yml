# Evento — Digite Rápido (chat)
#
# Uma palavra ou frase é mostrada e o primeiro que digitá-la exatamente com
# /digite-rapido <frase> vence — acentos inclusive. Como o texto está à mostra,
# é uma corrida de digitação. Sem acerto na duração, termina sem vencedor.
#
#   /digite-rapido iniciar » abre o evento (staff)  (também /digite)
#   /digite-rapido cancelar » encerra sem vencedor (staff)
#   /digite-rapido <frase>  » palpite de um jogador

display: '&9&lDIGITE RAPIDO'

# A cor deste evento. Todo '{c}' nas mensagens vira esta cor, então retematizar
# o evento inteiro é editar esta linha e mais nada.
color: '&9'

start-time: 3s
duration: 30s
# De quantos em quantos segundos a frase é REENVIADA enquanto ninguém acerta —
# o chat anda rápido e quem chegou no meio da rodada não viu o que digitar.
# Vazio ("") ou "0s" = manda só uma vez, no começo.
repeat: 10s

# Quantas rodadas uma frase fica de molho antes de poder ser sorteada de novo.
# SEM esta chave vale o banco inteiro menos uma: uma frase só volta depois que
# todas as outras já saíram. "no-repeat: 0" desliga e volta ao sorteio puramente
# aleatório (que pode repetir na rodada seguinte).
#no-repeat: 30

# ── Rigor da comparação ───────────────────────────────────────────────
#
# As duas chaves são independentes: cada uma aperta um lado, e o que vale aqui
# não mexe em nenhum outro evento. Sem a chave, vale false (o perdão). Espaço
# sobrando nas pontas e espaço repetido no meio são sempre ignorados, nas duas.
#
# Aqui as DUAS são true: a frase está à mostra e o jogo é reproduzi-la igual.
#
# TRUE: o acento conta — "cafe da manha" NÃO passa por "café da manhã".
accent-sensitive: true
# TRUE: a caixa conta — "Café da manhã" NÃO passa por "café da manhã". Como o
# banco abaixo é todo minúsculo, o jogador tem que copiar em minúsculo também.
# Ponha false se preferir perdoar o Shift/Caps sem abrir mão do acento.
case-sensitive: true

# ── Banco de frases ───────────────────────────────────────────────────
#
# Uma frase por linha. A frase mostrada É a resposta a digitar (não use "|").
frases:
  # ── Curtas ──
  # ── Médias ──
  # ── Trava-línguas ──
  - velocidade é tudo
  - trabalho em equipe
  - quem digita mais rápido vence
  - café da manhã reforçado
  - tempo é dinheiro
  - o barato sai caro
  - quem procura acha
  - a união faz a força
  - devagar se vai ao longe
  - antes tarde do que nunca
  - quem avisa amigo é
  - beleza não põe mesa
  - o seguro morreu de velho
  - quem espera sempre alcança
  - filho de peixe peixinho é
  - roupa suja se lava em casa
  - cada macaco no seu galho
  - onde há fumaça há fogo
  - quem não arrisca não petisca
  - nem tudo que reluz é ouro
  - o sol nasce para todos
  - quem tem boca vai a roma
  - melhor prevenir do que remediar
  - o hábito não faz o monge
  - quem muito quer nada tem
  - quem ri por último ri melhor
  - dinheiro não traz felicidade
  - não deixe para amanhã o que dá para fazer hoje
  - a pressa é inimiga da perfeição
  - água mole em pedra dura tanto bate até que fura
  - de grão em grão a galinha enche o papo
  - mais vale um pássaro na mão do que dois voando
  - casa de ferreiro espeto de pau
  - gato escaldado tem medo de água fria
  - quem semeia vento colhe tempestade
  - em boca fechada não entra mosca
  - quem canta seus males espanta
  - amigos amigos negócios à parte
  - a esperança é a última que morre
  - um dia é da caça e outro do caçador
  - cavalo dado não se olham os dentes
  - para bom entendedor meia palavra basta
  - papagaio come milho e periquito leva a fama
  - quem com ferro fere com ferro será ferido
  - o rato roeu a roupa do rei
  - o rato roeu a roupa do rei de roma
  - três pratos de trigo para três tigres tristes
  - a aranha arranha a jarra
  - o peito do pé de pedro é preto
  - sabia que o sabiá sabia assobiar
  - num ninho de mafagafos há sete mafagafinhos
  - o doce perguntou pro doce qual é o doce mais doce
  - bagre branco e barco preto no porto
  - a vaca malhada foi molhada por outra vaca molhada

rewards:
- cash add {player} 5000

# ── COMO ESCREVER AS MENSAGENS ────────────────────────────────────────
#
# As mensagens longas usam bloco '|2': escreva as linhas como o jogador vai ler.
#
# O '2' é o que preserva os DOIS ESPAÇOS de recuo no começo de cada linha — sem
# ele o YAML come o recuo e o texto cola na borda do chat. Na prática: o conteúdo
# fica a 6 espaços da margem do arquivo, e os 2 que sobram são os que aparecem.
# Uma linha com só '&r' vira uma linha em branco.
#
# O desenho do bloco:
#   &8▎  barra lateral, só nas linhas de texto corrido — é o cabeçalho do bloco
#   &8▶  o item principal (o prêmio, a chamada para agir) — sem a barra
#   &8▪  os detalhes secundários — sem a barra
# Uma linha em branco (só '&r') separa os grupos: ela entra quando o marcador muda,
# não entre dois '▪' seguidos. Nunca leva barra nem marcador.
#
# O formato antigo (lista com '- ') continua funcionando em qualquer mensagem.
#
# Tags de chat, válidas em qualquer mensagem:
#   <click:run_command:/comando>texto</click>       clicar executa o comando
#   <click:suggest_command:/comando >texto</click>  clicar escreve no chat
#   <hover:show_text:&fdica>texto</hover>           o mouse em cima mostra a dica
# As duas se combinam — o normal é um botão ter as duas.
#
# ATENÇÃO no 'suggest_command': o espaço antes do '>' faz parte do comando
# sugerido. É ele que deixa o cursor pronto para o jogador digitar só a resposta.
#
# Tokens sempre disponíveis: {c} = a cor deste evento (a chave 'color' acima)
#                            {event} = o nome colorido do evento
# Os demais tokens estão anotados em comentário acima de cada mensagem.
messages:
  
  # Mostrado por /digite-rapido sem argumento. {command} = digite-rapido (sem barra)
  help: |2

      &8▎ {c}&lDigite Rápido
      &8▪ &a/{command} <resposta> &8- &fCopie a frase e mande no chat antes dos outros.
      &8▪ &fVale só a cópia &7idêntica&f: acento e minúsculas contam.
      &r
# {seconds} até revelar · {command} = /digite-rapido
  announce: |2

      &8▎ {c}Evento {c}&lDigite Rápido {c}iniciando!
      &8▎ &fResponda clicando &a&l<click:suggest_command:/digite-rapido ><hover:show_text:&fClique para já digitar &7/digite-rapido &fno chat.>AQUI</hover></click>&f.
      &r
      &8▶ &fPrêmio: {c}5K de Cash
      &r
      &8▪ &fRevela em: &7{seconds}s
      &r
# {prompt} = o que foi sorteado nesta rodada
  prompt: |2

      &8▎ {c}Evento {c}&lDigite Rápido {c}iniciado!
      &r
      &8▶ &fDigite: &7{prompt}
      &r
      &8▪ &fResponda clicando &a&l<click:suggest_command:/digite-rapido ><hover:show_text:&fClique para já digitar &7/digite-rapido &fno chat.>AQUI</hover></click>&f.
      &r
# Reenviada a cada 'repeat' segundos enquanto ninguém acerta. Apague este bloco
# para que o 'prompt' acima seja reenviado no lugar. {prompt} = a frase a digitar
  reminder: |2

      &8▎ {c}Evento {c}&lDigite Rápido {c}rolando - ninguém digitou ainda!
      &r
      &8▶ &fDigite: &7{prompt}
      &r
      &8▪ &fResponda clicando &a&l<click:suggest_command:/digite-rapido ><hover:show_text:&fClique para já digitar &7/digite-rapido &fno chat.>AQUI</hover></click>&f.
      &r
  wrong: '&cNão foi igualzinho. Copie a frase exatamente - acento e minúsculas contam.'
  
  # {player} acertou · {answer} a resposta certa
  winner: |2

      &8▎ {c}Evento {c}&lDigite Rápido&f, {c}temos um vencedor!
      &r
      &8▶ &7{player} &fdigitou a frase primeiro.
      &r
      &8▪ &fResposta: &7{answer}
      &8▪ &fPrêmio: {c}5K de Cash
      &r
# {answer} a resposta que ninguém acertou
  no-winner: |2

      &8▎ {c}Evento {c}&lDigite Rápido {c}encerrado.
      &r
      &8▪ &fMotivo: &7Tempo esgotado - ninguém digitou a tempo.
      &8▪ &fResposta: &7{answer}
      &r
  cancelled: |2

      &8▎ {c}Evento {c}&lDigite Rápido {c}cancelado.
      &r
      &8▪ &fMotivo: &7Cancelado pela staff.
      &r
