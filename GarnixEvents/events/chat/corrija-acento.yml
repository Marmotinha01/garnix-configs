# Evento — Corrija o Acento (chat)
#
# Uma palavra é mostrada SEM acento e o jogador precisa reescrevê-la com o acento
# no lugar exato, usando /corrija-acento <palavra>. O primeiro que acertar vence.
# Sem acerto na duração, termina sem vencedor e revela a forma correta.
#
# ATENÇÃO: aqui 'accent-sensitive' é TRUE — o acento é justamente o que se avalia,
# então "familia" NÃO conta como "família".
#
#   /corrija-acento iniciar  - abre o evento (staff)  (também /acento)
#   /corrija-acento cancelar - encerra sem vencedor (staff)
#   /corrija-acento <palavra> - palpite de um jogador

display: '&6&lCORRIJA O ACENTO'

# A cor deste evento. Todo '{c}' nas mensagens vira esta cor, então retematizar
# o evento inteiro é editar esta linha e mais nada.
color: '&6'

start-time: 3s
duration: 45s
# De quantos em quantos segundos a palavra é REENVIADA enquanto ninguém acerta —
# o chat anda rápido e quem chegou no meio da rodada não viu o desafio.
# Vazio ("") ou "0s" = manda só uma vez, no começo.
repeat: 15s

# Quantas rodadas uma palavra fica de molho antes de poder ser sorteada de novo.
# SEM esta chave vale o banco inteiro menos uma: uma palavra só volta depois que
# todas as outras já saíram. "no-repeat: 0" desliga e volta ao sorteio puramente
# aleatório (que pode repetir na rodada seguinte).
#no-repeat: 40

# ── Rigor da comparação ───────────────────────────────────────────────
#
# As duas chaves são independentes: cada uma aperta um lado, e o que vale aqui
# não mexe em nenhum outro evento. Sem a chave, vale false (o perdão). Espaço
# sobrando nas pontas e espaço repetido no meio são sempre ignorados, nas duas.
#
# TRUE: o acento conta — é justamente o ponto deste evento.
accent-sensitive: true
# FALSE: a caixa não conta — "Família" passa por "família". O desafio aqui é o
# acento, não o Shift; ponha true só se quiser cobrar a maiúscula também.
case-sensitive: false

# ── Banco de palavras ─────────────────────────────────────────────────
#
# Formato "sem acento|com acento". O lado esquerdo é o que aparece (o desafio);
# o direito é a forma correta a digitar (e a que é revelada no fim).
#
# Evite palavras com duas leituras possíveis ("pais" pode virar "país" ou continuar
# "pais"): o jogador não tem como adivinhar qual das duas o evento quer.
palavras:
  # ── Til e cedilha ──
  # ── Agudo e circunflexo ──
  - nao|não
  - mae|mãe
  - irmao|irmão
  - coracao|coração
  - feijao|feijão
  - limao|limão
  - aviao|avião
  - cao|cão
  - pao|pão
  - mao|mão
  - paes|pães
  - maca|maçã
  - licao|lição
  - acucar|açúcar
  - cabeca|cabeça
  - criancas|crianças
  - danca|dança
  - forca|força
  - praca|praça
  - servico|serviço
  - comecar|começar
  - almoco|almoço
  - pescoco|pescoço
  - orgao|órgão
  - familia|família
  - portugues|português
  - voce|você
  - agua|água
  - medico|médico
  - musica|música
  - historia|história
  - matematica|matemática
  - ingles|inglês
  - cafe|café
  - sofa|sofá
  - ceu|céu
  - chapeu|chapéu
  - heroi|herói
  - ate|até
  - tambem|também
  - alguem|alguém
  - ninguem|ninguém
  - porem|porém
  - arvore|árvore
  - ultimo|último
  - publico|público
  - rapido|rápido
  - dificil|difícil
  - facil|fácil
  - possivel|possível
  - util|útil
  - nivel|nível
  - movel|móvel
  - automovel|automóvel
  - oculos|óculos
  - onibus|ônibus
  - estomago|estômago
  - sanduiche|sanduíche
  - saude|saúde
  - tenis|tênis
  - lampada|lâmpada
  - camera|câmera
  - armario|armário
  - relogio|relógio
  - negocio|negócio
  - silencio|silêncio
  - exercicio|exercício
  - policia|polícia
  - farmacia|farmácia
  - distancia|distância
  - importancia|importância
  - experiencia|experiência
  - ciencia|ciência
  - paciencia|paciência
  - sabado|sábado
  - terca|terça
  - proximo|próximo
  - maximo|máximo
  - minimo|mínimo
  - otimo|ótimo
  - unico|único
  - magico|mágico
  - logico|lógico

# Recompensa do vencedor. Banda: CHAT — chat rapido — se ganha digitando, o de menor atrito do servidor.
#
# Nada em coins de proposito: evento nao tem gate de tier, entao um valor fixo
# seria enorme no dia 1 e po no dia 5. Cash, chave e caixa sao neutros em tier.
#
rewards:
- cash add {player} 10
- crates givekey vip {player} 5

# ── COMO ESCREVER AS MENSAGENS ────────────────────────────────────────
#
# As mensagens longas usam bloco '|2': escreva as linhas como o jogador vai ler.
#
# O '2' é o que preserva os DOIS ESPAÇOS de recuo no começo de cada linha — sem
# ele o YAML come o recuo e o texto cola na borda do chat. Na prática: o conteúdo
# fica a 6 espaços da margem do arquivo, e os 2 que sobram são os que aparecem.
# Uma linha com só '&r' vira uma linha em branco.
#
# O desenho do bloco:
#   &8▎  barra lateral, só nas linhas de texto corrido — é o cabeçalho do bloco
#   &8▶  o item principal (o prêmio, a chamada para agir) — sem a barra
#   &8▪  os detalhes secundários — sem a barra
# Uma linha em branco (só '&r') separa os grupos: ela entra quando o marcador muda,
# não entre dois '▪' seguidos. Nunca leva barra nem marcador.
#
# O formato antigo (lista com '- ') continua funcionando em qualquer mensagem.
#
# Tags de chat, válidas em qualquer mensagem:
#   <click:run_command:/comando>texto</click>       clicar executa o comando
#   <click:suggest_command:/comando >texto</click>  clicar escreve no chat
#   <hover:show_text:&fdica>texto</hover>           o mouse em cima mostra a dica
# As duas se combinam — o normal é um botão ter as duas.
#
# ATENÇÃO no 'suggest_command': o espaço antes do '>' faz parte do comando
# sugerido. É ele que deixa o cursor pronto para o jogador digitar só a resposta.
#
# Tokens sempre disponíveis: {c} = a cor deste evento (a chave 'color' acima)
#                            {event} = o nome colorido do evento
# Os demais tokens estão anotados em comentário acima de cada mensagem.
messages:
  
  # Mostrado por /corrija-acento sem argumento. {command} = corrija-acento (sem barra)
  help: |2

      &8▎ {c}&lCorrija o Acento
      &8▪ &a/{command} <resposta> &8- &fReescreva a palavra com o acento no lugar certo.
      &r
# {seconds} até revelar · {command} = /corrija-acento
  announce: |2

      &8▎ {c}Evento {c}&lCorrija o Acento {c}iniciando!
      &8▎ &fResponda clicando &a&l<click:suggest_command:/corrija-acento ><hover:show_text:&fClique para já digitar &7/corrija-acento &fno chat.>AQUI</hover></click>&f.
      &r
      &8▶ &fPrêmios: &6❂10 cash &8+ &dx&l5 &dChaves VIP
      &r
      &8▪ &fRevela em: &7{seconds}s
      &r
# {prompt} = o que foi sorteado nesta rodada
  prompt: |2

      &8▎ {c}Evento {c}&lCorrija o Acento {c}iniciado!
      &r
      &8▶ &fSem acento: &7{prompt}
      &r
      &8▪ &fResponda clicando &a&l<click:suggest_command:/corrija-acento ><hover:show_text:&fClique para já digitar &7/corrija-acento &fno chat.>AQUI</hover></click>&f.
      &r
# Reenviada a cada 'repeat' segundos enquanto ninguém acerta. Apague este bloco
# para que o 'prompt' acima seja reenviado no lugar. {prompt} = a palavra sem acento
  reminder: |2

      &8▎ {c}Evento {c}&lCorrija o Acento {c}rolando - ninguém acertou ainda!
      &r
      &8▶ &fSem acento: &7{prompt}
      &r
      &8▪ &fResponda clicando &a&l<click:suggest_command:/corrija-acento ><hover:show_text:&fClique para já digitar &7/corrija-acento &fno chat.>AQUI</hover></click>&f.
      &r
  wrong: '&cO acento não está certo. Tente de novo.'
  
  # {player} acertou · {answer} a resposta certa
  winner: |2

      &8▎ {c}Evento {c}&lCorrija o Acento&f, {c}temos um vencedor!
      &r
      &8▶ &7{player} &facertou o acento primeiro.
      &r
      &8▪ &fResposta: &7{answer}
      &8▪ &fPrêmios: &6❂10 cash &8+ &dx&l5 &dChaves VIP
      &r
# {answer} a resposta que ninguém acertou
  no-winner: |2

      &8▎ {c}Evento {c}&lCorrija o Acento {c}encerrado.
      &r
      &8▪ &fMotivo: &7Tempo esgotado - ninguém acertou o acento.
      &8▪ &fResposta: &7{answer}
      &r
  cancelled: |2

      &8▎ {c}Evento {c}&lCorrija o Acento {c}cancelado.
      &r
      &8▪ &fMotivo: &7Cancelado pela staff.
      &r
