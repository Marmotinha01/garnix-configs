# Evento — Acerte a Palavra (chat)
#
# Uma palavra aparece com as letras escondidas e vai sendo revelada aos poucos.
# O primeiro que digitar a palavra inteira com /acerte-palavra <palavra> vence.
# Se ninguém acertar dentro da duração, termina sem vencedor e revela a palavra.
#
#   /acerte-palavra iniciar  - abre o evento (staff)
#   /acerte-palavra cancelar - encerra sem vencedor (staff)
#   /acerte-palavra <palavra> - palpite de um jogador

display: '&3&lACERTE A PALAVRA'

# A cor deste evento. Todo '{c}' nas mensagens vira esta cor, então retematizar
# o evento inteiro é editar esta linha e mais nada.
color: '&3'

start-time: 3s
# A duração aqui importa: é quanto tempo o pessoal tem antes de acabar sem vencedor.
duration: 60s
# Este evento não precisa de 'repeat' (a chave dos outros eventos de chat, que reenvia
# o enunciado de tempos em tempos): a palavra já reaparece sozinha a cada nova letra
# revelada, pelo 'reveal.every' abaixo. Se ainda assim quiser o reenvio, é só somar
# a chave aqui: repeat: "20s"
#
# Quantas rodadas uma palavra fica de molho antes de poder ser sorteada de novo.
# SEM esta chave vale o banco inteiro menos uma: uma palavra só volta depois que
# todas as outras já saíram. "no-repeat: 0" desliga e volta ao sorteio puramente
# aleatório (que pode repetir na rodada seguinte). A memória é do servidor ligado —
# reiniciar o servidor zera; o /eventos reload não.
#no-repeat: 40

# ── Rigor da comparação ───────────────────────────────────────────────
#
# As duas chaves são independentes: cada uma aperta um lado, e o que vale aqui
# não mexe em nenhum outro evento. Sem a chave, vale false (o perdão). Espaço
# sobrando nas pontas e espaço repetido no meio são sempre ignorados, nas duas.
#
# FALSE: ignora o acento — "familia" passa por "família".
accent-sensitive: false
# FALSE: ignora a caixa — "Família" passa por "família". Quem está adivinhando
# não tem como saber a grafia exata, então o padrão aqui é perdoar as duas.
case-sensitive: false

# ── Revelação das dicas ───────────────────────────────────────────────
reveal:
  # Caractere que esconde uma letra ainda não revelada.
  mask-char: _
  # Quantas letras já vêm reveladas (sorteadas) assim que a palavra aparece.
  # Vale para as palavras sem ">N" próprio. Conta junto com o 'keep-hidden' abaixo.
  start-revealed: 2
  # De quantos em quantos segundos uma nova letra é revelada.
  every: 8s
  # Quantas letras nunca são reveladas (para não entregar a palavra de graça).
  keep-hidden: 2

# ── Banco de palavras ─────────────────────────────────────────────────
#
# Uma palavra (ou expressão) por linha. Grafias alternativas: "coração|coracao".
#
# ">N" no fim da linha diz quantas letras já vêm reveladas naquela palavra, no lugar do
# 'reveal.start-revealed'. Sem ">N", vale o valor do arquivo. Ex.: "coração|coracao>3".
#
# Evite palavras muito longas: cada letra a mais é uma dica a mais até alguém acertar.
palavras:
  # ── Comida ──
  # ── Bichos ──
  # ── Natureza ──
  # ── Objetos ──
  # ── Lugares e ideias ──
  - banana>2
  - abacaxi>2
  - morango>2
  - melancia>3
  - chocolate>3
  - sorvete>2
  - pipoca>2
  - lasanha>2
  - tomate>2
  - cenoura>2
  - queijo>2
  - biscoito>3
  - elefante>3
  - cachorro>3
  - macaco>2
  - tartaruga>3
  - golfinho>3
  - pinguim>2
  - zebra>2
  - coruja>2
  - formiga>2
  - borboleta>3
  - cavalo>2
  - girafa>2
  - girassol>3
  - floresta>3
  - montanha>3
  - cachoeira>3
  - estrela>2
  - trovão|trovao>2
  - deserto>2
  - semente>2
  - computador>4
  - teclado>2
  - celular>2
  - janela>2
  - cadeira>2
  - armário|armario>2
  - martelo>2
  - tesoura>2
  - vassoura>3
  - garrafa>2
  - relógio|relogio>2
  - guitarra>3
  - foguete>2
  - bicicleta>3
  - chuveiro>3
  - ventilador>4
  - aventura>3
  - biblioteca>4
  - hospital>3
  - mercado>2
  - castelo>2
  - estrada>2
  - dinheiro>3
  - domingo>2
  - verdade>2
  - amizade>2
  - coração|coracao>2
  - vitória|vitoria>2

# Recompensa do vencedor. Banda: CHAT — chat rapido — se ganha digitando, o de menor atrito do servidor.
#
# Nada em coins de proposito: evento nao tem gate de tier, entao um valor fixo
# seria enorme no dia 1 e po no dia 5. Cash, chave e caixa sao neutros em tier.
#
rewards:
- cash add {player} 10
- crates givekey rankup {player} 5
- fragmentos givevirtual {player} marca 3

# ── COMO ESCREVER AS MENSAGENS ────────────────────────────────────────
#
# As mensagens longas usam bloco '|2': escreva as linhas como o jogador vai ler.
#
# O '2' é o que preserva os DOIS ESPAÇOS de recuo no começo de cada linha — sem
# ele o YAML come o recuo e o texto cola na borda do chat. Na prática: o conteúdo
# fica a 6 espaços da margem do arquivo, e os 2 que sobram são os que aparecem.
# Uma linha com só '&r' vira uma linha em branco.
#
# O desenho do bloco:
#   &8▎  barra lateral, só nas linhas de texto corrido — é o cabeçalho do bloco
#   &8▶  o item principal (o prêmio, a chamada para agir) — sem a barra
#   &8▪  os detalhes secundários — sem a barra
# Uma linha em branco (só '&r') separa os grupos: ela entra quando o marcador muda,
# não entre dois '▪' seguidos. Nunca leva barra nem marcador.
#
# O formato antigo (lista com '- ') continua funcionando em qualquer mensagem.
#
# Tags de chat, válidas em qualquer mensagem:
#   <click:run_command:/comando>texto</click>       clicar executa o comando
#   <click:suggest_command:/comando >texto</click>  clicar escreve no chat
#   <hover:show_text:&fdica>texto</hover>           o mouse em cima mostra a dica
# As duas se combinam — o normal é um botão ter as duas.
#
# ATENÇÃO no 'suggest_command': o espaço antes do '>' faz parte do comando
# sugerido. É ele que deixa o cursor pronto para o jogador digitar só a resposta.
#
# Tokens sempre disponíveis: {c} = a cor deste evento (a chave 'color' acima)
#                            {event} = o nome colorido do evento
# Os demais tokens estão anotados em comentário acima de cada mensagem.
messages:
  
  # Mostrado por /acerte-palavra sem argumento. {command} = acerte-palavra (sem barra)
  help: |2

      &8▎ {c}&lAcerte a Palavra
      &8▪ &a/{command} <resposta> &8- &fEnvia sua resposta.
      &r
# {seconds} até revelar · {command} = /acerte-palavra
  announce: |2

      &8▎ {c}Evento {c}&lAcerte a Palavra {c}iniciando!
      &8▎ &fResponda clicando &a&l<click:suggest_command:/acerte-palavra ><hover:show_text:&fClique para já digitar &7/acerte-palavra &fno chat.>AQUI</hover></click>&f.
      &r
      &8▶ &fPrêmios: &6❂10 cash &8+ &6x&l5 &6Chaves RankUP
      &r
      &8▪ &fRevela em: &7{seconds}s
      &r
# {prompt} = a palavra com as letras escondidas · {remaining} = quantas dicas ainda vêm
  prompt: |2

      &8▎ {c}Evento {c}&lAcerte a Palavra {c}iniciado!
      &r
      &8▶ &fPalavra: &7{prompt}
      &r
      &8▪ &fDicas restantes: &7{remaining}
      &8▪ &fResponda clicando &a&l<click:suggest_command:/acerte-palavra ><hover:show_text:&fClique para já digitar &7/acerte-palavra &fno chat.>AQUI</hover></click>&f.
      &r
  wrong: '&cNão é essa. Tente de novo.'
  
  # {player} acertou · {answer} a resposta certa
  winner: |2

      &8▎ {c}Evento {c}&lAcerte a Palavra&f, {c}temos um vencedor!
      &r
      &8▶ &7{player} &facertou a palavra primeiro.
      &r
      &8▪ &fResposta: &7{answer}
      &8▪ &fPrêmios: &6❂10 cash &8+ &6x&l5 &6Chaves RankUP
      &r
# {answer} a resposta que ninguém acertou
  no-winner: |2

      &8▎ {c}Evento {c}&lAcerte a Palavra {c}encerrado.
      &r
      &8▪ &fMotivo: &7Tempo esgotado - ninguém acertou.
      &8▪ &fResposta: &7{answer}
      &r
  cancelled: |2

      &8▎ {c}Evento {c}&lAcerte a Palavra {c}cancelado.
      &r
      &8▪ &fMotivo: &7Cancelado pela staff.
      &r
# Reenviada a cada nova letra revelada.
# {prompt} = a palavra como está agora
# {remaining} = quantas dicas ainda vêm depois desta (0 = esta foi a última; o que
#               sobrar escondido é o 'reveal.keep-hidden', que nunca é revelado)
  hint: |2

      &8▎ {c}&lDICA
      &8▶ &7{prompt}
      &r
      &8▪ &fDicas restantes: &7{remaining}
      &8▪ &fResponda clicando &a&l<click:suggest_command:/acerte-palavra ><hover:show_text:&fClique para já digitar &7/acerte-palavra &fno chat.>AQUI</hover></click>
      &r
