# Evento — Charada (chat)
#
# Uma charada é sorteada do banco e anunciada no chat. O primeiro jogador que
# responder corretamente com /charada <resposta> vence. Se ninguém acertar dentro
# da duração, o evento termina sem vencedor e revela a resposta.
#
# Mesmo motor do Quiz — só muda o conteúdo (o banco 'charadas') e as mensagens.
#
#   /charada iniciar   - abre o evento (staff)
#   /charada cancelar  - encerra sem vencedor (staff)
#   /charada <resposta> - palpite de um jogador

display: '&d&lCHARADA'

# A cor deste evento. Todo '{c}' nas mensagens vira esta cor, então retematizar
# o evento inteiro é editar esta linha e mais nada.
color: '&d'

start-time: 3s
duration: 60s
# De quantos em quantos segundos a charada é REENVIADA enquanto ninguém decifra —
# o chat anda rápido e quem chegou no meio da rodada não viu o enunciado.
# Vazio ("") ou "0s" = manda só uma vez, no começo.
repeat: 20s

# Quantas rodadas uma charada fica de molho antes de poder ser sorteada de novo.
# SEM esta chave vale o banco inteiro menos uma: uma charada só volta depois que
# todas as outras já saíram. "no-repeat: 0" desliga e volta ao sorteio puramente
# aleatório (que pode repetir na rodada seguinte).
#no-repeat: 20

# -- Rigor da comparação -----------------------------------------------
#
# As duas chaves são independentes: cada uma aperta um lado, e o que vale aqui
# não mexe em nenhum outro evento. Sem a chave, vale false (o perdão). Espaço
# sobrando nas pontas e espaço repetido no meio são sempre ignorados, nas duas.
#
# FALSE: ignora o acento — "gelo" e "relógio"/"relogio" passam igual.
accent-sensitive: false
# FALSE: ignora a caixa — "Gelo" passa por "gelo". Quem está adivinhando não tem
# como saber a grafia exata, então o padrão aqui é perdoar as duas.
case-sensitive: false

# -- Banco de charadas -------------------------------------------------
#
# Uma charada por linha, no formato "Charada|resposta1|resposta2|...".
# A PRIMEIRA resposta é a revelada no fim; as demais são formas aceitas.
# Não use "|" dentro do texto da charada.
#
# As últimas cinco são as difíceis — ainda decifráveis, mas pedem um tempo a mais.
charadas:
  # -- Fáceis --
  # -- Médias --
  # -- Difíceis (mas decifráveis) --
  - 'O que é, o que é: quanto mais se tira, maior fica?|buraco|o buraco'
  - 'O que é, o que é: tem dentes mas não morde?|pente|o pente'
  - 'O que é, o que é: cai em pé e corre deitado?|chuva|a chuva'
  - O que sobe mas nunca desce?|idade|a idade
  - 'O que é, o que é: tem cidades mas não tem casas, tem rios mas não tem água?|mapa|o mapa'
  - 'O que é, o que é: tem coroa mas não é rei, tem espinho mas não é rosa?|abacaxi|o abacaxi'
  - 'O que é, o que é: tem asa mas não voa, tem bico mas não bica?|bule|o bule'
  - 'O que é, o que é: tem pescoço mas não tem cabeça?|garrafa|a garrafa'
  - 'O que é, o que é: quanto mais queima, menor fica?|vela|a vela'
  - 'O que é, o que é: tem folhas mas não é árvore?|livro|o livro|caderno|o caderno'
  - 'O que é, o que é: tem mãos mas não tem braços?|relógio|relogio|o relogio'
  - 'O que é, o que é: sobe e desce mas fica sempre no mesmo lugar?|escada|a escada'
  - 'O que é, o que é: anda com os pés na cabeça?|piolho|o piolho'
  - 'O que é, o que é: quanto mais se enche, mais leve fica?|balão|balao|o balao|bexiga'
  - 'O que é, o que é: passa a vida toda em pé e nunca se cansa?|árvore|arvore|a arvore'
  - 'O que é, o que é: entra na água e não se molha?|sombra|a sombra|a luz|luz'
  - 'O que é, o que é: quanto mais se lava, mais sujo fica?|água|agua|a agua'
  - Que animal sempre cai de pé?|gato|o gato
  - 'O que é, o que é: tem cara e coroa mas não tem corpo?|moeda|a moeda'
  - 'O que é, o que é: tem olhos mas não enxerga?|batata|a batata'
  - 'O que é, o que é: quanto mais escuro fica, mais se vê?|estrelas|as estrelas|estrela|ceu estrelado'
  - 'O que é, o que é: tem cama mas não dorme, tem boca mas não fala?|rio|o rio'
  - 'O que é, o que é: de dia tem quatro pés e de noite tem oito?|cama|a cama'
  - 'O que é, o que é: voa sem asas e chora sem olhos?|nuvem|a nuvem'
  - 'O que é, o que é: tem teclas mas não abre porta nenhuma?|teclado|o teclado|piano|o piano'
  - 'O que é, o que é: quanto mais anda, mais fica para trás?|caminho|o caminho|estrada|a estrada'
  - 'O que é, o que é: fala todas as línguas sem nunca ter estudado?|eco|o eco'
  - Qual mês do ano tem 28 dias?|todos|todos os meses|todos eles
  - 'O que é, o que é: sempre vem mas nunca chega?|amanhã|amanha|o amanha'
  - 'O que é, o que é: você só pode segurar com a mão direita?|cotovelo esquerdo|o cotovelo esquerdo|a mao esquerda|mao esquerda'
  - 'O que é, o que é: quebra assim que alguém diz o nome dele?|silêncio|silencio|o silencio'
  - 'O que é, o que é: é seu, mas os outros usam muito mais do que você?|nome|o nome|seu nome|meu nome'
  - 'O que é, o que é: quanto mais você tira, mais deixa para trás?|pegadas|as pegadas|pegada|passos|os passos'
  - 'O que é, o que é: quanto mais tem, menos se enxerga?|escuridão|escuridao|a escuridao|breu'
  - 'O que é, o que é: está sempre na sua frente e mesmo assim você nunca consegue ver?|futuro|o futuro'

# Recompensa do vencedor. Banda: CHAT — chat rapido — se ganha digitando, o de menor atrito do servidor.
#
# Nada em coins de proposito: evento nao tem gate de tier, entao um valor fixo
# seria enorme no dia 1 e po no dia 5. Cash, chave e caixa sao neutros em tier.
#
rewards:
- cash add {player} 10
- crates givekey vip {player} 5

# -- COMO ESCREVER AS MENSAGENS ----------------------------------------
#
# As mensagens longas usam bloco '|2': escreva as linhas como o jogador vai ler.
#
# O '2' é o que preserva os DOIS ESPAÇOS de recuo no começo de cada linha — sem
# ele o YAML come o recuo e o texto cola na borda do chat. Na prática: o conteúdo
# fica a 6 espaços da margem do arquivo, e os 2 que sobram são os que aparecem.
# Uma linha com só '&r' vira uma linha em branco.
#
# O desenho do bloco:
#   &8▎  barra lateral, só nas linhas de texto corrido — é o cabeçalho do bloco
#   &8▶  o item principal (o prêmio, a chamada para agir) — sem a barra
#   &8▪  os detalhes secundários — sem a barra
# Uma linha em branco (só '&r') separa os grupos: ela entra quando o marcador muda,
# não entre dois '▪' seguidos. Nunca leva barra nem marcador.
#
# O formato antigo (lista com '- ') continua funcionando em qualquer mensagem.
#
# Tags de chat, válidas em qualquer mensagem:
#   <click:run_command:/comando>texto</click>       clicar executa o comando
#   <click:suggest_command:/comando >texto</click>  clicar escreve no chat
#   <hover:show_text:&fdica>texto</hover>           o mouse em cima mostra a dica
# As duas se combinam — o normal é um botão ter as duas.
#
# ATENÇÃO no 'suggest_command': o espaço antes do '>' faz parte do comando
# sugerido. É ele que deixa o cursor pronto para o jogador digitar só a resposta.
#
# Tokens sempre disponíveis: {c} = a cor deste evento (a chave 'color' acima)
#                            {event} = o nome colorido do evento
# Os demais tokens estão anotados em comentário acima de cada mensagem.
messages:
  
  # Mostrado por /charada sem argumento. {command} = charada (sem barra)
  help: |2

      &8▎ {c}&lCharada
      &8▪ &a/{command} <resposta> &8- &fDecifre a charada antes dos outros.
      &r
# {seconds} até revelar · {command} = /charada
  announce: |2

      &8▎ {c}Evento {c}&lCharada {c}iniciando!
      &8▎ &fResponda clicando &a&l<click:suggest_command:/charada ><hover:show_text:&fClique para já digitar &7/charada &fno chat.>AQUI</hover></click>&f.
      &r
      &8▶ &fPrêmios: &6❂10 cash &8+ &dx&l5 &dChaves VIP
      &r
      &8▪ &fRevela em: &7{seconds}s
      &r
# {prompt} = o que foi sorteado nesta rodada
  prompt: |2

      &8▎ {c}Evento {c}&lCharada {c}iniciado!
      &r
      &8▶ &fCharada: &7{prompt}
      &r
      &8▪ &fResponda clicando &a&l<click:suggest_command:/charada ><hover:show_text:&fClique para já digitar &7/charada &fno chat.>AQUI</hover></click>&f.
      &r
# Reenviada a cada 'repeat' segundos enquanto ninguém decifra. Apague este bloco
# para que o 'prompt' acima seja reenviado no lugar. {prompt} = a charada sorteada
  reminder: |2

      &8▎ {c}Evento {c}&lCharada {c}rolando - ninguém decifrou ainda!
      &r
      &8▶ &fCharada: &7{prompt}
      &r
      &8▪ &fResponda clicando &a&l<click:suggest_command:/charada ><hover:show_text:&fClique para já digitar &7/charada &fno chat.>AQUI</hover></click>&f.
      &r
  wrong: '&cNão é essa. Tente de novo.'
  
  # {player} acertou · {answer} a resposta certa
  winner: |2

      &8▎ {c}Evento {c}&lCharada&f, {c}temos um vencedor!
      &r
      &8▶ &7{player} &fdecifrou a charada primeiro.
      &r
      &8▪ &fResposta: &7{answer}
      &8▪ &fPrêmios: &6❂10 cash &8+ &dx&l5 &dChaves VIP
      &r
# {answer} a resposta que ninguém acertou
  no-winner: |2

      &8▎ {c}Evento {c}&lCharada {c}encerrado.
      &r
      &8▪ &fMotivo: &7Tempo esgotado - ninguém decifrou.
      &8▪ &fResposta: &7{answer}
      &r
  cancelled: |2

      &8▎ {c}Evento {c}&lCharada {c}cancelado.
      &r
      &8▪ &fMotivo: &7Cancelado pela staff.
      &r
