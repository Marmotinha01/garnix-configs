# Evento — Parkour
#
# Todos largam juntos no início do mapa. Vence quem chegar primeiro na chegada.
# Ninguém é eliminado. Durante a contagem regressiva os corredores ficam TRAVADOS
# na largada — dá para olhar em volta e se mexer dentro do próprio bloco, mas o
# passo que sairia do bloco é recusado até o VALENDO.
#
# Locais necessários: lobby, join, exit e ao menos uma chegada. O cabin é opcional.
#   /parkour setloc lobby|join|exit|cabin  - espera, largada, saída e camarote (opcional)
#   /parkour addsign                 - arma o modo; clique na placa para adicioná-la
#   /parkour delsign <numero>        - remove uma das placas
#   /parkour addplate                - a placa de pressão em que você está vira chegada
#   /parkour delplate <numero>       - remove uma das placas de pressão de chegada
#
# A chegada pode ser PLACA (clicar nela) ou PLACA DE PRESSÃO (pisar nela), e a arena
# pode ter as duas: vale a que o corredor alcançar primeiro. Pode haver várias de cada
# — use uma por bloco da linha para o corredor não precisar mirar no meio dela.
#
# CAIR NÃO FAZ NADA sozinho: o corredor fica onde caiu e volta quando quiser, com o
# item de retorno (checkpoint-item abaixo) — clique direito com ele na mão. Assim um
# percurso com água, com buraco ou com queda para um trecho mais baixo se comporta
# igual, sem o plugin ter que adivinhar o que é cair naquele mapa.
#
# Checkpoints (opcionais — sem nenhum, o retorno leva para a largada):
# Cada checkpoint é uma PLACA DE PRESSÃO do percurso, pega ao pisar nela.
#   1. coloque a placa de pressão onde quiser o checkpoint
#   2. pise nela
#   3. /parkour addcheckpoint        - registra a placa em que você está
#   /parkour delcheckpoint <n>       - remove o checkpoint número n
# Adicione-os na ORDEM do percurso: o jogador só avança de checkpoint, nunca volta,
# então o percurso pode dobrar sobre si mesmo sem ninguém perder terreno.

display: '&dParkour'

# A cor deste evento. Todo '{c}' nas mensagens vira esta cor, então retematizar
# o evento inteiro é editar esta linha e mais nada.
color: '&d'

# Tag do último vencedor deste evento, exibida pela placeholder
# %events_tag_parkour%. Deixe vazio para o evento não dar tag.
tag: '&d[Ninja]'

join-time: 1m
start-time: 10s
duration: 10m

min-players: 2
max-players: 0

# O item que devolve o corredor ao último checkpoint (ou à largada, se ainda não pegou
# nenhum): clique DIREITO com ele na mão, a qualquer momento. É entregue quando o
# jogador cai na arena, junto com a contagem regressiva, e some sozinho no fim do evento.
#
# Formato de item normal do GarnixCore (material, data, amount, display, lore, enchants…).
# 'slot' é a casa da hotbar (0 a 8) em que ele nasce — e é a casa já selecionada.
# Sem esta seção o corredor recebe uma pena sem nome, e o console avisa.
checkpoint-item:
  material: FEATHER
  slot: 8
  display: '&a&lVOLTAR AO CHECKPOINT'
  lore:
    - '&7Clique &fdireito &7para voltar ao'
    - '&7último checkpoint que você pegou.'
    - '&8Sem checkpoint, volta para a largada.'

# Recompensa do vencedor. Banda: BASE — presencial — custa deslocamento e tempo de arena.
#
# Nada em coins de proposito: evento nao tem gate de tier, entao um valor fixo
# seria enorme no dia 1 e po no dia 5. Cash, chave e caixa sao neutros em tier.
#
rewards:
- cash add {player} 20
- crates givekey vip {player} 10

# Títulos mostrados no meio da tela durante o evento.
titles:
  countdown:
    title: '&c&l{seconds}'
    subtitle: '&7Prepare-se!'
    fade-in: 0
    stay: 30
    fade-out: 10
  go:
    title: '&a&lVALENDO!'
    subtitle: '&7Corra até a placa!'

# ── COMO ESCREVER AS MENSAGENS ────────────────────────────────────────
#
# As mensagens longas usam bloco '|2': escreva as linhas como o jogador vai ler.
#
# O '2' é o que preserva os DOIS ESPAÇOS de recuo no começo de cada linha — sem
# ele o YAML come o recuo e o texto cola na borda do chat. Na prática: o conteúdo
# fica a 6 espaços da margem do arquivo, e os 2 que sobram são os que aparecem.
# Uma linha com só '&r' vira uma linha em branco.
#
# O desenho do bloco:
#   &8▎  barra lateral, só nas linhas de texto corrido — é o cabeçalho do bloco
#   &8▶  o item principal (o prêmio, a chamada para agir) — sem a barra
#   &8▪  os detalhes secundários — sem a barra
# Uma linha em branco (só '&r') separa os grupos: ela entra quando o marcador muda,
# não entre dois '▪' seguidos. Nunca leva barra nem marcador.
#
# O formato antigo (lista com '- ') continua funcionando em qualquer mensagem.
#
# Tags de chat, válidas em qualquer mensagem:
#   <click:run_command:/comando>texto</click>      clicar executa o comando
#   <click:suggest_command:/comando >texto</click> clicar escreve no chat
#   <hover:show_text:&fdica>texto</hover>          o mouse em cima mostra a dica
# As duas se combinam — o normal é um botão ter as duas:
#   <click:run_command:/parkour entrar><hover:show_text:&fdica>AQUI</hover></click>
#
# Tokens sempre disponíveis: {c} = a cor deste evento (a chave 'color' acima)
#                            {event} = o nome colorido do evento
# Os demais tokens ({count}, {seconds}, {player}…) estão anotados em cada mensagem.
messages:
  
  # {count} participantes até agora · {seconds} para fechar as entradas
  announce: |2

      &8▎ {c}Evento {c}&lParkour {c}iniciando!
      &8▎ &fParticipe clicando &a&l<click:run_command:/parkour entrar><hover:show_text:&fClique para entrar no evento.>AQUI</hover></click>&f.
      &r
      &8▶ &fPrêmios: &dTag [Ninja] &8+ &6❂20 cash &8+ &dx&l10 &dChaves VIP
      &r
      &8▪ &fParticipantes: &7{count}
      &8▪ &fEntradas fecham em &7{seconds}s
      &r
# {count} participantes · {seconds} para começar
  locked: |2

      &8▎ {c}Evento {c}&lParkour {c}iniciando!
      &8▎ &fAs entradas foram &7fechadas&f.
      &r
      &8▪ &fParticipantes: &7{count}
      &r
      &8▶ &fComeça em {c}&l{seconds}s
      &r
# {count} participantes
  started: |2

      &8▎ {c}Evento {c}&lParkour {c}iniciado!
      &r
      &8▪ &fParticipantes: &7{count}
      &r
# {player} venceu
  winner: |2

      &8▎ {c}Evento {c}&lParkour&f, {c}temos um vencedor!
      &r
      &8▶ &7{player} &fcompletou o percurso em primeiro lugar.
      &r
      &8▪ &fPrêmios: &dTag [Ninja] &8+ &6❂20 cash &8+ &dx&l10 &dChaves VIP
      &r
# ── Eliminações ─────────────────────────────────────────────────────
# Linha única e sem a barra lateral: são avisos soltos no meio do jogo, não blocos.
# {player} quem saiu · {killer} quem tirou · {remaining} ainda em jogo
  eliminated: '&7{player} &ffoi eliminado. &8({remaining} restantes)'
  eliminated-by: '&7{player} &ffoi eliminado por &7{killer}&f. &8({remaining} restantes)'
  eliminated-self: '&cVocê foi eliminado do evento.'
  
  # ── Fim sem vencedor ────────────────────────────────────────────────
  no-winner: |2

      &8▎ {c}Evento {c}&lParkour {c}encerrado.
      &r
      &8▪ &fMotivo: &7Ninguém completou o percurso.
      &r
  cancelled: |2

      &8▎ {c}Evento {c}&lParkour {c}cancelado.
      &r
      &8▪ &fMotivo: &7Cancelado pela staff.
      &r
# {count} de {min} jogadores
  not-enough-players: |2

      &8▎ {c}Evento {c}&lParkour {c}cancelado.
      &r
      &8▪ &fMotivo: &7Jogadores insuficientes.
      &r
# ── Actionbar ───────────────────────────────────────────────────────
# Enviada a TODOS do servidor quando alguém entra ou sai. Não aceita clique.
  player-joined-actionbar: '&7{player} &fentrou no &7{event} &8▪ &a{count} &fparticipantes'
  player-left-actionbar: '&7{player} &fsaiu do &7{event} &8▪ &a{count} &fparticipantes'
  
  # ── Percurso ────────────────────────────────────────────────────────
  # {number} o checkpoint · {total} quantos existem
  fell: '&cVocê caiu. Voltando para a largada...'
  fell-to-checkpoint: '&cVocê caiu. Voltando para o checkpoint &7#{number}&c.'
  checkpoint-reached: '&aCheckpoint &7{number}&f/&7{total} &aalcançado.'
  time-up: '&eO tempo do evento &7{event} &eacabou.'
