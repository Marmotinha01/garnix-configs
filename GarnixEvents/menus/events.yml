title: Eventos
rows: 3

stats-icon:
  slot: 11
  display: '&bSuas Estatísticas'
  lore:
  - '&7Seu desempenho em cada um'
  - '&7dos eventos do servidor.'
  - ''
  - ' &8Eventos vencidos:'
  - '{events}'
  - ''
  - ' &8 ▪ &fVitórias totais: &a{total} '
  - ''
  # Usada quando o jogador ainda não venceu nenhum evento: sem o total, que
  # repetiria o que a linha de aviso já diz. Apague para usar sempre a de cima.
  lore-empty:
  - '&7Seu desempenho em cada um'
  - '&7dos eventos do servidor.'
  - ''
  - ' &8 ▾ &cNenhuma vitória ainda. '
  - ''

stats:
  line: ' &8 ▪ &f{event}: &a{wins}x '
  # Só aparece se 'lore-empty' for apagada — aí o {events} volta a ser usado
  # mesmo com o jogador zerado.
  none: ' &8 ▾ &cNenhuma vitória ainda. '

# Ícone só de leitura, no meio do menu: não tem clique nenhum e não sai do lugar.
# O plugin não agenda evento nenhum — quem escreve o cronograma é você, aqui nas
# linhas de 'lore'. Apague a seção inteira para tirar o ícone do menu.
schedule-icon:
  slot: 13
  material: WATCH
  display: '&eCronograma'
  lore:
  - '&7Os horários de cada'
  - '&7evento de cada dia.'
  - ''
  - ' &8Durante a semana:'
  - ' &8 ▪ &f12:00 &8- &7Evento de arena '
  - ' &8 ▪ &f16:00 &8- &7Evento de chat '
  - ' &8 ▪ &f20:00 &8- &7Evento de arena '
  - ''
  - ' &8Fim de semana:'
  - ' &8 ▪ &f15:00 &8- &7Evento de arena '
  - ' &8 ▪ &f19:00 &8- &7Evento de chat '
  - ' &8 ▪ &f21:00 &8- &7Evento de arena '
  - ''
  - '&8&oOs horários podem variar.'

ranking-icon:
  slot: 15
  material: GOLD_NUGGET
  display: '&6TOP'
  lore:
  - '&7Os melhores competidores'
  - '&7de eventos do servidor.'
  - ''
  - '&6Clique para acessar.'
