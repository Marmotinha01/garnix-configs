# GarnixEvents — Config
#
# As configurações de cada evento (tempos, kit, recompensas e mensagens próprias)
# ficam em events/<evento>.yml. Aqui só o que vale para o plugin inteiro.

# Intervalo (minutos) de atualização dos rankings.
ranking-refresh-minutes: 5

# Texto de %events_running% e %events_winner_<evento>% quando não há ninguém.
placeholder-none: Nenhum

# Texto de %events_status% — a situação de quem está olhando a scoreboard dentro
# de uma run. Fora dela o placeholder fica vazio.
placeholder-status:
  alive: '&aVivo'
  eliminated: '&cEliminado'
  watching: '&eEspectando'

# Segundos restantes em que o anúncio de entrada é repetido no chat.
#
# Cadência de 30 em 30 dentro da janela de 2m30s (o `join-time` de todo evento
# presencial). Somando o anúncio de abertura, que sai sozinho quando o evento
# abre, o servidor é lembrado cinco vezes: 2m30s · 2m · 1m30s · 1m · 30s.
#
# O 10 saiu junto com as paradas finais (5/3/1): a ponta da janela de entrada
# colide com o title de contagem regressiva, que já mostra o número na tela do
# jogador — e um sexto bloco de anúncio não cabe no chat sem afogar o resto.
announce-at:
- 120
- 90
- 60
- 30

# Comandos liberados para quem está EM JOGO no evento.
# Bypass: events.bypass.commands
participants-command-whitelist:
- eventos
- evento
- events
- event
- sumo
- fight
- parkour
- corrida
- spleef
- splegg
- killer
- destemido
- mvp
- tnt-run
- tntrun
- sniper
- paintball
- arqueiros
- batata-quente
- batataquente
- batata
# Eventos de chat: são respondidos por comando e correm numa trilha própria, em
# paralelo com a arena. Sem eles aqui, quem está jogando um evento presencial não
# consegue participar de um quiz/charada que aconteça ao mesmo tempo.
- quiz
- charada
- desembaralhe
- matematica
- mat
- conta
- digite-rapido
- digite
- digiterapido
- corrija-acento
- acento
- corrijaacento
- acerte-palavra
- acertepalavra
- clique-rapido
- clique
- cliquerapido
- bolao
- bolão

# Comandos liberados para quem já foi eliminado e está assistindo no camarote.
# Costuma ser mais permissivo — quem está aqui não influencia mais o resultado.
spectators-command-whitelist:
- eventos
- evento
- events
- event
- sumo
- fight
- parkour
- corrida
- spleef
- splegg
- killer
- destemido
- mvp
- tnt-run
- tntrun
- sniper
- paintball
- arqueiros
- batata-quente
- batataquente
- batata
- spawn
- tell
- msg
- r

setup:
  # Volume máximo (em blocos) de uma área selecionada com o graveto.
  # Evita que uma seleção errada trave o servidor ao montar o piso. 0 = sem limite.
  max-area-volume: 250000
  
  # O graveto de seleção. É reconhecido por NBT, então um graveto comum
  # continua funcionando normalmente.
  wand-item:
    material: STICK
    display: '&aGraveto de Seleção'
    lore:
    - '&7Use para marcar as áreas'
    - '&7em que os eventos rodam.'
    - ''
    - '&aOpções de uso:'
    - '&fBotão esquerdo &8➟ &7Primeiro ponto'
    - '&fBotão direito &8➟ &7Demais pontos'
    glow: true
