# Lista de baús (/bau, /baus).
title: Seus Baús
rows: 6

# Posições dos baús, na ordem dos ids (1..10).
slots:
- 11
- 12
- 13
- 14
- 15
- 20
- 21
- 22
- 23
- 24

# Baú desbloqueado. O ícone vem do baú; {id}, {rows} são preenchidos.
chest-icon:
  display: '&aBaú #{id}'
  lore:
  - '&7Um baú só seu, guardado'
  - '&7fora do inventário.'
  - ''
  - ' &8 ▪ &fLinhas: &7{rows}'
  - ''
  - '&aOpções de uso:'
  - '&fBotão esquerdo &8➟ &7Abrir'
  - '&fBotão direito &8➟ &7Gerenciar'

# Posição ainda não desbloqueada.
locked-icon:
  material: BARRIER
  display: '&cBaú Bloqueado'
  lore:
  - '&7Este baú ainda não foi'
  - '&7liberado para você.'
  - ''
  - '&7Use um &fAtivador de Baú'
  - '&7para desbloquear.'

# Atalho para o ender chest. {player} = dono da lista.
echest-icon:
  slot: 40
  material: ENDER_CHEST
  display: '&eEnder Chest'
  lore:
  - '&7Acesse o seu baú do fim'
  - '&7para armazenar itens.'
  - ''
  - '&eClique para acessar.'
