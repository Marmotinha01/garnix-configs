# Gerenciar baú (clique-direito na lista). {id} = número do baú.
title: 'Gerenciar Baú #{id}'
rows: 4

rename-icon:
  slot: 11
  material: NAME_TAG
  display: '&eRenomear Baú'
  lore:
  - '&7Define o nome exibido na lista.'
  - '&7Aceita cores, até &f{max} &7caracteres.'
  - ''
  - ' &7Atual: &r{display}'
  - ''
  - '&eClique para renomear'

expand-icon:
  slot: 13
  material: ANVIL
  display: '&aExpandir Baú'
  lore:
  - '&7Linhas atuais: &f{rows}'
  - '&7Próxima linha: &f{next}&7/&f{max}'
  - '&7Custo: &f{cost} {currency}'
  - ''
  - '&aClique para expandir'
  # Exibido quando o baú já está no tamanho máximo.
  max-lore:
  - '&7Linhas: &f{rows}&7/&f{max}'
  - ''
  - '&cTamanho máximo atingido.'

change-icon:
  slot: 15
  material: ITEM_FRAME
  display: '&bTrocar Ícone'
  lore:
  - '&7Escolhe o ícone do baú na lista.'
  - ''
  - '&bClique para acessar.'

back-icon:
  slot: 31
  texture: "7437346d8bda78d525d19f540a95e4e79daeda795cbc5a13256236312cf"
  display: '&cVoltar'
  lore:
  - '&7Clique para voltar.'
