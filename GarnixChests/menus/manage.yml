# Gerenciar baú (clique-direito na lista). {id} = número do baú.
title: 'Gerenciar Baú #{id}'
rows: 4

rename-icon:
  slot: 11
  material: NAME_TAG
  display: '&eRenomear Baú'
  lore:
  - '&7Troque o nome que este'
  - '&7baú mostra na lista.'
  - ''
  - ' &8 ▪ &fAtual: &r{display}'
  - ' &8 ▪ &fLimite: &7{max} caracteres'
  - ''
  - '&eClique para renomear.'

expand-icon:
  slot: 13
  material: ANVIL
  display: '&aExpandir Baú'
  lore:
  - '&7Ganhe mais uma linha de'
  - '&7espaço dentro deste baú.'
  - ''
  - ' &8 ▪ &fLinhas atuais: &7{rows}'
  - ' &8 ▪ &fPróxima linha: &a{next}&8/&c{max}'
  - ' &8 ▪ &fCusto: &7{cost} {currency}'
  - ''
  - '&aClique para expandir.'
  # Exibido quando o baú já está no tamanho máximo.
  max-lore:
  - '&7Ganhe mais uma linha de'
  - '&7espaço dentro deste baú.'
  - ''
  - ' &8 ▪ &fLinhas: &a{rows}&8/&c{max}'
  - ''
  - ' &8 ▾ &cTamanho máximo atingido.'

change-icon:
  slot: 15
  material: ITEM_FRAME
  display: '&bTrocar Ícone'
  lore:
  - '&7Escolha o item que aparece'
  - '&7no lugar deste baú.'
  - ''
  - '&bClique para acessar.'

back-icon:
  slot: 31
  texture: '7437346d8bda78d525d19f540a95e4e79daeda795cbc5a13256236312cf'
  display: '&eVoltar'
  lore:
  - '&7Clique para voltar.'
