# Hotbar buttons inside the mine (slot = índice 0-8).
#
# Layout: 0 relatório · 2 resetar · 4 picareta · 6 chaves · 8 sair.
# A picareta não fica aqui — o slot dela é o 'pickaxe-icon.slot' do config.yml, e
# é para ele que o jogador é jogado ao entrar na mina.

# Chaves de mineração guardadas. O tamanho da pilha acompanha a contagem e o item
# brilha enquanto houver pelo menos uma chave, então dá para ler o progresso sem
# abrir nada. Clique com o botão direito abre o menu da caixa (/crates), com abrir,
# retirar e o preview das recompensas.
#
# {keys} = a contagem REAL, e é ela que vale. A pilha é só um indicador grosseiro:
# satura em 64 e nunca desce abaixo de 1 (pilha de tamanho 0 não sobrevive no
# servidor). Com zero chaves o item mostra 1 e SEM brilho — quem diz "tem chave" é
# o brilho, não o número da pilha.
#
# A caixa aberta é a do 'key-id' do Abençoado (enchants/blessed.yml). Sem esse
# encantamento configurado o botão não aparece.
keys-icon:
  slot: 6
  material: TRIPWIRE_HOOK
  display: '&eChaves Mineração'
  lore:
  - '&8▪ &b{keys} chaves guardadas'
  - ''
  - '&eClique para gerenciar.'

report-enabled-icon:
  slot: 0
  material: INK_SACK
  data: 10
  display: '&aRelatório Ativado'
  lore:
  - '&7Clique para desativar.'

report-disabled-icon:
  slot: 0
  material: INK_SACK
  data: 8
  display: '&cRelatório Desativado'
  lore:
  - '&7Clique para ativar.'

reset-icon:
  slot: 2
  material: WATCH
  display: '&cResetar Mina'
  lore:
  - '&7Clique para resetar.'

exit-icon:
  slot: 8
  material: INK_SACK
  data: 1
  display: '&cSair da Mina'
  lore:
  - '&7Clique para sair.'