# 0.1% por bloco no nível 1 e 2% no nível 500.
#
# As chaves são roladas em TODO bloco quebrado, inclusive os que os encantamentos
# de área derrubam — então esta chance NÃO se lê sozinha: o ritmo real de chave é
# ela vezes quantos blocos a picareta derruba por minuto. Quando as chances dos
# encantamentos de área mudam, o ritmo de chave muda junto, mesmo sem ninguém
# tocar aqui. Foi o que aconteceu: os valores antigos (0.05% / 1%) foram
# calibrados contra o ritmo de blocos ANTERIOR ao reequilíbrio que deixou
# Explosivo e Raio mais raros nos níveis baixos, e na prática saíram
# ~3x mais lentos do que o pretendido. Estes são o dobro daqueles.
base-chance: 0.1
increase-chance: 0.0038076

# As chaves caem direto nas chaves virtuais do /crates, não no correio, e são
# creditadas em lote a cada tique do relatório.
#
# Este encantamento não tem 'messages', 'title' nem 'subtitle' de propósito: quem
# anuncia as chaves é o relatório de mineração, na linha de encantamentos ativados
# (uma ativação = uma chave). Não recolocar — seria o mesmo aviso duas vezes.

