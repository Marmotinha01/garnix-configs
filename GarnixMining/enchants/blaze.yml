# --- Fireball barrage ----------------------------------------------------------
# Blazes hover over the dig site and lob fireballs at the mine; each fireball that
# lands blasts a CUBE out of the virtual mine.

# Impact blast radius of each fireball (cube side = 2*radius+1).
