# --- Fireball barrage ----------------------------------------------------------
# Blazes hover over the dig site and lob fireballs at the mine; each fireball that
# lands blasts a CUBE out of the virtual mine.

# Impact blast radius of each fireball (cube side = 2*radius+1).
fireball-explosion-radius: 1

# How long the blazes keep launching fireballs, in ticks (20 ticks = 1 second).
fireball-duration-ticks: 72

# Ticks between each fireball launch (20 ticks = 1 second; lower = faster barrage).
fireball-interval-ticks: 6

