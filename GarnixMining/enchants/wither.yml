# --- Skull bombardment ---------------------------------------------------------
# The Wither spins and lobs its own skulls at the mine; each skull that lands
# blasts a SPHERE out of the virtual mine. The skulls are the whole effect —
# there is no final crater.

# Sphere radius each skull breaks on impact (in blocks).
skull-explosion-radius: 3

# How long the Wither keeps launching skulls, in ticks (20 ticks = 1 second).
skull-duration-ticks: 60

# Ticks between each skull launch (20 ticks = 1 second; lower = faster barrage).
skull-interval-ticks: 4

