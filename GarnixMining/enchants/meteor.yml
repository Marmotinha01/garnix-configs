# --- Meteor storm --------------------------------------------------------------
# Fireballs rain down over the WHOLE mine, spawning above the region top at random
# columns and falling straight down until each hits a still-standing block, where
# it blasts a SPHERE out of the virtual mine. A meteor falling down an already-
# mined column just passes through and despawns — it never wastes a blast on air.

# Sphere radius each meteor breaks on impact (in blocks). Raised from 2 to 3: the
# 40 meteors land on RANDOM columns of the whole mine, so they barely overlap and
# the crater size drives the payout almost one-for-one. At radius 2 a storm broke
# ~890 blocks, which made this the worst deal in the plugin — 50% pricier than the
# Wither for 26% fewer blocks. Radius 3 takes it to ~2.870.
meteor-explosion-radius: 3

# How long meteors keep raining, in ticks (20 ticks = 1 second).
meteor-duration-ticks: 100

# Ticks between each spawn wave (lower = denser storm).
meteor-interval-ticks: 5

# How many meteors are dropped on each wave.
meteors-per-wave: 2

# How fast a meteor descends, in blocks per tick.
meteor-fall-speed: 1.4

# How far above the top of the mine a meteor spawns, in blocks.
meteor-spawn-height: 10

