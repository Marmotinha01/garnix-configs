# GarnixMining — Config

# Minutes between mining-ranking rebuilds (top 10 blocks/level).
ranking-refresh-minutes: 5

# Mine XP display (XP is not a currency).
xp-display:
  symbol: ''
  color: '&b'
  display: XP

# Label for the "both" booster: one booster that boosts every mine reward
# (coins, gemas) AND mine XP at once. Same shape as xp-display (it is not a
# currency). Shown wherever a booster's currency name is rendered.
both-display:
  symbol: ""
  color: ""
  display: "&bXP &7+ &aCoins &7+ &dGemas"

# -----------------------------------------------------------------------------
# GANHO POR NÍVEL DENTRO DA MESMA COMPOSIÇÃO
# -----------------------------------------------------------------------------
# Só os níveis que trocam a composição declaram blocos no levels.yml. Cada nível
# acima do último que declarou multiplica as moedas daquele bloco por esta %, uma
# vez por nível, e a contagem zera na próxima troca — quando o valor base do
# levels.yml volta a valer. Assim todo nível upado rende mais sem precisar
# declarar bloco nível a nível (o que faria o jogo anunciar troca de composição
# em todo nível).
#
# 'default' vale para toda moeda; uma chave com o id da moeda sobrescreve. Uma
# moeda que sobe devagar entre tiers (gemas) precisa de uma % menor que coins.
#
# TETO: o acumulado no último nível antes da troca nunca pode passar o valor base
# do próximo bloco, senão trocar de composição viraria rebaixamento. O plugin
# calcula esse teto a partir do próprio levels.yml, trava a % que passar dele e
# avisa no console qual valor passou a valer.
#
# O XP do bloco não é afetado: é ele que mede o avanço de nível.
level-reward-growth:
  default: 2.0
  gemas: 0.3

# Currency used to buy/refund enchant levels. Must be a GarnixCurrencies id.
enchant-currency: gemas

# Moeda que o bônus somado reporta — o {bonus} da actionbar e o %mining_bonus% da
# scoreboard. Os dois leem daqui para nunca mostrarem números diferentes.
#
# O bônus soma booster + skin + armadura + cargo, que é o que "bônus" significa nas
# lores das skins e das armaduras — então o número da tela fecha com o que está
# escrito nelas. O multiplicador dos encantamentos (Afortunado/Gemado) e o Frenesi
# NÃO entram: eles são multiplicativos, não somam percentual.
#
# Na prática a moeda escolhida tanto faz, porque skins e armaduras usam o mesmo
# percentual para todas as moedas. A chave existe para o dia em que deixarem de usar.
bonus-display-provider: coins

# Refund percentage applied when disenchanting (40 = 40% of the paid cost).
enchant-refund-percentage: 40.0

# -----------------------------------------------------------------------------
# ORÇAMENTO DAS ANIMAÇÕES DE ENCANTAMENTO (blaze / snake / wither / kraken /
# meteor), somando TODOS os jogadores do servidor.
#
# A unidade é "packets por tick": quanto trabalho a main thread precisa montar a
# cada 50 ms para animar os efeitos. Quando o orçamento acaba, os próximos procs
# são recusados até algum efeito em andamento terminar.
#
# -- POR QUE ESTÁ EM 0 --------------------------------------------------------
# 0 = ilimitado, e é o padrão de propósito.
#
# Os limites por jogador já seguram a carga no dia a dia: cada um pode ter no
# máximo 1 kraken, 1 blaze, 1 wither, 1 meteoro e 3 cobras ao mesmo tempo. Só um
# servidor com MUITOS jogadores de nível alto minerando junto chega perto do teto
# da main thread. Ligar o orçamento antes disso só faz encantamento deixar de
# disparar sem necessidade, e o jogador sente como se o item tivesse quebrado.
# Então ele fica desligado até o servidor mostrar que precisa.
#
# -- QUANTO CADA EFEITO CUSTA -------------------------------------------------
#   kraken 185   wither 21   blaze 18   meteor 9   snake 4
#
# O orçamento conta TRABALHO e não quantidade, porque os efeitos não são nem de
# longe equivalentes: "50 efeitos" são 200 packets/tick se forem cobras e 9250 se
# forem krakens. Um kraken sozinho custa o mesmo que 46 cobras.
#
# O custo do kraken sai de 'tentacles' x 'tentacle-length' do kraken.yml, então
# diminuir esses valores barateia cada kraken aqui também, automaticamente.
#
# -- QUANDO AUMENTAR ----------------------------------------------------------
# Se você ligou o orçamento e os jogadores estão reclamando que os encantamentos
# "não pegam", mas o TPS está estável em 20. Nesse caso sobra folga na main
# thread e o orçamento está apertado demais. Suba aos poucos (por exemplo de
# 10000 para 15000) e observe o TPS depois de cada mudança.
#
# -- QUANDO DIMINUIR ----------------------------------------------------------
# Se o TPS cai nos horários de pico e o /timings aponta as tasks de animação.
# Cada corte no orçamento reduz proporcionalmente o trabalho por tick.
#
# -- NÚMEROS DE REFERÊNCIA (simulados: 500 jogadores, tudo nível 100) ---------
#   ilimitado -> 77000 packets/tick   (a main thread não dá conta: 3-5 TPS)
#      20000  -> 20000 packets/tick   (67% dos procs recusados)
#      10000  -> 10000 packets/tick   (79% recusados) <- pesado mas sustentável
#       5000  ->  5000 packets/tick   (89% recusados)
#
# -- O DETALHE IMPORTANTE -----------------------------------------------------
# O orçamento NÃO deixa os efeitos mais baratos, ele só decide quem ganha um.
# Com 500 jogadores maxados a demanda é 77000 e o teto seguro é ~10000, então a
# maioria dos procs vai ser recusada — isso é matemática, não configuração.
#
# Para ter MAIS procs acontecendo, o caminho não é aumentar o orçamento (aí o
# servidor trava de novo) e sim baratear cada efeito: baixar 'tentacle-length' do
# kraken.yml de 20 para 12 leva o kraken de 185 para 137, e cabe um quarto a mais
# de krakens no mesmo orçamento. É trocar aparência por quantidade.
# -----------------------------------------------------------------------------
enchant-animation-budget: 10000

# Auto-generated bonus lines for pickaxe skins (skins.yml) and armor pieces
# (armors/*.yml): put {bonus} on a lore line and it expands to one line per entry
# of that item's 'bonuses' table, so a percentage is written once (in 'bonuses')
# instead of by hand. Per line: {value} = the number, {unit} = "%" for a percent
# bonus (empty otherwise); {color} and {display} (plus every currency placeholder
# above) come from GarnixCurrencies — xp uses xp-display. A skins.yml or armor
# file may override this layout with its own 'bonus-format'.
bonus-lore-format: "&8 ▪ &a+&l{value}&a{unit} {primary_color}{Display} "

