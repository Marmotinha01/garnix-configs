# Min/max mine tax (percentage). The owner cannot set a rate outside this range.
tax:
  min: 0.0
  max: 40.0

# Percentage of block XP visitors contribute to the owner's mine (0-100).
visitor-xp-percentage: 35

# Percentage of block XP a visitor also earns toward their OWN mine while mining
# in someone else's mine (0-100). Independent of visitor-xp-percentage.
visitor-self-xp-percentage: 10

# Visitor slots — the per-mine capacity of simultaneous VISITORS (non-owner
# miners). Every player starts with 0 unlocked slots (only the owner may mine);
# each activated "slot item" unlocks +1, up to 'max'. A slot is the capacity a
# visitor occupies only while actually inside — a friend assigned to a slot does
# not reserve capacity when absent, so public miners can fill any free room. The
# same unlocked-slot count also caps how many friends the owner may assign in the
# manage menu. 'max' must not exceed the number of friend-slot positions defined
# in menus/manage.yml (friend-slots.slots).
visitor-slots-max: 5

# Activatable visitor-slot item, handed out by /mina givevaga. Right-click to
# activate: unlocks +1 visitor slot (up to visitor-slots.max) and is consumed.
# 'texture' builds a player-head icon; swap for 'material'/'data' for a normal
# item. 'flags' is optional (Bukkit ItemFlags).
slot-item:
  texture: "4089d0e0c88e5250038e659f508ebda5b65a5be0bfc4103d0e12faba4018d5cb"
  display: '&aVaga de Visitante'
  lore:
  - '&7Desbloqueia mais uma vaga'
  - '&7de visitante na sua mina.'
  - ''
  - '&aOpções de uso:'
  - '&fBotão direito &8➟ &7Ativar'

booster:
  # Minimum remaining time (seconds) required to recover an active booster.
  # On recovery the player gets back an item worth 50% of the remaining time
  # (the other half is lost). This floor blocks the abuse of recovering
  # almost-expired boosters just to re-activate another without waiting.
  min-remove-seconds: 30

# Booster item template. Currency placeholders + {bonus} {duration} {remaining}.
booster-icon:
  material: POTION
  data: 8201
  flags: ["HIDE_POTION_EFFECTS"]
  display: '&6Booster de Mineração'
  lore:
  - '&7Use este booster para ter'
  - '&7seus ganhos aumentados.'
  - ''
  - ' &8Informações: '
  - ' &8▪ &fTipo: {symbol_color}{primary_color}{Display} '
  - ' &8▪ &fBônus: &a{bonus} '
  - ' &8▪ &fDuração: &7{duration} '
  activation-lore:
  - ''
  - '&6Opções de uso:'
  - '&fBotão direito &8➟ &7Ativar'
  - '&fBotão dir. + SHIFT &8➟ &7Juntar'

# Action bar shown while mining. Placeholders: {providers} {separator} {bonus}
# {mine_level} {max_level} {mine_exp} {mine_need_exp}.
# "provider-display" is per-currency: currency placeholders + {value}.
#
# {bonus} = bônus somado em percentual (booster + skin + armadura + cargo), da moeda
# em 'bonus-display-provider' acima. Vem sem o '%', então escreva o símbolo na linha.
actionbar:
  separator: ' &8▏ '
  tax-display: '&fTaxa &c&l{tax}&c%'
  provider-display: '{primary_color}+{symbol_color}{symbol}{primary_color}{value}'
  message: '{providers}{separator}&fBônus: &a&l{bonus}&a%{separator}&fNível: &a{mine_level}&8/&c{max_level}{separator}&fXP: &a{mine_exp}&8/&c{mine_need_exp}'

# Per-currency entry for the {rewards} placeholder of enchant messages/titles.
# Currency placeholders + {value}.
enchant-reward-entry: '{symbol_color}{symbol}{primary_color}{value}'

# Pickaxe item shown while mining. O slot faz parte do layout do hotbar.yml
# (0 relatório · 2 resetar · 4 picareta · 6 chaves · 8 sair) e é o slot em que o
# jogador é posicionado ao entrar na mina.
pickaxe-icon:
  slot: 4
  display: '&6Picareta &7[{blocks}]'
  lore:
  - ''
  - ' &6▎ &fEncantamentos: '
  - '{enchants}'
  - ''
  - ' &6▎ &fSkin: {skin-display} &a+&l{skin-bonus}&a% '
  - '' 
  - '&6Opções de uso:'
  - '&fBotão dir. + SHIFT &8➟ &7Gerenciar'
  enchant-entry: ' &8◗ &7{enchant} {level} '
  no-enchants: ' &8◗ &7Quebra Rápida ∞ '

# Per-mine reset cooldown, in seconds.
reset-cooldown: 30

# Repeating-task intervals in seconds.
#
# 'mining-report-seconds' é a janela do relatório contada POR JOGADOR, a partir do
# primeiro bloco que ele quebra — não é um tique global do servidor. Quem entra na
# mina agora minera o intervalo inteiro antes do primeiro resumo, em vez de receber
# um relatório de cinco segundos porque o tique caiu logo depois.
#
# As chaves do Abençoado são creditadas no /crates junto do tique do relatório, que
# roda de 5 em 5 segundos — não existe mais uma chave para isso, nem uma task só
# para isso. O crédito é pagamento e roda para todo jogador online, mesmo para quem
# desligou o relatório; quem ANUNCIA as chaves é o relatório.
tasks:
  pickaxe-display-seconds: 5
  booster-expiry-seconds: 60
  mining-report-seconds: 60

# Skin-forge item (consumed on use). Texture is the player-head base hash.
forge-icon:
  texture: 818f83eb64f438e3f6ae3a5c2dea8ed10303bad85ac34a798659a275aa096506
  display: '&6Forja de Skins'
  lore:
  - '&7Combine skins para'
  - '&7forjar uma melhor.'
  - ''
  - '&8 ▪ &fTipo: &6Picareta '
  - ''
  - ' &8Requisitos:'
  - '&8 ▪ &c7 skins iguais '
  - ''
  - '&6Opções de uso:'
  - '&fBotão dir. + SHIFT &8➟ &7Abrir'

# Drill ("britadeira", the pt-BR display name). A single, unique consumable item:
# right-click a standing mine block to plant it. A trapdoor/iron/hopper body then
# bores straight down that column, carving a (2*dig-radius+1) square out of the mine
# at each level until it breaks the mine floor, then vanishes and shows the earnings
# title (like a bomb). The body is drawn as real fake blocks, visible to every viewer
# of the mine. 'data'/'flags' are optional, like the item templates above.
drill:
  material: HOPPER
  display: "&cBritadeira"
  glow: true
  lore:
  - '&7Perfura a coluna inteira'
  - '&7até o fundo da mina.'
  - ''
  - '&8 ▪ &fÁrea: &c3x3 '
  - ''
  - '&cOpções de uso:'
  - '&fBotão direito &8➟ &7Usar'
  # Half-width of the square carved at each level: 1 = 3x3, 2 = 5x5, 0 = column only.
  dig-radius: 1
  # Ticks between each downward step (lower = faster). 2 = 10 levels per second.
  descend-period-ticks: 10
  # Ticks the assembled body pauses at the clicked block before descending, so it is
  # clearly seen starting there. 20 ticks = 1 second. 0 = no pause (descend at once).
  start-hold-ticks: 10
  # Most drills a single player may have boring at once.
  max-simultaneous-per-player: 10
  # The three fake blocks of the drill body, top to bottom.
  top-block: IRON_TRAPDOOR
  middle-block: IRON_BLOCK
  bottom-block: HOPPER
  
# -- Progress bar --
progress-bar:
  # Number of characters in the bar.
  length: 10
  # Character repeated for each segment.
  symbol: '▪'
  # Color of completed segments.
  completed-color: '&a'
  # Color of incomplete segments.
  incomplete-color: '&7'

# -- Frenzy (infinite mission) --
# Mining manual blocks fills a meter; once full, a timed window opens during which
# ALL of that player's mining gains are multiplied. The active window lives only in
# memory: it survives a quit/reconnect but is lost on a full server restart.
frenzy:
  # Master switch for the whole mechanic.
  enabled: true
  # How the meter fills:
  #   volume — count manual blocks up to 'blocks-required' (simple, predictable).
  #   streak — the meter DECAYS when you stop mining, forcing sustained digging.
  mode: streak
  # (volume) Manually mined blocks needed to trigger the frenzy. Enchants, drill and
  # bombs do NOT count — only blocks broken by hand.
  blocks-required: 3500
  # (streak) Only used when mode: streak.
  streak:
    blocks-required: 3500
    # Meter units lost per second once you stop mining.
    decay-per-second: 20
    # Seconds of not mining before the decay starts.
    decay-grace-seconds: 2
  # Duration of the doubled-gains window. Accepts DurationFormatter syntax: "3m", "90s", "1m30s".
  duration: "2m"
  # Multiplier applied to ALL mining gains while active (base block, enchants, drill, bombs).
  multiplier: 2.0
  # Also multiply the mine XP gained while active?
  multiply-xp: true
  # true  = multiply the gross reward BEFORE tax, so a mine owner receives doubled tax
  #         from a visitor in frenzy.
  # false = only the player's own net take is doubled; the owner's tax is unchanged.
  multiply-before-tax: false
  # Accumulation bar shown by %mining_frenzy% while filling the meter.
  bar:
    length: 10
    symbol: '▪'
    completed-color: '&a'
    incomplete-color: '&7'
  # Tokens: {bar} {progress} {required} {percentage}.
  # {percentage} vem SEM o '%' — o símbolo é escrito aqui na linha.
  inactive-entry: '{bar} &7{percentage}%'
  # %mining_frenzy% text while the window is ACTIVE. {time} = remaining time.
  active-entry: '&7{time} restantes'
  # Feedback fired when the frenzy activates. {duration} = the configured duration.
  activation:
    title: '&4&lFRENESI!'
    subtitle: '&fGanhos dobrados por &c{duration}&f!'
    sound: LEVEL_UP