# ─────────────────────────────────────────────────────────────────────
# Pickaxe skins
# ─────────────────────────────────────────────────────────────────────
# Each skin can declare:
#   display   — colored display name
#   material  — visual pickaxe material inside the mine
#   icon      — menu icon (supports texture: and material:)
#   bonuses   — per-provider bonuses (value + percent flag)
#
# Put {bonus} on an icon lore line and it expands to one line per entry of that
# skin's 'bonuses' table (colour and name come from the currency), so a
# percentage is written once — in 'bonuses' — instead of by hand. The line
# layout is 'bonus-format' below (overrides config.yml's bonus-lore-format).
#
# The "default" skin is given to new players.
# Skins are unlocked via items (created with /mina giveskin).
# Players can remove unlocked skins back to item form to trade them.
# ─────────────────────────────────────────────────────────────────────

unlock-lore:
- ''
- '&aClique para desbloquear.'

# {bonus} line layout for skins (see config.yml → bonus-lore-format for tokens).
bonus-format: "  &8► {color}+{value}{unit} {display}"

skins:
  default:
    display: '&eSkin de Madeira'
    material: WOOD_PICKAXE
    icon:
      material: WOOD_PICKAXE
      display: '&eSkin de Madeira'
      lore:
      - '&cSem bônus.'
      flags:
      - HIDE_ATTRIBUTES
  
  pedra:
    display: '&7Skin de Pedra'
    material: STONE_PICKAXE
    icon:
      material: STONE_PICKAXE
      display: '&7Skin de Pedra'
      lore:
      - ''
      - ' &fBônus:'
      - '{bonus}'
      - ''
      flags:
      - HIDE_ATTRIBUTES
    bonuses:
      coins:
