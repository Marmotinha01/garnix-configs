# ---------------------------------------------------------------------
# Pickaxe skins
# ---------------------------------------------------------------------
# Each skin can declare:
#   display   — colored display name
#   material  — visual pickaxe material inside the mine
#   icon      — menu icon (supports texture: and material:)
#   forgeable — true = 7 desta skin forjam a PRÓXIMA declarada abaixo
#   bonuses   — per-provider bonuses (value + percent flag)
#
# Put {bonus} on an icon lore line and it expands to one line per entry of that
# skin's 'bonuses' table (colour and name come from the currency), so a
# percentage is written once — in 'bonuses' — instead of by hand. The line
# layout is 'bonus-format' below (overrides config.yml's bonus-lore-format).
#
# -- MESMO PERCENTUAL PARA TODA MOEDA ---------------------------------
# Toda skin dá o MESMO percentual em coins, gemas e XP. É o que permite a
# actionbar e a scoreboard mostrarem um número só de bônus ({bonus} e
# %mining_bonus%) que fecha com o que está escrito aqui. Se um dia as moedas
# forem diferenciadas, esse número passa a ser só o da moeda escolhida em
# config.yml → bonus-display-provider, e a conta deixa de fechar para as outras.
# A ladder é 2 · 5 · 9 · 14 · 20 · 28 · 38 · 50 · 65, igual à de Farm e Pesca.
#
# The "default" skin is given to new players.
# Skins are unlocked via items (created with /mina giveskin).
# Players can remove unlocked skins back to item form to trade them.
#
# -- LADDER DA TEMPORADA ----------------------------------------------
# Ordem de raridade (a ordem DESTE arquivo é a ordem da forja):
#   Madeira · Pedra · Ferro · Ouro · Diamante · Rubi · Quartzo · Jade ·
#   Safira · Mithril
#
# A forja (7 skins iguais) sobe de Pedra até Quartzo. Quartzo, Jade,
# Safira e Mithril têm forgeable: false — Jade, Safira e Mithril só saem
# de caixa (marcadas com glow no menu) e Quartzo é o topo da forja.
# ---------------------------------------------------------------------

unlock-lore:
- ''
- '&aClique para desbloquear.'

# {bonus} line layout for skins (see config.yml → bonus-lore-format for tokens).
bonus-format: "&8 ▪ &a+&l{value}&a{unit} {primary_color}{Display} "

skins:
  default:
    display: '&eMadeira'
    material: WOOD_PICKAXE
    forgeable: false
    icon:
      material: WOOD_PICKAXE
      display: '&eSkin de Madeira'
      lore:
      - ''
      - '&8 ▾ &cSem bônus. '
      flags:
      - HIDE_ATTRIBUTES

  pedra:
    display: '&7Pedra'
    material: STONE_PICKAXE
    forgeable: true
    icon:
      material: STONE_PICKAXE
      display: '&7Skin de Pedra'
      lore:
      - ''
      - ' &8Especificações: '
      - '{bonus}'
      - ''
      flags:
      - HIDE_ATTRIBUTES
    bonuses:
      coins:
        value: 2.0
        percent: true
      gemas:
