    - ''
    - ' &8 ▪ &fÁrea: &46x6 '
    - ''
    - '&4Opções de uso:'
    - '&fBotão direito &8➟ &7Usar'
  8x8:
    radius: 8
    material: "FIREBALL"
    display: "&4Explosivo"
