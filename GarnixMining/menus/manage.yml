# Visitor slots / friends. One icon per slot; 'slots' lists the inventory
# positions, one per slot (must have at least visitor-slots-max entries).
# A slot renders as:
#   • locked-icon  — not yet unlocked (activate a Vaga de Visitante item)
#   • free-icon    — unlocked and empty (click to assign a friend)
#   • filled       — a friend head (left-click: set tax, right-click: remove)
friend-slots:
  slots: [29, 30, 31, 32, 33]
  locked-icon:
    material: STAINED_GLASS_PANE
    data: 14
    display: '&cSlot Bloqueado'
    lore:
    - '&7Esta vaga de visitante'
    - '&7ainda não foi liberada.'
    - ''
    - '&7Ative uma &fVaga de Visitante'
    - '&7para liberar este slot.'
  free-icon:
    material: STAINED_GLASS_PANE
    data: 5
    display: '&aSlot Livre'
    lore:
    - '&7Vaga livre para receber'
    - '&7um amigo na sua mina.'
    - ''
    - '&aClique para adicionar.'
  filled:
    display: '&e{player}'
    lore:
    - '&7Amigo com acesso liberado'
    - '&7à sua área de mineração.'
    - ''
    - '&8 ▪ &fStatus: {status} '
    - '&8 ▪ &fTaxa: &c{tax}% '
    - ''
    - '&eOpções de uso:'
    - '&fBotão esquerdo &8➟ &7Definir taxa'
    - '&fBotão direito &8➟ &cRemover amigo'

