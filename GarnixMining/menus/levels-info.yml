# Menu — Mine Levels (Info)

title: Níveis da Mina

shape:
- XXXXXXXXX
- <X.....X>
- XXXXXXXXX

empty-icon:
  slot: 13
  material: BOWL
  amount: 0
  display: '&cVazio'
  lore:
  - '&7Nenhum nível encontrado.'

level-icon:
  material: STAINED_GLASS_PANE
  data: 5
  display: '&fNível &a&l{level}'
  lore:
  - '&7O que a sua mina gera ao'
  - '&7alcançar este nível.'
  - ''
  - '&8 ▪ &fXP: &c{xp} '
  - ''
  - ' &8Composição da mina: '
  - '{block_list}'
  - ''

block-entry: '&8 ▪ &f{block_name} &e{chance} '
reward-separator: ''
# O espaço que separa as recompensas mora no início da entry: manter só um lado
# evita o espaço dobrado quando o reward-separator é vazio.
reward-entry: ' {symbol_color}{symbol}{primary_color}{amount}'
# Formato só do XP (sempre a última recompensa da linha). Fica à parte para o
# reward-entry poder voltar a mostrar o {currency} das moedas sem duplicar aqui.
xp-entry: ' {symbol_color}{symbol}{primary_color}{amount} {currency} '