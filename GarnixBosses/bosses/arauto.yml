# Types:
# NONE, CURRENCY, ITEM, COMMAND, COMMAND_ITEM
#
# ⚠️ CLASSE: MEDIO. E aqui que a tabela vira: o azar cai de 25 para 15, a moeda
# encolhe de 25 para 21 e a faixa de RECURSO BOM salta de 18 para 28. O Arauto e
# o primeiro boss que paga item raro de verdade — e o primeiro que dropa LIVRO DE
# KILL-STACK, que e o que faz o proximo abate valer por varios.
#
# FAIXAS deste boss (peso = porcentagem, o arquivo soma 100):
#   azar 15 · moeda 21 · recurso 24 · recurso bom 28 · raro 10 · jackpot 2
#
# ⚠️ BOSS NAO PAGA GEMA, SEMENTE NEM CORAL — nos cinco, por decisao do dono. A
# moeda do boss e COINS e DRACMAS, e so.
#
# ⚠️ A DRACMA E A SECUNDARIA DO BOSS e sai em escada de 3 degraus (1.250 · 2.500 ·
# 5.000) com peso 6. Por abate ela rende ~427, contra os ~144 de antes.
#
# ⚠️ A MATADORA NAO CAI DE BOSS, por decisao do dono. A espada continua exclusiva
# da Caixa Bosses I/II e da crate — e o que mantem motivo para abrir a caixa. O
# livro de kill-stack cai porque ele so tem valor para quem JA mata boss.
#
# ⚠️ O DEGRAU ALTO DOS LIMITES (armazem 150, maquina 8, spawner 5) subiu da faixa
# RECURSO para a RECURSO BOM. Ele nao e recheio: 150 de armazem vale 240 de cash
# e 5 de spawner vale 20.000. Os degraus de baixo (50/100, 3/5, 2/3) continuam
# no recheio, na razao 6:3:1 de sempre.
#
# ⚠️ MOEDA SAI EM ESCADA DE 3 DEGRAUS (x1 · x2 · x4) com peso 50/30/20 dentro
# da familia. O degrau base de coins continua sendo o valor antigo do boss.
#
# ⚠️ `chance` e PESO — RewardManager usa RandomSelector.weighted, que normaliza
# pelo total. MAS o menu imprime o peso cru como porcentagem
# (BossRewardsMenu.java:136), entao somar 100 aqui nao e so legibilidade: e o
# que faz o numero que o jogador ve ser verdade.
#
# ⚠️ reward-rolls: 3 — cada abate sorteia 3 vezes nesta tabela. Com azar 15%, a
# chance de um abate nao render NADA e 0,15³ = 0,3375%.
#
# ⚠️ A lore do bloco `icon:` segue a gramatica das crates (`&fValor: &2$&a{amount}`),
# e o {amount} e resolvido no load pelo BossConfigManager#applyAmountPlaceholder —
# porte do metodo de mesmo nome do CrateManager. Ele le o `amount:` DA RECOMPENSA,
# nao o `amount:` de dentro do `icon:` (esse continua sendo so a pilha do preview).
#
# ⚠️ O COMBUSTIVEL ESCREVE OS LITROS A MAO na lore: o applyAmountPlaceholder usa
# NumberFormatter.formatSuffix e `{amount}` com 4.500 renderiza "4.5K".
#
# ⚠️ `boss give killstack <jogador> <nivel> [quantia]` — o NIVEL vem PRIMEIRO (1)
# e a quantia depois. E a ordem OPOSTA a do `boss give boss`, onde o {amount} e o
# primeiro int (os stacks).
#
# ⚠️ No correio a lore do icone NAO aparece: o MailMenu monta a dele com o total
# ja agregado (`Total: ✆3.7K` quando 3 rolls caem em dracmas). A lore daqui vale
# no menu /boss > recompensas, que mostra o valor por roll.
