# Types:
# NONE, CURRENCY, ITEM, COMMAND, COMMAND_ITEM
#
# ⚠️ CLASSE: MEDIO. E aqui que a tabela vira: o azar cai de 25 para 15, a moeda
# encolhe de 25 para 21 e a faixa de RECURSO BOM salta de 20 para 25. O Arauto e
# o primeiro boss que paga item raro de verdade — o primeiro com LIVRO DE
# KILL-STACK, o primeiro com LIVRO DE ENCANTAMENTO e o primeiro com Reset de KDR.
#
# FAIXAS deste boss (peso = porcentagem, o arquivo soma 100):
#   azar 15 · moeda 21 · recurso 24 · recurso bom 25 · raro 13 · jackpot 2
#
# ⚠️ OS 6 LIVROS DE ENCANTAMENTO ENTRAM AQUI, sempre 1x, sempre nivel 1, e o que
# muda de boss para boss e so a chance: 0,5 no Arauto, 0,7 no Tita, 1,0 no
# Devorador. Sao os 3 da lamina (Ceifador, Massacre, Pilhagem) e os 3 da vara
# (Cobica, Mare, Correnteza) — as duas familias com o mesmo peso, porque boss e
# superficie de todo mundo e nao pode privilegiar uma via.
#
# ⚠️ Colosso e Inferno NAO tem livro nenhum. E o gate: livro de encantamento so a
# partir do boss medio.
#
# ⚠️ BOSS NAO PAGA GEMA, SEMENTE NEM CORAL — nos cinco, por decisao do dono. A
# moeda do boss e COINS e DRACMAS, e so.
#
# ⚠️ A DRACMA E A SECUNDARIA DO BOSS e sai em escada de 3 degraus (1.250 · 2.500 ·
# 5.000) com peso 6. Por abate ela rende ~427, contra os ~144 de antes.
#
# ⚠️ A MATADORA NAO CAI DE BOSS, por decisao do dono. A espada continua exclusiva
# da Caixa Bosses I/II e da crate — e o que mantem motivo para abrir a caixa. O
# livro de kill-stack cai porque ele so tem valor para quem JA mata boss.
#
# ⚠️ SEM LIMPADOR DE TERRENO — por decisao do dono ele so entra a partir do Tita.
# O Reset de KDR ja entra aqui, junto com o Ativador de Bau.
#
# ⚠️ O CASH E MAIS TOPO QUE OS LIMITES, por decisao do dono: ele esta em 0,05,
# abaixo do degrau de limite mais raro do arquivo (spawner 75, em 0,1). Essa
# ordem tem que valer nos tres bosses que dao cash — se um limite ficar mais
# raro que o cash, a hierarquia inverte.
#
# ⚠️ O LIMITE DE SPAWNER SAI EM 20 · 30 · 50 · 75, quantia dada pelo dono, com os
# dois degraus de baixo no recheio e os dois de cima no RECURSO BOM. Com o
# armazem em 50 · 100 · 150 e a maquina em 3 · 5 · 8, as tres colunas DEIXARAM de
# ser comparaveis: 75 de spawner vale 300.000 de cash e 150 de armazem vale 240.
# A razao 6:3:1 de peso foi mantida, mas ela so compensava quando as quantias
# eram iguais. Se o spawner virar problema, o caminho e subir a escada da MAQUINA
# para a mesma faixa, ou cortar o peso do spawner, nao afinar mais o 6:3:1.
#
# ⚠️ O DEGRAU ALTO DOS LIMITES (armazem 150, maquina 8, spawner 50 e 75) vive na
# faixa RECURSO BOM. Ele nao e recheio. Os degraus de baixo continuam no recheio.
#
# ⚠️ COINS RECEBE O TRATAMENTO DA CRATE, nao o da banda de tier. A escada antiga
# era geometrica — 10.800 no Colosso ate 1,44x10^17 no Devorador, ~1.910x por
# boss — porque o `15-LOOT.md` assumia que cada boss e morto dentro da banda dele.
# So que BOSS NAO TEM GATE DE TIER: um T1 pega um Devorador da crate (0,4%), da
# Caixa Bosses I (5,25%) ou de um Tita, mata com a Matadora Inicial, e leva a
# renda inteira de um dia T17. E o mesmo problema que a crate tem, e a decisao e
# a mesma que o dono ja tomou la: coins e empurrao no dia 1 e ruido depois.
#
# A escada nova dobra a cada boss: 1.000 · 2.000 · 4.000 · 8.000 · 15.000 de base,
# com x2 e x4 em cima e peso 50/30/20 dentro da familia. Referencia: a crate paga
# ~117 coins por abertura e a Caixa Recursos ~350. O Colosso paga ~1.026 por
# abate — 8,8x a crate — e o Devorador ~10.260.
#
# ⚠️ O VALOR DO BOSS SAO OS ITENS, nao a moeda: runa, combustivel, limite, chave,
# caixa e livro. Se um dia o coins do boss parecer pequeno demais, o certo e
# mexer nos ITENS, nao em reintroduzir a escada geometrica.
#
# ⚠️ `chance` e PESO — RewardManager usa RandomSelector.weighted, que normaliza
# pelo total. MAS o menu imprime o peso cru como porcentagem
# (BossRewardsMenu.java:136), entao somar 100 aqui nao e so legibilidade: e o
# que faz o numero que o jogador ve ser verdade.
#
# ⚠️ reward-rolls: 3 — cada abate sorteia 3 vezes nesta tabela. Com azar 15%, a
# chance de um abate nao render NADA e 0,15³ = 0,3375%.
#
# ⚠️ A lore do bloco `icon:` segue a gramatica das crates (`&fValor: &2$&a{amount}`),
# e o {amount} e resolvido no load pelo BossConfigManager#applyAmountPlaceholder —
# porte do metodo de mesmo nome do CrateManager. Ele le o `amount:` DA RECOMPENSA,
# nao o `amount:` de dentro do `icon:` (esse continua sendo so a pilha do preview).
#
# ⚠️ O COMBUSTIVEL ESCREVE OS LITROS A MAO na lore: o applyAmountPlaceholder usa
# NumberFormatter.formatSuffix e `{amount}` com 2.000 renderiza "2K".
#
# ⚠️ `boss give killstack <jogador> <nivel> [quantia]` — o NIVEL vem PRIMEIRO (1)
# e a quantia depois. E a ordem OPOSTA a do `boss give boss`, onde o {amount} e o
# primeiro int (os stacks). Ja `lamina givebook` e `pesca givebook` recebem
# <tipo> <nivel> <quantia>, com o {amount} no fim.
#
# ⚠️ No correio a lore do icone NAO aparece: o MailMenu monta a dele com o total
# ja agregado (`Total: ✆3.7K` quando 3 rolls caem em dracmas). A lore daqui vale
# no menu /boss > recompensas, que mostra o valor por roll.
