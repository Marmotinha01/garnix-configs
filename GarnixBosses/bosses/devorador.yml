    - '&4para começar a atacar.'

# Types:
# NONE, CURRENCY, ITEM, COMMAND, COMMAND_ITEM
#
# ⚠️ CLASSE: DIFICIL. O Devorador e o unico da classe e a tabela mostra isso em
# TRES eixos ao mesmo tempo, nao so no topo:
#   · o AZAR desaba de 15 para 8 — a menor taxa de "nao veio nada" da rede;
#   · a MOEDA encolhe para 16 (era 26 no Colosso) — menos filler;
#   · o RARO explode para 28 (era 3 no Colosso) — mais de um em cada quatro rolls.
# E o mesmo eixo das caixas Tier I e Tier II: a diferenca esta no PISO.
#
# FAIXAS deste boss (peso = porcentagem, o arquivo soma 100):
#   azar 8 · moeda 16 · recurso 17 · recurso bom 26 · raro 28 · jackpot 5
#
# ⚠️ OS 6 LIVROS DE ENCANTAMENTO SAEM A 1,0 CADA — o degrau mais facil dos tres
# bosses que os dao (0,5 Arauto · 0,7 Tita · 1,0 aqui). Sempre 1x e sempre nivel
# 1; o que escala e so a chance. Sao os 3 da lamina (Ceifador, Massacre,
# Pilhagem) e os 3 da vara (Cobica, Mare, Correnteza), com o mesmo peso nas duas
# familias — 6% do arquivo em livro, ou ~17% dos abates.
#
# ⚠️ BOSS NAO PAGA GEMA, SEMENTE NEM CORAL — nos cinco, por decisao do dono. A
# moeda do boss e COINS e DRACMAS, e so.
#
# ⚠️ A DRACMA E A SECUNDARIA DO BOSS e sai em escada de 3 degraus (3.000 · 6.000 ·
# 12.000) com peso 4. Por abate ela rende ~684, contra os ~240 de antes e os ~145
# de uma abertura de Caixa Recursos.
#
# ⚠️ ELE FICA ABAIXO DA CAIXA BOA DE PROPOSITO. Ele nao da armadura, skin nem
# matadora, que sao justamente o que a Caixa Tier II vende, e a Caixa Garnix so
# aparece aqui a 0,05%. O que ele tem de melhor e o VOLUME: 3 rolls por abate,
# quantas vezes o jogador quiser matar.
#
# ⚠️ A MATADORA NAO CAI DE BOSS, por decisao do dono. A espada continua exclusiva
# da Caixa Bosses I/II e da crate. O kill-stack cai — e aqui em dois lotes (x1 a
# 4% e x2 a 1,7%), que e a maior fonte de livro fora da Caixa Bosses II.
#
# ⚠️ O CASH E MAIS TOPO QUE OS LIMITES, por decisao do dono: ele esta em 0,1,
# abaixo do degrau de limite mais raro do arquivo (spawner 150, em 0,2). So a
# Caixa Garnix (0,05) fica acima dele.
#
# ⚠️ O LIMITE DE SPAWNER SAI EM 50 · 75 · 100 · 150, quantia dada pelo dono, com
# os dois degraus de baixo no recheio e os dois de cima no RECURSO BOM. Com o
# armazem em 150 · 250 · 400 e a maquina em 8 · 12 · 20, as tres colunas
# DEIXARAM de ser comparaveis: 150 de spawner vale 600.000 de cash e 400 de
# armazem vale 640. A razao 6:3:1 de peso foi mantida, mas ela so compensava
# quando as quantias eram iguais — aqui ela amplifica em vez de compensar. Se o
# spawner virar problema, o caminho e subir a escada da MAQUINA para a mesma
# faixa, ou cortar o peso do spawner de vez, nao afinar mais o 6:3:1.
#
# ⚠️ Sem faixa de boss acima: o Devorador e o ultimo da escada, entao ele se
# auto-alimenta. 3x a 5,5% e 5x a 2,2% dao 0,275 stack de retorno por roll, ou
# 0,825 por abate — abaixo de 1, entao a corrente sempre decai. So passaria a se
# sustentar sozinha se esses dois pesos somassem mais de 33.
#
# ⚠️ O DEVORADOR APARECE DUAS VEZES: sao o MESMO item, um com stack 3 e outro com
# stack 5. O `boss give boss` recebe <stacks> <quantia> e o {amount} vai no
# PRIMEIRO — 3x aqui e UM item com pilha 3, nao tres itens soltos.
#
# ⚠️ COINS RECEBE O TRATAMENTO DA CRATE, nao o da banda de tier. A escada antiga
# era geometrica — 10.800 no Colosso ate 1,44x10^17 no Devorador, ~1.910x por
# boss — porque o `15-LOOT.md` assumia que cada boss e morto dentro da banda dele.
# So que BOSS NAO TEM GATE DE TIER: um T1 pega um Devorador da crate (0,4%), da
# Caixa Bosses I (5,25%) ou de um Tita, mata com a Matadora Inicial, e leva a
# renda inteira de um dia T17. E o mesmo problema que a crate tem, e a decisao e
# a mesma que o dono ja tomou la: coins e empurrao no dia 1 e ruido depois.
#
# A escada nova dobra a cada boss: 1.000 · 2.000 · 4.000 · 8.000 · 15.000 de base,
# com x2 e x4 em cima e peso 50/30/20 dentro da familia. Referencia: a crate paga
# ~117 coins por abertura e a Caixa Recursos ~350. O Colosso paga ~1.026 por
# abate — 8,8x a crate — e o Devorador ~10.260.
#
# ⚠️ O VALOR DO BOSS SAO OS ITENS, nao a moeda: runa, combustivel, limite, chave,
# caixa e livro. Se um dia o coins do boss parecer pequeno demais, o certo e
# mexer nos ITENS, nao em reintroduzir a escada geometrica.
#
# ⚠️ `chance` e PESO — RewardManager usa RandomSelector.weighted, que normaliza
# pelo total. MAS o menu imprime o peso cru como porcentagem
# (BossRewardsMenu.java:136), entao somar 100 aqui nao e so legibilidade: e o
# que faz o numero que o jogador ve ser verdade.
#
# ⚠️ reward-rolls: 3 — cada abate sorteia 3 vezes nesta tabela. Com azar 8%, a
# chance de um abate nao render NADA e 0,08³ = 0,0512% — 1 em cada 1.953.
#
# ⚠️ A lore do bloco `icon:` segue a gramatica das crates (`&fValor: &2$&a{amount}`),
# e o {amount} e resolvido no load pelo BossConfigManager#applyAmountPlaceholder —
# porte do metodo de mesmo nome do CrateManager. Ele le o `amount:` DA RECOMPENSA,
# nao o `amount:` de dentro do `icon:` (esse continua sendo so a pilha do preview).
#
# ⚠️ O COMBUSTIVEL ESCREVE OS LITROS A MAO na lore: o applyAmountPlaceholder usa
# NumberFormatter.formatSuffix e `{amount}` com 4.000 renderiza "4K".
#
# ⚠️ `boss give killstack <jogador> <nivel> [quantia]` — o NIVEL vem PRIMEIRO (1)
# e a quantia depois. Ja `lamina givebook` e `pesca givebook` recebem <tipo>
# <nivel> <quantia>, com o {amount} no fim.
#
# ⚠️ A CAIXA GARNIX E O UNICO PREMIO DO SERVIDOR QUE SO SAI AQUI. Ela esta a 0,05%
# por roll, ou 0,15% por abate. Ela e a caixa mais rara da rede e o conteudo dela
# (5 maquinas de limite, papel de VIP, Matadora Hit-Kill) e desproporcional de
# proposito — mexer nesse peso e mexer no item mais valioso da economia.
#
# ⚠️ No correio a lore do icone NAO aparece: o MailMenu monta a dele com o total
# ja agregado (`Total: ✆9K` quando 3 rolls caem em dracmas). A lore daqui vale no
# menu /boss > recompensas, que mostra o valor por roll.
