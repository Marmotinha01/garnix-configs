# Types:
# NONE, CURRENCY, ITEM, COMMAND, COMMAND_ITEM
#
# FAIXAS deste boss:
#   comum 86% (azar 25 incluso) · comum plus 12% · semi raro 1,2% ·
#   raro 0,6% · raro plus 0,19% · jackpot 0,01%
#
# ⚠️ `chance` e PESO — RewardManager usa RandomSelector.weighted, que normaliza
# pelo total. MAS o menu imprime o peso cru como porcentagem
# (BossRewardsMenu.java:136), entao somar 100 aqui nao e so legibilidade: e o
# que faz o numero que o jogador ve ser verdade.
#
# ⚠️ reward-rolls: 3 — cada abate sorteia 3 vezes nesta tabela.
#
# ⚠️ A lore do bloco `icon:` segue a gramatica das crates (`&fValor: &2$&a{amount}`),
# e o {amount} e resolvido no load pelo BossConfigManager#applyAmountPlaceholder —
# porte do metodo de mesmo nome do CrateManager. Ele le o `amount:` DA RECOMPENSA,
# nao o `amount:` de dentro do `icon:` (esse continua sendo so a pilha do preview).
#
# ⚠️ No correio a lore do icone NAO aparece: o MailMenu monta a dele com o total
# ja agregado (`Total: ✆600` quando 3 rolls caem em dracmas). A lore daqui vale no
# menu /boss > recompensas, que mostra o valor por roll.
#
# ⚠️ `boss give boss` recebe <stacks> <quantia>: o {amount} vai no PRIMEIRO. Dois
# rolls no mesmo boss viram um item x2, nao dois itens soltos.
