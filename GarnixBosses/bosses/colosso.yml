# Types:
# NONE, CURRENCY, ITEM, COMMAND, COMMAND_ITEM
#
# ⚠️ CLASSE: FACIL. O Colosso e o boss de entrada e o mais comum da rede (56%
# da crate Bosses). A tabela dele e recurso de desenvolvimento quase inteira —
# combustivel, limite e runa. Nao ha skin, armadura, matadora, livro de
# encantamento nem kill-stack aqui: quem mata Colosso esta comprando material.
#
# FAIXAS deste boss (peso = porcentagem, o arquivo soma 100):
#   azar 25 · moeda 26 · recurso 26 · recurso bom 19 · raro 3 · jackpot 1
#
# ⚠️ BOSS NAO PAGA GEMA, SEMENTE NEM CORAL — nos cinco, por decisao do dono. As
# tres secundarias de via saem de crate, de caixa e da propria profissao; a moeda
# do boss e COINS e DRACMAS, e so. O peso que sobrou nao virou mais moeda: ele foi
# para RECURSO e RECURSO BOM, que e onde o dono quer o valor do boss.
#
# ⚠️ A DRACMA E A SECUNDARIA DO BOSS e por isso ela ganhou escada de 3 degraus
# (500 · 1.000 · 2.000) e peso 8, contra os 100 fixos com peso 15 de antes. Por
# abate ela sai de ~45 para ~228. A Caixa Recursos entrega ~145 por abertura,
# entao o boss facil passa a caixa mediana, que e a ordem pedida.
#
# ⚠️ SEM LIMPADOR DE TERRENO E SEM RESET DE KDR — por decisao do dono, os dois
# utilitarios comecam mais para cima na escada: o Limpador so a partir do Tita e
# o Reset de KDR so a partir do Arauto. Aqui o utilitario e o Ativador de Bau.
#
# ⚠️ O LIMITE DE SPAWNER SAI EM 10 · 20 · 30, quantia dada pelo dono. Com o
# armazem em 15 · 30 e a maquina em 1 · 2, as tres colunas DEIXARAM de ser
# comparaveis: 30 de spawner vale 120.000 de cash e 30 de armazem vale 48. A
# razao 6:3:1 de peso (armazem : maquina : spawner) foi mantida, mas ela nao
# fecha essa conta — ela so compensava quando as quantias eram iguais. Se o
# spawner virar problema, o caminho e subir a escada da MAQUINA para a mesma
# faixa, ou cortar o peso do spawner de vez, nao afinar mais o 6:3:1.
#
# ⚠️ O LIMITE DE ARMAZEM CAIU DE 500 PARA 15 · 30. Os 500 antigos valiam 800 de
# cash no shop e saiam em 4% dos rolls do boss mais comum do servidor — era o
# maior vazamento da tabela. A escada nova acompanha a Caixa Recursos e sobe
# boss a boss ate 150 · 250 · 400 no Devorador.
#
# ⚠️ MOEDA SAI EM ESCADA DE 3 DEGRAUS (x1 · x2 · x4) com peso 50/30/20 dentro
# da familia, o padrao das caixas. O degrau base de coins continua sendo o valor
# antigo do boss — a escada acrescenta topo, nao rebaixa o piso.
#
# ⚠️ O QUE SEPARA AS CLASSES E O PISO, NAO O TETO: o Colosso e o unico boss sem
# livro nenhum, sem caixa de tier acima no raro e com azar em 25%.
#
# ⚠️ `chance` e PESO — RewardManager usa RandomSelector.weighted, que normaliza
# pelo total. MAS o menu imprime o peso cru como porcentagem
# (BossRewardsMenu.java:136), entao somar 100 aqui nao e so legibilidade: e o
# que faz o numero que o jogador ve ser verdade.
#
# ⚠️ reward-rolls: 3 — cada abate sorteia 3 vezes nesta tabela. Com azar 25%, a
# chance de um abate nao render NADA e 0,25³ = 1,5625%.
#
# ⚠️ A lore do bloco `icon:` segue a gramatica das crates (`&fValor: &2$&a{amount}`),
# e o {amount} e resolvido no load pelo BossConfigManager#applyAmountPlaceholder —
# porte do metodo de mesmo nome do CrateManager. Ele le o `amount:` DA RECOMPENSA,
# nao o `amount:` de dentro do `icon:` (esse continua sendo so a pilha do preview).
#
# ⚠️ O COMBUSTIVEL ESCREVE OS LITROS A MAO na lore. O applyAmountPlaceholder usa
# NumberFormatter.formatSuffix, entao `{amount}` com 1.000 renderiza "1K" e a
# linha sairia "1KL". O token `{amount_decimal}` das caixas NAO existe no
# garnix-bosses (BoxManager.java:64 e exclusivo do mystery-boxes).
#
# ⚠️ `type: COMMAND` = o {amount} e VALOR carregado por um item so (limite,
# combustivel, runa, chave virtual). `type: COMMAND_ITEM` = o {amount} e
# CONTAGEM de pilha e vai no ultimo argumento. Trocar os dois faz 20 entradas
# virarem 20 itens, ou estoura o byte de Count da 1.8.
#
# ⚠️ No correio a lore do icone NAO aparece: o MailMenu monta a dele com o total
# ja agregado (`Total: ✆1K` quando 3 rolls caem em dracmas). A lore daqui vale no
# menu /boss > recompensas, que mostra o valor por roll.
