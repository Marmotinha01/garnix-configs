debug: false

ranking-refresh-minutes: 5
ranking-size: 10

# Teto global de bosses ENTIDADE vivos ao mesmo tempo no servidor (C8).
# 0 = ilimitado. O teto vale so para invocar um boss NOVO: empilhar num que
# ja existe continua liberado, porque empilhar nao cria entidade.
#
# Cada plot tem no maximo 1 entidade por TIPO de boss, entao a contagem e
# limitada por (jogadores x tipos), nao pelo volume de chaves. Com 250
# jogadores e 5 bosses o teorico e 1.250 — o valor abaixo sai do teste L2.
max-simultaneous: 0

boss-stack-radius: 5

boss-nametag: '{display} §7x{stack}'

# ⚠️ O material NAO pode ser `written_book`. A tela de leitura do livro e aberta
# pelo proprio cliente (PlayerControllerMP#sendUseItem roda o uso do item local),
# entao cancelar o PlayerInteractEvent no servidor nao fecha ela — abria por
# cima ate do merge com SHIFT. `book` e inerte no clique direito e o `glow`
# abaixo devolve o brilho.
kill-stack-item:
  material: book
  display: '&4Livro de Kill-Stack'
  lore:
  - '&7Elimine mais bosses'
  - '&7ao abater apenas um.'
  - ''
  - '&8 ▪ &fNível: &c{level} '
  - ''
  - '&4Arraste sobre uma'
  - '&4matadora para aplicar.'
  glow: true
