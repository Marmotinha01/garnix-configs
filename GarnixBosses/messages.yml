# ── Entrega de itens ───────────────────────────────────────────────────
# Mostradas pelo ItemDelivery quando o item não pode ir direto ao inventário.
# mailed:   jogador em evento/mundo de eventos — NADA entrou no inventário.
# leftover: inventário cheio — só a sobra foi ao correio.
delivery:
  mailed: '&eVocê está em um evento. &eSeu item foi para o correio. &7(/correio)'
  leftover: '&eSeu inventário está cheio. &eO que sobrou foi para o correio. &7(/correio)'
