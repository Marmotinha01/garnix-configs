# Board de evento. Só o selector do GarnixEvents chega até ela.
#
# A permission é de propósito um nó que ninguém tem: o casamento normal por
# mundo passa por appliesTo(), que checa permissão, então essa board nunca é
# escolhida por estar no mundo dos eventos. O selector busca a board pelo id e
# não passa por appliesTo(), então para quem está na run ela aparece igual.
# Sem isso, bastava o eventos_lobby.yml perder o priority para as boards de
# evento aparecerem no lobby.

enabled: true
priority: 0
worlds: ['eventos']
permission: 'garnix.eventos.board'
update-ticks: 20

title:
  interval: 2
  frames:
  - '&f&lBATATA QUENTE'
  - '&e&lBATATA QUENTE'
  - '&6&lBATATA QUENTE'
  - '&6&lB&f&lATATA QUENTE'
  - '&6&lB&e&lATATA QUENTE'
  - '&6&lBA&f&lTATA QUENTE'
  - '&6&lBA&e&lTATA QUENTE'
  - '&6&lBAT&f&lATA QUENTE'
  - '&6&lBAT&e&lATA QUENTE'
  - '&6&lBATA&f&lTA QUENTE'
  - '&6&lBATA&e&lTA QUENTE'
  - '&6&lBATAT&f&lA QUENTE'
  - '&6&lBATAT&e&lA QUENTE'
  - '&6&lBATATA&f&l QUENTE'
  - '&6&lBATATA&e&l QUENTE'
  - '&6&lBATATA &f&lQUENTE'
  - '&6&lBATATA &e&lQUENTE'
  - '&6&lBATATA Q&f&lUENTE'
  - '&6&lBATATA Q&e&lUENTE'
  - '&6&lBATATA QU&f&lENTE'
  - '&6&lBATATA QU&e&lENTE'
  - '&6&lBATATA QUE&f&lNTE'
  - '&6&lBATATA QUE&e&lNTE'
  - '&6&lBATATA QUEN&f&lTE'
  - '&6&lBATATA QUEN&e&lTE'
  - '&6&lBATATA QUENT&f&lE'
  - '&6&lBATATA QUENT&e&lE'
  - '&e&lBATATA QUENTE'
  - '&6&lBATATA QUENTE'
  - '&f&lBATATA QUENTE'
  - '&6&lBATATA QUENTE'

lines:
- ''

- text: ' &fComeça em: &7%events_countdown%s'
  condition: '%events_state% == starting'

- text: ' &fTempo: &7%events_elapsed%'
  condition: '%events_state% == running'

- ' &fParticipantes: &a%events_alive%&8/&c%events_players%'
- ''

- text: ' &fRound: &7%events_stat_round%'
  condition: '%events_state% == running'

- text: ' &fBatatas: &c%events_stat_batatas%'
  condition: '%events_state% == running'

- text: ' &c&lVOCE ESTA COM ELA!'
  condition: '%events_stat_batata% == sim'

- text: ''
  condition: '%events_state% == running'

- ' &fStatus: %events_status%'
- ''
- '&eredegarnix.com'
