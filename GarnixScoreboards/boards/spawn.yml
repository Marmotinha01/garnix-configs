# ══════════════════════════════════════════════════════════════════════════
#  Scoreboard "spawn"  ·  exemplo de scoreboard presa a um mundo
#  Quem estiver no mundo abaixo vê esta no lugar da default (prioridade maior).
#  Troque o nome do mundo pelo seu — ou apague o arquivo se não usar um spawn
#  separado. Referência completa: README.md
# ══════════════════════════════════════════════════════════════════════════


# ── Quando esta scoreboard aparece ────────────────────────────────────────

enabled: true

# Acima da default (0), então vence enquanto o jogador estiver nos mundos abaixo.
priority: 10

worlds:
- spawn

permission: ''

update-ticks: 20


# ── Título ────────────────────────────────────────────────────────────────

title:
  interval: 4
  frames:
  - '&b&l» &f&lSPAWN &b&l«'
  - '&f&l» &b&lSPAWN &f&l«'


# ── Linhas ────────────────────────────────────────────────────────────────

lines:
- '&7&m--------------------'
- ' &fBem-vindo,'
- ' &b{player}&f!'
- ''
- ' &fOnline: &a{online}&8/&c{max_online}'
- ''
- ' &7Use &f/warps &7para'
- ' &7escolher um destino.'
- '&7&m--------------------'
