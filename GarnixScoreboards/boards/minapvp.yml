# Board do mundo da mina PvP.
#
# ⚠️ O CONTADOR DE RESET É SÓ O DO TEMPO. A mina reseta por DOIS gatilhos —
# reset.interval (3m) e reset.broken-percentage (40% da região quebrada) — e o
# %pvpmine_next_reset% enxerga só o primeiro. Numa mina cheia o segundo dispara
# antes, e o contador vai estar marcando 1m30 quando o refill acontecer.
#
# Não tem conserto pelo lado da board: quando o gatilho é "quanto já quebraram",
# não existe previsão, existe medição. Se o descompasso incomodar, o caminho é
# desligar o broken-percentage e deixar a mina só no relógio — aí o número
# passa a valer sempre.
#
# (Isto contraria a regra "o reset da mina é silencioso" do messages.yml do
# GarnixPvPMine. Foi pedido de propósito, não descuido — se um dia o reset
# voltar a ser surpresa, é esta linha que sai.)
#
# ⚠️ 15 LINHAS É O TETO DO 1.8. Toda linha nova aqui derruba uma de baixo em
# silêncio, e a folga que as condicionais dão é falsa — conte pelo pior caso,
# não pelo que está na sua tela.
#
# ⚠️ CADA LINHA SAI EM DUAS METADES. O 1.8 manda uma linha como prefix (16
# chars) + suffix (16), e o FastBoard corta no caractere 16 CONTANDO OS CÓDIGOS
# DE COR. A metade de baixo é remontada com ChatColor.getLastColors(prefix),
# que anda de trás para frente e PARA na primeira cor — formatação que veio
# ANTES dessa cor não é reconstruída.
#
# Na prática: depois do último &cor de uma linha, evite &l/&n/&o. Se o corte
# cair ali, a metade de baixo perde o negrito e a linha renderiza em dois
# estilos no meio de uma palavra.
enabled: true
priority: 0
worlds: ['minapvp']
permission: ''

# ⚠️ 10 e não 20. O número que muda rápido aqui é a vida do altar durante um
# raid, e meio segundo de atraso já é pouco perto do tempo entre dois hits.
# É o dobro de renderizações por jogador, mas só neste mundo.
update-ticks: 10

title:
  interval: 2
  frames:
  - '&f&lMINA PVP &8▪ &c%pvpmine_players%'
  - '&c&lMINA PVP &8▪ &c%pvpmine_players%'
  - '&4&lMINA PVP &8▪ &c%pvpmine_players%'
  - '&4&lM&f&lINA PVP &8▪ &c%pvpmine_players%'
  - '&4&lM&c&lINA PVP &8▪ &c%pvpmine_players%'
  - '&4&lMI&f&lNA PVP &8▪ &c%pvpmine_players%'
  - '&4&lMI&c&lNA PVP &8▪ &c%pvpmine_players%'
  - '&4&lMIN&f&lA PVP &8▪ &c%pvpmine_players%'
  - '&4&lMIN&c&lA PVP &8▪ &c%pvpmine_players%'
  - '&4&lMINA &f&lPVP &8▪ &c%pvpmine_players%'
  - '&4&lMINA &c&lPVP &8▪ &c%pvpmine_players%'
  - '&c&lMINA PVP &8▪ &c%pvpmine_players%'
  - '&4&lMINA PVP &8▪ &c%pvpmine_players%'
  - '&f&lMINA PVP &8▪ &c%pvpmine_players%'
  - '&4&lMINA PVP &8▪ &c%pvpmine_players%'

lines:
- ''
- ' &fNa mina: &e%pvpmine_players%'
- ' &fReset em: &7%pvpmine_next_reset%'
- ''

- ' &c&lDOMINAÇAO'
- ' %pvpmine_state%'

# A barra e o tempo são o MESMO lugar da board em dois momentos diferentes: a
# barra enquanto sobe, o relógio depois que fechou. Nunca aparecem juntos —
# uma barra cheia parada embaixo do tempo não informa nada, só ocupa linha.
#
# 'claiming' e não '!= dominated' de propósito: com ninguém dominando a barra
# ficaria em 0%, e uma barra vazia é ruído, não informação.
- text: ' %pvpmine_bar%'
  condition: '%pvpmine_status% == claiming'

# ⚠️ O tempo mora numa linha SÓ DELE por causa do corte de 16 caracteres do 1.8
# (ver o comentário de placeholders: no messages.yml do GarnixPvPMine). Aqui
# tudo depois do último código de cor é texto puro, então onde quer que o corte
# caia as duas metades saem iguais.
- text: ' &fDobro por &a%pvpmine_time%'
  condition: '%pvpmine_status% == dominated'

# O bloco do altar inteiro sai da board quando não existe altar de pé.
- text: ''
  condition: '%pvpmine_altar_alive%'

- text: ' &d&lALTAR'
  condition: '%pvpmine_altar_alive%'

- text: ' &4❤%pvpmine_altar_hp%'
  condition: '%pvpmine_altar_alive%'

- ''
- ' &fCoins: &2$&a%currencies_coins%'
- ''
- '&eredegarnix.com'
