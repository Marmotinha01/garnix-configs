# Board de evento. Só o selector do GarnixEvents chega até ela.
#
# A permission é de propósito um nó que ninguém tem: o casamento normal por
# mundo passa por appliesTo(), que checa permissão, então essa board nunca é
# escolhida por estar no mundo dos eventos. O selector busca a board pelo id e
# não passa por appliesTo(), então para quem está na run ela aparece igual.
# Sem isso, bastava o eventos_lobby.yml perder o priority para as boards de
# evento aparecerem no lobby.

enabled: true
priority: 0
worlds: ['eventos']
permission: 'garnix.eventos.board'
update-ticks: 20

title:
  interval: 2
  frames:
  - '&f&lPAINTBALL &8► &a%events_alive%'
  - '&e&lPAINTBALL &8► &a%events_alive%'
  - '&d&lPAINTBALL &8► &a%events_alive%'
  - '&d&lP&f&lAINTBALL &8► &a%events_alive%'
  - '&d&lP&e&lAINTBALL &8► &a%events_alive%'
  - '&d&lPA&f&lINTBALL &8► &a%events_alive%'
  - '&d&lPA&e&lINTBALL &8► &a%events_alive%'
  - '&d&lPAI&f&lNTBALL &8► &a%events_alive%'
  - '&d&lPAI&e&lNTBALL &8► &a%events_alive%'
  - '&d&lPAIN&f&lTBALL &8► &a%events_alive%'
  - '&d&lPAIN&e&lTBALL &8► &a%events_alive%'
  - '&d&lPAINT&f&lBALL &8► &a%events_alive%'
  - '&d&lPAINT&e&lBALL &8► &a%events_alive%'
  - '&d&lPAINTB&f&lALL &8► &a%events_alive%'
  - '&d&lPAINTB&e&lALL &8► &a%events_alive%'
  - '&d&lPAINTBA&f&lLL &8► &a%events_alive%'
  - '&d&lPAINTBA&e&lLL &8► &a%events_alive%'
  - '&d&lPAINTBAL&f&lL &8► &a%events_alive%'
  - '&d&lPAINTBAL&e&lL &8► &a%events_alive%'
  - '&e&lPAINTBALL &8► &a%events_alive%'
  - '&d&lPAINTBALL &8► &a%events_alive%'
  - '&f&lPAINTBALL &8► &a%events_alive%'
  - '&d&lPAINTBALL &8► &a%events_alive%'

lines:
- ''

- text: ' &fComeça em: &7%events_countdown%s'
  condition: '%events_state% == starting'

- text: ' &fTempo: &7%events_elapsed%'
  condition: '%events_state% == running'

- ' &fParticipantes: &a%events_alive%&8/&c%events_players%'
- ' &fStatus: %events_status%'
- ''
- '&eredegarnix.com'
