# Board de evento. Só o selector do GarnixEvents chega até ela.
#
# A permission é de propósito um nó que ninguém tem: o casamento normal por
# mundo passa por appliesTo(), que checa permissão, então essa board nunca é
# escolhida por estar no mundo dos eventos. O selector busca a board pelo id e
# não passa por appliesTo(), então para quem está na run ela aparece igual.
# Sem isso, bastava o eventos_lobby.yml perder o priority para as boards de
# evento aparecerem no lobby.

enabled: true
priority: 0
worlds: ['eventos']
permission: 'garnix.eventos.board'
update-ticks: 20

title:
  interval: 2
  frames:
  - '&f&lCORRIDA &8► &a%events_alive%'
  - '&6&lCORRIDA &8► &a%events_alive%'
  - '&e&lCORRIDA &8► &a%events_alive%'
  - '&e&lC&f&lORRIDA &8► &a%events_alive%'
  - '&e&lC&6&lORRIDA &8► &a%events_alive%'
  - '&e&lCO&f&lRRIDA &8► &a%events_alive%'
  - '&e&lCO&6&lRRIDA &8► &a%events_alive%'
  - '&e&lCOR&f&lRIDA &8► &a%events_alive%'
  - '&e&lCOR&6&lRIDA &8► &a%events_alive%'
  - '&e&lCORR&f&lIDA &8► &a%events_alive%'
  - '&e&lCORR&6&lIDA &8► &a%events_alive%'
  - '&e&lCORRI&f&lDA &8► &a%events_alive%'
  - '&e&lCORRI&6&lDA &8► &a%events_alive%'
  - '&e&lCORRID&f&lA &8► &a%events_alive%'
  - '&e&lCORRID&6&lA &8► &a%events_alive%'
  - '&6&lCORRIDA &8► &a%events_alive%'
  - '&e&lCORRIDA &8► &a%events_alive%'
  - '&f&lCORRIDA &8► &a%events_alive%'
  - '&e&lCORRIDA &8► &a%events_alive%'

lines:
- ''

- text: ' &fComeça em: &a%events_countdown%&7s'
  condition: '%events_state% == starting'

- text: ' &fTempo: &b%events_elapsed%'
  condition: '%events_state% == running'

- ' &fParticipantes: &a%events_alive%&8/&c%events_players%'
- ' &fStatus: %events_status%'

- ''
- '&eredegarnix.com'
