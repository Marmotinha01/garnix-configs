# Board de evento. Só o selector do GarnixEvents chega até ela.
#
# A permission é de propósito um nó que ninguém tem: o casamento normal por
# mundo passa por appliesTo(), que checa permissão, então essa board nunca é
# escolhida por estar no mundo dos eventos. O selector busca a board pelo id e
# não passa por appliesTo(), então para quem está na run ela aparece igual.
# Sem isso, bastava o eventos_lobby.yml perder o priority para as boards de
# evento aparecerem no lobby.

enabled: true
priority: 0
worlds: ['eventos']
permission: 'garnix.eventos.board'
update-ticks: 20

title:
  interval: 2
  frames:
  - '&7&lDESTEMIDO &8► &a%events_alive%'
  - '&f&lDESTEMIDO &8► &a%events_alive%'
  - '&8&lDESTEMIDO &8► &a%events_alive%'
  - '&8&lD&7&lESTEMIDO &8► &a%events_alive%'
  - '&8&lD&f&lESTEMIDO &8► &a%events_alive%'
  - '&8&lDE&7&lSTEMIDO &8► &a%events_alive%'
  - '&8&lDE&f&lSTEMIDO &8► &a%events_alive%'
  - '&8&lDES&7&lTEMIDO &8► &a%events_alive%'
  - '&8&lDES&f&lTEMIDO &8► &a%events_alive%'
  - '&8&lDEST&7&lEMIDO &8► &a%events_alive%'
  - '&8&lDEST&f&lEMIDO &8► &a%events_alive%'
  - '&8&lDESTE&7&lMIDO &8► &a%events_alive%'
  - '&8&lDESTE&f&lMIDO &8► &a%events_alive%'
  - '&8&lDESTEM&7&lIDO &8► &a%events_alive%'
  - '&8&lDESTEM&f&lIDO &8► &a%events_alive%'
  - '&8&lDESTEMI&7&lDO &8► &a%events_alive%'
  - '&8&lDESTEMI&f&lDO &8► &a%events_alive%'
  - '&8&lDESTEMID&7&lO &8► &a%events_alive%'
  - '&8&lDESTEMID&f&lO &8► &a%events_alive%'
  - '&f&lDESTEMIDO &8► &a%events_alive%'
  - '&8&lDESTEMIDO &8► &a%events_alive%'
  - '&7&lDESTEMIDO &8► &a%events_alive%'
  - '&8&lDESTEMIDO &8► &a%events_alive%'

lines:
- ''

- text: ' &fComeça em: &7%events_countdown%s'
  condition: '%events_state% == starting'

- text: ' &fTempo: &7%events_elapsed%'
  condition: '%events_state% == running'

- ' &fParticipantes: &a%events_alive%&8/&c%events_players%'
- ' &fStatus: %events_status%'
- ''
- '&eredegarnix.com'
