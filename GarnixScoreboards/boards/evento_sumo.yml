# Board de evento. Só o selector do GarnixEvents chega até ela.
#
# A permission é de propósito um nó que ninguém tem: o casamento normal por
# mundo passa por appliesTo(), que checa permissão, então essa board nunca é
# escolhida por estar no mundo dos eventos. O selector busca a board pelo id e
# não passa por appliesTo(), então para quem está na run ela aparece igual.
# Sem isso, bastava o eventos_lobby.yml perder o priority para as boards de
# evento aparecerem no lobby.

enabled: true
priority: 0
worlds: ['eventos']
permission: 'garnix.eventos.board'
update-ticks: 20

title:
  interval: 2
  frames:
  - '&f&lSUMO'
  - '&e&lSUMO'
  - '&b&lSUMO'
  - '&b&lS&f&lUMO'
  - '&b&lS&e&lUMO'
  - '&b&lSU&f&lMO'
  - '&b&lSU&e&lMO'
  - '&b&lSUM&f&lO'
  - '&b&lSUM&e&lO'
  - '&e&lSUMO'
  - '&b&lSUMO'
  - '&f&lSUMO'
  - '&b&lSUMO'

lines:
- ''

- text: ' &fComeça em: &7%events_countdown%s'
  condition: '%events_state% == starting'

- text: ' &fTempo: &7%events_elapsed%'
  condition: '%events_state% == running'

- ''

- text: ' &c%events_stat_duelo%'
  condition: '%events_stat_duelo%'

- text: ''
  condition: '%events_stat_duelo%'

- ' &fParticipantes: &a%events_alive%&8/&c%events_players%'
- ' &fStatus: %events_status%'
- ''
- '&eredegarnix.com'
